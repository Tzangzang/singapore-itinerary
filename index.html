<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vở luyện IELTS Speaking – thi 20/10</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Pangolin&display=swap&subset=vietnamese" rel="stylesheet">
<style>
:root{
  --paper:#FCFCFA; --grid:#E3EAF3; --grid2:#CBD8E8;
  --ink:#1E3A8A; --text:#1F2433; --muted:#5B6475;
  --red:#C62828; --red-soft:#FDECEC; --line:#D5DCE6; --nav:#F2F5F9;
  --chip:#EEF2FA; --done:#2E7D32;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#151922; --grid:#1D2330; --grid2:#252D3D;
    --ink:#9DB6F5; --text:#E6E9EF; --muted:#9AA3B5;
    --red:#FF6B6B; --red-soft:#3A1F24; --line:#2C3445; --nav:#10141B;
    --chip:#1F2738; --done:#7BC67F;
  }
}
:root[data-theme="dark"]{
  --paper:#151922; --grid:#1D2330; --grid2:#252D3D;
  --ink:#9DB6F5; --text:#E6E9EF; --muted:#9AA3B5;
  --red:#FF6B6B; --red-soft:#3A1F24; --line:#2C3445; --nav:#10141B;
  --chip:#1F2738; --done:#7BC67F;
}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 64px)}
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0}
body{
  background:var(--nav);color:var(--text);
  font-family:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  font-size:16px;line-height:1.6;
}
.red{color:var(--red);font-weight:700;font-style:normal}
.hand{font-family:"Pangolin","Comic Sans MS","Segoe Print",cursive}
.blank{display:inline-block;min-width:3.2em;border-bottom:1.5px solid var(--muted);transform:translateY(-3px);height:1em}
.layout{display:grid;grid-template-columns:260px minmax(0,1fr);min-height:100vh}
nav{
  position:sticky;top:env(safe-area-inset-top,0px);align-self:start;height:100vh;overflow:auto;
  padding:28px 18px;border-right:1px solid var(--line);background:var(--nav)
}
.brand{font-family:"Pangolin",cursive;font-size:26px;color:var(--ink);line-height:1.2;margin:0 0 4px}
.countdown{margin:0 0 22px;color:var(--muted);font-size:14px}
.countdown b{color:var(--red)}
nav ol{list-style:none;margin:0;padding:0}
nav li button{
  width:100%;text-align:left;background:none;border:0;border-radius:8px;cursor:pointer;
  padding:9px 10px;margin:1px 0;color:var(--text);font:inherit;font-size:15px;display:flex;justify-content:space-between;gap:8px;align-items:baseline
}
nav li button:hover{background:var(--chip)}
nav li button[aria-current="true"]{background:var(--paper);color:var(--ink);font-weight:600;box-shadow:inset 3px 0 0 var(--ink)}
nav .prog{font-size:12px;color:var(--muted);white-space:nowrap}
.toggle{
  margin-top:22px;display:flex;align-items:center;gap:10px;font-size:14px;color:var(--muted);cursor:pointer;
  border:1px solid var(--line);border-radius:8px;padding:9px 10px;background:var(--paper);width:100%;font-family:inherit
}
.toggle .box{width:34px;height:20px;border-radius:10px;background:var(--grid2);position:relative;flex:none;transition:background .15s}
.toggle .box::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:left .15s}
.toggle[aria-pressed="true"] .box{background:var(--ink)}
.toggle[aria-pressed="true"] .box::after{left:16px}
main{
  background-color:var(--paper);
  background-image:
    linear-gradient(var(--grid2) 1px,transparent 1px),
    linear-gradient(90deg,var(--grid2) 1px,transparent 1px),
    linear-gradient(var(--grid) 1px,transparent 1px),
    linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:96px 96px,96px 96px,24px 24px,24px 24px;
  background-attachment:local;
  padding:44px clamp(18px,5vw,64px) 96px;
  min-width:0;
}
.sheet{max-width:760px;margin:0 auto}
h1{font-size:clamp(28px,4vw,38px);line-height:1.15;color:var(--ink);margin:0 0 6px;font-weight:700;letter-spacing:-.01em}
.lead{color:var(--muted);margin:0 0 28px;max-width:62ch}
h2{font-family:"Pangolin",cursive;font-weight:400;color:var(--ink);font-size:28px;margin:44px 0 10px;line-height:1.2}
h3{font-size:18px;margin:26px 0 8px;color:var(--text)}
.kw-table{width:100%;border-collapse:collapse;margin:6px 0 16px;background:var(--paper);font-size:15px}
.kw-table td{padding:6px 10px;border-bottom:1px solid var(--line);vertical-align:top}
.kw-table td:first-child{color:var(--ink);font-weight:600;width:52%}
.scroll{overflow-x:auto}
.q{list-style:none;margin:0 0 6px;padding:16px 0 14px;border-top:1px dashed var(--grid2)}
.qhead{display:flex;gap:12px;align-items:flex-start}
.qnum{font-family:"Pangolin",cursive;color:var(--ink);font-size:20px;line-height:1.3;min-width:1.6em}
.qtext{font-weight:600;font-size:17px;line-height:1.45;flex:1}
.check{flex:none;display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);cursor:pointer;user-select:none;padding-top:3px}
.check input{width:18px;height:18px;accent-color:var(--done);cursor:pointer}
.q.is-done .qtext{color:var(--muted)}
.hint{margin:10px 0 0 calc(1.6em + 12px);display:grid;gap:6px;background:var(--paper);border-left:3px solid var(--grid2);padding:8px 0 8px 14px}
.row{display:grid;grid-template-columns:84px 1fr;gap:10px;align-items:baseline}
.tag{font-family:"Pangolin",cursive;color:var(--ink);font-size:16px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:var(--chip);color:var(--ink);border-radius:5px;padding:1px 8px;font-size:14.5px;font-style:italic}
.frame{font-style:italic}
.note{color:var(--red);font-size:14px}
.peek{display:none;margin:8px 0 0 calc(1.6em + 12px);background:none;border:1px dashed var(--grid2);color:var(--ink);border-radius:6px;padding:3px 10px;font:inherit;font-size:14px;cursor:pointer}
body.hide-hints .q:not(.open) .hint{display:none}
body.hide-hints .q:not(.open) .peek{display:inline-block}
.box-note{background:var(--red-soft);border-radius:8px;padding:12px 16px;margin:14px 0}
.box-note p{margin:0}
table.plan{width:100%;border-collapse:collapse;font-size:15px;background:var(--paper)}
table.plan th,table.plan td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
table.plan th{color:var(--muted);font-weight:500;font-size:13px}
table.plan td:first-child{white-space:nowrap;color:var(--ink);font-weight:600}
table.plan button{background:none;border:0;padding:0;color:inherit;font:inherit;cursor:pointer;text-decoration:underline;text-decoration-color:var(--grid2);text-underline-offset:3px}
ul.errs{list-style:none;padding:0;margin:8px 0}
ul.errs li{padding:7px 0 7px 28px;position:relative;border-bottom:1px solid var(--line)}
ul.errs li::before{content:"✗";position:absolute;left:4px;color:var(--red);font-weight:700}
.stat{font-size:15px}
.stat b{color:var(--ink)}
.bar{height:8px;background:var(--grid);border-radius:4px;overflow:hidden;margin:8px 0 4px;max-width:420px}
.bar i{display:block;height:100%;background:var(--ink)}
.step-label{font-weight:600;color:var(--text)}
.subtabs{display:flex;gap:6px;overflow-x:auto;padding:4px 0 10px;margin:0 0 4px;border-bottom:1px solid var(--line);scrollbar-width:thin}
.subtabs button{flex:none;border:1px solid var(--line);background:var(--paper);color:var(--text);border-radius:999px;padding:5px 12px;font:inherit;font-size:14px;cursor:pointer;white-space:nowrap}
.subtabs button:hover{border-color:var(--ink)}
.subtabs button[aria-selected="true"]{background:var(--ink);border-color:var(--ink);color:var(--paper);font-weight:600}
.subtabs .cnt{font-size:12px;opacity:.75;margin-left:2px}
.subtabs button.full:not([aria-selected="true"]){border-color:var(--done);color:var(--done)}
.src{color:var(--muted);font-size:14px;margin:-4px 0 10px}
.pager{display:flex;justify-content:space-between;gap:12px;margin-top:28px}
.pager button{background:none;border:1px solid var(--line);border-radius:8px;padding:8px 14px;font:inherit;font-size:15px;color:var(--ink);cursor:pointer}
.pager button:hover{border-color:var(--ink)}
.qtable tr.q{border-top:0;padding:0;margin:0}
.qtable{width:100%;border-collapse:collapse;background:var(--paper);margin-top:8px;table-layout:fixed}
.qtable thead th{text-align:left;font-size:13px;font-weight:500;color:var(--muted);padding:8px 12px;border-bottom:2px solid var(--grid2)}
.qtable thead th:first-child{width:36%}
.qtable td{vertical-align:top;padding:14px 12px;border-bottom:1px dashed var(--grid2)}
.qtable td.qcol{border-right:1px solid var(--line)}
.qtable .qhead{display:flex;gap:8px}
.qtable .check{margin:10px 0 0 calc(1.6em + 8px);padding:0}
.qtable .hint{margin:0;border-left:0;padding:0;gap:10px}
.qtable .peek{margin:0}
.block{display:grid;grid-template-columns:90px 1fr;gap:10px;align-items:baseline}
.qtable .idea-left{margin:12px 0 0 calc(1.6em + 8px);padding:8px 10px;background:var(--chip);border-radius:6px;display:block}
.qtable .idea-left .tag{display:block;margin-bottom:4px}
.qtable .idea-left ol.idea li{grid-template-columns:auto 1fr;gap:8px}
.qtable .idea-left ol.idea .lbl{min-width:6.5em}
ol.idea{list-style:none;margin:0;padding:0;display:grid;gap:3px}
ol.idea li{display:grid;grid-template-columns:118px 1fr;gap:8px}
ol.idea .kwi{font-weight:600;color:var(--ink)}
ol.idea .lbl{color:var(--muted);font-size:13px;padding-top:2px}
ol.formula{margin:8px 0 12px}
.notewrap{display:grid;grid-template-columns:90px 1fr;gap:10px;margin-top:12px;align-items:start}
.notewrap textarea{width:100%;min-height:52px;resize:vertical;font:inherit;font-size:15px;line-height:1.5;color:var(--text);background:var(--paper);border:1px dashed var(--ink);border-radius:6px;padding:6px 10px;overflow:hidden}
.notewrap textarea:focus{outline:2px solid var(--ink);outline-offset:1px;border-style:solid}
@media (max-width:860px){
  .qtable,.qtable tbody,.qtable tr,.qtable td{display:block;width:100%}
  .qtable thead{display:none}
  .qtable tr{border-bottom:1px dashed var(--grid2);padding:12px 0}
  .qtable td{border:0;padding:4px 0}
  .qtable td.qcol{border-right:0}
  .qtable .check{margin-left:0}
  .block,.notewrap{grid-template-columns:1fr;gap:2px}
  ol.idea li{grid-template-columns:1fr;gap:0}
}
.vh{font-size:16px;margin:22px 0 8px;color:var(--ink)}
.vtable{width:100%;border-collapse:collapse;background:var(--paper);font-size:15px}
.vtable th{text-align:left;font-size:13px;font-weight:500;color:var(--muted);padding:6px 10px;border-bottom:2px solid var(--grid2)}
.vtable td{padding:7px 10px;border-bottom:1px solid var(--line);vertical-align:top}
.vtable td.vp{color:var(--ink);font-weight:700;white-space:nowrap}
.vtable td.vex{font-style:italic;color:var(--text)}
.vtable .hl{color:var(--ink);font-style:italic}
.sheetp{margin:12px 0 0;display:flex;flex-wrap:wrap;gap:6px 6px;align-items:baseline;font-size:14px}
.sheetp .tag{margin-right:6px}
.sheetp .pm{color:var(--muted);margin-right:10px}
@media (max-width:860px){
  .vtable thead{display:none}
  .vtable,.vtable tbody,.vtable tr,.vtable td{display:block;width:100%}
  .vtable tr{padding:8px 0;border-bottom:1px solid var(--line)}
  .vtable td{border:0;padding:1px 0}
  .vtable td.vp{white-space:normal}
}
.vtable .ipa{display:block;font-weight:400;color:var(--muted);font-family:"Be Vietnam Pro","Segoe UI","Lucida Sans Unicode","DejaVu Sans",sans-serif;font-size:14px;margin-top:2px;white-space:normal}
.vtable .ipa .red{font-weight:700}
.legend{font-size:13.5px;color:var(--muted);margin:-2px 0 8px}
em.past{font-style:inherit}
.vtable .pri{display:inline-block;margin-top:4px;font-size:12px;font-weight:500;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:0 6px}
.vtable .pri.first{color:var(--ink);border-color:var(--ink)}
.vtable .tip{display:block;margin-top:3px;font-size:13.5px;color:var(--muted)}
.vtable td .vex{font-style:italic}
footer{margin-top:56px;color:var(--muted);font-size:13px}
button:focus-visible,input:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
@media (max-width:860px){
  .layout{grid-template-columns:1fr}
  nav{position:sticky;top:0;height:auto;z-index:5;padding:10px 12px calc(10px);border-right:0;border-bottom:1px solid var(--line);padding-top:calc(10px + env(safe-area-inset-top,0px));top:0}
  .brand{font-size:20px;display:inline}
  .countdown{display:inline;margin-left:8px;font-size:13px}
  nav ol{display:flex;gap:4px;overflow-x:auto;margin-top:8px;padding-bottom:2px}
  nav li button{white-space:nowrap;font-size:14px;padding:6px 10px}
  nav li button[aria-current="true"]{box-shadow:inset 0 -3px 0 var(--ink)}
  nav .prog{display:none}
  .toggle{margin-top:8px;padding:6px 10px}
  main{padding-top:28px}
  .hint{margin-left:0}
  .peek{margin-left:0}
  .row{grid-template-columns:1fr;gap:2px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* ===== Part 2 & 3 ===== */
u.end{text-decoration:underline;text-decoration-color:var(--red);text-decoration-thickness:2px;text-underline-offset:3px}
.p2lbl.p2key{background:var(--red,#c0392b)}
.p2kq{margin:4px 0 10px;font-weight:600;color:var(--red,#c0392b)}
.p2h{font-size:15px;color:var(--ink);margin:16px 0 6px;font-weight:700}
.p2list{margin:0 0 8px;padding-left:18px}
.p2list li{margin:3px 0}
.p2list .p2num{color:var(--red);font-family:Georgia,serif;margin-right:4px}
.p2vi{background:var(--nav,#F2F5F9);border-radius:8px;padding:8px 14px}
.p2vi p{margin:4px 0}
.p2toc{display:flex;flex-wrap:wrap;align-items:flex-start;height:auto;gap:8px;margin:14px 0 6px;position:sticky;top:0;z-index:5;background:var(--paper);padding:8px 0;scroll-margin-top:0}
.p2toc button{font:inherit;font-size:14px;border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:999px;padding:5px 12px;cursor:pointer}
.p2toc button.full{border-color:var(--ink);font-weight:600}
.p2toc button.full::after{content:" ✓"}
.p2block{scroll-margin-top:64px;padding-top:8px;margin-top:28px;border-top:2px solid var(--line)}
.p2block:first-of-type{border-top:0;margin-top:8px}
.p2top{text-align:right;margin:6px 0 0}
.p2top button{font:inherit;font-size:13px;background:none;border:0;color:var(--ink);opacity:.7;cursor:pointer;text-decoration:underline}
.p2lbl{display:inline-block;font-size:12px;font-weight:700;color:var(--paper);background:var(--ink);border-radius:4px;padding:0 6px;margin-right:2px;vertical-align:1px;font-style:normal;font-family:"Be Vietnam Pro",sans-serif}
.p2topic{margin:4px 0;font-weight:600;line-height:1.45}
.p2num{font-family:"Pangolin",cursive;color:var(--red);font-weight:400;margin-right:4px;white-space:nowrap}
ol.p2ideas{margin:4px 0 8px;padding-left:22px}
ol.p2ideas li{margin:4px 0}
.p2sample{background:var(--paper);border-left:3px solid var(--grid2);padding:4px 0 4px 14px}
.p2sample p{margin:0 0 10px}
.p2past{font-size:14px;color:var(--muted)}
.p2s{border-top:0}
.p2s .check{margin:14px 0 0;padding:0}
.p2s .peek{margin:0 0 8px}
.p2alt{border-top:1px dashed var(--grid2);padding:12px 0 6px}
.p2change{margin:4px 0 0;padding-left:14px;border-left:3px solid var(--grid2);font-size:15px}
.p2change p{margin:0 0 6px}
.p2en{font-style:italic}
body.hide-hints .q:not(.open) .p2sample{display:none}
body.hide-hints .q:not(.open) .p2change .p2en{display:none}
nav li.navhead{font-size:13px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;padding:16px 10px 4px}
nav li.navsub button{padding-left:24px}
@media (max-width:860px){nav li.navhead{padding:6px 4px 0 10px;align-self:center;white-space:nowrap}nav li.navsub button{padding-left:10px}}
.p3vi{margin:0;font-size:15px;line-height:1.55}
.p3en{font-size:15.5px;line-height:1.6}
.qtable .idea-left ol.idea.p3idea li{grid-template-columns:1fr;gap:0;margin-bottom:6px}
.qtable .idea-left ol.idea.p3idea .lbl{min-width:0;padding-top:0;font-size:12.5px}
.idea .vi{display:block;font-weight:400;color:var(--muted);font-size:14px;line-height:1.45}
table.plan td.p2c{white-space:nowrap;color:var(--muted);font-weight:400}
</style>

["What music do you like?","V-pop.","Especially Chipu, my favourite singer.","Her songs are catchy and cheer me up.","a big fan of|V-pop|catchy","I'm a big fan of ___, especially songs [[which]] ___."],

function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}
var PAST_RE = /\b(was|were|wasn't|weren't|went|had|hadn't|did|didn't|couldn't|made|got|saw|bought|found|left|met|learnt|learned|sang|took|gave|kept|wore|taught|burst|asked|binge-watched|carried|encouraged|explained|handed|hated|helped|inspired|joined|liked|looked|loved|reminded|restored|returned|scored|screamed|splashed|started|swapped|visited|walked|wanted|watched|used(?= to))\b/gi;
function pastMark(htmlText){ return htmlText.replace(PAST_RE,'<em class="red past">$1</em>'); }
function fmt(s){
  return String(s).split(/(\[\[.+?\]\])/).map(function(seg){
     return /^\[\[/.test(seg) ? '<em class="red">'+esc(seg.slice(2,-2))+'</em>' : pastMark(esc(seg));
   }).join("")
   .replace(/___/g,'<span class="blank" aria-label="chỗ trống"></span>');
}
function hintHTML(q){
  var h = '<div class="hint">';
  h += '<div class="block"><span class="tag">Từ vựng</span><span class="chips">'+q.kw.map(function(k){return '<span class="chip" lang="en">'+esc(k)+'</span>';}).join("")+'</span></div>';
  h += '<div class="block"><span class="tag">Mẫu câu</span><span class="frame" lang="en">'+fmt(q.frame)+'</span></div>';
  if(q.note) h += '<div class="block"><span class="tag">Lưu ý</span><span class="note">'+fmt(q.note)+'</span></div>';
  return h + '</div><button class="peek" type="button">Xem gợi ý</button>';
}
function ideaHTML(q){
  var h = '<div class="hint idea-left"><span class="tag">Ý tưởng</span><ol class="idea">';
  q.idea.forEach(function(x,i){ h += '<li><span class="lbl">'+IDEA_LABELS[i]+'</span><span lang="en" class="kwi">'+pastMark(esc(x))+'</span></li>'; });
  return h + '</ol></div>';
}
function rowHTML(key, num, q){
  var isDone = !!done[key], note = notes[key] || "";
  return '<tr class="q'+(isDone?' is-done':'')+'" data-key="'+esc(key)+'">'+
   '<td class="qcol"><div class="qhead"><span class="qnum">'+num+'</span><span class="qtext" lang="en">'+esc(q.q)+'</span></div>'+
   ideaHTML(q)+
   '<label class="check"><input type="checkbox"'+(isDone?' checked':'')+'> Đã luyện</label></td>'+
   '<td class="hcol">'+hintHTML(q)+
   '<label class="notewrap"><span class="tag">Ghi chú của bạn</span><textarea rows="2" data-note="'+esc(key)+'" placeholder="Câu trả lời của bạn, lỗi cần sửa, từ mới…">'+esc(note)+'</textarea></label></td></tr>';
}
function vocabHTML(name){
  var list = VOCAB[name]; if(!list) return "";
  function mark(ex, p){
    var core = p.replace(/^(a|an|the|be) /i,"").replace(/ (someone|something) /i," ");
    var i = ex.toLowerCase().indexOf(core.toLowerCase().split(" ")[0]);
    var e = esc(ex);
    if(i<0) return e;
    var re = new RegExp("("+core.split(" ").map(function(w){return w.replace(/[.*+?^${}()|[\]\\]/g,"\\$&");}).join("\\w*[ ,]+")+"\\w*)","i");
    return e.replace(re,'<b class="hl">$1</b>');
  }
  return '<h3 class="vh">Cụm từ nâng band 6</h3><div class="scroll"><table class="vtable"><thead><tr><th scope="col">Cụm từ</th><th scope="col">Nghĩa</th><th scope="col">Ví dụ</th></tr></thead><tbody>'+
    list.map(function(r){ return '<tr><td lang="en" class="vp">'+esc(r[0])+(r[3]?'<span class="ipa">'+r[3]+'</span>':'')+'</td><td>'+esc(r[1])+'</td><td lang="en" class="vex">'+pastMark(mark(r[2],r[0]))+'</td></tr>'; }).join("")+
    '</tbody></table></div>';
}
function sheetVocabHTML(name){
  var list = SHEETV[name]; if(!list) return "";
  return '<h3 class="vh">Cụm từ trong bảng tính của bạn</h3><p class="legend">Phiên âm: <em class="red">chữ đỏ</em> là âm cuối cần bật rõ (t, d, k, p, s, z, tʃ, dʒ…). Trong ví dụ và mẫu câu: <em class="red">chữ đỏ</em> là động từ quá khứ.</p><div class="scroll"><table class="vtable"><thead><tr><th scope="col">Cụm từ</th><th scope="col">Nghĩa</th><th scope="col">Ví dụ & mẹo dùng</th></tr></thead><tbody>'+
    list.map(function(r){
      var pri = r[5] ? '<span class="pri'+(r[5]==="Học trước"?' first':'')+'">'+esc(r[5])+'</span>' : '';
      return '<tr><td lang="en" class="vp">'+esc(r[0])+'<span class="ipa">'+r[6]+'</span>'+pri+'</td><td>'+esc(r[1])+'</td><td><span lang="en" class="vex">'+r[2]+'</span>'+(r[4]?'<span class="tip">'+esc(r[4])+'</span>':'')+'</td></tr>';
    }).join("")+'</tbody></table></div>';
}
function topicCount(name){
  var t = ALL[name], n=0;
  t.qs.forEach(function(q,i){ if(done["t:"+name+":"+i]) n++; });
  return {n:n,total:t.qs.length};
}
function dayCount(id){
  if(typeof P2!=="undefined" && P2[id]) return p2Count(id);
  if(!PLAN[id]) return null;
  var n=0,total=0;
  PLAN[id].forEach(function(name){ var c=topicCount(name); n+=c.n; total+=c.total; });
  return {n:n,total:total};
}

function dayPage(id){
  var meta = DAYMETA[id], list = PLAN[id];
  var idx = Math.min(subIdx[id]||0, list.length-1);
  var name = list[idx], t = ALL[name];
  var h = '<h1>'+meta.title+'</h1><p class="lead">'+meta.lead+'</p>';
  h += '<div class="subtabs" role="tablist" aria-label="Chủ đề trong ngày">';
  list.forEach(function(nm,i){
    var c = topicCount(nm), full = c.n===c.total;
    h += '<button type="button" role="tab" data-sub="'+i+'" aria-selected="'+(i===idx)+'" class="'+(full?'full':'')+'">'+esc(nm)+' <span class="cnt">'+c.n+'/'+c.total+'</span></button>';
  });
  h += '</div><h2>'+(SHEETNUM[name]?SHEETNUM[name]+'. ':'')+esc(name)+'</h2>';
  if(t.common) h += '<p class="src">Câu hỏi thường gặp của chủ đề này. Nếu bảng tính của bạn có câu khác, ưu tiên câu trong bảng.</p>';
  h += sheetVocabHTML(name);
  h += vocabHTML(name);
  h += '<h3 class="vh">Câu hỏi</h3><table class="qtable"><thead><tr><th scope="col">Câu hỏi</th><th scope="col">Gợi ý, mẫu câu & ghi chú</th></tr></thead><tbody>';
  t.qs.forEach(function(q,qi){ h += rowHTML("t:"+name+":"+qi, qi+1, q); });
  h += '</tbody></table><div class="pager">';
  if(idx>0) h += '<button type="button" data-sub="'+(idx-1)+'">‹ '+esc(list[idx-1])+'</button>'; else h += '<span></span>';
  if(idx<list.length-1) h += '<button type="button" data-sub="'+(idx+1)+'">'+esc(list[idx+1])+' ›</button>';
  return h + '</div>';
}

lass=\"end\">nk</u> abou<u class=\"end\">t</u> this pla<u class=\"end\">ce</u> whenever I feel stresse<u class=\"end\">d</u> at wo<u class=\"end\">rk</u>. Sometime<u class=\"end\">s</u> I loo<u class=\"end\">k</u> at my photo<u class=\"end\">s</u> from the tri<u class=\"end\">p</u>, and I feel calm again.", "I li<u class=\"end\">ke</u> this pla<u class=\"end\">ce</u> becau<u class=\"end\">se</u> it he<u class=\"end\">lps</u> me forge<u class=\"end\">t</u> abou<u class=\"end\">t</u> wo<u class=\"end\">rk</u> and clear my mi<u class=\"end\">nd</u>. Ne<u class=\"end\">xt</u> time, I&#x27;m going to go in November, when the buckwhea<u class=\"end\">t</u> flowe<u class=\"end\">rs</u> are in bloom. If I <em class=\"red past\">ha<u class=\"end\">d</u></em> a long holiday, I wou<u class=\"end\">ld</u> stay there for a whole wee<u class=\"end\">k</u>."], "past": "went · stayed · woke · walked · saw · was · could · didn't", "alts": [{"topics": [{"n": "29", "t": "Describe a home that you like to visit but did not want to live in", "k": "And explain why you would not like to live there"}], "q": ["<b>Đổi:</b> tập trung vào ngôi nhà homestay.", "<span class=\"p2lbl\">HT</span>  <span lang=\"en\" class=\"p2en\">The homestay is the home of a H&#x27;Mông family. It is a traditional hou<u class=\"end\">se</u> ma<u class=\"end\">de</u> of earth and woo<u class=\"end\">d</u>, with a small garden and a kitchen with an open fire. The family is very ki<u class=\"end\">nd</u>, and they coo<u class=\"end\">k</u> deliciou<u class=\"end\">s</u> local foo<u class=\"end\">d</u> for gue<u class=\"end\">sts</u>.</span>", "<b>Vì sao không muốn ở:</b> <span lang=\"en\" class=\"p2en\">However, I wou<u class=\"end\">ldn&#x27;t</u> wa<u class=\"end\">nt</u> to live there. It&#x27;s very far from the city, it&#x27;s very co<u class=\"end\">ld</u> in winter, and the interne<u class=\"end\">t</u> is wea<u class=\"end\">k</u>, so it&#x27;s difficu<u class=\"end\">lt</u> for me to wo<u class=\"end\">rk</u> fe, becau<u class=\"end\">se</u> I really disconnecte<u class=\"end\">d</u> from my phone and my wo<u class=\"end\">rk</u>.</span>"]}], "main": {"n": "23", "t": "Describe a quiet place that you like to go to", "k": "And explain how you feel about the place"}, "name": "Mẫu 2 – Làng Nhỏ Gần Đồng Văn, Hà Giang", "short": "Mẫu 2 – Hà Giang"}, {"ideas": ["Landmark 81 – tòa nhà cao nhất VN, Bình Thạnh, cạnh sông Sài Gòn; lần đầu đi với gia đình. Phủ kính, tối sáng đèn, bên trong có trung tâm thương mại, rạp phim. Lên đài quan sát → cả thành phố dưới chân, xe như kiến → dù sợ độ cao vẫn ở đến hoàng hôn → ăn tối, dạo công viên ven sông. Thích vì đẹp, cho thấy TP.HCM hiện đại. Nếu có một cuối tuần rảnh, mình sẽ dẫn ông bà lên đỉnh."], "para": ["I<u class=\"end\">&#x27;d</u> li<u class=\"end\">ke</u> to ta<u class=\"end\">lk</u> abou<u class=\"end\">t</u> Landma<u class=\"end\">rk</u> 81, which is the talle<u class=\"end\">st</u> building in Vietnam.", "It is locate<u class=\"end\">d</u> in Bình Thạnh Distri<u class=\"end\">ct</u>, ne<u class=\"end\">xt</u> to the Saigon River. It <em class=\"red past\">opene<u class=\"end\">d</u></em> a few yea<u class=\"end\">rs</u> ago, and I fi<u class=\"end\">rst</u> <em class=\"red past\">we<u class=\"end\">nt</u></em> there with my family.", "The building is very tall and covere<u class=\"end\">d</u> with gla<u class=\"end\">ss</u>. At ni<u class=\"end\">ght</u>, it shine<u class=\"end\">s</u> with colourful li<u class=\"end\">ghts</u>. Insi<u class=\"end\">de</u>, there is a big shopping mall, a cinema and many restaura<u class=\"end\">nts</u>.", "On our fi<u class=\"end\">rst</u> visi<u class=\"end\">t</u>, we <em class=\"red past\">too<u class=\"end\">k</u></em> the li<u class=\"end\">ft</u> to the observation de<u class=\"end\">ck</u> at the to<u class=\"end\">p</u>. When I <em class=\"red past\">looke<u class=\"end\">d</u></em> ou<u class=\"end\">t</u> of the window, the whole city <em class=\"red past\">was</em> under my fee<u cl end\">s</u> abou<u class=\"end\">t</u> this radio."], "past": "belonged · bought · was · had · told · sat · turned · worked", "alts": [{"topics": [{"n": "12", "t": "Describe a period in history that you are interested in", "k": "And explain why you are interested in this era"}], "q": ["<b>Đổi:</b> lấy chính giai đoạn những năm 1980 trong bài.", "<span lang=\"en\" class=\"p2en\">I&#x27;m intereste<u class=\"end\">d</u> in Vietnam in the 1980<u class=\"end\">s</u>. I learn abou<u class=\"end\">t</u> it from my grandfathe<u class=\"end\">r&#x27;s</u> storie<u class=\"end\">s</u> and from boo<u class=\"end\">ks</u>. At that time, life <em class=\"red past\">was</em> very ha<u class=\"end\">rd</u>: people <em class=\"red past\">di<u class=\"end\">dn&#x27;t</u></em> have enough foo<u class=\"end\">d</u>, and they <em class=\"red past\">ha<u class=\"end\">d</u></em> to wai<u class=\"end\">t</u> in long line<u class=\"end\">s</u> to buy ri<u class=\"end\">ce</u>. I&#x27;m intereste<u class=\"end\">d</u> in this perio<u class=\"end\">d</u> becau<u class=\"end\">se</u> it he<u class=\"end\">lps</u> me understa<u class=\"end\">nd</u> my family and how much our country is changing.</span>", "<span class=\"p2lbl\">TL</span>  <span lang=\"en\" class=\"p2en\">I&#x27;m going to rea<u class=\"end\">d</u> more boo<u class=\"end\">ks</u> abou<u class=\"end\">t</u> this perio<u class=\"end\">d</u>.</span>"]}, {"topics": [{"n": "8", "t": "Describe an impressive work of art (such as a painting) you saw", "k": "And explain why you enjoy it"}], "q": ["<b>Đổi:</b> đổi đồ vật thành bức tranh cũ treo ở nhà ông bà, giữ đoạn \"ông kể chuyện\" và \"vì sao ý nghĩa\".", "<span class=\"p2lbl\">QK</span>  <span lang=\"en\" class=\"p2en\">I fi<u class=\"end\">rst</u> <em class=\"red past\">saw</em> it when I <em class=\"red past\">was</em> a chi<u class=\"end\">ld</u>, in my grandpare<u class=\"end\">nts&#x27;</u> hou<u class=\"end\">se</u> in Bến Tre.</span>", "<span class=\"p2lbl\">HT</span>  <span n you buy a coffee or some frui<u class=\"end\">t</u>, the sho<u class=\"end\">p</u> usually give<u class=\"end\">s</u> you a bag, and you throw it away after a few minute<u class=\"end\">s</u>.", "In Vũng Tàu, we <em class=\"red past\">walke<u class=\"end\">d</u></em> along the beach in the morning, and I <em class=\"red past\">saw</em> plasti<u class=\"end\">c</u> ba<u class=\"end\">gs</u> everywhere: in the sa<u class=\"end\">nd</u>, in the water, even arou<u class=\"end\">nd</u> a small fish. That ni<u class=\"end\">ght</u>, I <em class=\"red past\">watche<u class=\"end\">d</u></em> a ne<u class=\"end\">ws</u> video abou<u class=\"end\">t</u> a sea turtle with a plasti<u class=\"end\">c</u> bag in its mouth. I <em class=\"red past\">fe<u class=\"end\">lt</u></em> really sa<u class=\"end\">d</u>.", "With this law, sho<u class=\"end\">ps</u> ca<u class=\"end\">n&#x27;t</u> give free plasti<u class=\"end\">c</u> ba<u class=\"end\">gs</u>, so people bring their own cloth ba<u class=\"end\">gs</u> or pay for paper ba<u class=\"end\">gs</u>. Everyone benefi<u class=\"end\">ts</u> from it, especially sea anima<u class=\"end\">ls</u> and our children.", "At fi<u class=\"end\">rst</u>, people will feel it is inconvenie<u class=\"end\">nt</u>, but they will ge<u class=\"end\">t</u> use<u class=\"end\">d</u> to it. I thi<u class=\"end\">nk</u> it is a simple law, and everyone can follow it. If I <em class=\"red past\">ha<u class=\"end\">d</u></em> the power, I wou<u class=\"end\">ld</u> introdu<u class=\"end\">ce</u> this law tomorrow."], "past": "thought · went · walked · saw · watched · felt · had", "alts": [], "main": {"n": "27", "t": "Describe a law of environment protection that you would like to introduce", "k": "And explain how you feel about this law"}, "short": "Đề 27 – Luật túi nilon"}]}, "p2_4": {"name": "Sự kiện", "title": "Nhóm 4 – SỰ KIỆN & TRẢI NGHIỆM (Events / Experiences)", "tips": ["<b>Lưu ý riêng nhóm này:</b> đề hỏi \"a time when…\" nên <b>bắt buộc</b> </u> the Pomodoro metho<u class=\"end\">d</u>.", "I thi<u class=\"end\">nk</u> it waste<u class=\"end\">s</u> my time becau<u class=\"end\">se</u> I ca<u class=\"end\">n&#x27;t</u> remember anything useful after watching, and I go to be<u class=\"end\">d</u> la<u class=\"end\">te</u>. If I <em class=\"red past\">ha<u class=\"end\">d</u></em> more self-control, I wou<u class=\"end\">ld</u> dele<u class=\"end\">te</u> the a<u class=\"end\">pp</u> on weekday<u class=\"end\">s</u>."], "past": "started · lay · said · watched · looked · was · felt · couldn't · checked · saw · spent · tried · had", "alts": [{"topics": [{"n": "24", "t": "Describe something that you do that can help you concentrate on work or study", "k": "And explain how it helps you concentrate on your work/study"}], "q": ["<b>Đổi:</b> đảo trọng tâm sang Pomodoro, đoạn TikTok chỉ còn 1–2 câu làm lý do.", "<span class=\"p2lbl\">QK</span>  <span lang=\"en\" class=\"p2en\">I <em class=\"red past\">starte<u class=\"end\">d</u></em> using the Pomodoro metho<u class=\"end\">d</u> abou<u class=\"end\">t</u> a year ago, when I <em class=\"red past\">realize<u class=\"end\">d</u></em> that TikTok <em class=\"red past\">too<u class=\"end\">k</u></em> too much of my time.</span>", "<span class=\"p2lbl\">HT</span>  <span lang=\"en\" class=\"p2en\">I u<u class=\"end\">se</u> it every day, both at wo<u class=\"end\">rk</u> and when I study English. I se<u class=\"end\">t</u> a timer for 25 minute<u class=\"end\">s</u>, and I only focu<u class=\"end\">s</u> on one ta<u class=\"end\">sk</u>. Then I ta<u class=\"end\">ke</u> a 5-minu<u class=\"end\">te</u> brea<u class=\"end\">k</u>: I dri<u class=\"end\">nk</u> water or wa<u class=\"end\">lk</u> arou<u class=\"end\">nd</u>. After four rou<u class=\"end\">nds</u>, I ta<u class=\"end\">ke</u> a longer brea<u class=\"end\">k</u>. It he<u class=\"end\">lps</u> me becau<u class=\"end\">se</u> 25 minute<u class=\"end\">s</u> fee<u class=\"end\">ls</u> sho<u class=\"end\">rt</u> var P3G = {"p3_1": {"name": "Người", "topics": [{"name": "Đề 10 · Sports", "rows": [["Should students have physical education and do sports at school?", "Có, chắc chắn rồi. Thể thao giúp học sinh khỏe mạnh, [[and]] giảm căng thẳng sau giờ học. Học sinh [[also]] học được tinh thần đồng đội khi chơi bóng đá hay bóng rổ. [[For example]], ở trường mình ngày xưa, tiết thể dục là giờ học mà ai cũng mong đợi. [[However]], nhiều trường ở thành phố không có đủ sân chơi, [[so]] chính phủ nên đầu tư nhiều hơn.", "Yes, definitely. Sports keep students healthy, [[and]] they help students relax after studying. Students [[also]] learn teamwork when they play football or basketball. [[For example]], at my old school, PE was the lesson everyone looked forward to. [[However]], many schools in big cities don't have enough space for sports, [[so]] the government should invest more.", "", "keep healthy|teamwork", ""], ["What qualities make an athlete?", "Một vận động viên cần chăm chỉ và kỷ luật. Họ tập luyện mỗi ngày, kể cả khi thời tiết xấu. [[And]] họ không bỏ cuộc sau khi thua. Họ [[also]] cần tinh thần mạnh mẽ, [[because]] áp lực thi đấu rất lớn. [[For example]], vận động viên phải giữ bình tĩnh khi hàng nghìn người đang xem.", "An athlete needs to be hard-working and disciplined. They train every day, even when the weather is bad. [[And]] they don't give up after losing a match. They [[also]] need a strong mind, [[because]] there is a lot of pressure in competitions. [[For example]], athletes have to stay calm when thousands of people are watching.", "", "discipline|train|give up", ""], ["Is talent important in sports?", "Năng khiếu quan trọng, [[but]] chăm chỉ còn quan trọng hơn. Năng khiếu giúp lúc bắt đầu. [[However]], nếu không tập luyện, năng khiếu thôi là không đủ. [[For example]], nhiều vận động viên Việt Nam không phải thiên tài, [[but]] họ tập luyện rất chăm và vẫn giành huy chương SEA Games. [[So]] mình nghĩ chăm chỉ là yếu tố quyết định.", "Talent is important, [[but]] hard work is more important. Talent helps at the beginning. [[However]], without training, talent is not enough. [[For example]], many Vietnamese athletes are not very talented at first, [[but]] they train very hard and still win medals at the SEA Games. [[So]] I think hard work is the key.", "", "talent|hard work|not enough", ""], ["What is the most popular sport in your country?", "Bóng đá là môn phổ biến nhất. [[When]] đội tuyển quốc gia đá, hầu như ai cũng xem. Gần đây, cầu lông và pickleball [[also]] rất phổ biến. Bóng đá phổ biến [[because]] dễ chơi, chỉ cần một quả bóng. [[When]] Việt Nam thắng, mọi người còn đổ ra đường ăn mừng.", "Football is the most popular sport. [[When]] the national team plays, almost everyone watches. Recently, badminton and pickleball have [[also]] become very popular. Football is popular [[because]] it's easy to play; you only need a ball. [[When]] Vietnam wins, people even go out into the streets to celebrate.", "", "national team|badminton|pickleball", ""]]}, {"name": "Đề 22 · Teachers & learning", "rows": [["What qualities do you think a good teacher should have?", "Một giáo viên giỏi cần kiên nhẫn và tử tế. Họ [[also]] cần giải thích rõ ràng. [[And]] họ nên làm cho bài học thú vị, [[so]] học sinh không thấy chán. [[For example]], cô giáo tiếng Anh cấp ba của mình hay dùng trò chơi trong lớp, [[so]] tụi mình rất thích học. Mình nghĩ giáo viên giỏi còn cần thực sự quan tâm đến học sinh.", "A good teacher should be patient and kind. They [[also]] need to explain things clearly. [[And]] they should make lessons interesting, [[so]] students don't feel bored. [[For example]], my high school English teacher often used games in class, [[so]] we really enjoyed learning. I think a good teacher [[also]] needs to really care about the students.", "", "patient|explain clearly|interesting", ""], ["Who do you think can learn better? Old or young people?", "Mình nghĩ người trẻ học tốt hơn, [[because]] họ nhớ nhanh hơn. [[However]], người lớn tuổi tập trung hơn, [[because]] họ biết rõ mình học để làm gì. [[For example]], trẻ con học ngoại ngữ rất nhanh, [[because]] chúng không sợ sai. [[But]] người lớn biết cách học hiệu quả, [[so]] nếu có động lực, người lớn cũng học rất tốt.", "I think young people learn better, [[because]] they remember things faster. [[However]], older people are more focused, [[because]] they know why they are learning. [[For example]], children learn languages very quickly, [[because]] they're not afraid of making mistakes. [[But]] adults know how to study effectively, [[so]] if they're motivated, they can learn very well too.", "", "remember faster|focused", ""], ["What do you think is the best age for children to go to school?", "Mình nghĩ khoảng 6 tuổi là phù hợp, [[because]] lúc đó trẻ đã sẵn sàng ngồi học và tập trung. [[Before that]], trẻ nên chơi và học ở trường mẫu giáo. [[If]] trẻ đi học quá sớm, trẻ có thể thấy áp lực và mệt mỏi. [[In my opinion]], trẻ nhỏ cần thời gian chơi để phát triển sự sáng tạo.", "I think around six years old is the best age, [[because]] children are ready to sit and focus. [[Before that]], they should play and learn at kindergarten. [[If]] children start school too early, they may feel stressed and tired. [[In my opinion]], young children need time to play, [[because]] it helps them become creative.", "", "ready|kindergarten", ""]]}, {"name": "Đề 28 · Success", "rows": [["Why do some people succeed while others give up?", "[[Because]] người thành công có mục tiêu rõ ràng, [[and]] họ coi thất bại là bài học. [[On the other hand]], người khác dễ bỏ cuộc khi mọi thứ trở nên khó khăn. Người thành công [[also]] thường có người ủng hộ, như gia đình hay bạn bè. [[So]] mình nghĩ mục tiêu rõ ràng và sự hỗ trợ là hai điều quan trọng nhất.", "[[Because]] successful people have clear goals, [[and]] they see failure as a lesson. [[On the other hand]], other people give up when things get difficult. Successful people [[also]] usually have people who support them, like family or friends. [[So]] I think clear goals and support are the two most important things.", "", "clear goals|lesson|give up", ""], ["Is determination important for success?", "Có, rất quan trọng, [[because]] thành công cần nhiều thời gian. [[For example]], chị mình vẫn kiên trì [[when]] shop tranh của chị có rất ít khách, [[and]] giờ chị đã thành công. Không có sự quyết tâm, mọi người sẽ bỏ cuộc khi gặp khó khăn đầu tiên. [[So]] mình nghĩ quyết tâm còn quan trọng hơn cả tài năng.", "Yes, very important, [[because]] success takes a long time. [[For example]], my sister kept going [[when]] her art shop had very few customers, [[and]] now she is successful. Without determination, people give up at the first difficulty. [[So]] I think determination is even more important than talent.", "", "determination|take time|keep going", ""], ["Should parents teach children not to give up easily?", "Có, chắc chắn rồi. [[Because]] cuộc sống có nhiều khó khăn, trẻ cần học cách kiên trì. Bố mẹ có thể bắt đầu bằng việc để con tự hoàn thành những việc nhỏ. [[For example]], [[when]] con học đi xe đạp và bị ngã, bố mẹ nên động viên con thử lại. [[But]] bố mẹ [[also]] không nên ép con quá nhiều.", "Yes, definitely. [[Because]] life is full of difficulties, children need to learn not to give up. Parents can start by asking their kids to finish small tasks by themselves. [[For example]], [[when]] a child learns to ride a bike and falls, parents should encourage them to try again. [[But]] parents [[also]] shouldn't push their kids too hard.", "", "difficulties|finish tasks", ""], ["Can failure help people become successful?", "Có, mình nghĩ vậy. [[When]] thất bại, con người học được từ sai lầm của mình, [[so]] lần sau họ làm tốt hơn. Nhiều người thành công đã thất bại rất nhiều lần. [[For example]], lần đầu thi IELTS mình không đạt điểm mong muốn, [[but]] mình biết điểm yếu của mình là ngữ pháp, [[so]] giờ mình tập trung vào đó. Thất bại cho mình biết cần cải thiện điều gì.", "Yes, I think so. [[When]] people fail, they learn from their mistakes, [[so]] next time they do better. Many successful people failed many times before they succeeded. [[For example]], I didn't get the score I wanted the first time I took IELTS, [[but]] I learned that my weak point was grammar, [[so]] now I focus on it. Failure shows us what we need to improve.", "", "learn from mistakes|do better", ""], ["What motivates people to achieve difficult goals?", "Nhiều người có động lực từ tiền và mong muốn có cuộc sống tốt hơn. Gia đình [[also]] là động lực lớn. [[And]] một số người chỉ muốn cảm giác tự hào về bản thân. [[For example]], chị mình làm việc rất chăm [[because]] chị muốn chứng minh với bố mẹ rằng chị đúng. Mình nghĩ động lực từ bên trong thường mạnh hơn động lực từ tiền bạc.", "Many people are motivated by money and a better life. Their family is [[also]] a big motivation. [[And]] some people just want to feel proud of themselves. [[For example]], my sister works very hard [[because]] she wants to show our parents that she made the right choice. I think motivation from inside is usually stronger than money.", "", "better life|family|pride", ""]]}, {"name": "Đề 31 · Business", "rows": [["What qualities make someone a successful businessperson?", "Mình nghĩ họ cần chăm chỉ và sáng tạo. Họ [[also]] không dễ bỏ cuộc. [[For example]], chị mình tối nào cũng làm việc khuya để lo cho shop tranh. [[Also]], một doanh nhân giỏi cần hiểu khách hàng và biết lắng nghe. [[Without]] những điều này, doanh nghiệp khó phát triển lâu dài.", "I think they need to be hard-working and creative. They [[also]] don't give up easily. [[For example]], my sister works late every night for her art shop. [[Also]], a good businessperson needs to understand customers and listen to them. [[Without]] these qualities, it's hard for a business to grow.", "", "hard-working|creative|give up", ""], ["Do you think starting a business is risky? Why?", "Có, khá rủi ro, [[because]] có thể mất nhiều tiền. [[For example]], nhiều cửa hàng nhỏ ở thành phố của mình đóng cửa chỉ sau một năm. [[Also]], người kinh doanh phải làm việc rất nhiều giờ, [[and]] thu nhập không ổn định. [[But]] nếu thành công, họ có thể kiếm nhiều tiền hơn đi làm thuê.", "Yes, quite risky, [[because]] you can lose a lot of money. [[For example]], many small shops in my city close after only one year. [[Also]], business owners have to work very long hours, [[and]] their income isn't stable. [[But]] if they succeed, they can earn much more than an employee.", "", "risky|lose money|close down", ""], ["Why do some businesses succeed while others fail?", "Doanh nghiệp thành công hiểu khách hàng của mình, [[and]] có sản phẩm, dịch vụ tốt. [[On the other hand]], doanh nghiệp thất bại thường không thay đổi khi thị trường thay đổi. [[For example]], shop tranh của chị mình thành công [[because]] chị trả lời khách rất nhanh và vẽ theo yêu cầu. Mình nghĩ ngày nay doanh nghiệp còn cần biết dùng mạng xã hội.", "Successful businesses understand their customers, [[and]] they have good products and good service. [[On the other hand]], businesses [[which]] fail often don't change when the market changes. [[For example]], my sister's art shop is successful [[because]] she replies to customers quickly and draws what they want. I think businesses today [[also]] need to use social media well.", "", "understand customers|good service|the market changes", ""], ["Is it better to work for a company or run your own business?", "Với mình, làm cho công ty tốt hơn, [[because]] ổn định và ít căng thẳng hơn. [[But]] trong tương lai, mình có thể tự kinh doanh. Làm cho công ty, mình học được từ đồng nghiệp và có lương đều đặn. [[However]], tự kinh doanh thì tự do hơn, [[so]] nó phù hợp với người thích rủi ro.", "For me, working for a company is better, [[because]] it's more stable and less stressful. [[But]] in the future, I [[might]] start my own business. When you work for a company, you can learn from your colleagues, and you get a regular salary. [[However]], running your own business gives you more freedom, [[so]] it suits people who like taking risks.", "", "stable|less stressful|start my own business", ""]]}, {"name": "Đề 32 · Art & drawing", "rows": [["What is the right age for a child to learn drawing?", "Mình nghĩ khoảng 4–5 tuổi, [[because]] lúc đó trẻ đã cầm bút vững. Trẻ ở tuổi này [[also]] rất sáng tạo, [[so]] đây là thời điểm tốt để bắt đầu. [[However]], mình nghĩ không nên ép trẻ học vẽ quá sớm. Trẻ nên vẽ vì thích, [[not because]] bố mẹ muốn.", "I think around four or five, [[because]] kids can hold a pencil well at that age. They're [[also]] very creative, [[so]] it's a good time to start. [[However]], I don't think parents should force kids to learn too early. Children should draw [[because]] they enjoy it, not because their parents want them to.", "", "hold a pencil|creative", ""], ["Why do most children draw more often than adults do?", "[[Because]] trẻ có nhiều thời gian rảnh hơn, [[and]] trẻ không sợ vẽ xấu. [[In contrast]], người lớn bận làm việc và thường nghĩ mình vẽ không đẹp. [[Also]], trẻ dùng tranh để thể hiện cảm xúc, [[because]] trẻ chưa biết nói hết bằng lời. Khi lớn lên, mọi người dần mất thói quen đó.", "[[Because]] children have more free time, [[and]] they aren't afraid of drawing badly. [[In contrast]], adults are busy with work, and they often think they can't draw well. [[Also]], children use drawing to show their feelings, [[because]] they can't always explain them with words. As people grow up, they slowly lose this habit.", "", "free time|afraid of|busy", ""], ["Why do some people visit galleries or museums instead of viewing artworks online?", "[[Because]] ở phòng tranh, mình thấy được màu sắc và kích thước thật của tác phẩm. Không khí ở đó [[also]] rất đặc biệt. [[And]] đi xem triển lãm là hoạt động cuối tuần thú vị. [[For example]], khi xem tranh thật ở bảo tàng Mỹ thuật TP.HCM, mình thấy rõ từng nét cọ. Xem trên điện thoại thì tiện, [[but]] không thể có cảm giác như vậy.", "[[Because]] in a gallery, you can see the real colours and size of the artwork. The atmosphere is [[also]] special. [[And]] visiting a gallery is a nice weekend activity. [[For example]], when I see real paintings at the Fine Arts Museum in Ho Chi Minh City, I can see every brushstroke. Looking at art on a phone is convenient, [[but]] you can't get the same feeling.", "", "real colours|atmosphere|weekend", ""], ["Do you think galleries and museums should be free of charge?", "Mình nghĩ nên miễn phí cho học sinh và trẻ em, [[so]] nhiều người được tiếp cận nghệ thuật hơn. [[But]] người lớn có thể trả một khoản phí nhỏ để giúp duy trì bảo tàng. [[If]] miễn phí hoàn toàn, có thể không đủ tiền để bảo quản tác phẩm. [[So]] mình nghĩ giá vé rẻ là giải pháp tốt nhất.", "I think they should be free for students and children, [[so]] more people can learn about art. [[But]] adults can pay a small fee to help look after the museum. [[If]] they're completely free, there may not be enough money to look after the artworks. [[So]] I think cheap tickets are the best solution.", "", "free of charge|learn about art|small fee", ""], ["How do artworks inspire people?", "Tác phẩm nghệ thuật làm người xem thấy bình yên hoặc vui vẻ. Chúng [[also]] cho người ta ý tưởng mới. [[For example]], một bức tranh thiên nhiên làm mình muốn đi du lịch. Nghệ thuật [[also]] giúp mọi người hiểu về lịch sử và văn hóa. [[For example]], tranh Đông Hồ cho mình thấy cuộc sống ở làng quê Việt Nam ngày xưa.", "Artworks can make people feel calm or happy. They [[also]] give people new ideas. [[For example]], a painting of nature makes me want to travel. Art [[also]] helps people understand history and culture. [[For example]], Đông Hồ paintings show me village life in old Vietnam.", "", "feel calm|new ideas", ""]]}, {"name": "Đề 34 · Clothes", "rows": [["Do you think what people wear can influence their mood?", "Có, mình nghĩ vậy. [[When]] mình mặc đồ màu sáng, mình thấy vui hơn. Quần áo đẹp [[also]] giúp mọi người tự tin hơn, nhất là khi đi phỏng vấn. [[For example]], [[when]] mình mệt, mình hay mặc đồ màu sáng đi làm để thấy vui hơn. Mình nghĩ quần áo [[also]] ảnh hưởng đến cách người khác nhìn mình.", "Yes, I think so. [[When]] I wear bright colours, I feel happier. Nice clothes [[also]] make people more confident, especially at a job interview. [[For example]], [[when]] I feel tired, I often wear bright clothes to work to cheer myself up. I think clothes [[also]] affect how other people see us.", "", "bright colours|confident", ""], ["Do you think it is a good idea to buy clothes online?", "Vừa tốt vừa không. Mua online thì rẻ và tiện. [[But]] đôi khi size hoặc màu sắc không giống trong ảnh, [[so]] phải đổi trả. [[For example]], mình hay mua quần áo trên Shopee vì có nhiều giảm giá. [[But]] với đồ quan trọng như vest hay giày, mình thích ra cửa hàng thử trước.", "Yes and no. It's cheap and convenient. [[But]] sometimes the size or the colour is different from the photo, [[so]] you have to return it. [[For example]], I often buy clothes on Shopee [[because]] there are many discounts. [[But]] for important things like suits or shoes, I prefer to try them on in a shop first.", "", "convenient|wrong size", ""], ["What kind of clothes do people wear in the workplace?", "Đa số dân văn phòng mặc sơ mi và quần tây. Một số công ty có đồng phục. [[However]], ở các nghề sáng tạo như marketing, mọi người mặc thoải mái hơn, ví dụ quần jeans. Ở ngân hàng hay công ty luật, mọi người mặc rất trang trọng, [[because]] họ cần tạo sự tin tưởng với khách hàng. Mình nghĩ quần áo nên phù hợp với từng công việc.", "Most office workers wear shirts and trousers. Some companies have uniforms. [[However]], in creative jobs like marketing, people dress more casually, like in jeans. In banks or law firms, people dress very formally, [[because]] they need customers to trust them. I think clothes should suit the job.", "", "uniform|relaxed", ""], ["What are the differences between clothes worn by old people and those by young people?", "Người lớn tuổi thích quần áo đơn giản, thoải mái, [[while]] người trẻ theo xu hướng thời trang. Người trẻ [[also]] mặc màu sáng hơn và hay mua đồ mới hơn. [[For example]], bà mình chỉ mặc áo bà ba và quần lụa, [[while]] em gái mình thích áo crop top và quần jeans rách. Mình nghĩ người trẻ dùng quần áo để thể hiện cá tính.", "Old people prefer simple and comfortable clothes, [[while]] young people follow fashion trends. Young people [[also]] wear brighter colours, and they buy new clothes more often. [[For example]], my grandmother only wears traditional clothes, [[while]] my younger sister likes crop tops and ripped jeans. I think young people use clothes to show their personality.", "", "comfortable|fashion trends", ""]]}, {"name": "Đề 44 · Music", "rows": [["What kind of music do people like at different ages?", "Người trẻ thường thích nhạc pop và rap, [[while]] người lớn tuổi thích nhạc xưa và nhạc truyền thống. [[For example]], bố mẹ mình rất thích nhạc Trịnh Công Sơn. Người trẻ thích nhạc sôi động [[because]] nó hợp với nhịp sống nhanh. Người lớn tuổi thích nhạc chậm và lời ý nghĩa, [[because]] nó nhắc họ nhớ về tuổi trẻ.", "Young people usually like pop and rap, [[while]] older people prefer old songs and traditional music. [[For example]], my parents love Trịnh Công Sơn's songs. Young people like energetic music [[because]] it matches their busy lifestyle. Older people prefer slow songs with meaningful lyrics, [[because]] they remind them of their youth.", "", "pop|rap|traditional music", ""], ["What kind of music is popular in your country now and what kind will be in the future?", "Hiện giờ V-pop và rap đang rất thịnh. Mình nghĩ trong tương lai, sẽ có nhiều nhạc làm bằng AI. [[Also]], nhạc Việt sẽ pha trộn nhiều hơn với phong cách phương Tây. [[For example]], nhiều ca sĩ trẻ giờ kết hợp nhạc cụ dân tộc với nhạc điện tử. Mình nghĩ đây là xu hướng hay, [[because]] nó giúp giữ gìn văn hóa Việt.", "Now, V-pop and rap are very popular. I think in the future, there [[will]] be more music made with AI. [[Also]], Vietnamese music [[will]] mix more with Western styles. [[For example]], many young singers now mix traditional instruments with electronic music. I think it's a good trend, [[because]] it helps keep Vietnamese culture alive.", "", "V-pop|rap|AI music", ""], ["Do parents in your country require their children to learn to play musical instruments?", "Không hẳn. Đa số bố mẹ tập trung cho con học tiếng Anh và toán. [[But]] một số gia đình ở thành phố lớn cho con đi học piano hoặc guitar. [[In my opinion]], học nhạc cụ rất tốt cho trẻ, [[because]] nó giúp trẻ kiên nhẫn và tập trung. [[But]] học phí khá đắt, [[so]] không phải gia đình nào cũng cho con học được.", "Not really. Most parents focus on English and maths. [[But]] some families in big cities send their kids to piano or guitar classes. [[In my opinion]], learning an instrument is very good for kids, [[because]] it helps them become patient and focused. [[But]] the classes are quite expensive, [[so]] not every family can afford them.", "", "focus on|piano classes", ""], ["Why do some people like to listen to live music while others prefer CDs?", "Một số người thích nhạc sống [[because]] không khí rất tuyệt, được thấy ca sĩ và hát theo. Người khác thích đĩa CD hoặc nghe online, [[because]] rẻ hơn và nghe lúc nào cũng được. [[For example]], mình thích nghe nhạc trên Spotify khi lái xe đi làm. [[But]] [[if]] ca sĩ mình thích tổ chức concert, mình chắc chắn sẽ mua vé, [[because]] cảm giác hát cùng hàng nghìn người rất tuyệt.", "Some people like live music [[because]] the atmosphere is great, and they can see the singer and sing along. [[Others]] prefer CDs or streaming, [[because]] it's cheaper and they can listen anytime. [[For example]], I usually listen to music on Spotify when I drive to work. [[But]] [[if]] my favourite singer has a concert, I [[will]] definitely buy a ticket, [[because]] singing with thousands of people is amazing.", "", "atmosphere|sing along|listen anytime", ""]]}, {"name": "Đề 45 · Health", "rows": [["What effect does stress have on health?", "Căng thẳng có thể gây đau đầu và mất ngủ. Người bị căng thẳng [[also]] hay ăn uống không điều độ. [[If]] căng thẳng kéo dài, nó có thể gây bệnh nặng. [[For example]], [[when]] mình có deadline ở công ty, mình hay mất ngủ và ăn đồ ăn nhanh. [[So]] mình nghĩ mọi người nên tập thể dục hoặc thiền để giảm căng thẳng.", "Stress can cause headaches and bad sleep. Stressed people [[also]] often eat badly. [[If]] it lasts a long time, it can cause serious illness. [[For example]], [[when]] I have deadlines at work, I often can't sleep, and I eat fast food. [[So]] I think people should exercise or meditate to reduce stress.", "", "headaches|bad sleep|long-term", ""], ["Which group pays more attention to health, young people or old people?", "Mình nghĩ người lớn tuổi quan tâm hơn, [[because]] họ lo bị bệnh. [[On the other hand]], người trẻ nghĩ mình khỏe, [[so]] họ hay thức khuya và ăn đồ ăn nhanh. [[However]], bây giờ người trẻ bắt đầu quan tâm sức khỏe hơn. [[For example]], nhiều bạn trẻ đi gym, chạy bộ và ăn uống lành mạnh. Mình nghĩ xu hướng này rất tốt.", "I think old people pay more attention, [[because]] they worry about getting sick. Young people, [[on the other hand]], think they're healthy, [[so]] they often stay up late and eat fast food. [[However]], young people are starting to care more about their health now. [[For example]], many of them go to the gym, run and eat healthy food. I think it's a very good trend.", "", "worry about|stay up late", ""]]}, {"name": "Đề 49 · Intelligence", "rows": [["What kinds of games can help children become more intelligent?", "Những trò như xếp hình và cờ bàn có thể giúp trẻ, [[because]] trẻ phải suy nghĩ và lên kế hoạch. Cờ vua đặc biệt tốt cho tư duy. Một số app giáo dục [[also]] rất hữu ích. [[However]], trò chơi điện tử thì không tốt lắm [[if]] trẻ chơi quá nhiều. Mình nghĩ bố mẹ nên chơi cùng con, [[because]] như vậy trẻ học được nhiều hơn.", "Games like puzzles and board games can help, [[because]] children need to think and plan. Chess is especially good for thinking. Some educational apps are [[also]] useful. [[However]], video games are not very good [[if]] children play too much. I think parents should play with their kids, [[because]] they can learn more that way.", "", "puzzles|board games|chess", ""], ["Do you agree that talking to children is the best way to develop their intelligence?", "Đó là một trong những cách tốt nhất, [[because]] trẻ học được từ mới và ý tưởng mới khi nói chuyện. [[Also]], đọc sách cùng nhau cũng giúp trẻ phát triển rất nhiều. [[When]] bố mẹ hỏi con những câu như \"Tại sao?\", trẻ phải suy nghĩ và giải thích. Điều này giúp trẻ phát triển tư duy và tự tin hơn.", "It's one of the best ways, [[because]] children learn new words and ideas when they talk. [[Also]], reading books together helps a lot. [[When]] parents ask their children questions like \"Why?\", the children have to think and explain. This helps them develop their thinking and become more confident.", "", "new words|reading together", ""], ["Does spending lots of time on computers make children less intelligent?", "Không hẳn. Trẻ có thể học được rất nhiều trên mạng. [[But]] chơi game quá nhiều thì không tốt cho khả năng tập trung của trẻ. [[For example]], cháu mình xem YouTube cả ngày, [[and]] bé khó ngồi yên làm bài tập. [[So]] mình nghĩ bố mẹ nên giới hạn thời gian dùng máy tính, khoảng một tiếng mỗi ngày.", "Not always. Children can learn a lot online. [[But]] too much gaming is bad for their focus. [[For example]], my nephew watches YouTube all day, [[and]] he finds it hard to sit still and do his homework. [[So]] I think parents should limit screen time to about one hour a day.", "", "learn online|focus", ""], ["Who plays a more important role in a child’s development, teachers or parents?", "Mình nghĩ bố mẹ quan trọng hơn, [[because]] trẻ ở nhà nhiều hơn ở trường. Bố mẹ [[also]] dạy trẻ những giá trị sống và thói quen tốt. [[However]], giáo viên [[also]] rất quan trọng, [[because]] họ dạy kiến thức và kỹ năng xã hội. [[So]] cả hai cần phối hợp với nhau.", "I think parents play a more important role, [[because]] children spend more time at home than at school. Parents [[also]] teach them values and good habits. [[However]], teachers are [[also]] very important, [[because]] they teach knowledge and social skills. [[So]] both of them need to work together.", "", "values|habits", ""], ["What is the difference between the role of a teacher and a parent in the education of children?", "Giáo viên chủ yếu dạy kiến thức, [[while]] bố mẹ dạy con cách cư xử. Bố mẹ [[also]] cho con tình yêu thương và sự hỗ trợ. [[For example]], giáo viên dạy con giải toán, [[while]] bố mẹ dạy con nói lời cảm ơn và xin lỗi. Mình nghĩ vai trò của bố mẹ kéo dài cả đời.", "Teachers mainly teach knowledge, [[while]] parents teach children how to behave. Parents [[also]] give them love and support. [[For example]], a teacher teaches a child how to solve maths problems, [[while]] parents teach them to say thank you and sorry. I think a parent's role lasts for life.", "", "knowledge|behave|support", ""]]}, {"name": "Đề 50 · Happiness", "rows": [["How can companies improve employees’ happiness?", "Mình nghĩ công ty có thể tạo môi trường làm việc tốt, lương công bằng và giờ làm linh hoạt. [[For example]], công ty mình cho làm ở nhà vào thứ Sáu, [[so]] ai cũng thấy vui hơn. [[In addition]], công ty nên khen thưởng nhân viên làm tốt và tổ chức hoạt động nhóm như du lịch. [[When]] nhân viên vui, họ làm việc hiệu quả hơn và ít nghỉ việc hơn.", "I think companies can give employees a good working environment, a fair salary and flexible hours. [[For example]], my company lets us work from home on Fridays, [[so]] everyone feels happier. [[In addition]], companies should reward good work and organise team activities, like company trips. [[When]] employees are happy, they work better, and they don't quit.", "", "working environment|flexible hours|work from home", ""], ["Which do you think is more important in the workplace, happiness or high salaries?", "Với mình, hạnh phúc quan trọng hơn, [[because]] [[if]] mình không vui, mình không làm việc tốt được. [[However]], lương vẫn quan trọng để trang trải cuộc sống. [[For example]], nhiều bạn mình nghỉ việc lương cao [[because]] sếp quá khó tính. [[So]] mình nghĩ môi trường làm việc vui vẻ quan trọng không kém tiền lương.", "For me, happiness is more important, [[because]] [[if]] I'm unhappy, I can't work well. [[However]], salary is still important to pay the bills. [[For example]], many of my friends quit well-paid jobs [[because]] their bosses were too difficult. [[So]] I think a happy workplace is as important as the salary.", "", "be happy at work|pay the bills", ""], ["Some people say that living in a happy city is boring. What do you think?", "Mình không đồng ý. Một thành phố hạnh phúc thì yên bình và an toàn, [[and]] vẫn có nhiều thứ để làm. [[For example]], Đà Nẵng rất yên bình nhưng không hề nhàm chán. Thành phố yên bình giúp mọi người có thời gian cho gia đình và sở thích. [[In my opinion]], một thành phố hạnh phúc không cần quá sôi động, nó chỉ cần an toàn và dễ sống.", "I don't agree. A happy city is peaceful and safe, [[and]] there are still many things to do. [[For example]], Đà Nẵng is very calm, but it's not boring at all. A peaceful city gives people time for their family and hobbies. [[In my opinion]], a happy city doesn't need to be very exciting. It just needs to be safe and easy to live in.", "", "peaceful|safe|things to do", ""], ["Do you think everyone shares a similar definition of happiness?", "Không, mình không nghĩ vậy. Nó tùy vào độ tuổi và tính cách. [[While]] người trẻ muốn thành công, người lớn tuổi muốn sức khỏe và gia đình. [[For example]], với mình bây giờ, hạnh phúc là có công việc tốt và được đi du lịch. [[But]] với bố mẹ mình, hạnh phúc chỉ là con cái khỏe mạnh và về thăm nhà thường xuyên.", "No, I don't think so. It depends on age and personality. [[While]] young people want success, older people want health and family. [[For example]], for me now, happiness means a good job and travelling. [[But]] for my parents, happiness is simply having healthy children who visit them often.", "", "depend on|success|health and family", ""]]}, {"name": "Đề 56 · Planning", "rows": [["What types of plans do people often make with friends and family?", "Mọi người hay lên kế hoạch đi chơi, đi du lịch [[and]] tổ chức tiệc sinh nhật. Nhiều gia đình [[also]] lên kế hoạch cho bữa ăn cuối tuần cùng nhau. [[For example]], nhóm bạn mình thường lên kế hoạch đi Vũng Tàu vào dịp lễ. Lên kế hoạch trước giúp mọi người sắp xếp thời gian và tiết kiệm tiền.", "People often plan trips, holidays [[and]] birthday parties. Many families [[also]] plan weekend meals together. [[For example]], my group of friends usually plans a trip to Vũng Tàu on public holidays. Planning ahead helps everyone arrange their time and save money.", "", "trips|birthday parties", ""], ["Is it important for people to plan special events, such as weddings?", "Có, rất quan trọng, [[because]] đám cưới có nhiều khách và tốn nhiều tiền. [[Without]] kế hoạch, rất dễ có chuyện không như ý. [[For example]], đám cưới cần đặt nhà hàng, gửi thiệp mời và chọn áo cưới từ nhiều tháng trước. Lên kế hoạch kỹ giúp cô dâu chú rể bớt căng thẳng vào ngày cưới.", "Yes, very important, [[because]] there are many guests and it costs a lot of money. [[Without]] a plan, things can easily go wrong. [[For example]], a wedding needs a restaurant, invitations and a wedding dress, and people book them months before. A good plan helps the couple feel less stressed on the big day.", "", "guests|go wrong", ""], ["Why don't some people like to plan their social life in advance?", "[[Because]] họ thích tùy hứng. [[Also]], lịch làm việc của họ thay đổi nhiều. Với một số người, lên kế hoạch cho việc đi chơi giống như đi làm vậy. [[For example]], mình thích những cuộc hẹn bất ngờ với bạn bè, [[because]] chúng thường rất vui. [[However]], những việc quan trọng thì vẫn cần lên kế hoạch.", "[[Because]] they like to be spontaneous. [[Also]], their schedule changes a lot. For some people, planning their free time feels like work. [[For example]], I like last-minute meetings with my friends, [[because]] they're often very fun. [[However]], important things still need a plan.", "", "spontaneous|schedule changes", ""], ["What are the advantages for young people of planning their future careers?", "[[First]], họ biết mình nên học gì. [[Second]], họ không lãng phí thời gian. [[As a result]], họ bớt lo lắng về tương lai. [[For example]], [[if]] sinh viên biết mình muốn làm marketing, họ có thể đi thực tập sớm. [[So]] khi ra trường, họ đã có kinh nghiệm và dễ tìm việc hơn.", "[[First]], they know what to study. [[Second]], they don't waste time. [[As a result]], they feel less stressed about the future. [[For example]], [[if]] students know they want to work in marketing, they can do an internship early. [[So]] when they graduate, they already have experience, and it's easier to find a job.", "", "know what to study|waste time", ""], ["Should young people ask for advice about career planning, for example from teachers or family?", "Có, [[because]] thầy cô và bố mẹ có nhiều kinh nghiệm. [[But]] quyết định cuối cùng nên là của người trẻ, [[because]] đó là cuộc đời của họ. [[For example]], khi chọn ngành học, mình đã hỏi ý kiến bố mẹ và một thầy giáo. [[However]], người trẻ nên chọn công việc mình thích, [[because]] họ sẽ làm việc đó rất nhiều năm.", "Yes, [[because]] teachers and parents have a lot of experience. [[But]] the final decision should be theirs, [[because]] it's their life. [[For example]], when I chose my major, I asked my parents and one of my teachers. [[However]], young people should choose a job they like, [[because]] they [[will]] do it for many years.", "", "experience|final decision", ""]]}, {"name": "Đề 58 · Friendship", "rows": [["Do you still keep in touch with your friends from childhood? Why or why not?", "Có, với một người bạn. Giờ tụi mình làm cùng công ty, [[so]] gặp nhau mỗi ngày. [[But]] với các bạn khác, tụi mình chỉ thỉnh thoảng nhắn tin trên Facebook. [[In my opinion]], giữ liên lạc với bạn cũ không dễ, [[because]] ai cũng bận và sống ở những nơi khác nhau. [[But]] mỗi khi gặp lại, tụi mình vẫn nói chuyện như hồi nhỏ.", "Yes, with one friend. We work at the same company now, [[so]] we see each other every day. [[But]] with other friends, we only chat on Facebook sometimes. [[In my opinion]], it's not easy to keep in touch with old friends, [[because]] everyone is busy and lives in different places. [[But]] whenever we meet, we still talk like when we were kids.", "", "keep in touch|chat on Facebook", ""], ["How important is childhood friendship to children?", "Rất quan trọng, [[because]] trẻ học cách chia sẻ và giúp đỡ nhau. Có bạn tốt [[also]] làm cho việc đi học vui hơn. [[For example]], [[when]] trẻ có bạn thân ở trường, trẻ sẽ tự tin hơn và thích đi học hơn. Tình bạn thời thơ ấu [[also]] tạo ra những kỷ niệm đẹp cả đời.", "It's very important, [[because]] children learn to share and help each other. Good friends [[also]] make school more fun. [[For example]], [[when]] children have a close friend at school, they feel more confident, and they enjoy going to school. Childhood friendships [[also]] create good memories for life.", "", "share|help each other", ""], ["What do you think of communicating via social media?", "Giao tiếp qua mạng xã hội thì nhanh và miễn phí, [[and]] mình nói chuyện được với người ở xa. [[However]], nó không gần gũi bằng gặp trực tiếp. [[For example]], mình gọi video với bạn ở nước ngoài mỗi tuần. [[But]] đôi khi tin nhắn dễ gây hiểu lầm, [[because]] mình không nghe được giọng nói hay thấy nét mặt.", "It's fast and free, [[and]] we can talk to people who live far away. [[However]], it's less personal than meeting face to face. [[For example]], I video call a friend who lives abroad every week. [[But]] sometimes messages cause misunderstandings, [[because]] you can't hear the voice or see the face.", "", "fast|far away|less personal", ""], ["Do you think online communication through social media will replace face-to-face communication?", "Không, mình không nghĩ vậy. Mọi người vẫn cần gặp trực tiếp, [[because]] cái ôm và nụ cười thật thì không thể có qua mạng. [[For example]], dù nhắn tin mỗi ngày, tụi mình vẫn hẹn gặp nhau cà phê cuối tuần. Mình nghĩ mạng xã hội chỉ giúp duy trì mối quan hệ, chứ không thay thế được việc gặp nhau.", "No, I don't think so. People still need to meet in person, [[because]] hugs and real smiles can't happen online. [[For example]], even though we chat every day, my friends and I still meet for coffee at weekends. I think social media helps us keep in touch, [[but]] it can't replace meeting in person.", "", "meet in person", ""], ["What's the difference between having younger friends and older friends?", "Bạn nhỏ tuổi hơn thì vui và năng động, [[while]] bạn lớn tuổi hơn cho mình lời khuyên tốt. Mình học được những điều khác nhau từ cả hai. [[For example]], bạn nhỏ tuổi hơn giới thiệu cho mình các ứng dụng và xu hướng mới, [[while]] bạn lớn tuổi hơn giúp mình khi gặp khó khăn trong công việc. [[So]] có nhiều kiểu bạn bè là điều rất tốt.", "Younger friends are fun and energetic, [[while]] older friends give good advice. I learn different things from both. [[For example]], my younger friends show me new apps and trends, [[while]] my older friends help me when I have problems at work. [[So]] it's good to have different kinds of friends.", "", "energetic|advice", ""]]}, {"name": "Đề 60 · Medical jobs", "rows": [["Why do some people choose to work in the medical field?", "Chủ yếu [[because]] họ muốn giúp người khác. [[Also]], đây là công việc ổn định. Một số người theo nghề vì bố mẹ cũng làm ngành y. [[In addition]], ở Việt Nam, bác sĩ được xã hội tôn trọng, [[so]] nhiều bố mẹ muốn con học ngành y. [[However]], học ngành y rất lâu và vất vả, khoảng sáu năm.", "Mainly [[because]] they want to help people. [[Also]], it's a stable job. Some people follow their parents, who also work in this field. [[In addition]], doctors are respected in Vietnam, [[so]] many parents want their children to study medicine. [[However]], medical school is long and difficult; it takes about six years.", "", "help people|stable", ""], ["How does working in a medical-related profession impact a person's life?", "Họ thường làm việc nhiều giờ, [[so]] có ít thời gian cho gia đình. [[But]] họ thấy rất tự hào khi bệnh nhân khỏi bệnh. [[For example]], cô mình là y tá, [[and]] cô thường phải trực đêm, kể cả dịp Tết. Công việc này [[also]] rất căng thẳng, [[because]] một lỗi nhỏ có thể ảnh hưởng đến tính mạng bệnh nhân.", "They often work long hours, [[so]] they have less time for their family. [[But]] they feel very proud when their patients get better. [[For example]], my aunt is a nurse, [[and]] she often works night shifts, even during Tết. The job is [[also]] very stressful, [[because]] a small mistake can affect a patient's life.", "", "long hours|proud", ""], ["Do you think medical professionals are valued in society?", "Có, mọi người tôn trọng họ. [[However]], lương của họ chưa đủ cao, nhất là y tá, [[so]] nhiều người phải làm thêm. [[During]] mùa dịch, mọi người càng thấy rõ vai trò của nhân viên y tế. Mình nghĩ chính phủ nên tăng lương cho họ, [[because]] họ làm việc rất vất vả.", "Yes, people respect them. [[However]], their salary is not high enough, especially for nurses, [[so]] many of them have to do extra work. [[During]] the pandemic, people saw clearly how important medical workers are. I think the government should increase their salary, [[because]] they work very hard.", "", "respect|salary", ""], ["In your opinion, which profession is more important: doctors or nurses?", "Cả hai đều quan trọng. Bác sĩ chẩn đoán và điều trị, [[while]] y tá chăm sóc bệnh nhân hằng ngày. Bệnh viện không thể thiếu ai cả. [[For example]], sau phẫu thuật, y tá là người theo dõi và chăm sóc bệnh nhân suốt ngày đêm. [[So]] mình nghĩ không thể nói nghề nào quan trọng hơn, [[because]] họ phối hợp với nhau.", "Both are important. Doctors find the problem and treat it, [[while]] nurses take care of patients every day. A hospital can't work without either of them. [[For example]], after an operation, nurses watch and care for patients day and night. [[So]] I don't think one job is more important, [[because]] they work together as a team.", "", "diagnose|take care of", ""], ["How can technology influence medical-related professions in the future?", "Trong tương lai, AI [[will]] giúp phát hiện bệnh sớm. [[Also]], sẽ có nhiều buổi khám online hơn. Robot có thể hỗ trợ bác sĩ trong phẫu thuật. [[For example]], ở Việt Nam, nhiều bệnh viện đã cho đặt lịch khám qua app, [[so]] bệnh nhân không phải chờ lâu. [[However]], công nghệ không thể thay thế sự quan tâm của bác sĩ và y tá.", "In the future, AI [[will]] help doctors find diseases early. [[Also]], there [[will]] be more online appointments. Robots may help in surgery too. [[For example]], many hospitals in Vietnam already let patients book appointments on an app, [[so]] they don't have to wait for a long time. [[However]], technology can't replace the care of doctors and nurses.", "", "AI|online appointments|surgery", ""]]}, {"name": "Đề 63 · Plants & farming", "rows": [["Are there many people growing their own vegetables now?", "Có, nhiều hơn trước, [[because]] mọi người lo ngại hóa chất trong thực phẩm. [[For example]], nhiều người ở thành phố trồng rau thơm trên ban công. [[Also]], trồng rau là sở thích giúp giảm căng thẳng. [[For example]], bà mình trồng rau muống và ớt sau nhà, [[and]] bà nói làm vườn giúp bà khỏe mạnh.", "Yes, more than before, [[because]] people worry about chemicals in food. [[For example]], many people in cities grow herbs on their balcony. [[Also]], growing vegetables is a hobby that reduces stress. [[For example]], my grandmother grows morning glory and chilli behind her house, [[and]] she says gardening keeps her healthy.", "", "chemicals|grow herbs|balcony", ""], ["Do you think it’s good to let kids learn how to plant?", "Có, chắc chắn rồi. Trồng cây dạy trẻ tính kiên nhẫn và trách nhiệm, [[and]] trẻ cũng hiểu thức ăn đến từ đâu. [[For example]], một số trường mầm non ở thành phố có vườn rau nhỏ cho trẻ chăm sóc. Mình nghĩ đây là cách học rất tốt, [[because]] trẻ được học qua thực hành.", "Yes, definitely. It teaches kids to be patient and responsible, [[and]] they also learn where food comes from. [[For example]], some kindergartens in my city have small vegetable gardens for children to look after. I think it's a great way to learn, [[because]] children learn by doing.", "", "patient|responsible|where food comes from", ""], ["What do you think of the job of a farmer?", "Mình nghĩ đó là công việc rất vất vả. Nông dân làm việc ngoài trời cả ngày dưới nắng. [[But]] công việc của họ rất quan trọng, [[because]] ai cũng cần lương thực. [[However]], thu nhập của nông dân thường thấp và phụ thuộc vào thời tiết. [[So]] mình nghĩ chính phủ nên hỗ trợ nông dân nhiều hơn, ví dụ giúp họ bán nông sản online.", "I think it's a very hard job. Farmers work outside all day in the sun. [[But]] their job is very important, [[because]] everyone needs food. [[However]], farmers' income is often low, and it depends on the weather. [[So]] I think the government should support farmers more, [[for example]] by helping them sell their products online.", "", "hard job|work outside|everyone needs food", ""], ["What are the differences between traditional and modern agriculture?", "[[In the past]], nông dân [[used to]] dùng sức người và sức trâu bò, [[but]] bây giờ họ dùng máy móc và công nghệ. [[As a result]], làm nhanh hơn và cần ít nhân công hơn. [[However]], nông nghiệp hiện đại dùng nhiều hóa chất hơn, [[so]] không tốt cho môi trường. Mình nghĩ tương lai sẽ là nông nghiệp sạch, kết hợp công nghệ và phương pháp tự nhiên.", "[[In the past]], farmers [[used to]] use people and animals, [[but]] now they use machines and technology. [[As a result]], farming is faster and needs fewer workers. [[However]], modern farming uses more chemicals, [[so]] it's not good for the environment. I think the future is clean farming, [[which]] mixes technology with natural methods.", "", "machines|technology|fewer workers", "", "So sánh xưa và nay: used to + động từ nguyên mẫu, không cần chia quá khứ."], ["What happened to the farmers’ income during the pandemic?", "Thu nhập của họ giảm, [[because]] họ không bán được nông sản sang tỉnh khác. Một số nông dân chuyển sang bán rau online. [[For example]], nhiều người ở thành phố đặt mua trái cây trực tiếp từ nông dân qua Facebook. Mùa dịch khó khăn, [[but]] nó giúp nông dân học cách kinh doanh online.", "Their income [[went]] down, [[because]] they couldn't sell their products to other cities. Some farmers [[sold]] vegetables online instead. [[For example]], many people in cities bought fruit directly from farmers on Facebook. The pandemic was hard, [[but]] it taught farmers how to sell online.", "", "went down|couldn't sell|sell online", "", "Câu hỏi về chuyện đã qua → dùng quá khứ đơn: went, couldn't, sold."]]}]}, "p3_2": {"name": "Địa điểm", "topics": [{"name": "Đề 23 · Leisure", "rows": [["How do people express happiness in your culture?", "Người Việt thường hay cười và vui vẻ. [[When]] có chuyện vui, họ chia sẻ tin đó với gia đình. Họ hay tổ chức tiệc hoặc ăn một bữa thật lớn cùng nhau để ăn mừng. [[For example]], khi có người trong nhà thi đỗ, cả nhà thường đi ăn nhà hàng và tặng quà nhỏ. Mình nghĩ người Việt thích chia sẻ niềm vui [[because]] như vậy khoảnh khắc đó đặc biệt hơn.", "Vietnamese people usually smile and laugh a lot. [[When]] something good happens, they share the new
