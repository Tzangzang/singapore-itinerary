<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vở luyện IELTS Speaking – thi 20/10</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Pangolin&display=swap&subset=vietnamese" rel="stylesheet">
<style>
:root{
  --paper:#FCFCFA; --grid:#E3EAF3; --grid2:#CBD8E8;
  --ink:#1E3A8A; --text:#1F2433; --muted:#5B6475;
  --red:#C62828; --red-soft:#FDECEC; --line:#D5DCE6; --nav:#F2F5F9;
  --chip:#EEF2FA; --done:#2E7D32;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#151922; --grid:#1D2330; --grid2:#252D3D;
    --ink:#9DB6F5; --text:#E6E9EF; --muted:#9AA3B5;
    --red:#FF6B6B; --red-soft:#3A1F24; --line:#2C3445; --nav:#10141B;
    --chip:#1F2738; --done:#7BC67F;
  }
}
:root[data-theme="dark"]{
  --paper:#151922; --grid:#1D2330; --grid2:#252D3D;
  --ink:#9DB6F5; --text:#E6E9EF; --muted:#9AA3B5;
  --red:#FF6B6B; --red-soft:#3A1F24; --line:#2C3445; --nav:#10141B;
  --chip:#1F2738; --done:#7BC67F;
}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 64px)}
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0}
body{
  background:var(--nav);color:var(--text);
  font-family:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  font-size:16px;line-height:1.6;
}
.red{color:var(--red);font-weight:700;font-style:normal}
.hand{font-family:"Pangolin","Comic Sans MS","Segoe Print",cursive}
.blank{display:inline-block;min-width:3.2em;border-bottom:1.5px solid var(--muted);transform:translateY(-3px);height:1em}
.layout{display:grid;grid-template-columns:260px minmax(0,1fr);min-height:100vh}
nav{
  position:sticky;top:env(safe-area-inset-top,0px);align-self:start;height:100vh;overflow:auto;
  padding:28px 18px;border-right:1px solid var(--line);background:var(--nav)
}
.brand{font-family:"Pangolin",cursive;font-size:26px;color:var(--ink);line-height:1.2;margin:0 0 4px}
.countdown{margin:0 0 22px;color:var(--muted);font-size:14px}
.countdown b{color:var(--red)}
nav ol{list-style:none;margin:0;padding:0}
nav li button{
  width:100%;text-align:left;background:none;border:0;border-radius:8px;cursor:pointer;
  padding:9px 10px;margin:1px 0;color:var(--text);font:inherit;font-size:15px;display:flex;justify-content:space-between;gap:8px;align-items:baseline
}
nav li button:hover{background:var(--chip)}
nav li button[aria-current="true"]{background:var(--paper);color:var(--ink);font-weight:600;box-shadow:inset 3px 0 0 var(--ink)}
nav .prog{font-size:12px;color:var(--muted);white-space:nowrap}
.toggle{
  margin-top:22px;display:flex;align-items:center;gap:10px;font-size:14px;color:var(--muted);cursor:pointer;
  border:1px solid var(--line);border-radius:8px;padding:9px 10px;background:var(--paper);width:100%;font-family:inherit
}
.toggle .box{width:34px;height:20px;border-radius:10px;background:var(--grid2);position:relative;flex:none;transition:background .15s}
.toggle .box::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:left .15s}
.toggle[aria-pressed="true"] .box{background:var(--ink)}
.toggle[aria-pressed="true"] .box::after{left:16px}
main{
  background-color:var(--paper);
  background-image:
    linear-gradient(var(--grid2) 1px,transparent 1px),
    linear-gradient(90deg,var(--grid2) 1px,transparent 1px),
    linear-gradient(var(--grid) 1px,transparent 1px),
    linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:96px 96px,96px 96px,24px 24px,24px 24px;
  background-attachment:local;
  padding:44px clamp(18px,5vw,64px) 96px;
  min-width:0;
}
.sheet{max-width:760px;margin:0 auto}
h1{font-size:clamp(28px,4vw,38px);line-height:1.15;color:var(--ink);margin:0 0 6px;font-weight:700;letter-spacing:-.01em}
.lead{color:var(--muted);margin:0 0 28px;max-width:62ch}
h2{font-family:"Pangolin",cursive;font-weight:400;color:var(--ink);font-size:28px;margin:44px 0 10px;line-height:1.2}
h3{font-size:18px;margin:26px 0 8px;color:var(--text)}
.kw-table{width:100%;border-collapse:collapse;margin:6px 0 16px;background:var(--paper);font-size:15px}
.kw-table td{padding:6px 10px;border-bottom:1px solid var(--line);vertical-align:top}
.kw-table td:first-child{color:var(--ink);font-weight:600;width:52%}
.scroll{overflow-x:auto}
.q{list-style:none;margin:0 0 6px;padding:16px 0 14px;border-top:1px dashed var(--grid2)}
.qhead{display:flex;gap:12px;align-items:flex-start}
.qnum{font-family:"Pangolin",cursive;color:var(--ink);font-size:20px;line-height:1.3;min-width:1.6em}
.qtext{font-weight:600;font-size:17px;line-height:1.45;flex:1}
.check{flex:none;display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);cursor:pointer;user-select:none;padding-top:3px}
.check input{width:18px;height:18px;accent-color:var(--done);cursor:pointer}
.q.is-done .qtext{color:var(--muted)}
.hint{margin:10px 0 0 calc(1.6em + 12px);display:grid;gap:6px;background:var(--paper);border-left:3px solid var(--grid2);padding:8px 0 8px 14px}
.row{display:grid;grid-template-columns:84px 1fr;gap:10px;align-items:baseline}
.tag{font-family:"Pangolin",cursive;color:var(--ink);font-size:16px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:var(--chip);color:var(--ink);border-radius:5px;padding:1px 8px;font-size:14.5px;font-style:italic}
.frame{font-style:italic}
.note{color:var(--red);font-size:14px}
.peek{display:none;margin:8px 0 0 calc(1.6em + 12px);background:none;border:1px dashed var(--grid2);color:var(--ink);border-radius:6px;padding:3px 10px;font:inherit;font-size:14px;cursor:pointer}
body.hide-hints .q:not(.open) .hint{display:none}
body.hide-hints .q:not(.open) .peek{display:inline-block}
.box-note{background:var(--red-soft);border-radius:8px;padding:12px 16px;margin:14px 0}
.box-note p{margin:0}
table.plan{width:100%;border-collapse:collapse;font-size:15px;background:var(--paper)}
table.plan th,table.plan td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
table.plan th{color:var(--muted);font-weight:500;font-size:13px}
table.plan td:first-child{white-space:nowrap;color:var(--ink);font-weight:600}
table.plan button{background:none;border:0;padding:0;color:inherit;font:inherit;cursor:pointer;text-decoration:underline;text-decoration-color:var(--grid2);text-underline-offset:3px}
ul.errs{list-style:none;padding:0;margin:8px 0}
ul.errs li{padding:7px 0 7px 28px;position:relative;border-bottom:1px solid var(--line)}
ul.errs li::before{content:"✗";position:absolute;left:4px;color:var(--red);font-weight:700}
.stat{font-size:15px}
.stat b{color:var(--ink)}
.bar{height:8px;background:var(--grid);border-radius:4px;overflow:hidden;margin:8px 0 4px;max-width:420px}
.bar i{display:block;height:100%;background:var(--ink)}
.step-label{font-weight:600;color:var(--text)}
.subtabs{display:flex;gap:6px;overflow-x:auto;padding:4px 0 10px;margin:0 0 4px;border-bottom:1px solid var(--line);scrollbar-width:thin}
.subtabs button{flex:none;border:1px solid var(--line);background:var(--paper);color:var(--text);border-radius:999px;padding:5px 12px;font:inherit;font-size:14px;cursor:pointer;white-space:nowrap}
.subtabs button:hover{border-color:var(--ink)}
.subtabs button[aria-selected="true"]{background:var(--ink);border-color:var(--ink);color:var(--paper);font-weight:600}
.subtabs .cnt{font-size:12px;opacity:.75;margin-left:2px}
.subtabs button.full:not([aria-selected="true"]){border-color:var(--done);color:var(--done)}
.src{color:var(--muted);font-size:14px;margin:-4px 0 10px}
.pager{display:flex;justify-content:space-between;gap:12px;margin-top:28px}
.pager button{background:none;border:1px solid var(--line);border-radius:8px;padding:8px 14px;font:inherit;font-size:15px;color:var(--ink);cursor:pointer}
.pager button:hover{border-color:var(--ink)}
.qtable tr.q{border-top:0;padding:0;margin:0}
.qtable{width:100%;border-collapse:collapse;background:var(--paper);margin-top:8px;table-layout:fixed}
.qtable thead th{text-align:left;font-size:13px;font-weight:500;color:var(--muted);padding:8px 12px;border-bottom:2px solid var(--grid2)}
.qtable thead th:first-child{width:36%}
.qtable td{vertical-align:top;padding:14px 12px;border-bottom:1px dashed var(--grid2)}
.qtable td.qcol{border-right:1px solid var(--line)}
.qtable .qhead{display:flex;gap:8px}
.qtable .check{margin:10px 0 0 calc(1.6em + 8px);padding:0}
.qtable .hint{margin:0;border-left:0;padding:0;gap:10px}
.qtable .peek{margin:0}
.block{display:grid;grid-template-columns:90px 1fr;gap:10px;align-items:baseline}
.qtable .idea-left{margin:12px 0 0 calc(1.6em + 8px);padding:8px 10px;background:var(--chip);border-radius:6px;display:block}
.qtable .idea-left .tag{display:block;margin-bottom:4px}
.qtable .idea-left ol.idea li{grid-template-columns:auto 1fr;gap:8px}
.qtable .idea-left ol.idea .lbl{min-width:6.5em}
ol.idea{list-style:none;margin:0;padding:0;display:grid;gap:3px}
ol.idea li{display:grid;grid-template-columns:118px 1fr;gap:8px}
ol.idea .kwi{font-weight:600;color:var(--ink)}
ol.idea .lbl{color:var(--muted);font-size:13px;padding-top:2px}
ol.formula{margin:8px 0 12px}
.notewrap{display:grid;grid-template-columns:90px 1fr;gap:10px;margin-top:12px;align-items:start}
.notewrap textarea{width:100%;min-height:52px;resize:vertical;font:inherit;font-size:15px;line-height:1.5;color:var(--text);background:var(--paper);border:1px dashed var(--ink);border-radius:6px;padding:6px 10px;overflow:hidden}
.notewrap textarea:focus{outline:2px solid var(--ink);outline-offset:1px;border-style:solid}
@media (max-width:860px){
  .qtable,.qtable tbody,.qtable tr,.qtable td{display:block;width:100%}
  .qtable thead{display:none}
  .qtable tr{border-bottom:1px dashed var(--grid2);padding:12px 0}
  .qtable td{border:0;padding:4px 0}
  .qtable td.qcol{border-right:0}
  .qtable .check{margin-left:0}
  .block,.notewrap{grid-template-columns:1fr;gap:2px}
  ol.idea li{grid-template-columns:1fr;gap:0}
}
.vh{font-size:16px;margin:22px 0 8px;color:var(--ink)}
.vtable{width:100%;border-collapse:collapse;background:var(--paper);font-size:15px}
.vtable th{text-align:left;font-size:13px;font-weight:500;color:var(--muted);padding:6px 10px;border-bottom:2px solid var(--grid2)}
.vtable td{padding:7px 10px;border-bottom:1px solid var(--line);vertical-align:top}
.vtable td.vp{color:var(--ink);font-weight:700;white-space:nowrap}
.vtable td.vex{font-style:italic;color:var(--text)}
.vtable .hl{color:var(--ink);font-style:italic}
.sheetp{margin:12px 0 0;display:flex;flex-wrap:wrap;gap:6px 6px;align-items:baseline;font-size:14px}
.sheetp .tag{margin-right:6px}
.sheetp .pm{color:var(--muted);margin-right:10px}
@media (max-width:860px){
  .vtable thead{display:none}
  .vtable,.vtable tbody,.vtable tr,.vtable td{display:block;width:100%}
  .vtable tr{padding:8px 0;border-bottom:1px solid var(--line)}
  .vtable td{border:0;padding:1px 0}
  .vtable td.vp{white-space:normal}
}
.vtable .ipa{display:block;font-weight:400;color:var(--muted);font-family:"Be Vietnam Pro","Segoe UI","Lucida Sans Unicode","DejaVu Sans",sans-serif;font-size:14px;margin-top:2px;white-space:normal}
.vtable .ipa .red{font-weight:700}
.legend{font-size:13.5px;color:var(--muted);margin:-2px 0 8px}
em.past{font-style:inherit}
.vtable .pri{display:inline-block;margin-top:4px;font-size:12px;font-weight:500;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:0 6px}
.vtable .pri.first{color:var(--ink);border-color:var(--ink)}
.vtable .tip{display:block;margin-top:3px;font-size:13.5px;color:var(--muted)}
.vtable td .vex{font-style:italic}
footer{margin-top:56px;color:var(--muted);font-size:13px}
button:focus-visible,input:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
@media (max-width:860px){
  .layout{grid-template-columns:1fr}
  nav{position:sticky;top:0;height:auto;z-index:5;padding:10px 12px calc(10px);border-right:0;border-bottom:1px solid var(--line);padding-top:calc(10px + env(safe-area-inset-top,0px));top:0}
  .brand{font-size:20px;display:inline}
  .countdown{display:inline;margin-left:8px;font-size:13px}
  nav ol{display:flex;gap:4px;overflow-x:auto;margin-top:8px;padding-bottom:2px}
  nav li button{white-space:nowrap;font-size:14px;padding:6px 10px}
  nav li button[aria-current="true"]{box-shadow:inset 0 -3px 0 var(--ink)}
  nav .prog{display:none}
  .toggle{margin-top:8px;padding:6px 10px}
  main{padding-top:28px}
  .hint{margin-left:0}
  .peek{margin-left:0}
  .row{grid-template-columns:1fr;gap:2px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* ===== Part 2 & 3 ===== */
u.end{text-decoration:underline;text-decoration-color:var(--red);text-decoration-thickness:2px;text-underline-offset:3px}
.oreo{display:block}
.oline{display:block;margin:0 0 4px;padding-left:26px;position:relative}
.olbl{position:absolute;left:0;top:2px;display:inline-block;width:18px;text-align:center;font-size:11px;font-weight:700;color:var(--paper);background:var(--ink);border-radius:4px;font-family:"Be Vietnam Pro",sans-serif;line-height:18px}
.p2lbl.p2key{background:var(--red,#c0392b)}
.p2kq{margin:4px 0 10px;font-weight:600;color:var(--red,#c0392b)}
.p2h{font-size:15px;color:var(--ink);margin:16px 0 6px;font-weight:700}
.p2list{margin:0 0 8px;padding-left:18px}
.p2list li{margin:3px 0}
.p2list .p2num{color:var(--red);font-family:Georgia,serif;margin-right:4px}
.p2vi{background:var(--nav,#F2F5F9);border-radius:8px;padding:8px 14px}
.p2vi p{margin:4px 0}
.p2toc{display:flex;flex-wrap:wrap;align-items:flex-start;height:auto;gap:8px;margin:14px 0 6px;position:sticky;top:0;z-index:5;background:var(--paper);padding:8px 0;scroll-margin-top:0}
.p2toc button{font:inherit;font-size:14px;border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:999px;padding:5px 12px;cursor:pointer}
.p2toc button.full{border-color:var(--ink);font-weight:600}
.p2toc button.full::after{content:" ✓"}
.p2block{scroll-margin-top:64px;padding-top:8px;margin-top:28px;border-top:2px solid var(--line)}
.p2block:first-of-type{border-top:0;margin-top:8px}
.p2top{text-align:right;margin:6px 0 0}
.p2top button{font:inherit;font-size:13px;background:none;border:0;color:var(--ink);opacity:.7;cursor:pointer;text-decoration:underline}
.p2lbl{display:inline-block;font-size:12px;font-weight:700;color:var(--paper);background:var(--ink);border-radius:4px;padding:0 6px;margin-right:2px;vertical-align:1px;font-style:normal;font-family:"Be Vietnam Pro",sans-serif}
.p2topic{margin:4px 0;font-weight:600;line-height:1.45}
.p2num{font-family:"Pangolin",cursive;color:var(--red);font-weight:400;margin-right:4px;white-space:nowrap}
ol.p2ideas{margin:4px 0 8px;padding-left:22px}
ol.p2ideas li{margin:4px 0}
.p2sample{background:var(--paper);border-left:3px solid var(--grid2);padding:4px 0 4px 14px}
.p2sample p{margin:0 0 10px}
.p2past{font-size:14px;color:var(--muted)}
.p2s{border-top:0}
.p2s .check{margin:14px 0 0;padding:0}
.p2s .peek{margin:0 0 8px}
.p2alt{border-top:1px dashed var(--grid2);padding:12px 0 6px}
.p2change{margin:4px 0 0;padding-left:14px;border-left:3px solid var(--grid2);font-size:15px}
.p2change p{margin:0 0 6px}
.p2en{font-style:italic}
body.hide-hints .q:not(.open) .p2sample{display:none}
body.hide-hints .q:not(.open) .p2change .p2en{display:none}
nav li.navhead{font-size:13px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;padding:16px 10px 4px}
nav li.navsub button{padding-left:24px}
@media (max-width:860px){nav li.navhead{padding:6px 4px 0 10px;align-self:center;white-space:nowrap}nav li.navsub button{padding-left:10px}}
.p3vi{margin:0;font-size:15px;line-height:1.55}
.p3en{font-size:15.5px;line-height:1.6}
.qtable .idea-left ol.idea.p3idea li{grid-template-columns:1fr;gap:0;margin-bottom:6px}
.qtable .idea-left ol.idea.p3idea .lbl{min-width:0;padding-top:0;font-size:12.5px}
.idea .vi{display:block;font-weight:400;color:var(--muted);font-size:14px;line-height:1.45}
table.plan td.p2c{white-space:nowrap;color:var(--muted);font-weight:400}
</style>

<div class="layout">

</div>

["Do you think your friends use too much social media?","I don't think so.","They're busy with work.","They only use it in the evening.","busy with work","I don't think so. [[Since]] they're ___, they ___."],

["What's the most popular social media in Vietnam? Why?","Facebook.","It has many features, like Marketplace.","People buy and sell things there.","features|buy and sell things","___, [[because]] it has ___, like Marketplace, [[where]] people ___."],
["Do you think people in your country find social media useful?","Yes, very useful.","People talk to family members who live far away.","They also keep up with local news.","family members|keep up with the news","Yes. People use it to talk to family members [[who]] ___."]]),
T("Music",[["listen to pop music","nghe nhạc pop"],["help me relax","giúp tôi thư giãn"],["put me in a good mood","làm tôi vui lên"],["have the same taste in music","có cùng gu âm nhạc"]],[
["What music do you like?","V-pop.","Especially Chipu, my favourite singer.","Her songs are catchy and cheer me up.","a big fan of|V-pop|catchy","I'm a big fan of ___, especially songs [[which]] ___."],

function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}
var PAST_RE = /\b(was|were|wasn't|weren't|went|had|hadn't|did|didn't|couldn't|made|got|saw|bought|found|left|met|learnt|learned|sang|took|gave|kept|wore|taught|burst|asked|binge-watched|carried|encouraged|explained|handed|hated|helped|inspired|joined|liked|looked|loved|reminded|restored|returned|scored|screamed|splashed|started|swapped|visited|walked|wanted|watched|used(?= to))\b/gi;
function pastMark(htmlText){ return htmlText.replace(PAST_RE,'<em class="red past">$1</em>'); }
function fmt(s){
  return String(s).split(/(\[\[.+?\]\])/).map(function(seg){
     return /^\[\[/.test(seg) ? '<em class="red">'+esc(seg.slice(2,-2))+'</em>' : pastMark(esc(seg));
   }).join("")
   .replace(/___/g,'<span class="blank" aria-label="chỗ trống"></span>');
}
function hintHTML(q){
  var h = '<div class="hint">';
  h += '<div class="block"><span class="tag">Từ vựng</span><span class="chips">'+q.kw.map(function(k){return '<span class="chip" lang="en">'+esc(k)+'</span>';}).join("")+'</span></div>';
  h += '<div class="block"><span class="tag">Mẫu câu</span><span class="frame" lang="en">'+fmt(q.frame)+'</span></div>';
  if(q.note) h += '<div class="block"><span class="tag">Lưu ý</span><span class="note">'+fmt(q.note)+'</span></div>';
  return h + '</div><button class="peek" type="button">Xem gợi ý</button>';
}
function ideaHTML(q){
  var h = '<div class="hint idea-left"><span class="tag">Ý tưởng</span><ol class="idea">';
  q.idea.forEach(function(x,i){ h += '<li><span class="lbl">'+IDEA_LABELS[i]+'</span><span lang="en" class="kwi">'+pastMark(esc(x))+'</span></li>'; });
  return h + '</ol></div>';
}
function rowHTML(key, num, q){
  var isDone = !!done[key], note = notes[key] || "";
  return '<tr class="q'+(isDone?' is-done':'')+'" data-key="'+esc(key)+'">'+
   '<td class="qcol"><div class="qhead"><span class="qnum">'+num+'</span><span class="qtext" lang="en">'+esc(q.q)+'</span></div>'+
   ideaHTML(q)+
   '<label class="check"><input type="checkbox"'+(isDone?' checked':'')+'> Đã luyện</label></td>'+
   '<td class="hcol">'+hintHTML(q)+
   '<label class="notewrap"><span class="tag">Ghi chú của bạn</span><textarea rows="2" data-note="'+esc(key)+'" placeholder="Câu trả lời của bạn, lỗi cần sửa, từ mới…">'+esc(note)+'</textarea></label></td></tr>';
}
function vocabHTML(name){
  var list = VOCAB[name]; if(!list) return "";
  function mark(ex, p){
    var core = p.replace(/^(a|an|the|be) /i,"").replace(/ (someone|something) /i," ");
    var i = ex.toLowerCase().indexOf(core.toLowerCase().split(" ")[0]);
    var e = esc(ex);
    if(i<0) return e;
    var re = new RegExp("("+core.split(" ").map(function(w){return w.replace(/[.*+?^${}()|[\]\\]/g,"\\$&");}).join("\\w*[ ,]+")+"\\w*)","i");
    return e.replace(re,'<b class="hl">$1</b>');
  }
  return '<h3 class="vh">Cụm từ nâng band 6</h3><div class="scroll"><table class="vtable"><thead><tr><th scope="col">Cụm từ</th><th scope="col">Nghĩa</th><th scope="col">Ví dụ</th></tr></thead><tbody>'+
    list.map(function(r){ return '<tr><td lang="en" class="vp">'+esc(r[0])+(r[3]?'<span class="ipa">'+r[3]+'</span>':'')+'</td><td>'+esc(r[1])+'</td><td lang="en" class="vex">'+pastMark(mark(r[2],r[0]))+'</td></tr>'; }).join("")+
    '</tbody></table></div>';
}
function sheetVocabHTML(name){
  var list = SHEETV[name]; if(!list) return "";
  return '<h3 class="vh">Cụm từ trong bảng tính của bạn</h3><p class="legend">Phiên âm: <em class="red">chữ đỏ</em> là âm cuối cần bật rõ (t, d, k, p, s, z, tʃ, dʒ…). Trong ví dụ và mẫu câu: <em class="red">chữ đỏ</em> là động từ quá khứ.</p><div class="scroll"><table class="vtable"><thead><tr><th scope="col">Cụm từ</th><th scope="col">Nghĩa</th><th scope="col">Ví dụ & mẹo dùng</th></tr></thead><tbody>'+
    list.map(function(r){
      var pri = r[5] ? '<span class="pri'+(r[5]==="Học trước"?' first':'')+'">'+esc(r[5])+'</span>' : '';
      return '<tr><td lang="en" class="vp">'+esc(r[0])+'<span class="ipa">'+r[6]+'</span>'+pri+'</td><td>'+esc(r[1])+'</td><td><span lang="en" class="vex">'+r[2]+'</span>'+(r[4]?'<span class="tip">'+esc(r[4])+'</span>':'')+'</td></tr>';
    }).join("")+'</tbody></table></div>';
}
function topicCount(name){
  var t = ALL[name], n=0;
  t.qs.forEach(function(q,i){ if(done["t:"+name+":"+i]) n++; });
  return {n:n,total:t.qs.length};
}
function dayCount(id){
  if(typeof P2!=="undefined" && P2[id]) return p2Count(id);
  if(!PLAN[id]) return null;
  var n=0,total=0;
  PLAN[id].forEach(function(name){ var c=topicCount(name); n+=c.n; total+=c.total; });
  return {n:n,total:total};
}

function dayPage(id){
  var meta = DAYMETA[id], list = PLAN[id];
  var idx = Math.min(subIdx[id]||0, list.length-1);
  var name = list[idx], t = ALL[name];
  var h = '<h1>'+meta.title+'</h1><p class="lead">'+meta.lead+'</p>';
  h += '<div class="subtabs" role="tablist" aria-label="Chủ đề trong ngày">';
  list.forEach(function(nm,i){
    var c = topicCount(nm), full = c.n===c.total;
    h += '<button type="button" role="tab" data-sub="'+i+'" aria-selected="'+(i===idx)+'" class="'+(full?'full':'')+'">'+esc(nm)+' <span class="cnt">'+c.n+'/'+c.total+'</span></button>';
  });
  h += '</div><h2>'+(SHEETNUM[name]?SHEETNUM[name]+'. ':'')+esc(name)+'</h2>';
  if(t.common) h += '<p class="src">Câu hỏi thường gặp của chủ đề này. Nếu bảng tính của bạn có câu khác, ưu tiên câu trong bảng.</p>';
  h += sheetVocabHTML(name);
  h += vocabHTML(name);
  h += '<h3 class="vh">Câu hỏi</h3><table class="qtable"><thead><tr><th scope="col">Câu hỏi</th><th scope="col">Gợi ý, mẫu câu & ghi chú</th></tr></thead><tbody>';
  t.qs.forEach(function(q,qi){ h += rowHTML("t:"+name+":"+qi, qi+1, q); });
  h += '</tbody></table><div class="pager">';
  if(idx>0) h += '<button type="button" data-sub="'+(idx-1)+'">‹ '+esc(list[idx-1])+'</button>'; else h += '<span></span>';
  if(idx<list.length-1) h += '<button type="button" data-sub="'+(idx+1)+'">'+esc(list[idx+1])+' ›</button>';
  return h + '</div>';
}

>ds</u>: lazy and clumsy, but ki<u class=\"end\">nd</u>. It also <em class=\"red past\">reminde<u class=\"end\">d</u></em> me of my childhoo<u class=\"end\">d</u>. If I <em class=\"red past\">ha<u class=\"end\">d</u></em> the cha<u class=\"end\">nce</u>, I wou<u class=\"end\">ld</u> watch it again with my brother."], "past": "watched · grew · were · tried · went · laughed · dropped · was · cried · talked · made · reminded · had", "alts": [{"topics": [{"n": "41", "t": "Describe a movie you watched recently that you felt disappointed about", "k": "And explain why you felt disappointed about it"}], "q": ["<b>Đổi:</b> giữ khung, đổi sang một phim gây thất vọng, đổi cảm xúc.", "<span class=\"p2lbl\">QK</span>  <span lang=\"en\" class=\"p2en\">La<u class=\"end\">st</u> month, I <em class=\"red past\">watche<u class=\"end\">d</u></em> a new action film at the cinema with my frie<u class=\"end\">nds</u>. I <em class=\"red past\">decide<u class=\"end\">d</u></em> to watch it becau<u class=\"end\">se</u> the trailer <em class=\"red past\">looke<u class=\"end\">d</u></em> exciting, and it <em class=\"red past\">ha<u class=\"end\">d</u></em> many famou<u class=\"end\">s</u> acto<u class=\"end\">rs</u>.</span>", "<span class=\"p2lbl\">HT</span>  <span lang=\"en\" class=\"p2en\">But the story is too long and predictable, and the ending is boring. The acto<u class=\"end\">rs</u> are goo<u class=\"end\">d</u>, but the scri<u class=\"end\">pt</u> is wea<u class=\"end\">k</u>.</span>", "<span class=\"p2lbl\">TL</span>  <span lang=\"en\" class=\"p2en\">Ne<u class=\"end\">xt</u> time, I will rea<u class=\"end\">d</u> revie<u class=\"end\">ws</u> before I go to the cinema.</span>"]}, {"topics": [{"n": "2", "t": "Describe an online video in which you learned something new", "k": "And explain what you learned from it"}], "q": ["<b>Đổi:</b> đổi thành video YouTube về cách dùng AI để học tiếng Anh.", "<span class=\"p2lbl\">QK</span>  <span lang=\"en\" class=\"p2en\">La<u class=\"end\">st</u ong dish, and we <em class=\"red past\">waite<u class=\"end\">d</u></em> for almo<u class=\"end\">st</u> thirty minute<u class=\"end\">s</u>. Then the manager <em class=\"red past\">came</em> to our table, <em class=\"red past\">sai<u class=\"end\">d</u></em> sorry and <em class=\"red past\">gave</em> u<u class=\"end\">s</u> a free desse<u class=\"end\">rt</u>. Although we <em class=\"red past\">waite<u class=\"end\">d</u></em> a long time, nobody <em class=\"red past\">was</em> angry.", "During dinner, my grandfather <em class=\"red past\">gave</em> a sho<u class=\"end\">rt</u> speech. I <em class=\"red past\">sa<u class=\"end\">t</u></em> ne<u class=\"end\">xt</u> to him, and he <em class=\"red past\">to<u class=\"end\">ld</u></em> me how he <em class=\"red past\">me<u class=\"end\">t</u></em> my grandmother when he <em class=\"red past\">was</em> young. At the e<u class=\"end\">nd</u>, we all <em class=\"red past\">sang</em> \"Happy Birthday\".", "I <em class=\"red past\">fe<u class=\"end\">lt</u></em> really happy and warm that ni<u class=\"end\">ght</u>. My family only has dinner together two or three time<u class=\"end\">s</u> a year, so this dinner <em class=\"red past\">was</em> very special to me. If I <em class=\"red past\">ha<u class=\"end\">d</u></em> the cha<u class=\"end\">nce</u>, I wou<u class=\"end\">ld</u> have a dinner li<u class=\"end\">ke</u> that with my family every month."], "past": "went · came · was · brought · waited · said · gave · sat · told · met · sang · felt · had", "alts": [{"topics": [{"n": "33", "t": "Describe an enjoyable dinner you had with your friends.", "k": "And explain why you found this dinner enjoyable"}], "q": ["<b>Đổi:</b> đổi \"family\" thành \"friends\", đổi lý do.", "<span class=\"p2lbl\">QK</span>  <span lang=\"en\" class=\"p2en\">La<u class=\"end\">st</u> month, I <em class=\"red past\">ha<u class=\"end\">d</u></em> dinner with five clo<u class=\"end\">se</u> frie<u class=\"end\">nds</u> at a seafoo<u class=\"end\"> hop/store.", "k": "And explain why you think the service was good"}], "q": ["<b>Đổi:</b> giữ nhà hàng, hoặc đổi thành cửa hàng điện thoại.", "<span lang=\"en\" class=\"p2en\">La<u class=\"end\">st</u> month, I <em class=\"red past\">we<u class=\"end\">nt</u></em> to a phone sho<u class=\"end\">p</u> to buy a new phone. The staff member <em class=\"red past\">was</em> very patie<u class=\"end\">nt</u>. She <em class=\"red past\">explaine<u class=\"end\">d</u></em> everything clearly, and she <em class=\"red past\">helpe<u class=\"end\">d</u></em> me move all my photo<u class=\"end\">s</u> to the new phone for free.</span>", "<span class=\"p2lbl\">HT</span>  <span lang=\"en\" class=\"p2en\">Now I alway<u class=\"end\">s</u> buy my phone<u class=\"end\">s</u> there, becau<u class=\"end\">se</u> I tru<u class=\"end\">st</u> them.</span>"]}, {"topics": [{"n": "14", "t": "Describe an interesting conversation that you had with an old person", "k": "And explain how you felt about it"}], "q": ["<b>Đổi:</b> nhấn mạnh cuộc nói chuyện với ông.", "<span lang=\"en\" class=\"p2en\">He <em class=\"red past\">to<u class=\"end\">ld</u></em> me how he <em class=\"red past\">worke<u class=\"end\">d</u></em> as a teacher in a small village, how he <em class=\"red past\">ro<u class=\"end\">de</u></em> a bicycle 10 kilometre<u class=\"end\">s</u> to school every day, and how he <em class=\"red past\">me<u class=\"end\">t</u></em> my grandmother. I <em class=\"red past\">fe<u class=\"end\">lt</u></em> very surprise<u class=\"end\">d</u>, becau<u class=\"end\">se</u> I never <em class=\"red past\">knew</em> those storie<u class=\"end\">s</u>.</span>", "<span class=\"p2lbl\">HT</span>  <span lang=\"en\" class=\"p2en\">Now I call him every Sunday, and I alway<u class=\"end\">s</u> a<u class=\"end\">sk</u> him to tell me one more story.</span>"]}, {"topics": [{"n": "55", "t": "Describe a live sports event you watched before", "k": "And how you felt about it"}], "q": ["<b>Đổi:</b> giữ cấu trúc, đổi sự kiện.", "<span class=\"p2lbl\">QK</span>  <span lang=\"en\" class=\"p2en\">La<u class=\"end\">st</u> year, I <em class=\"red past\">watche<u class=\"end\">d</u></em> a football match between Vietnam and Thaila<u class=\"end\">nd</u> at the stadium with my frie<u class=\"end\">nds</u>. The stadium <em class=\"red past\">was</em> full, everyone <em class=\"red past\">wore</em> re<u class=\"end\">d</u> shi<u class=\"end\">rts</u>, and people <em class=\"red past\">sang</em> and <em class=\"red past\">cheere<u class=\"end\">d</u></em> all the time. When Vietnam <em class=\"red past\">score<u class=\"end\">d</u></em>, everyone <em class=\"red past\">jumpe<u class=\"end\">d</u></em> u<u class=\"end\">p</u> and <em class=\"red past\">hugge<u class=\"end\">d</u></em> each other.</span>", "<span class=\"p2lbl\">HT</span>  <span lang=\"en\" class=\"p2en\">Now I go to watch football at the stadium abou<u class=\"end\">t</u> o<u class=\"end\">nce</u> a year, becau<u class=\"end\">se</u> the atmosphere is much better than on TV.</span>", "<span class=\"p2lbl\">TL</span>  <span lang=\"en\" class=\"p2en\">I&#x27;m going to watch the ne<u class=\"end\">xt</u> Vietnam match with my frie<u class=\"end\">nds</u>.</span>"]}], "main": {"n": "51", "t": "Describe an important event you celebrated", "k": "And explain how you felt about the event"}, "name": "Mẫu 3 – Sinh Nhật 80 Tuổi Của Ông", "short": "Mẫu 3 – Sinh nhật ông"}, {"ideas": ["Laptop hỏng trước buổi họp, đồng nghiệp cứu nguy. Tuần trước có cuộc họp lớn ra mắt sản phẩm mới, phải trình bày ý tưởng với sếp; rất quan trọng nên tập nhiều lần với slide. Ngay trước giờ họp, laptop không mở được → rất lo, căng thẳng. Đồng nghiệp gợi ý dùng bảng trắng để trình bày, còn cô ấy thử tải lại slide dự phòng. Suy nghĩ kỹ rồi quyết định dùng bảng trắng – quyết định khó vì phải đổi gần như cả bài. May mắn là rất thành công: sếp thích, khen sáng tạo, duyệt ý tưởng. Rất vui, sau giờ làm mời đồng nghiệp đi ăn cảm ơn. Học được: bình tĩnh khi em> it, and he <em class=\"red past\">appreciate<u class=\"end\">d</u></em> my creativity in using a whiteboard instea<u class=\"end\">d</u> of normal slide<u class=\"end\">s</u>. He <em class=\"red past\">approve<u class=\"end\">d</u></em> my idea for the new produ<u class=\"end\">ct</u>.", "I <em class=\"red past\">was</em> so happy, and after wo<u class=\"end\">rk</u>, I <em class=\"red past\">too<u class=\"end\">k</u></em> my co-worker ou<u class=\"end\">t</u> for a meal to say tha<u class=\"end\">nks</u>. It really <em class=\"red past\">tau<u class=\"end\">ght</u></em> me to stay calm under pressure and alway<u class=\"end\">s</u> have a backu<u class=\"end\">p</u> plan. If I <em class=\"red past\">ha<u class=\"end\">d</u></em> another importa<u class=\"end\">nt</u> presentation, I wou<u class=\"end\">ld</u> save my slide<u class=\"end\">s</u> online fi<u class=\"end\">rst</u>."], "past": "saved · had · needed · was · practised · suggested · could · tried · decided · worked · loved · appreciated · approved · took · taught", "alts": [{"topics": [{"n": "21", "t": "Describe a time when you had a problem with using the computer", "k": "And explain how you solved the problem at last"}], "q": ["<b>Đổi:</b> giữ nguyên bài, thêm câu giải quyết cuối cùng.", "<span lang=\"en\" class=\"p2en\">In the e<u class=\"end\">nd</u>, I <em class=\"red past\">solve<u class=\"end\">d</u></em> the problem in two ste<u class=\"end\">ps</u>: I use<u class=\"end\">d</u> the whiteboard for the meeting, and after that, the IT team <em class=\"red past\">fixe<u class=\"end\">d</u></em> my lapto<u class=\"end\">p</u>. Now I alway<u class=\"end\">s</u> save my file<u class=\"end\">s</u> on Google Drive.</span>"]}, {"topics": [{"n": "46", "t": "Describe a difficult decision that you made and had a good result", "k": "And explain how you felt about the good result"}], "q": ["<b>Đổi:</b> mở bài bằng quyết định khó, giữ phần còn lại.", "<span lang=\"en\" class=\"p2en\">I<u class=\"end\">&#x27;d  you had to change your plan", "k": "And how you felt about the change"}], "q": ["<b>Đổi:</b> mở bài bằng việc đổi kế hoạch, giữ phần còn lại.", "<span lang=\"en\" class=\"p2en\">I<u class=\"end\">&#x27;d</u> li<u class=\"end\">ke</u> to ta<u class=\"end\">lk</u> abou<u class=\"end\">t</u> a time when I <em class=\"red past\">ha<u class=\"end\">d</u></em> to change my plan for an importa<u class=\"end\">nt</u> presentation at wo<u class=\"end\">rk</u>. My plan <em class=\"red past\">was</em> to u<u class=\"end\">se</u> my slide<u class=\"end\">s</u>, but my lapto<u class=\"end\">p</u> <em class=\"red past\">bro<u class=\"end\">ke</u></em> ju<u class=\"end\">st</u> before the meeting, so I use<u class=\"end\">d</u> a whiteboard instea<u class=\"end\">d</u>.</span>", "<b>Cảm xúc:</b> <span lang=\"en\" class=\"p2en\">At fi<u class=\"end\">rst</u>, I <em class=\"red past\">fe<u class=\"end\">lt</u></em> stresse<u class=\"end\">d</u> abou<u class=\"end\">t</u> the change, but in the e<u class=\"end\">nd</u>, I <em class=\"red past\">fe<u class=\"end\">lt</u></em> happy, becau<u class=\"end\">se</u> the new plan <em class=\"red past\">worke<u class=\"end\">d</u></em> even better.</span>"]}, {"topics": [{"n": "26", "t": "Describe a time when you worked in a group", "k": "And explain why you worked in the group"}], "q": ["<b>Đổi:</b> nhấn mạnh làm việc cùng đồng nghiệp: làm gì, với ai, gặp vấn đề gì.", "<span lang=\"en\" class=\"p2en\">I<u class=\"end\">&#x27;d</u> li<u class=\"end\">ke</u> to ta<u class=\"end\">lk</u> abou<u class=\"end\">t</u> a time when I <em class=\"red past\">worke<u class=\"end\">d</u></em> with my co-worker to save an importa<u class=\"end\">nt</u> presentation. The problem <em class=\"red past\">was</em> that my lapto<u class=\"end\">p</u> <em class=\"red past\">bro<u class=\"end\">ke</u></em> ju<u class=\"end\">st</u> before the meeting. So we <em class=\"red past\">worke<u class=\"end\">d</u></em> together: I <em class=\"red past\">explaine<u class=\"end\">d</u></em> my idea on the whiteboard, and she <em class=\"red past\">trie<u class=\"end\">d</u></em> to downloa<u class=\"end\">d</u> my slide<u class=\"end\">s</u>.</span>", "<b>Vì sao làm nhóm:</b> <span lang=\"en\" class=\"p2en\">We <em class=\"red past\">worke<u class=\"end\">d</u></em> together becau<u class=\"end\">se</u> there <em class=\"red past\">was</em> very little time, and two people <em class=\"red past\">cou<u class=\"end\">ld</u></em> solve the problem faster than one.</span>"]}], "main": {"n": "53", "t": "Describe a problem of technology you have encountered, like a computer or a cell phone", "k": "And explain how you felt when you had this problem"}, "name": "Mẫu 4 – Laptop Hỏng Trước Buổi Họp", "short": "Mẫu 4 – Laptop hỏng trước buổi họp"}]}, "p2_5": {"name": "Hoạt động", "title": "Nhóm 5 – HOẠT ĐỘNG, THÓI QUEN & KỸ NĂNG (Activities / Habits / Skills)", "tips": ["<b>Mẹo nhóm này:</b> kể lần đầu tiên làm hoạt động đó (chuyện vui hoặc chuyện hỏng), rồi chuyển sang thói quen bây giờ với <i>Now I usually… / I often…</i>."], "samples": [{"ideas": ["Xem TikTok – thói quen phí thời gian, xem buổi tối vì mệt, muốn thư giãn. Một năm trước định xem 5 phút → nhìn lại đã 1 giờ sáng → hôm sau buồn ngủ, không tập trung → kiểm tra thấy 2 tiếng/ngày. Giờ học thì để điện thoại phòng khác, dùng Pomodoro. Phí thời gian vì xem xong không nhớ gì, ngủ muộn. Nếu tự chủ hơn, mình sẽ xóa app vào ngày thường."], "para": ["I<u class=\"end\">&#x27;d</u> li<u class=\"end\">ke</u> to ta<u class=\"end\">lk</u> abou<u class=\"end\">t</u> a habi<u class=\"end\">t</u> that waste<u class=\"end\">s</u> a lo<u class=\"end\">t</u> of my time: watching sho<u class=\"end\">rt</u> video<u class=\"end\">s</u> on TikTok.", "I <em class=\"red past\">starte<u class=\"end\">d</u></em> using TikTok abou<u class=\"end\">t</u> two yea<u class=\"end\">rs</u> ago. I usually watch it at ni<u class=\"end\">ght</u>, before I go to slee<u class=\"end\">p</u>.", "I watch it becau<u class=\   h += '<div class="p2toc" role="navigation" aria-label="Các bài mẫu trong trang">';
  g.samples.forEach(function(x,i){
    h += '<button type="button" data-jump="p2s-'+i+'" class="'+(done[p2Key(id,i)]?'full':'')+'">'+esc(x.short)+'</button>';
  });
  h += '</div>';
  g.samples.forEach(function(s,idx){
    var key = p2Key(id, idx), isDone = !!done[key], note = notes[key] || "";
    h += '<section class="p2block" id="p2s-'+idx+'"><h2>'+esc(s.short)+'</h2>';
    h += '<div class="q p2s'+(isDone?' is-done':'')+'" data-key="'+esc(key)+'" data-idx="'+idx+'">';
    var tl = [s.main]; s.alts.forEach(function(a){ a.topics.forEach(function(t){ if(tl.every(function(x){ return x.n!==t.n; })) tl.push(t); }); });
    h += '<h3 class="p2h">Danh sách đề</h3><ul class="p2list">'+tl.map(function(t){ return '<li><span class="p2num">Đề '+esc(t.n)+'</span> <span lang="en">'+esc(t.t)+'</span></li>'; }).join("")+'</ul>';
    h += '<h3 class="p2h">Bài mẫu</h3><button class="peek" type="button">Xem bài mẫu</button><div class="p2sample" lang="en">'+s.para.map(function(p){ return '<p>'+p+'</p>'; }).join("");
    if(s.past) h += '<p class="p2past" lang="vi">Động từ quá khứ trong bài: '+esc(s.past)+'</p>';
    h += '</div>';
    h += '<h3 class="p2h">Gợi ý tiếng Việt</h3><div class="p2vi">'+s.ideas.map(function(x){ return '<p>'+x+'</p>'; }).join("")+'</div>';
    h += '<label class="check"><input type="checkbox"'+(isDone?' checked':'')+'> Đã luyện bài này</label>';
    h += '<label class="notewrap"><span class="tag">Ghi chú của bạn</span><textarea rows="2" data-note="'+esc(key)+'" placeholder="Thời gian nói, lỗi cần sửa, từ mới…">'+esc(note)+'</textarea></label>';
    if(s.alts.length){
      h += '<h3 class="p2h">Cách đổi cho các đề khác</h3>';
      s.alts.forEach(function(a){
        h += '<div class="p2alt">'+a.topics.map(function(t){ return p2TopicHead(t); }).join("")+'<div class="p2change">'+a.q.map(function(x){ return '<p>'+x+'</p>'; }).join("")+'</div></div>';
      });
    }
    h += '</div><p class="p2top"><button type="button" data-jump="top">↑ Về đầu trang</button></p></section>';
  });
  return h;
}

var P3G = {"p3_1": {"name": "Người", "topics": [{"name": "Đề 10 · Sports", "rows": [["Should students have physical education and do sports at school?", "Có, mình nghĩ học sinh chắc chắn nên có giờ thể dục và chơi thể thao ở trường.||[[That's because]] thể thao giúp học sinh khỏe mạnh [[and]] thư giãn sau giờ học. Các em [[also]] học được tinh thần đồng đội.||[[For example]], ở trường cũ của mình, giờ thể dục là tiết mà ai cũng mong chờ. Tụi mình chơi bóng đá [[and]] cười rất nhiều.||[[So]] có, mình nghĩ thể thao nên là một phần quan trọng ở trường, [[and]] chính phủ nên đầu tư thêm sân chơi.", "Yes, I think students should definitely do sports at school.||[[That's because]] sports keep students healthy [[and]] help them relax after studying. They [[also]] learn teamwork.||[[For example]], at my old school, PE was the lesson everyone looked forward to. We played football [[and]] laughed a lot.||[[So]] yes, I think sports should be an important part of school, [[and]] the government should build more sports fields.", "", "keep healthy|teamwork", ""], ["What qualities make an athlete?", "Mình nghĩ một vận động viên cần chăm chỉ, kỷ luật [[and]] có tinh thần mạnh mẽ.||[[That's because]] họ phải tập luyện mỗi ngày, kể cả khi thời tiết xấu. Họ [[also]] chịu rất nhiều áp lực khi thi đấu.||[[For example]], các cầu thủ bóng đá Việt Nam phải giữ bình tĩnh khi hàng chục nghìn người đang xem. [[And]] họ không bỏ cuộc sau khi thua.||[[So]] theo mình, chăm chỉ [[and]] một tinh thần vững vàng là những phẩm chất quan trọng nhất.", "I think an athlete needs to be hard-working, disciplined [[and]] mentally strong.||[[That's because]] they have to train every day, even when the weather is bad. They [[also]] face a lot of pressure in competitions.||[[For example]], Vietnamese football players need to stay calm when thousands of people are watching. [[And]] they don't give up after losing a match.||[[So]] in my opinion, hard work [[and]] a strong mind are the most important qualities.", "", "discipline|train|give up", ""], ["Is talent important in sports?", "Có, năng khiếu quan trọng, [[but]] mình nghĩ chăm chỉ còn quan trọng hơn.||[[That's because]] năng khiếu chỉ giúp lúc bắt đầu. Nếu không tập luyện, năng khiếu thôi là không đủ.||[[For example]], nhiều vận động viên Việt Nam lúc đầu không có nhiều năng khiếu, [[but]] họ tập luyện rất chăm chỉ [[and]] vẫn giành huy chương ở SEA Games.||[[So]] mình nghĩ năng khiếu có ích, [[but]] chăm chỉ mới là chìa khóa.", "Yes, talent is important, [[but]] I think hard work is more important.||[[That's because]] talent only helps at the beginning. Without training, talent is not enough.||[[For example]], many Vietnamese athletes are not very talented at first, [[but]] they train very hard [[and]] still win medals at the SEA Games.||[[So]] I think talent helps, [[but]] hard work is the key.", "", "talent|hard work|not enough", ""], ["What is the most popular sport in your country?", "Mình nghĩ bóng đá là môn thể thao phổ biến nhất ở Việt Nam.||[[That's because]] bóng đá rất dễ chơi, bạn chỉ cần một quả bóng. Hầu như ai cũng xem [[when]] đội tuyển quốc gia đá.||[[For example]], [[when]] Việt Nam thắng, mọi người ở Thành phố Hồ Chí Minh đổ ra đường để ăn mừng. Gần đây, cầu lông [[and]] pickleball [[also]] rất phổ biến.||[[So]] theo mình, bóng đá vẫn là môn thể thao số một ở đất nước mình.", "I think football is the most popular sport in Vietnam.||[[That's because]] it's easy to play; you only need a ball. Almost everyone watches [[when]] the national team plays.||[[For example]], [[when]] Vietnam wins, people in Ho Chi Minh City go out into the streets to celebrate. Badminton [[and]] pickleball are [[also]] very popular now.||[[So]] in my opinion, football is still the number one sport in my country.", "", "national team|badminton|pickleball", ""]]}, {"name": "Đề 22 · Teachers & learning", "rows": [["What qualities do you think a good teacher should have?", "Mình nghĩ một giáo viên giỏi cần kiên nhẫn, tử tế [[and]] giải thích rõ ràng.||[[That's because]] học sinh cần cảm thấy an toàn để đặt câu hỏi. Giáo viên [[also]] nên làm bài học thú vị, [[so]] học sinh không thấy chán.||[[For example]], cô dạy tiếng Anh cấp ba của mình hay dùng trò chơi trong lớp, [[so]] tụi mình rất thích học.||[[So]] theo mình, một giáo viên giỏi là người kiên nhẫn [[and]] thật sự quan tâm đến học sinh.", "I think a good teacher should be patient, kind [[and]] clear.||[[That's because]] students need to feel safe to ask questions. Teachers [[also]] need to make lessons interesting, [[so]] students don't feel bored.||[[For example]], my high school English teacher often used games in class, [[so]] we really enjoyed learning.||[[So]] in my opinion, a good teacher is patient [[and]] really cares about the students.", "", "patient|explain clearly|interesting", ""], ["Who do you think can learn better? Old or young people?", "Tùy trường hợp, [[but]] mình nghĩ người trẻ thường học nhanh hơn.||[[That's because]] người trẻ nhớ nhanh hơn [[and]] không sợ mắc lỗi. [[However]], người lớn tuổi tập trung hơn, [[because]] họ biết rõ mình học để làm gì.||[[For example]], trẻ con học ngoại ngữ rất nhanh. [[But]] mình là người lớn, [[and]] mình học IELTS rất tập trung [[because]] mình có mục tiêu rõ ràng.||[[So]] mình nghĩ người trẻ học nhanh hơn, [[but]] người lớn có động lực cũng có thể học rất tốt.", "It depends, [[but]] I think young people usually learn faster.||[[That's because]] they remember things quickly [[and]] they aren't afraid of mistakes. [[However]], older people are more focused, [[because]] they know why they are learning.||[[For example]], children learn languages very quickly. [[But]] I'm an adult, [[and]] I study IELTS with focus [[because]] I have a clear goal.||[[So]] I think young people learn faster, [[but]] motivated adults can learn very well too.", "", "remember faster|focused", ""], ["What do you think is the best age for children to go to school?", "Mình nghĩ khoảng sáu tuổi là độ tuổi tốt nhất để trẻ đi học.||[[That's because]] ở tuổi này trẻ đã sẵn sàng ngồi yên [[and]] tập trung. [[If]] đi học quá sớm, trẻ có thể thấy căng thẳng [[and]] mệt mỏi.||[[For example]], ở Việt Nam, trẻ vào lớp một lúc sáu tuổi. [[Before that]], các bé chơi [[and]] học ở trường mẫu giáo, điều này giúp các bé sáng tạo.||[[So]] theo mình, sáu tuổi là phù hợp nhất, [[because]] trẻ nhỏ cần thời gian để chơi.", "I think around six years old is the best age to start school.||[[That's because]] children are ready to sit [[and]] focus at that age. [[If]] they start too early, they may feel stressed [[and]] tired.||[[For example]], in Vietnam, children start grade one at six. [[Before that]], they play [[and]] learn at kindergarten, which helps them be creative.||[[So]] in my opinion, six is the best age, [[because]] young children need time to play.", "", "ready|kindergarten", ""]]}, {"name": "Đề 28 · Success", "rows": [["Why do some people succeed while others give up?", "Mình nghĩ người thành công có mục tiêu rõ ràng [[and]] có người ủng hộ họ.||[[That's because]] họ xem thất bại là một bài học. [[On the other hand]], những người khác bỏ cuộc [[when]] mọi thứ trở nên khó khăn.||[[For example]], chị gái mình không bỏ cuộc [[when]] tiệm tranh của chị có ít khách, [[because]] gia đình luôn ủng hộ chị.||[[So]] theo mình, mục tiêu rõ ràng [[and]] sự ủng hộ là hai điều quan trọng nhất.", "I think successful people have clear goals [[and]] people who support them.||[[That's because]] they see failure as a lesson. [[On the other hand]], other people give up [[when]] things get difficult.||[[For example]], my sister didn't give up [[when]] her art shop had few customers, [[because]] our family always supported her.||[[So]] in my opinion, clear goals [[and]] support are the two most important things.", "", "clear goals|lesson|give up", ""], ["Is determination important for success?", "Có, mình nghĩ quyết tâm rất quan trọng để thành công.||[[That's because]] thành công cần rất nhiều thời gian. Không có quyết tâm, người ta sẽ bỏ cuộc ở khó khăn đầu tiên.||[[For example]], chị gái mình vẫn tiếp tục [[when]] tiệm tranh của chị có rất ít khách, [[and]] bây giờ chị đã thành công.||[[So]] có, mình nghĩ quyết tâm còn quan trọng hơn cả năng khiếu.", "Yes, I think determination is very important for success.||[[That's because]] success takes a long time. Without determination, people give up at the first difficulty.||[[For example]], my sister kept going [[when]] her art shop had very few customers, [[and]] now she is successful.||[[So]] yes, I think determination is even more important than talent.", "", "determination|take time|keep going", ""], ["Should parents teach children not to give up easily?", "Có, mình nghĩ bố mẹ chắc chắn nên dạy con không dễ bỏ cuộc.||[[That's because]] cuộc sống đầy khó khăn, [[so]] trẻ cần học cách tiếp tục cố gắng từ sớm.||[[For example]], [[when]] một đứa trẻ tập đi xe đạp [[and]] bị ngã, bố mẹ nên động viên con thử lại. [[But]] bố mẹ không nên ép con quá mức.||[[So]] có, theo mình bố mẹ nên dạy điều này, bắt đầu từ những việc nhỏ.", "Yes, I think parents should definitely teach this.||[[That's because]] life is full of difficulties, [[so]] children need to learn to keep trying early.||[[For example]], [[when]] a child learns to ride a bike [[and]] falls, parents should encourage them to try again. [[But]] they shouldn't push too hard.||[[So]] yes, in my opinion parents should teach this, starting with small tasks.", "", "difficulties|finish tasks", ""], ["Can failure help people become successful?", "Có, mình nghĩ thất bại có thể giúp người ta thành công.||[[That's because]] [[when]] thất bại, người ta học được từ lỗi sai, [[so]] lần sau họ làm tốt hơn.||[[For example]], lần đầu thi IELTS mình không đạt điểm mong muốn, [[but]] mình nhận ra điểm yếu là ngữ pháp, [[so]] bây giờ mình tập trung vào nó.||[[So]] có, mình nghĩ thất bại cho mình thấy cần cải thiện điều gì.", "Yes, I think failure can help people succeed.||[[That's because]] [[when]] people fail, they learn from their mistakes, [[so]] next time they do better.||[[For example]], I didn't get the score I wanted in my first IELTS test, [[but]] I found my weak point was grammar, [[so]] now I focus on it.||[[So]] yes, I think failure shows us what we need to improve.", "", "learn from mistakes|do better", ""], ["What motivates people to achieve difficult goals?", "Mình nghĩ gia đình [[and]] mong muốn tự hào về bản thân là động lực lớn nhất.||[[That's because]] tiền có thể giúp một thời gian, [[but]] động lực từ bên trong thường mạnh hơn [[and]] kéo dài hơn.||[[For example]], chị gái mình làm việc rất chăm chỉ [[because]] chị muốn cho bố mẹ thấy chị đã chọn đúng.||[[So]] theo mình, gia đình [[and]] động lực bên trong giúp người ta đạt được những mục tiêu khó.", "I think family [[and]] personal pride motivate people the most.||[[That's because]] money helps for a while, [[but]] motivation from inside is usually stronger [[and]] lasts longer.||[[For example]], my sister works very hard [[because]] she wants to show our parents that she made the right choice.||[[So]] in my opinion, family [[and]] inner motivation help people reach difficult goals.", "", "better life|family|pride", ""]]}, {"name": "Đề 31 · Business", "rows": [["What qualities make someone a successful businessperson?", "Mình nghĩ một doanh nhân thành công cần chăm chỉ, sáng tạo [[and]] hiểu khách hàng.||[[That's because]] kinh doanh có rất nhiều khó khăn, [[so]] họ không được dễ bỏ cuộc. Họ [[also]] cần lắng nghe khách hàng.||[[For example]], chị gái mình làm việc đến khuya mỗi tối cho tiệm tranh của chị, [[and]] chị luôn trả lời tin nhắn của khách rất nhanh.||[[So]] theo mình, chăm chỉ [[and]] hiểu khách hàng là những phẩm chất quan trọng nhất.", "I think a successful businessperson needs to be hard-working, creative [[and]] customer-focused.||[[That's because]] business is full of problems, [[so]] they can't give up easily. They [[also]] need to listen to customers.||[[For example]], my sister works late every night for her art shop, [[and]] she always replies to customers quickly.||[[So]] in my opinion, hard work [[and]] understanding customers are the most important qualities.", "", "hard-working|creative|give up", ""], ["Do you think starting a business is risky? Why?", "Có, mình nghĩ khởi nghiệp khá rủi ro.||[[That's because]] bạn có thể mất rất nhiều tiền, [[and]] thu nhập không ổn định. Chủ doanh nghiệp [[also]] phải làm việc rất nhiều giờ.||[[For example]], nhiều quán cà phê nhỏ ở Thành phố Hồ Chí Minh đóng cửa chỉ sau khoảng một năm.||[[So]] có, khởi nghiệp rủi ro, [[but]] [[if]] thành công, bạn có thể kiếm được nhiều hơn một nhân viên.", "Yes, I think starting a business is quite risky.||[[That's because]] you can lose a lot of money, [[and]] your income isn't stable. Owners [[also]] work very long hours.||[[For example]], many small coffee shops in Ho Chi Minh City close after only about one year.||[[So]] yes, it's risky, [[but]] [[if]] you succeed, you can earn much more than an employee.", "", "risky|lose money|close down", ""], ["Why do some businesses succeed while others fail?", "Mình nghĩ doanh nghiệp thành công là vì họ hiểu khách hàng [[and]] thay đổi theo thị trường.||[[That's because]] khách hàng luôn thay đổi. Những doanh nghiệp thất bại thường không thay đổi [[when]] thị trường thay đổi.||[[For example]], tiệm tranh của chị gái mình thành công [[because]] chị trả lời khách nhanh [[and]] dùng mạng xã hội rất tốt.||[[So]] theo mình, hiểu khách hàng là chìa khóa để thành công.", "I think businesses succeed when they understand customers [[and]] change with the market.||[[That's because]] customers' needs change all the time. Businesses that fail often don't change [[when]] the market changes.||[[For example]], my sister's art shop is successful [[because]] she replies to customers quickly [[and]] uses social media well.||[[So]] in my opinion, understanding customers is the key to success.", "", "understand customers|good service|the market changes", ""], ["Is it better to work for a company or run your own business?", "Với mình, làm cho công ty thì tốt hơn, ít nhất là bây giờ.||[[That's because]] công việc ổn định hơn [[and]] ít căng thẳng hơn. Mình [[also]] có lương đều đặn [[and]] học được từ đồng nghiệp.||[[For example]], ở công ty giáo dục của mình, mình học được rất nhiều về marketing từ sếp. [[However]], tự kinh doanh cho mình nhiều tự do hơn.||[[So]] bây giờ mình chọn làm cho công ty, [[but]] trong tương lai mình có thể tự kinh doanh.", "For me, working for a company is better, at least for now.||[[That's because]] it's more stable [[and]] less stressful. I [[also]] get a regular salary [[and]] learn from my colleagues.||[[For example]], at my education company, I learn a lot about marketing from my boss. [[However]], running a business gives more freedom.||[[So]] I prefer working for a company now, [[but]] I might start my own business in the future.", "", "stable|less stressful|start my own business", ""]]}, {"name": "Đề 32 · Art & drawing", "rows": [["What is the right age for a child to learn drawing?", "Mình nghĩ khoảng bốn hoặc năm tuổi là phù hợp để trẻ học vẽ.||[[That's because]] ở tuổi này trẻ đã cầm bút chì tốt. Các bé [[also]] rất sáng tạo.||[[For example]], cháu của mình bắt đầu vẽ lúc bốn tuổi, [[and]] bé rất thích vẽ con vật. [[But]] bố mẹ không nên ép con học quá sớm.||[[So]] theo mình, bốn hoặc năm tuổi là tốt, miễn là trẻ vẽ [[because]] các bé thích.", "I think around four or five is the right age.||[[That's because]] kids can hold a pencil well at that age. They are [[also]] very creative.||[[For example]], my nephew started drawing at four, [[and]] he loves drawing animals. [[But]] parents shouldn't force kids too early.||[[So]] in my opinion, four or five is good, as long as kids draw [[because]] they enjoy it.", "", "hold a pencil|creative", ""], ["Why do most children draw more often than adults do?", "Mình nghĩ trẻ con vẽ nhiều hơn [[because]] các bé có nhiều thời gian rảnh [[and]] không sợ vẽ xấu.||[[That's because]] trẻ con dùng tranh vẽ để thể hiện cảm xúc. [[In contrast]], người lớn bận rộn với công việc [[and]] thường nghĩ mình vẽ không đẹp.||[[For example]], cháu mình vẽ gần như mỗi ngày, còn mình thì chỉ cầm bút để viết ghi chú cho công việc.||[[So]] theo mình, khi lớn lên, người ta dần mất đi thói quen này.", "I think children draw more [[because]] they have more free time [[and]] no fear.||[[That's because]] children use drawing to show their feelings. [[In contrast]], adults are busy with work [[and]] often think they can't draw well.||[[For example]], my nephew draws almost every day, [[but]] I only use a pen to write notes for work.||[[So]] in my opinion, people slowly lose this habit as they grow up.", "", "free time|afraid of|busy", ""], ["Why do some people visit galleries or museums instead of viewing artworks online?", "Mình nghĩ người ta đến bảo tàng để xem tác phẩm thật.||[[That's because]] ở bảo tàng, bạn thấy được màu sắc [[and]] kích thước thật của tác phẩm. Không khí ở đó [[also]] rất đặc biệt.||[[For example]], [[when]] mình xem tranh thật ở Bảo tàng Mỹ thuật Thành phố Hồ Chí Minh, mình thấy được từng nét cọ.||[[So]] theo mình, xem tranh trên điện thoại thì tiện, [[but]] không mang lại cảm giác giống như vậy.", "I think people visit galleries to see the real artworks.||[[That's because]] in a gallery, you can see the real colours [[and]] size. The atmosphere is [[also]] special.||[[For example]], [[when]] I see real paintings at the Fine Arts Museum in Ho Chi Minh City, I can see every brushstroke.||[[So]] in my opinion, art online is convenient, [[but]] it doesn't give the same feeling.", "", "real colours|atmosphere|weekend", ""], ["Do you think galleries and museums should be free of charge?", "Mình nghĩ bảo tàng nên miễn phí cho học sinh [[and]] trẻ em, [[but]] không phải cho tất cả mọi người.||[[That's because]] khi miễn phí, nhiều người trẻ có thể học về nghệ thuật hơn. [[But]] bảo tàng [[also]] cần tiền để bảo quản tác phẩm.||[[For example]], nếu người lớn trả một khoản phí nhỏ, khoảng ba mươi nghìn đồng, bảo tàng sẽ có tiền để sửa chữa [[and]] bảo quản tranh.||[[So]] theo mình, vé rẻ cho người lớn [[and]] miễn phí cho học sinh là giải pháp tốt nhất.", "I think they should be free for students [[and]] children, [[but]] not for everyone.||[[That's because]] free entry helps more young people learn about art. [[But]] museums [[also]] need money to look after the artworks.||[[For example]], [[if]] adults pay a small fee, about thirty thousand dong, the museum has money to repair [[and]] protect paintings.||[[So]] in my opinion, cheap tickets for adults [[and]] free entry for students is the best solution.", "", "free of charge|learn about art|small fee", ""], ["How do artworks inspire people?", "Mình nghĩ tác phẩm nghệ thuật giúp người ta cảm thấy bình yên [[and]] có ý tưởng mới.||[[That's because]] nghệ thuật chạm đến cảm xúc của chúng ta. Nó [[also]] giúp người ta hiểu lịch sử [[and]] văn hóa.||[[For example]], một bức tranh thiên nhiên làm mình muốn đi du lịch Đà Lạt. Tranh Đông Hồ [[also]] cho mình thấy cuộc sống làng quê Việt Nam xưa.||[[So]] theo mình, nghệ thuật truyền cảm hứng cho cả cảm xúc [[and]] suy nghĩ của chúng ta.", "I think artworks make people feel calm [[and]] give them new ideas.||[[That's because]] art touches our feelings. It [[also]] helps people understand history [[and]] culture.||[[For example]], a painting of nature makes me want to travel to Đà Lạt. Đông Hồ paintings [[also]] show me village life in old Vietnam.||[[So]] in my opinion, art inspires both our feelings [[and]] our thinking.", "", "feel calm|new ideas", ""]]}, {"name": "Đề 34 · Clothes", "rows": [["Do you think what people wear can influence their mood?", "Có, mình nghĩ quần áo có thể ảnh hưởng đến tâm trạng.||[[That's because]] màu sáng làm người ta vui hơn. Quần áo đẹp [[also]] giúp người ta tự tin hơn, nhất là khi đi phỏng vấn.||[[For example]], [[when]] mình thấy mệt, mình thường mặc đồ màu sáng đi làm để vui lên.||[[So]] có, mình nghĩ những gì mình mặc thật sự ảnh hưởng đến cảm giác của mình.", "Yes, I think clothes can change our mood.||[[That's because]] bright colours make people feel happier. Nice clothes [[also]] make people more confident, especially at a job interview.||[[For example]], [[when]] I feel tired, I often wear bright clothes to work to cheer myself up.||[[So]] yes, I think what we wear really affects how we feel.", "", "bright colours|confident", ""], ["Do you think it is a good idea to buy clothes online?", "Tùy trường hợp, mua quần áo online có cả mặt tốt [[and]] mặt xấu.||[[That's because]] nó rẻ [[and]] tiện. [[But]] đôi khi kích cỡ hoặc màu sắc khác với hình, [[so]] bạn phải trả hàng.||[[For example]], mình hay mua quần áo trên Shopee [[because]] có nhiều giảm giá. [[But]] với đồ quan trọng như giày, mình thích thử ở cửa hàng trước.||[[So]] theo mình, mua online tốt cho đồ đơn giản, [[but]] không tốt cho đồ quan trọng.", "It depends, because online shopping has good [[and]] bad points.||[[That's because]] it's cheap [[and]] convenient. [[But]] sometimes the size or colour is different from the photo, [[so]] you have to return it.||[[For example]], I often buy clothes on Shopee [[because]] there are many discounts. [[But]] for shoes, I prefer to try them in a shop first.||[[So]] in my opinion, online shopping is good for simple clothes, [[but]] not for important ones.", "", "convenient|wrong size", ""], ["What kind of clothes do people wear in the workplace?", "Mình nghĩ hầu hết nhân viên văn phòng mặc áo sơ mi [[and]] quần tây.||[[That's because]] trang phục cần phù hợp với công việc. Ở ngân hàng, người ta ăn mặc trang trọng [[because]] khách hàng cần tin tưởng họ.||[[For example]], ở công ty giáo dục của mình, người làm marketing ăn mặc thoải mái hơn, như quần jeans [[and]] áo thun.||[[So]] theo mình, trang phục công sở phụ thuộc vào loại công việc.", "I think most office workers wear shirts [[and]] trousers.||[[That's because]] clothes need to suit the job. In banks, people dress formally [[because]] customers need to trust them.||[[For example]], at my education company, people in marketing dress more casually, like jeans [[and]] T-shirts.||[[So]] in my opinion, work clothes depend on the type of job.", "", "uniform|relaxed", ""], ["What are the differences between clothes worn by old people and those by young people?", "Mình nghĩ người lớn tuổi thích đồ đơn giản, [[while]] người trẻ thích theo mốt.||[[That's because]] người lớn tuổi quan tâm đến sự thoải mái. Người trẻ [[also]] dùng quần áo để thể hiện cá tính.||[[For example]], bà mình ở Bến Tre chỉ mặc áo bà ba truyền thống, [[while]] em gái mình thích áo croptop [[and]] quần jeans rách.||[[So]] theo mình, người lớn tuổi chọn sự thoải mái, còn người trẻ chọn phong cách.", "I think old people like simple clothes, [[while]] young people follow fashion.||[[That's because]] old people care about comfort. Young people [[also]] use clothes to show their personality.||[[For example]], my grandmother in Bến Tre only wears traditional clothes, [[while]] my younger sister likes crop tops [[and]] ripped jeans.||[[So]] in my opinion, old people choose comfort, [[and]] young people choose style.", "", "comfortable|fashion trends", ""]]}, {"name": "Đề 44 · Music", "rows": [["What kind of music do people like at different ages?", "Mình nghĩ người trẻ thích nhạc pop [[and]] rap, [[while]] người lớn tuổi thích nhạc xưa.||[[That's because]] nhạc sôi động hợp với cuộc sống bận rộn của người trẻ. Người lớn tuổi thích bài chậm [[because]] chúng gợi nhớ tuổi trẻ.||[[For example]], bố mẹ mình rất thích nhạc Trịnh Công Sơn, còn mình thì nghe nhạc pop khi chạy bộ.||[[So]] theo mình, sở thích âm nhạc thay đổi theo độ tuổi.", "I think young people like pop [[and]] rap, [[while]] older people prefer old songs.||[[That's because]] energetic music matches young people's busy life. Older people like slow songs [[because]] they remind them of their youth.||[[For example]], my parents love Trịnh Công Sơn's songs, [[but]] I listen to pop music when I go running.||[[So]] in my opinion, music taste changes with age.", "", "pop|rap|traditional music", ""], ["What kind of music is popular in your country now and what kind will be in the future?", "Mình nghĩ bây giờ V-pop [[and]] rap phổ biến, [[and]] tương lai sẽ có nhiều nhạc pha trộn [[and]] nhạc làm bằng AI hơn.||[[That's because]] người trẻ thích những thứ mới. Công nghệ [[also]] giúp làm nhạc dễ hơn.||[[For example]], nhiều ca sĩ trẻ bây giờ kết hợp nhạc cụ truyền thống với nhạc điện tử, [[and]] những bài này rất nổi trên TikTok.||[[So]] theo mình, đây là xu hướng tốt [[because]] nó giúp giữ gìn văn hóa Việt Nam.", "I think V-pop [[and]] rap are popular now, [[and]] mixed music [[and]] AI music will grow.||[[That's because]] young people like new things. Technology [[also]] makes music easier to create.||[[For example]], many young singers mix traditional instruments with electronic music, [[and]] these songs are very popular on TikTok.||[[So]] in my opinion, it's a good trend [[because]] it keeps Vietnamese culture alive.", "", "V-pop|rap|AI music", ""], ["Do parents in your country require their children to learn to play musical instruments?", "Không hẳn, hầu hết bố mẹ ở Việt Nam không bắt con học nhạc cụ.||[[That's because]] họ tập trung vào tiếng Anh [[and]] toán. Các lớp nhạc [[also]] khá đắt.||[[For example]], ở Thành phố Hồ Chí Minh, một số gia đình cho con học piano [[or]] guitar, [[but]] ở quê mình ở Bến Tre thì rất hiếm.||[[So]] không, mình nghĩ học nhạc vẫn chưa phổ biến, [[but]] nó rất tốt cho trẻ.", "No, not really. Most parents don't require it.||[[That's because]] they focus on English [[and]] maths. Music classes are [[also]] quite expensive.||[[For example]], in Ho Chi Minh City, some families send kids to piano [[or]] guitar classes, [[but]] in my hometown in Bến Tre it's rare.||[[So]] no, I think it's not common yet, [[but]] music is very good for kids.", "", "focus on|piano classes", ""], ["Why do some people like to listen to live music while others prefer CDs?", "Mình nghĩ người ta chọn tùy theo việc họ thích không khí hay sự tiện lợi.||[[That's because]] nhạc sống có không khí tuyệt vời [[and]] bạn được hát cùng ca sĩ. [[But]] nghe nhạc online thì rẻ hơn [[and]] nghe lúc nào cũng được.||[[For example]], mình thường nghe Spotify khi đi làm. [[But]] [[if]] ca sĩ mình thích có concert, mình chắc chắn sẽ mua vé.||[[So]] theo mình, cả hai đều tốt, [[but]] với những dịp khác nhau.", "I think it depends on whether people want atmosphere or convenience.||[[That's because]] live music has a great atmosphere [[and]] you can sing along. [[But]] streaming is cheaper [[and]] you can listen anytime.||[[For example]], I usually listen to Spotify on my way to work. [[But]] [[if]] my favourite singer has a concert, I always buy a ticket.||[[So]] in my opinion, both are good, [[but]] for different moments.", "", "atmosphere|sing along|listen anytime", ""]]}, {"name": "Đề 45 · Health", "rows": [["What effect does stress have on health?", "Mình nghĩ căng thẳng rất có hại cho sức khỏe.||[[That's because]] nó gây đau đầu [[and]] mất ngủ. [[If]] kéo dài lâu, nó có thể gây ra bệnh nghiêm trọng.||[[For example]], [[when]] mình có deadline ở công ty, mình thường không ngủ được [[and]] ăn đồ ăn nhanh.||[[So]] theo mình, mọi người nên tập thể dục, như chạy bộ, để giảm căng thẳng.", "I think stress is very bad for our health.||[[That's because]] it causes headaches [[and]] bad sleep. [[If]] it lasts a long time, it can cause serious illness.||[[For example]], [[when]] I have deadlines at work, I often can't sleep, [[and]] I eat fast food.||[[So]] in my opinion, people should exercise, like running, to reduce stress.", "", "headaches|bad sleep|long-term", ""], ["Which group pays more attention to health, young people or old people?", "Mình nghĩ người lớn tuổi quan tâm đến sức khỏe nhiều hơn.||[[That's because]] họ lo bị bệnh. Người trẻ thì nghĩ mình khỏe, [[so]] họ hay thức khuya [[and]] ăn đồ ăn nhanh.||[[For example]], bố mẹ mình ở Bến Tre đi bộ mỗi sáng. [[However]], bây giờ nhiều bạn trẻ ở Sài Gòn [[also]] chạy bộ [[and]] đi gym.||[[So]] theo mình, người lớn tuổi quan tâm hơn, [[but]] người trẻ đang dần thay đổi.", "I think old people pay more attention to their health.||[[That's because]] they worry about getting sick. Young people think they're healthy, [[so]] they stay up late [[and]] eat fast food.||[[For example]], my parents in Bến Tre walk every morning. [[However]], many young people in Saigon [[also]] run [[and]] go to the gym now.||[[So]] in my opinion, old people care more, [[but]] young people are changing.", "", "worry about|stay up late", ""]]}, {"name": "Đề 49 · Intelligence", "rows": [["What kinds of games can help children become more intelligent?", "Mình nghĩ các trò như xếp hình, cờ vua [[and]] board game giúp trẻ thông minh hơn.||[[That's because]] trẻ phải suy nghĩ [[and]] lên kế hoạch khi chơi. Một số ứng dụng giáo dục [[also]] có ích.||[[For example]], cháu mình chơi cờ vua với bố mỗi tối, [[and]] bây giờ bé suy nghĩ cẩn thận hơn. [[But]] chơi game điện tử quá nhiều thì không tốt.||[[So]] theo mình, các trò cần suy nghĩ là tốt nhất, nhất là khi bố mẹ chơi cùng.", "I think puzzles, chess [[and]] board games help children become smarter.||[[That's because]] children need to think [[and]] plan when they play. Some educational apps are [[also]] useful.||[[For example]], my nephew plays chess with his dad every evening, [[and]] now he thinks more carefully. [[But]] too many video games are not good.||[[So]] in my opinion, thinking games are the best, especially when parents play too.", "", "puzzles|board games|chess", ""], ["Do you agree that talking to children is the best way to develop their intelligence?", "Có, mình nghĩ trò chuyện là một trong những cách tốt nhất.||[[That's because]] trẻ học được từ mới [[and]] ý tưởng mới khi nói chuyện. Đọc sách cùng nhau [[also]] giúp rất nhiều.||[[For example]], [[when]] bố mẹ hỏi con 'Tại sao?', trẻ phải suy nghĩ [[and]] giải thích, [[so]] các bé tự tin hơn.||[[So]] có, mình nghĩ trò chuyện với trẻ rất quan trọng cho trí thông minh của các bé.", "Yes, I think talking is one of the best ways.||[[That's because]] children learn new words [[and]] ideas when they talk. Reading books together [[also]] helps a lot.||[[For example]], [[when]] parents ask 'Why?', children have to think [[and]] explain, [[so]] they become more confident.||[[So]] yes, I think talking with children is very important for their intelligence.", "", "new words|reading together", ""], ["Does spending lots of time on computers make children less intelligent?", "Không hẳn, mình nghĩ điều đó phụ thuộc vào cách trẻ dùng máy tính.||[[That's because]] trẻ có thể học được nhiều thứ online. [[But]] chơi game quá nhiều thì không tốt cho sự tập trung.||[[For example]], cháu mình xem YouTube cả ngày, [[and]] bé thấy khó ngồi yên làm bài tập về nhà.||[[So]] theo mình, bố mẹ nên giới hạn thời gian dùng màn hình khoảng một tiếng mỗi ngày.", "No, not always. It depends on how children use computers.||[[That's because]] children can learn a lot online. [[But]] too much gaming is bad for their focus.||[[For example]], my nephew watches YouTube all day, [[and]] he finds it hard to sit still [[and]] do his homework.||[[So]] in my opinion, parents should limit screen time to about one hour a day.", "", "learn online|focus", ""], ["Who plays a more important role in a child’s development, teachers or parents?", "Mình nghĩ bố mẹ đóng vai trò quan trọng hơn.||[[That's because]] trẻ dành nhiều thời gian ở nhà hơn ở trường. Bố mẹ [[also]] dạy con giá trị sống [[and]] thói quen tốt.||[[For example]], bố mẹ mình dạy mình nấu ăn [[and]] giúp việc nhà. [[However]], giáo viên [[also]] quan trọng [[because]] họ dạy kiến thức [[and]] kỹ năng xã hội.||[[So]] theo mình, bố mẹ quan trọng hơn, [[but]] cả hai cần phối hợp với nhau.", "I think parents play a more important role.||[[That's because]] children spend more time at home than at school. Parents [[also]] teach values [[and]] good habits.||[[For example]], my parents taught me to cook [[and]] help at home. [[However]], teachers are [[also]] important [[because]] they teach knowledge [[and]] social skills.||[[So]] in my opinion, parents matter more, [[but]] both need to work together.", "", "values|habits", ""], ["What is the difference between the role of a teacher and a parent in the education of children?", "Mình nghĩ giáo viên chủ yếu dạy kiến thức, [[while]] bố mẹ dạy con cách cư xử.||[[That's because]] trường học tập trung vào các môn học. Bố mẹ [[also]] cho con tình yêu thương [[and]] sự ủng hộ.||[[For example]], giáo viên dạy trẻ giải bài toán, [[while]] bố mẹ dạy con nói cảm ơn [[and]] xin lỗi.||[[So]] theo mình, vai trò của bố mẹ kéo dài cả đời.", "I think teachers mainly teach knowledge, [[while]] parents teach behaviour.||[[That's because]] schools focus on subjects. Parents [[also]] give children love [[and]] support.||[[For example]], a teacher teaches a child to solve maths problems, [[while]] parents teach them to say thank you [[and]] sorry.||[[So]] in my opinion, a parent's role lasts for life.", "", "knowledge|behave|support", ""]]}, {"name": "Đề 50 · Happiness", "rows": [["How can companies improve employees’ happiness?", "Mình nghĩ công ty có thể cho nhân viên lương công bằng [[and]] giờ làm linh hoạt.||[[That's because]] [[when]] nhân viên vui, họ làm việc tốt hơn [[and]] không nghỉ việc. Công ty [[also]] nên khen thưởng khi nhân viên làm tốt.||[[For example]], công ty mình cho làm việc ở nhà vào thứ Sáu [[and]] tổ chức du lịch Đà Lạt mỗi năm, [[so]] mọi người đều vui hơn.||[[So]] theo mình, sự linh hoạt [[and]] các hoạt động tập thể làm nhân viên hạnh phúc hơn.", "I think companies can give fair salaries [[and]] flexible hours.||[[That's because]] [[when]] employees are happy, they work better [[and]] don't quit. Companies should [[also]] reward good work.||[[For example]], my company lets us work from home on Fridays [[and]] has a trip to Đà Lạt every year, [[so]] everyone feels happier.||[[So]] in my opinion, flexibility [[and]] team activities make employees happier.", "", "working environment|flexible hours|work from home", ""], ["Which do you think is more important in the workplace, happiness or high salaries?", "Với mình, hạnh phúc ở nơi làm việc quan trọng hơn.||[[That's because]] [[if]] mình không vui, mình không thể làm việc tốt. [[However]], lương vẫn quan trọng để trả các hóa đơn.||[[For example]], nhiều bạn của mình nghỉ những công việc lương cao [[because]] sếp quá khó tính.||[[So]] theo mình, một nơi làm việc vui vẻ quan trọng không kém tiền lương.", "For me, happiness is more important.||[[That's because]] [[if]] I'm unhappy, I can't work well. [[However]], salary is still important to pay the bills.||[[For example]], many of my friends quit well-paid jobs [[because]] their bosses were too difficult.||[[So]] in my opinion, a happy workplace is as important as a high salary.", "", "be happy at work|pay the bills", ""], ["Some people say that living in a happy city is boring. What do you think?", "Không, mình không đồng ý rằng một thành phố hạnh phúc là nhàm chán.||[[That's because]] thành phố yên bình cho người ta thời gian dành cho gia đình [[and]] sở thích. Ở đó [[also]] vẫn có nhiều việc để làm.||[[For example]], Đà Lạt rất yên tĩnh, [[but]] mình có thể đi bộ, chạy bộ [[and]] ăn những món ngon ở đó.||[[So]] theo mình, một thành phố hạnh phúc không cần quá sôi động, chỉ cần an toàn [[and]] dễ sống.", "No, I don't agree that a happy city is boring.||[[That's because]] a peaceful city gives people time for family [[and]] hobbies. There are [[also]] still many things to do.||[[For example]], Đà Lạt is very calm, [[but]] I can walk, run [[and]] eat great food there.||[[So]] in my opinion, a happy city doesn't need to be exciting; it just needs to be safe [[and]] easy to live in.", "", "peaceful|safe|things to do", ""], ["Do you think everyone shares a similar definition of happiness?", "Không, mình không nghĩ mọi người đều có cùng định nghĩa về hạnh phúc.||[[That's because]] nó phụ thuộc vào tuổi tác [[and]] tính cách. Người trẻ muốn thành công, [[while]] người lớn tuổi muốn sức khỏe [[and]] gia đình.||[[For example]], với mình bây giờ, hạnh phúc là một công việc tốt [[and]] được đi du lịch. [[But]] với bố mẹ mình, hạnh phúc là con cái khỏe mạnh [[and]] hay về thăm.||[[So]] theo mình, mỗi người có một định nghĩa hạnh phúc riêng.", "No, I don't think so.||[[That's because]] it depends on age [[and]] personality. Young people want success, [[while]] older people want health [[and]] family.||[[For example]], for me now, happiness means a good job [[and]] travelling. [[But]] for my parents, it means healthy children who visit them often.||[[So]] in my opinion, everyone has their own idea of happiness.", "", "depend on|success|health and family", ""]]}, {"name": "Đề 56 · Planning", "rows": [["What types of plans do people often make with friends and family?", "Mình nghĩ người ta thường lên kế hoạch cho các chuyến đi, tiệc sinh nhật [[and]] bữa ăn cuối tuần.||[[That's because]] lên kế hoạch trước giúp mọi người sắp xếp thời gian [[and]] tiết kiệm tiền.||[[For example]], nhóm bạn mình thường lên kế hoạch đi Vũng Tàu vào dịp lễ, [[and]] gia đình mình hay hẹn ăn cơm cùng nhau ở Bến Tre.||[[So]] theo mình, chuyến đi [[and]] bữa ăn gia đình là những kế hoạch phổ biến nhất.", "I think people often plan trips, birthday parties [[and]] weekend meals.||[[That's because]] planning ahead helps everyone arrange their time [[and]] save money.||[[For example]], my friends usually plan a trip to Vũng Tàu on public holidays, [[and]] my family often plans meals together in Bến Tre.||[[So]] in my opinion, trips [[and]] family meals are the most common plans.", "", "trips|birthday parties", ""], ["Is it important for people to plan special events, such as weddings?", "Có, mình nghĩ lên kế hoạch cho những sự kiện như đám cưới rất quan trọng.||[[That's because]] có rất nhiều khách [[and]] tốn nhiều tiền. Nếu không có kế hoạch, mọi thứ dễ bị sai.||[[For example]], một đám cưới cần nhà hàng, thiệp mời [[and]] váy cưới, [[and]] người ta thường đặt trước vài tháng.||[[So]] có, một kế hoạch tốt giúp cô dâu chú rể bớt căng thẳng trong ngày trọng đại.", "Yes, I think it's very important to plan events like weddings.||[[That's because]] there are many guests [[and]] it costs a lot of money. Without a plan, things can easily go wrong.||[[For example]], a wedding needs a restaurant, invitations [[and]] a dress, [[and]] people book them months before.||[[So]] yes, a good plan helps the couple feel less stressed on the big day.", "", "guests|go wrong", ""], ["Why don't some people like to plan their social life in advance?", "Mình nghĩ một số người không thích lên kế hoạch [[because]] họ thích sự tự nhiên.||[[That's because]] lịch của họ thay đổi nhiều. Với một số người, lên kế hoạch cho thời gian rảnh giống như đi làm.||[[For example]], mình thích những buổi hẹn bất ngờ với bạn bè, [[because]] chúng thường rất vui.||[[So]] theo mình, sự tự nhiên thì vui, [[but]] những việc quan trọng vẫn cần kế hoạch.", "I think some people don't plan [[because]] they like to be spontaneous.||[[That's because]] their schedule changes a lot. For some people, planning free time feels like work.||[[For example]], I like last-minute coffee with my friends, [[because]] it's often very fun.||[[So]] in my opinion, being spontaneous is fun, [[but]] important things still need a plan.", "", "spontaneous|schedule changes", ""], ["What are the advantages for young people of planning their future careers?", "Mình nghĩ lập kế hoạch nghề nghiệp giúp người trẻ biết nên học gì [[and]] không lãng phí thời gian.||[[That's because]] khi có mục tiêu rõ ràng, họ bớt căng thẳng về tương lai. Họ [[also]] có thể chuẩn bị sớm.||[[For example]], [[
