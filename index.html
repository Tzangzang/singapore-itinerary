s with their family. They often have a party or a big meal together to celebrate. [[For example]], when someone in my family passes an important exam, we usually go to a restaurant together and give them small gifts. I think we like to share happiness [[because]] it makes the moment more special.", "", "share good news|have a big meal", ""], ["How do people spend their leisure time in your country?", "Nhiều người đi cà phê với bạn bè sau giờ làm. Một số người chỉ ở nhà xem TV hoặc lướt điện thoại. [[At weekends]], các gia đình hay đi thăm họ hàng hoặc đi mua sắm cùng nhau. Ở thành phố lớn, đi xem phim hay đi TTTM cũng rất phổ biến. Cá nhân mình thường hẹn bạn cà phê vào thứ Bảy, [[because]] vừa rẻ vừa thư giãn.", "Many people go to cafés with their friends after work. Some people just watch TV or scroll on their phones at home. [[At weekends]], families often visit their relatives or go shopping together. In big cities, going to the cinema or a shopping mall is also very popular. Personally, I usually meet my friends for coffee on Saturday, [[because]] it's cheap and relaxing.", "", "go to cafés|scroll on phones|visit relatives", ""], ["How does technology affect the way people spend their leisure time?", "Bây giờ mọi người dành nhiều thời gian cho điện thoại hơn. Họ ở nhà xem video [[instead of]] ra ngoài. [[However]], công nghệ cũng giúp mọi người tìm sở thích mới, ví dụ học nấu ăn trên YouTube. [[In the past]], mọi người [[used to]] dành thời gian rảnh nói chuyện với hàng xóm hoặc chơi thể thao ngoài trời. [[So]] mình nghĩ công nghệ có ích, [[but]] thỉnh thoảng chúng ta nên bỏ điện thoại xuống.", "Nowadays, people spend much more time on their phones. They watch videos at home [[instead of]] going out. [[However]], technology also helps people find new hobbies, like learning to cook on YouTube. [[In the past]], people [[used to]] spend their free time talking with neighbours or playing sports outside. [[So]] I think technology is useful, [[but]] we should put our phones down sometimes.", "", "spend time on phones|go out|new hobbies", ""], ["Do you think only old people have time for leisure?", "Không, mình không nghĩ vậy. Người trẻ cũng có thời gian rảnh, nhất là vào cuối tuần. [[But]] đúng là người lớn tuổi rảnh hơn, [[because]] đa số họ đã nghỉ hưu. [[For example]], nhiều dân văn phòng đi gym hoặc chơi cầu lông sau giờ làm. Thời gian giải trí quan trọng với tất cả mọi người, [[because]] nó giúp giảm căng thẳng.", "No, I don't think so. Young people also have free time, especially at weekends. [[But]] it's true that older people have more free time, [[because]] most of them are retired. [[For example]], many office workers go to the gym or play badminton after work. Leisure time is important for everyone, [[because]] it helps people reduce stress.", "", "free time|retired", ""]]}, {"name": "Đề 29 · Homes", "rows": [["What makes a home comfortable to live in?", "Mình nghĩ một ngôi nhà thoải mái cần đủ rộng và có ánh sáng tự nhiên. Có hàng xóm yên tĩnh cũng quan trọng. [[But]] quan trọng nhất là có gia đình ở đó. [[For example]], căn hộ của mình không rộng lắm, [[but]] có cửa sổ lớn nên lúc nào cũng sáng và thoáng. [[When]] đi làm về và ăn tối với gia đình, mình thấy rất thư giãn.", "I think a comfortable home needs enough space and natural light. It's also important to have quiet neighbours. [[But]] most importantly, a home is comfortable [[because]] your family is there. [[For example]], my apartment is not very big, [[but]] it has a big window, so it always feels bright and fresh. [[When]] I come home after work and have dinner with my family, I feel really relaxed.", "", "space|light|quiet", ""], ["Do people's housing preferences change as they get older?", "Có, mình nghĩ vậy. Người trẻ thường muốn ở gần trung tâm, [[because]] gần chỗ làm và chỗ vui chơi. [[However]], người lớn tuổi thích nơi yên tĩnh có một khu vườn nhỏ. [[Also]], khi có con, mọi người muốn ở gần trường tốt. [[For example]], ông bà mình về quê sau khi nghỉ hưu, [[because]] ông bà muốn một cuộc sống yên bình.", "Yes, I think so. Young people usually want to live near the city centre, [[because]] it's close to work and entertainment. [[However]], older people prefer quiet places with a small garden. [[Also]], when people have children, they want a home near good schools. [[For example]], my grandparents moved back to their hometown after they retired, [[because]] they wanted a peaceful life.", "", "city centre|quiet|garden", ""], ["Is it better to live in a house or an apartment? Why?", "Với mình, chung cư tốt hơn. Chung cư an toàn hơn, và nhiều tòa có phòng gym, hồ bơi. [[But]] nhà riêng hợp với gia đình đông người hơn, [[because]] rộng rãi hơn. Ở TP.HCM, nhà riêng rất đắt, [[so]] đa số bạn trẻ chọn chung cư. [[In the future]], [[if]] có con, mình [[might]] mua một căn nhà nhỏ có vườn.", "For me, an apartment is better. It's safer, and many apartment buildings have a gym and a swimming pool. [[But]] a house is better for a big family, [[because]] it has more space. In Ho Chi Minh City, houses are very expensive, [[so]] most young people choose apartments. [[In the future]], [[if]] I have children, I [[might]] buy a small house with a garden.", "", "safer|gym and pool|more space", ""]]}, {"name": "Đề 36 · Crowds & cities", "rows": [["What are some common places where large crowds gather in your country?", "Trung tâm thương mại thường rất đông, nhất là cuối tuần. Chợ và bến xe cũng đông. [[During]] các dịp lễ, những điểm du lịch như Đà Nẵng hay Đà Lạt chật kín người. [[For example]], đêm Giao thừa, hàng nghìn người ra phố đi bộ Nguyễn Huệ xem pháo hoa. Rất vui, [[but]] rất khó di chuyển và tìm chỗ gửi xe.", "Shopping malls are often very crowded, especially at weekends. Markets and bus stations are also busy. [[During]] public holidays, tourist places like Đà Nẵng or Đà Lạt are full of people. [[For example]], on New Year's Eve, thousands of people go to Nguyễn Huệ Walking Street to watch the fireworks. It's exciting, [[but]] it's very hard to move and find a parking space.", "", "shopping malls|bus stations|holidays", ""], ["Why do so many people move to big cities?", "Chủ yếu [[because]] ở thành phố lớn có nhiều việc làm và lương cao hơn. Thành phố lớn [[also]] có trường học, đại học tốt hơn. [[So]] người trẻ nghĩ ở đó có nhiều cơ hội hơn. Ở nông thôn, lương thấp và không có nhiều nhà máy, văn phòng. [[However]], cuộc sống ở thành phố lớn đắt đỏ và căng thẳng, [[so]] một số người sau này lại về quê.", "Mainly [[because]] there are more jobs and higher salaries in big cities. Big cities [[also]] have better schools and universities. [[So]] young people think they have more opportunities there. In the countryside, salaries are low, and there aren't many factories or offices. [[However]], life in big cities is expensive and stressful, [[so]] some people move back home later.", "", "jobs|education|opportunities", ""], ["Why do some people enjoy being in crowded or lively places?", "Một số người thích không khí sôi động. [[When]] ở giữa đám đông, họ không thấy cô đơn. [[Also]], lúc nào cũng có nhiều thứ thú vị để xem và làm. [[For example]], bạn bè mình rất thích đi chợ đêm hoặc lễ hội âm nhạc, [[because]] ở đó họ thấy tràn đầy năng lượng. Cá nhân mình thỉnh thoảng cũng thích, [[but]] mình mau mệt.", "Some people enjoy the lively atmosphere. [[When]] they're in a crowd, they don't feel lonely. [[Also]], there are always many interesting things to see and do. [[For example]], my friends love going to night markets or music festivals, [[because]] they feel full of energy there. Personally, I enjoy it sometimes, [[but]] I get tired quickly.", "", "lively|lonely", ""], ["Do modern cities have fewer green spaces than in the past? Why might this be the case?", "Có, mình nghĩ vậy. Ngày càng nhiều người lên thành phố, [[so]] cần nhiều nhà ở hơn. [[As a result]], nhiều đất được dùng để xây nhà, làm đường thay vì làm công viên. [[For example]], một số công viên cũ ở thành phố mình đã thành TTTM hoặc chung cư. Đây là vấn đề, [[because]] mọi người, nhất là trẻ em, cần không gian xanh để vui chơi và thư giãn.", "Yes, I think so. More and more people move to cities, [[so]] they need more homes. [[As a result]], a lot of land is used for buildings and roads instead of parks. [[For example]], some old parks in my city became shopping malls or apartment buildings. This is a problem, [[because]] people, especially children, need green spaces to play and relax.", "", "buildings and roads|need homes", ""], ["What can be done to improve the situation of overcrowding and lack of greenery in cities?", "Mình nghĩ chính phủ nên xây thêm công viên và trồng cây trên mọi con đường. Họ [[could also]] dời một số nhà máy và trường đại học ra khỏi trung tâm. [[That way]], trung tâm sẽ bớt đông đúc. [[In addition]], công ty có thể cho nhân viên làm ở nhà vài ngày một tuần, [[so]] đường phố bớt đông. [[If]] làm được những việc này, thành phố [[will]] sạch hơn và dễ sống hơn.", "I think the government should build more parks and plant trees on every street. They [[could also]] move some factories and universities out of the city centre. [[That way]], the centre will be less crowded. [[In addition]], companies can let people work from home a few days a week, [[so]] there are fewer people on the roads. [[If]] we do these things, cities [[will]] be cleaner and more pleasant to live in.", "", "parks|move out|plant trees", ""]]}, {"name": "Đề 37 · City & countryside", "rows": [["What is the difference between living in the countryside and the city?", "Thành phố nhộn nhịp và tiện lợi, cần gì cũng có ở gần. [[In contrast]], nông thôn yên tĩnh và không khí trong lành. [[However]], ở nông thôn ít việc làm hơn. [[For example]], ở TP.HCM mình có thể đặt đồ ăn hay gọi Grab bất cứ lúc nào. [[But]] khi về thăm ông bà ở Bến Tre, mình ngủ rất ngon [[because]] ở đó rất yên tĩnh.", "The city is busy and convenient, and you can find everything you need nearby. [[In contrast]], the countryside is quiet, and the air is fresh. [[However]], there are fewer jobs in the countryside. [[For example]], in Ho Chi Minh City, I can order food or take a Grab at any time. [[But]] when I visit my grandparents in Bến Tre, I sleep really well [[because]] it's so quiet.", "", "convenient|fresh air|fewer jobs", ""], ["Do you prefer to live in the city or in the countryside?", "Hiện tại mình thích thành phố hơn, [[because]] công việc của mình ở đó và mọi thứ đều tiện. [[But]] khi về già, mình muốn sống ở quê, [[because]] ở đó yên bình. Ở thành phố, mình [[also]] được gặp nhiều người và học nhiều điều mới cho công việc. [[However]], mình không thích kẹt xe và ô nhiễm, [[so]] cuối tuần mình hay về quê để thư giãn.", "For now, I prefer the city, [[because]] my job is there and everything is convenient. [[But]] when I'm older, I'd like to live in the countryside, [[because]] it's peaceful. In the city, I can [[also]] meet many people and learn new things for my career. [[However]], I don't like the traffic and the pollution, [[so]] I often go to the countryside at weekends to relax.", "", "convenient|when I'm old", ""], ["Is it good for elderly people to live in large cities?", "Có cả mặt tốt và mặt không tốt. [[On the one hand]], có bệnh viện tốt, và con cái thường sống gần. [[On the other hand]], tiếng ồn và ô nhiễm không tốt cho sức khỏe của họ. [[For example]], ông bà mình từng lên TP.HCM ở một tháng, [[and]] ông bà thấy mệt vì tiếng ồn. [[So]] mình nghĩ một khu yên tĩnh trong thành phố, gần công viên, là lựa chọn tốt nhất cho người già.", "It has good and bad points. [[On the one hand]], there are good hospitals, and their children often live nearby. [[On the other hand]], the noise and pollution are not good for their health. [[For example]], my grandparents once stayed with us in Ho Chi Minh City for a month, [[and]] they felt tired because of the noise. [[So]] I think a quiet area in a city, near a park, is the best choice for older people.", "", "hospitals|pollution|noise", ""], ["Is it possible that all of the population will move to cities?", "Mình không nghĩ vậy. Chúng ta vẫn cần nông dân trồng lương thực, [[so]] phải có người ở lại nông thôn. [[Also]], nhiều người đơn giản là thích cuộc sống yên tĩnh ở đó. [[In addition]], công nghệ giờ cho phép làm việc từ xa, [[so]] một số bạn trẻ còn chuyển về quê. [[So]] mình tin thành phố sẽ tiếp tục phát triển, [[but]] nông thôn sẽ không bao giờ trống vắng.", "I don't think so. We still need farmers to grow food, [[so]] some people must stay in the countryside. [[Also]], many people simply love the quiet life there. [[In addition]], technology now lets people work from home, [[so]] some young people even move back to their hometown. [[So]] I believe cities [[will]] keep growing, [[but]] the countryside [[will]] never be empty.", "", "grow food|quiet life", ""]]}, {"name": "Đề 38 · Shopping", "rows": [["Do people in your country go to the shopping mall frequently?", "Có, khá thường xuyên, chủ yếu vào cuối tuần. Mọi người đến đó để ăn uống, xem phim và mua sắm. [[Also]], TTTM có máy lạnh, [[so]] là nơi dễ chịu khi trời nóng. [[For example]], gia đình mình thường đi Vincom vào Chủ nhật để ăn trưa và đi dạo. [[However]], nhiều người đến đó chỉ để thư giãn chứ không mua gì, [[because]] đồ khá đắt.", "Yes, quite often, mostly at weekends. People go there to eat, watch films and shop. [[Also]], malls are air-conditioned, [[so]] they're a nice place to go when it's hot. [[For example]], my family usually goes to Vincom on Sunday to have lunch and walk around. [[However]], many people go there just to relax, not to buy things, [[because]] everything is quite expensive.", "", "at weekends|air-conditioned", ""], ["How have people’s shopping habits changed in recent decades?", "[[In the past]], mọi người [[used to]] đi chợ mỗi ngày. [[But]] bây giờ nhiều người mua online, trên các app như Shopee hay TikTok Shop. Vừa nhanh, vừa dễ so sánh giá. Một thay đổi nữa là thanh toán không tiền mặt. Giờ đa số mọi người quét mã QR, [[so]] mua sắm nhanh hơn nhiều. Mình nghĩ mua online tiện, [[but]] đôi khi chất lượng không giống trong ảnh.", "[[In the past]], people [[used to]] go to local markets every day. [[But]] now, many people shop online, on apps like Shopee or TikTok Shop. It's faster, and they can compare prices easily. Another change is cashless payment. Most people pay by QR code now, [[so]] shopping is much faster. I think online shopping is convenient, [[but]] sometimes the quality is not as good as in the photos.", "", "shop online|Shopee", ""], ["Do you think shops and shopping malls will disappear in the future?", "Mình không nghĩ vậy. Mọi người vẫn muốn xem và sờ sản phẩm trước khi mua. [[Also]], TTTM không chỉ để mua sắm mà còn là nơi gặp bạn bè và vui chơi. [[However]], mình nghĩ một số cửa hàng nhỏ [[will]] đóng cửa [[because]] không cạnh tranh được với giá online. [[So]] trong tương lai, cửa hàng cần mang lại trải nghiệm tốt hơn, ví dụ quán cà phê bên trong nhà sách.", "I don't think so. People still want to see and touch products before they buy them. [[Also]], malls are not only for shopping. They're places to meet friends and have fun. [[However]], I think some small shops [[will]] close [[because]] they can't compete with online prices. [[So]] in the future, shops [[will]] need to offer a better experience, like a café inside a bookstore.", "", "see and touch|have fun", ""], ["What are the differences between shopping in street markets and big shopping malls?", "Chợ thì rẻ hơn và có thể mặc cả với người bán, [[while]] TTTM thì sạch sẽ, thoải mái và có máy lạnh. [[However]], đồ trong TTTM thường đắt hơn. [[For example]], ở chợ Bến Thành, bạn có thể mua quà lưu niệm rẻ nếu biết mặc cả. [[But]] nếu muốn chất lượng tốt và giá cố định, TTTM là lựa chọn tốt hơn.", "Street markets are cheaper, and you can bargain with the sellers, [[while]] shopping malls are clean, comfortable and air-conditioned. [[However]], things in malls are usually more expensive. [[For example]], at Bến Thành Market, you can buy souvenirs cheaply if you're good at bargaining. [[But]] if you want good quality and fixed prices, a mall is a better choice.", "", "bargain|comfortable|expensive", ""]]}, {"name": "Đề 47 · Animals", "rows": [["Do you think people are more interested in animals now than they were in the past?", "Có, mình nghĩ vậy. Bây giờ nhiều người nuôi thú cưng như chó, mèo và coi chúng như thành viên gia đình. [[Also]], video động vật rất phổ biến trên mạng xã hội. Bây giờ mọi người [[also]] quan tâm đến quyền của động vật hơn. [[For example]], nhiều bạn trẻ nhận nuôi chó mèo bị bỏ rơi [[instead of]] mua. [[In the past]], mọi người [[used to]] nuôi chó chủ yếu để giữ nhà.", "Yes, I think so. Nowadays, many people keep pets, like dogs and cats, and treat them like family members. [[Also]], animal videos are very popular on social media. People [[also]] care more about animal rights now. [[For example]], many young people adopt stray dogs and cats [[instead of]] buying them. [[In the past]], people [[used to]] keep dogs mainly to protect the house.", "", "keep pets|animal videos", ""], ["Is there any difference between the way animals were used for work in the past and nowadays?", "Có, khác nhiều. [[In the past]], nông dân [[used to]] dùng trâu để cày ruộng. [[But]] bây giờ máy móc làm việc đó. Giờ động vật chủ yếu là thú cưng hoặc phục vụ du lịch. Ngựa và bò [[also]] từng dùng để chở hàng, [[but]] giờ có xe tải. [[However]], ở một số vùng núi như Hà Giang, người dân vẫn dùng ngựa để chở ngô.", "Yes, a big difference. [[In the past]], farmers [[used to]] use buffaloes to work in the rice fields. [[But]] now, machines do this work. Today, animals are mostly pets or are used for tourism. Horses and cows [[used to]] carry goods too, [[but]] now we have trucks. [[However]], in some mountain areas like Hà Giang, people still use horses to carry corn.", "", "buffaloes|machines|tourism", ""]]}, {"name": "Đề 48 · Tourism", "rows": [["Why do people enjoy traveling?", "Mọi người thích du lịch [[because]] được thư giãn, quên chuyện công việc. Họ [[also]] được thấy nơi mới, thử món mới. [[For me]], du lịch là cách tuyệt vời để dành thời gian cho gia đình. Du lịch [[also]] giúp mọi người hiểu về văn hóa và lối sống khác nhau. [[For example]], khi đi Hà Giang, mình học được nhiều điều về cuộc sống của đồng bào dân tộc thiểu số. [[So]] mình nghĩ du lịch vừa thư giãn vừa bổ ích.", "People enjoy travelling [[because]] they can relax and forget about work. They [[also]] see new places and try new food. [[For me]], travelling is a great way to spend time with my family. Travelling [[also]] helps people learn about different cultures and ways of life. [[For example]], when I went to Hà Giang, I learned a lot about the life of ethnic minority people. [[So]] I think travelling is both relaxing and educational.", "", "relax|new places|new food", ""], ["What makes a place attractive to tourists?", "Một nơi hấp dẫn [[if]] có thiên nhiên đẹp và đồ ăn ngon. Người dân thân thiện cũng quan trọng. [[Also]], khách du lịch thích nơi có giá cả hợp lý. Giao thông thuận tiện cũng quan trọng. [[For example]], Đà Nẵng hấp dẫn [[because]] có biển đẹp, hải sản ngon và sân bay hiện đại. [[If]] một nơi sạch sẽ và an toàn, khách du lịch [[will]] quay lại.", "A place is attractive [[if]] it has beautiful nature and good food. Friendly local people are important too. [[Also]], tourists like places with reasonable prices. Good transport is important too. [[For example]], Đà Nẵng is attractive [[because]] it has beautiful beaches, delicious seafood and a modern airport. [[If]] a place is clean and safe, tourists [[will]] come back again.", "", "nature|friendly|reasonable prices", ""], ["Do people prefer traveling alone or with others? Why?", "Đa số thích đi cùng người khác, [[because]] an toàn hơn và vui hơn. [[But]] một số người thích đi một mình, [[because]] được tự do làm điều mình muốn. [[For example]], mình thường đi với gia đình hoặc bạn thân [[because]] có thể chia tiền và chụp ảnh cho nhau. [[However]], mình nghĩ đi một mình một lần cũng là trải nghiệm hay, [[because]] mình sẽ tự lập hơn.", "Most people prefer to travel with others, [[because]] it's safer and more fun. [[But]] some people like travelling alone, [[because]] they have more freedom to do what they want. [[For example]], I usually travel with my family or close friends [[because]] we can share the costs and take photos for each other. [[However]], I think travelling alone once is a good experience, [[because]] you become more independent.", "", "safer|freedom", ""], ["How has tourism changed in recent years?", "Thay đổi nhiều lắm. Giờ mọi người đặt mọi thứ online và chọn điểm đến theo review trên TikTok. [[Also]], vé máy bay rẻ hơn, [[so]] nhiều người đi du lịch được hơn. [[In the past]], mọi người [[used to]] đi tour của công ty du lịch. Giờ nhiều bạn trẻ tự lên kế hoạch, đi xe máy hoặc bay hãng giá rẻ. Du lịch dễ hơn, [[but]] một số điểm nổi tiếng giờ quá đông.", "It has changed a lot. Now people book everything online, and they choose places from TikTok reviews. [[Also]], flights are cheaper, [[so]] more people can travel. [[In the past]], people [[used to]] go on tours with a travel agency. Now many young people plan their own trips and travel by motorbike or budget airlines. Tourism is easier now, [[but]] some popular places are too crowded.", "", "book online|reviews|cheap flights", ""]]}, {"name": "Đề 54 · Working abroad", "rows": [["Why do people sometimes go to other cities or other countries to travel?", "[[Because]] họ muốn trải nghiệm văn hóa khác. Du lịch [[also]] là cách tốt để nghỉ ngơi khỏi công việc. [[And]] tất nhiên, nhiều bạn trẻ muốn chụp ảnh đẹp. [[For example]], nhiều người Việt đi Thái Lan hoặc Hàn Quốc [[because]] gần và không quá đắt. Đi nước ngoài [[also]] giúp họ luyện tiếng Anh và tự tin hơn.", "[[Because]] they want to experience different cultures. Travelling is [[also]] a good way to have a break from work. [[And]] of course, many young people want to take nice photos. [[For example]], many Vietnamese people go to Thailand or Korea [[because]] it's close and not too expensive. Travelling abroad [[also]] helps them practise English and become more confident.", "", "different cultures|have a break", ""], ["Why do people like travelling?", "[[Because]] du lịch rất thú vị, mình học được nhiều điều mới về thế giới. [[Also]], mình tạo được kỷ niệm đẹp với người đi cùng. Cá nhân mình thích du lịch [[because]] nó cho mình năng lượng. [[After]] một tháng làm việc bận rộn, một chuyến đi ngắn giúp mình thư giãn và quay lại làm việc với nhiều ý tưởng mới.", "[[Because]] it's exciting, and you can learn new things about the world. [[Also]], you make good memories with the people you travel with. Personally, I love travelling [[because]] it gives me energy. [[After]] a busy month at work, a short trip helps me relax and come back to work with new ideas.", "", "exciting|memories", ""], ["What jobs can people do abroad for a short period of time?", "Mọi người có thể làm phục vụ hoặc làm nông trại vài tháng. Một số người đi dạy tiếng Anh ở nước ngoài. Sinh viên [[also]] đi thực tập ở công ty nước ngoài. [[In addition]], một số người làm ở khách sạn hoặc nhà hàng vào mùa du lịch. Những việc này thường ngắn hạn, [[but]] giúp họ kiếm tiền và có thêm kinh nghiệm.", "People can work as waiters or farm workers for a few months. Some people teach English abroad. Students [[also]] do internships at foreign companies. [[In addition]], some people work in hotels or restaurants during the tourist season. These jobs are usually short, [[but]] they help people earn money and gain experience.", "", "internships|teach English", ""], ["Is it good that now people have an opportunity to work abroad?", "Có, mình nghĩ là tốt. Mọi người kiếm được nhiều tiền hơn [[and]] giúp được gia đình. Họ [[also]] học được kỹ năng và ngôn ngữ mới, rất có ích cho sự nghiệp. [[For example]], anh họ mình làm ở Nhật ba năm, [[and]] giờ anh ấy có công việc tốt hơn ở Việt Nam [[because]] biết tiếng Nhật. [[However]], mọi người nên cẩn thận với các lời mời làm việc lừa đảo.", "Yes, I think it's good. People can earn more money [[and]] help their families. They [[also]] learn new skills and a new language, which is useful for their career. [[For example]], my cousin worked in Japan for three years, [[and]] now he has a better job in Vietnam [[because]] he can speak Japanese. [[However]], people should be careful with fake job offers.", "", "earn more|new skills", ""], ["Why might some people not want to work in another country?", "[[Because]] họ nhớ gia đình, bạn bè. Ngôn ngữ [[also]] có thể là trở ngại lớn. [[And]] ở nhiều nước, chi phí sinh hoạt rất cao. [[Also]], rất khó kết bạn mới và làm quen với văn hóa khác. [[For example]], nhiều người thấy cô đơn, nhất là dịp Tết, [[when]] ở Việt Nam ai cũng ở bên gia đình.", "[[Because]] they miss their family and friends. Language can [[also]] be a big problem. [[And]] in many countries, the cost of living is very high. [[Also]], it's hard to make new friends and get used to a different culture. [[For example]], some people feel lonely, especially at Tết, [[when]] everyone in Vietnam is with their family.", "", "miss family|language|cost of living", ""]]}, {"name": "Đề 62 · Buildings", "rows": [["What do you think buildings will be like in the future?", "Mình nghĩ các tòa nhà [[will]] cao hơn và thông minh hơn. Chúng [[will]] dùng năng lượng mặt trời để tiết kiệm điện. [[Also]], sẽ có nhiều tòa nhà xanh có trồng cây. Có thể các tòa nhà [[also]] có hệ thống thông minh tự tắt đèn và máy lạnh. Mình nghĩ điều này cần thiết [[because]] thành phố cần tiết kiệm năng lượng và giảm ô nhiễm.", "I think buildings [[will]] be taller and smarter. They [[will]] use solar energy to save electricity. [[Also]], there [[will]] be more green buildings with trees on them. Maybe buildings [[will]] [[also]] have smart systems [[which]] turn off the lights and air conditioning automatically. I think this is necessary [[because]] cities need to save energy and reduce pollution.", "", "solar energy|smart|green buildings", "", "Câu hỏi về tương lai → I think… will…"], ["Which do most people prefer, living in a bungalow or in a tall building?", "Đa số người Việt thích nhà riêng, [[because]] muốn rộng rãi và có vườn riêng. [[But]] ở thành phố lớn, nhiều bạn trẻ ở chung cư, [[because]] rẻ hơn và an toàn hơn. [[In my opinion]], nhà riêng thoải mái hơn, [[but]] chung cư tiện hơn, [[because]] thường có gym, hồ bơi và bảo vệ. [[So]] còn tùy vào ngân sách và lối sống của mỗi người.", "Most Vietnamese people prefer a house, [[because]] they want more space and their own garden. [[But]] in big cities, many young people live in apartments, [[because]] they're cheaper and safer. [[In my opinion]], a house is more comfortable, [[but]] an apartment is more convenient, [[because]] it usually has a gym, a pool and security guards. [[So]] it really depends on people's budget and lifestyle.", "", "more space|own garden|apartment", ""], ["Why are taller and taller buildings being constructed nowadays?", "[[Because]] thành phố không đủ đất, [[and]] ngày càng nhiều người chuyển đến. Nhà cao tầng chứa được nhiều người. [[Also]], chúng là biểu tượng của thành phố hiện đại. [[For example]], Landmark 81 ở TP.HCM có văn phòng, căn hộ và TTTM trong cùng một tòa nhà. [[However]], quá nhiều nhà cao tầng có thể làm thành phố nóng và đông đúc hơn.", "[[Because]] cities don't have enough land, [[and]] more and more people move there. Tall buildings can hold a lot of people. [[Also]], they are a symbol of a modern city. [[For example]], Landmark 81 in Ho Chi Minh City has offices, apartments and a shopping mall in one building. [[However]], too many tall buildings can make the city hot and crowded.", "", "enough land|move to cities|symbol", ""]]}, {"name": "Đề 66 · Where to live", "rows": [["What kinds of places do older people prefer to live in?", "Người lớn tuổi thường thích nơi yên tĩnh, gần con cái và gần bệnh viện. Nhiều người [[also]] muốn ở lại quê, [[because]] bạn bè họ ở đó. [[For example]], bà mình không muốn lên thành phố, [[because]] bà yêu khu vườn và hàng xóm của bà. Người lớn tuổi [[also]] muốn không khí trong lành và nhịp sống chậm.", "Older people usually prefer quiet places [[which]] are near their children and near hospitals. Many of them [[also]] want to stay in their hometown, [[because]] their friends are there. [[For example]], my grandmother doesn't want to move to the city, [[because]] she loves her garden and her neighbours. Older people [[also]] want clean air and a slow life.", "", "quiet|near hospitals|hometown", ""], ["What are the advantages of living close to the workplace?", "[[First]], tiết kiệm thời gian và tiền đi lại. [[Second]], bớt căng thẳng, [[because]] không bị kẹt xe. [[As a result]], có nhiều thời gian hơn cho gia đình và tập thể dục. [[For example]], nhà mình cách công ty khoảng 30 phút, [[so]] mỗi ngày mình mất một tiếng trên đường. [[If]] ở gần hơn, mình [[would]] có thêm thời gian để ngủ và học tiếng Anh.", "[[First]], you save time and money on travelling. [[Second]], you feel less stressed, [[because]] you don't get stuck in traffic jams. [[As a result]], you have more time for your family and exercise. [[For example]], I live about 30 minutes from my office, [[so]] I spend one hour on the road every day. [[If]] I lived closer, I [[would]] have more time to sleep and study English.", "", "save time|traffic jams|more time", ""], ["Why do many people move to the city?", "Chủ yếu [[because]] có việc làm tốt hơn, lương cao hơn. Thành phố [[also]] có trường học và bệnh viện tốt hơn. [[And]] người trẻ thích các hoạt động giải trí ở đó. [[However]], thành phố lớn có nhiều vấn đề như kẹt xe, ô nhiễm và tiền thuê nhà cao. [[So]] nhiều người lên thành phố [[because]] cơ hội, [[but]] họ cũng gặp rất nhiều áp lực.", "Mainly [[because]] there are better jobs and higher salaries. Cities [[also]] have better schools and hospitals. [[And]] young people like the entertainment there. [[However]], big cities have problems like traffic jams, pollution and high rent. [[So]] many people move there [[because]] of the opportunities, [[but]] they also face a lot of stress.", "", "better jobs|better schools|entertainment", ""], ["Where do people like to live in your country?", "Đa số thích sống ở thành phố lớn như Hà Nội, TP.HCM, [[because]] nhiều việc làm hơn. Gần đây, thành phố biển như Đà Nẵng cũng ngày càng được chuộng. Một số người thích sống gần biển [[because]] không khí trong lành và cuộc sống ít áp lực. [[In my opinion]], trong tương lai nhiều người [[will]] sống ở các thành phố vừa [[because]] họ có thể làm việc online.", "Most people like to live in big cities like Hà Nội and Ho Chi Minh City, [[because]] there are more jobs. Recently, coastal cities like Đà Nẵng are becoming popular too. Some people prefer living near the beach [[because]] the air is fresh and life is less stressful. [[In my opinion]], more people [[will]] live in medium-sized cities in the future [[because]] they can work online.", "", "big cities|coastal cities|popular", ""]]}]}, "p3_3": {"name": "Đồ vật & Media", "topics": [{"name": "Đề 2 · Online learning", "rows": [["Do you think online learning will replace face-to-face learning?", "Mình không nghĩ vậy. Học sinh cần giáo viên để có động lực, nhất là trẻ nhỏ. [[But]] học online là một lựa chọn bổ sung rất tốt. [[For example]], [[during]] mùa dịch, mình học online suốt mấy tháng và thấy rất khó tập trung. Học ở lớp, mình có thể hỏi giáo viên ngay và luyện tập với bạn bè.", "I don't think so. Students need teachers to motivate them, especially young children. [[But]] online learning is a very good extra option. [[For example]], [[during]] the pandemic, I studied online for months, and it was hard to concentrate. In a real class, you can ask the teacher right away and practise with classmates.", "", "motivate|extra option", ""], ["What are the advantages of online learning?", "[[First]], thời gian linh hoạt. [[Second]], học online thường rẻ hơn. [[And]] mình có thể học ở bất cứ đâu, chỉ cần có internet. [[For example]], mình vừa đi làm vừa học thạc sĩ, [[so]] học online giúp mình xem lại bài giảng vào buổi tối. [[However]], học online cần tính tự giác rất cao.", "[[First]], the time is flexible. [[Second]], it's usually cheaper. [[And]] you can learn from anywhere, as long as you have the internet. [[For example]], I work and study for a master's degree at the same time, [[so]] online learning lets me watch lectures in the evening. [[However]], you need a lot of self-discipline.", "", "flexible|cheaper|anywhere", ""], ["Why are so many young people obsessed with short videos?", "[[Because]] video ngắn thì vui và không tốn nhiều thời gian. App [[also]] luôn đưa ra video mới. [[So]] rất dễ thư giãn mà không cần suy nghĩ. Người trẻ [[also]] bị áp lực phải cập nhật xu hướng, [[so]] họ xem video ngắn để không bị lạc hậu. [[But]] mình nghĩ video ngắn khiến khả năng tập trung kém đi.", "[[Because]] the videos are short and funny. The app [[also]] always shows new videos. [[So]] it's easy to relax without thinking. Young people [[also]] feel pressure to follow trends, [[so]] they watch short videos to stay updated. [[But]] I think short videos make it harder for us to focus.", "", "short and funny|relax", ""], ["Do you think people spend too much time watching short videos? Why?", "Có, mình nghĩ vậy. Nhiều người quên mất thời gian khi lướt video. [[For example]], mình đôi khi xem TikTok cả tiếng, [[but]] giờ mình đang cố giảm. Xem quá nhiều làm mọi người ngủ muộn và lãng phí thời gian lẽ ra dùng để đọc sách hay tập thể dục. [[So]] mình nghĩ mỗi người nên tự đặt giới hạn, ví dụ 30 phút mỗi ngày.", "Yes, I think so. Many people lose track of time. [[For example]], I sometimes watch TikTok for an hour, [[but]] now I'm trying to cut down. Watching too much makes people sleep late and waste time [[which]] they could use for reading or exercising. [[So]] I think everyone should set a limit, like 30 minutes a day.", "", "lose track of time", ""]]}, {"name": "Đề 3 · Old things", "rows": [["What kind of old things do people like to keep?", "Mọi người thường giữ ảnh, thư và quà cũ từ gia đình. [[For example]], nhà mình giữ chiếc radio của ông hơn 40 năm. Người lớn tuổi [[also]] hay giữ đồ dùng cũ như bát đĩa, [[because]] họ không muốn lãng phí. Mỗi món đồ cũ thường gắn với một câu chuyện của gia đình.", "People usually keep photos, letters and old gifts from their family. [[For example]], my family still keeps my grandfather's radio, which is more than 40 years old. Older people [[also]] keep old things like bowls and plates, [[because]] they don't want to waste anything. Each old thing usually has a family story.", "", "photos|letters|gifts", ""], ["Why do people keep old things?", "[[Because]] đồ cũ chứa kỷ niệm và nhắc nhớ về người thân. [[Also]], một số đồ cũ có thể trở nên có giá trị. [[For example]], mình giữ những lá thư bạn bè viết cho mình hồi cấp ba. Mỗi lần đọc lại, mình nhớ lại những ngày đi học rất vui.", "[[Because]] old things have memories, and they remind people of their family members. [[Also]], some old things become valuable. [[For example]], I keep letters [[which]] my friends wrote to me in high school. Every time I read them, I remember my happy school days.", "", "memories|remind|valuable", ""], ["What are the differences between the things old people keep and those young people keep?", "Người lớn tuổi giữ ảnh và đồ gỗ, [[while]] người trẻ giữ đồ công nghệ và quà của bạn bè. Người trẻ [[also]] lưu rất nhiều thứ trong điện thoại. [[For example]], ông mình giữ cả thùng ảnh đen trắng, [[while]] mình lưu hàng nghìn ảnh trên Google Photos. Mình nghĩ người già quý đồ vật thật hơn, [[because]] họ có thể cầm và nhìn thấy.", "Old people keep photos and furniture, [[while]] young people keep gadgets and gifts from friends. Young people [[also]] keep a lot of things on their phones. [[For example]], my grandfather keeps a box of black-and-white photos, [[while]] I keep thousands of photos on Google Photos. I think older people value real objects more, [[because]] they can hold and see them.", "", "furniture|gadgets|on their phones", ""], ["What are the differences between the things that people keep today and the things that people kept in the past?", "[[In the past]], mọi người [[used to]] giữ thư tay và ảnh giấy, [[but]] bây giờ họ lưu ảnh số và tin nhắn. Đồ số dễ lưu [[but]] cũng dễ mất. [[For example]], nếu điện thoại hỏng mà không sao lưu, mình có thể mất hết ảnh. [[So]] mình nghĩ nên in ra một vài tấm ảnh quan trọng để giữ lâu dài.", "[[In the past]], people [[used to]] keep letters and paper photos, [[but]] now they keep digital photos and messages. Digital things are easy to keep, [[but]] they're also easy to lose. [[For example]], [[if]] your phone breaks and you don't have a backup, you can lose all your photos. [[So]] I think we should print some important photos to keep for a long time.", "", "paper photos|digital|easy to lose", ""], ["Do you think that keeping old things in a family is a great way to connect with the past?", "Có, mình đồng ý. Đồ cũ có câu chuyện riêng. [[For example]], mỗi lần bố mình lau chiếc radio, bố kể chuyện ngày xưa cho tụi mình nghe. Những món đồ cũ giúp các thế hệ trong gia đình gần nhau hơn. [[When]] trẻ con hỏi về đồ vật cũ, ông bà có dịp kể chuyện, [[and]] trẻ hiểu hơn về nguồn gốc của mình.", "Yes, I agree. Old things have stories. [[For example]], when my father cleans the old radio, he tells us stories about the past. Old things bring different generations closer. [[When]] children ask about an old object, grandparents can tell stories, [[and]] children understand their family history better.", "", "stories|connect with the past", ""]]}, {"name": "Đề 8 · Art", "rows": [["What are the differences between painting and drawing?", "Vẽ phác (drawing) thường dùng bút chì, [[while]] vẽ tranh (painting) dùng màu và cọ. Vẽ tranh [[also]] mất nhiều thời gian hơn. Vẽ phác thường nhanh và đơn giản, dùng để ghi lại ý tưởng. [[In contrast]], vẽ tranh cần nhiều kỹ năng hơn về màu sắc, [[so]] tranh thường trông hoàn chỉnh và sinh động hơn.", "Drawing usually uses pencils, [[while]] painting uses colours and brushes. Painting [[also]] takes more time. Drawing is usually quick and simple, and people use it to note down ideas. [[In contrast]], painting needs more skills with colours, [[so]] paintings usually look more complete and colourful.", "", "pencils|brushes", ""], ["Why do some people keep a painting for a long time?", "[[Because]] bức tranh đẹp và chứa nhiều kỷ niệm. [[Also]], một số bức tranh càng để lâu càng có giá trị. [[For example]], nhà ông bà mình có một bức tranh làng quê đã hơn 20 năm tuổi. Bức tranh nhắc cả nhà nhớ về quê hương, [[so]] không ai muốn bỏ đi.", "[[Because]] it's beautiful, and it has memories. [[Also]], some paintings become more valuable over time. [[For example]], my grandparents have a painting of a village, [[which]] is more than 20 years old. It reminds the family of our hometown, [[so]] nobody wants to throw it away.", "", "memories|valuable", ""], ["How does building style affect people’s lives?", "Thiết kế tốt mang lại nhiều ánh sáng và gió, [[so]] người ở thấy vui và khỏe hơn. [[On the other hand]], thiết kế kém làm thành phố trông ngột ngạt. [[For example]], phố cổ Hội An có những ngôi nhà màu vàng rất đẹp, [[so]] du khách thấy thư thái khi đi dạo. [[But]] ở một số khu mới, các tòa nhà san sát, thiếu cây xanh.", "Good design gives more light and fresh air, [[so]] people feel happier and healthier. [[On the other hand]], bad design makes a city feel crowded. [[For example]], Hội An's old town has beautiful yellow houses, [[so]] visitors feel relaxed when they walk around. [[But]] in some new areas, buildings are too close together, and there are no trees.", "", "light and air|crowded", ""], ["Should children learn to draw?", "Có, [[because]] vẽ giúp trẻ sáng tạo. Đó [[also]] là cách thư giãn rất tốt sau giờ học. Vẽ [[also]] giúp trẻ thể hiện cảm xúc và tăng khả năng quan sát. [[However]], bố mẹ không nên ép con trở thành họa sĩ, chỉ nên để con vẽ cho vui.", "Yes, [[because]] drawing helps them be creative. It's [[also]] a good way to relax after school. Drawing [[also]] helps children express their feelings and notice details. [[However]], parents shouldn't push their kids to become artists. They should just let them draw for fun.", "", "creative|relax", ""], ["What is the meaning of what they draw? What do they often draw?", "Trẻ thường vẽ gia đình, ngôi nhà, động vật và nhân vật hoạt hình. Tranh của trẻ thể hiện cảm xúc, [[for example]], màu sáng thường có nghĩa là trẻ đang vui. [[For example]], cháu mình hay vẽ cả nhà nắm tay nhau, [[which]] cho thấy bé cảm thấy hạnh phúc và an toàn. Mình nghĩ bố mẹ nên hỏi con về tranh để hiểu con hơn.", "Children often draw their family, their home, animals and cartoon characters. Their drawings show their feelings. [[For example]], bright colours usually mean they're happy. [[For example]], my niece often draws our family holding hands, [[which]] shows she feels happy and safe. I think parents should ask their kids about their drawings to understand them better.", "", "family|cartoon characters|feelings", ""]]}, {"name": "Đề 12 · History", "rows": [["Should everyone know history?", "Có, ít nhất là lịch sử cơ bản, [[because]] mình sẽ hiểu đất nước mình hơn. [[Also]], chúng ta học được từ những sai lầm trong quá khứ. [[For example]], biết lịch sử giúp mình hiểu vì sao người Việt rất coi trọng gia đình và độc lập. [[However]], học sinh không cần nhớ quá nhiều ngày tháng, chỉ cần hiểu những sự kiện chính.", "Yes, at least basic history, [[because]] we understand our country better. [[Also]], we can learn from past mistakes. [[For example]], knowing history helps me understand why Vietnamese people value family and independence so much. [[However]], students don't need to remember too many dates. They just need to understand the main events.", "", "understand|past mistakes", ""], ["In what ways can children learn history?", "Trẻ có thể học lịch sử từ sách ở trường, từ phim và hoạt hình, [[or]] đi tham quan bảo tàng. Mình nghĩ phim là cách dễ nhớ nhất. [[For example]], ở Bảo tàng Lịch sử, trẻ được nhìn thấy đồ vật thật từ hàng trăm năm trước. Mình nghĩ học qua câu chuyện và hình ảnh giúp trẻ nhớ lâu hơn học thuộc lòng.", "Children can learn history from books at school, from films and cartoons, [[or]] by visiting museums. I think films are the easiest way to remember. [[For example]], at the History Museum, children can see real objects from hundreds of years ago. I think learning through stories and pictures helps them remember better than learning by heart.", "", "films|museums", ""], ["What are the differences between learning history from books and from videos?", "Sách có nhiều chi tiết hơn, [[while]] video thú vị và dễ nhớ hơn. [[However]], một số video trên mạng không chính xác. [[For example]], mình học lịch sử ở trường qua sách và thấy khá chán. [[But]] khi xem phim tài liệu trên YouTube, mình nhớ được nhiều hơn [[because]] có hình ảnh và âm thanh.", "Books give more details, [[while]] videos are more interesting and easier to remember. [[However]], some videos online are not correct. [[For example]], I studied history at school from books, and I found it quite boring. [[But]] when I watch documentaries on YouTube, I remember more [[because]] there are pictures and sounds.", "", "details|easy to remember|not correct", ""], ["Is it difficult to protect and preserve historic buildings?", "Có, khá khó, [[because]] việc bảo tồn tốn rất nhiều tiền. [[Also]], thời tiết nóng ẩm ở Việt Nam làm các công trình cũ nhanh hư hại. [[In addition]], một số người xây nhà mới, phá bỏ nhà cổ, [[because]] đất ở thành phố rất đắt. Mình nghĩ chính phủ nên có luật để bảo vệ những công trình này.", "Yes, quite difficult, [[because]] it costs a lot of money. [[Also]], the hot and humid weather in Vietnam damages old buildings quickly. [[In addition]], some people knock down old houses to build new ones, [[because]] land in cities is very expensive. I think the government should have laws to protect these buildings.", "", "costs a lot|damage", ""]]}, {"name": "Đề 27 · Environment", "rows": [["Why is environmental protection important?", "[[Because]] chúng ta chỉ có một Trái Đất. Ô nhiễm làm con người bị bệnh. [[If]] chúng ta không bảo vệ môi trường, thế hệ sau sẽ không có không khí và nước sạch. [[For example]], ở Hà Nội và TP.HCM, nhiều ngày không khí ô nhiễm đến mức mọi người phải đeo khẩu trang. [[So]] bảo vệ môi trường là bảo vệ sức khỏe của chính mình.", "[[Because]] we only have one Earth. Pollution makes people sick. [[If]] we don't protect the environment, future generations won't have clean air and water. [[For example]], in Hà Nội and Ho Chi Minh City, the air is sometimes so polluted that people have to wear masks. [[So]] protecting the environment means protecting our own health.", "", "pollution|future generations|clean air", ""], ["What environmental problems are common in cities?", "Vấn đề phổ biến nhất là ô nhiễm không khí do xe cộ, [[and]] rác thải nhựa. [[For example]], TP.HCM thường bị ngập khi trời mưa lớn. Nguyên nhân là có quá nhiều xe máy và rác không được phân loại. [[If]] không thay đổi, những vấn đề này [[will]] ngày càng nghiêm trọng.", "The most common problems are air pollution from traffic [[and]] plastic rubbish. [[For example]], Ho Chi Minh City often floods when it rains heavily. The reason is that there are too many motorbikes, and people don't separate their rubbish. [[If]] nothing changes, these problems [[will]] get worse.", "", "air pollution|rubbish|flooding", ""], ["Should governments or individuals take more responsibility?", "Mình nghĩ cả hai, [[but]] chính phủ nhiều hơn, [[because]] họ có thể ra luật. Mỗi cá nhân [[also]] có thể tái chế và dùng ít nhựa hơn. [[For example]], chính phủ có thể cấm túi nilon dùng một lần ở siêu thị. [[But]] luật chỉ hiệu quả [[when]] mỗi người cùng thực hiện, ví dụ mang túi vải khi đi chợ.", "I think both, [[but]] governments more, [[because]] they can make laws. Individuals can [[also]] recycle and use less plastic. [[For example]], the government can ban single-use plastic bags in supermarkets. [[But]] laws only work [[when]] everyone follows them, like bringing a cloth bag to the market.", "", "make laws|recycle|use less plastic", ""], ["How can schools teach children about environmental protection?", "Trường học có thể tổ chức các buổi học ngoài trời. [[For example]], cho học sinh phân loại rác ở trường, [[or]] tổ chức ngày dọn vệ sinh khu phố. Trường học [[also]] có thể mời chuyên gia đến nói chuyện hoặc cho học sinh trồng cây. [[When]] trẻ tự tay làm, trẻ sẽ nhớ lâu và hình thành thói quen tốt.", "Schools can have outdoor lessons. [[For example]], they can teach students to recycle at school, [[or]] organise clean-up days in the neighbourhood. Schools can [[also]] invite experts to give talks or let students plant trees. [[When]] children do things by themselves, they remember for a long time and build good habits.", "", "outdoor lessons|recycling|clean-up days", ""], ["Should companies be punished for pollution?", "Có, chắc chắn rồi. Họ nên bị phạt thật nặng, [[so]] lần sau họ sẽ cẩn thận hơn. [[For example]], [[if]] một nhà máy xả nước bẩn ra sông, người dân sống gần đó sẽ bị ảnh hưởng. [[So]] ngoài phạt tiền, công ty nên phải làm sạch lại môi trường.", "Yes, definitely. They should pay big fines, [[so]] they [[will]] be more careful next time. [[For example]], [[if]] a factory puts dirty water into a river, the people living nearby suffer. [[So]] besides paying fines, companies should clean up the environment.", "", "fines|careful", ""]]}, {"name": "Đề 41 · Films", "rows": [["Do you believe in movie reviews?", "Thỉnh thoảng. Mình hay đọc review trước khi đi xem phim. [[But]] một số review là quảng cáo được trả tiền, [[so]] mình không tin hoàn toàn. [[For example]], có lần mình đọc review rất tốt về một bộ phim, [[but]] khi đi xem thì thấy khá chán. Bây giờ mình đọc nhiều review khác nhau rồi mới quyết định.", "Sometimes. I usually read reviews before I go to the cinema. [[But]] some reviews are paid ads, [[so]] I don't believe them completely. [[For example]], once I read very good reviews about a film, [[but]] when I watched it, it was quite boring. Now I read several different reviews before I decide.", "", "read reviews|paid ads", ""], ["What are the different types of films in your country?", "Ở Việt Nam có phim hài, phim gia đình, phim kinh dị [[and]] phim lịch sử. Phim hài và phim gia đình là phổ biến nhất, nhất là dịp Tết. Gần đây, phim kinh dị Việt Nam ngày càng được giới trẻ yêu thích. Mình nghĩ điện ảnh Việt đang phát triển rất nhanh, [[because]] khán giả ủng hộ phim trong nước nhiều hơn.", "There are comedy films, family films, horror films [[and]] historical films. Comedy and family films are the most popular, especially at Tết. Recently, Vietnamese horror films have become popular with young people. I think the Vietnamese film industry is growing fast, [[because]] audiences support local films more.", "", "comedy|horror|historical", ""], ["Are historical films popular in your country? Why?", "Gần đây phim lịch sử ngày càng phổ biến, [[because]] mọi người muốn tìm hiểu về lịch sử. Một số phim gần đây rất thành công ngoài rạp. [[However]], làm phim lịch sử rất tốn kém, [[because]] cần trang phục và bối cảnh xưa. [[So]] không có nhiều phim loại này như phim hài.", "Historical films are becoming popular, [[because]] people want to learn about history. Some recent ones did very well at the cinema. [[However]], historical films are very expensive to make, [[because]] they need old costumes and settings. [[So]] there aren't as many of them as comedy films.", "", "learn about history", ""], ["Do you think films with famous actors or actresses would be more popular?", "Có, thường là vậy, [[because]] fan sẽ đi xem thần tượng của họ. [[But]] mình nghĩ kịch bản hay vẫn quan trọng hơn. [[For example]], nhiều người đi xem phim chỉ vì có ca sĩ hoặc diễn viên nổi tiếng. [[However]], nếu kịch bản dở, mọi người sẽ đánh giá thấp trên mạng, [[and]] phim vẫn thất bại.", "Yes, usually, [[because]] fans go to see their idols. [[But]] I think a good story is more important. [[For example]], many people go to see a film just because of a famous singer or actor. [[However]], [[if]] the story is bad, people give bad reviews online, [[and]] the film still fails.", "", "fans|idols|good story", ""], ["Should the director pay a lot of money to famous actors?", "Mình nghĩ không nên quá nhiều, [[because]] tiền nên dành cho kịch bản và kỹ xảo. [[However]], diễn viên nổi tiếng đúng là giúp bán được nhiều vé hơn. [[In my opinion]], diễn viên trẻ có tài [[also]] cần cơ hội. [[If]] đạo diễn chỉ chọn người nổi tiếng, những diễn viên mới sẽ khó phát triển.", "I think not too much, [[because]] the money should go to the story and the effects. [[However]], famous actors do help sell more tickets. [[In my opinion]], talented young actors [[also]] need chances. [[If]] directors only choose famous actors, new actors [[will]] find it hard to grow.", "", "story and effects|sell tickets", ""]]}, {"name": "Đề 61 · Comedy", "rows": [["How popular are comedy films in your country?", "Rất phổ biến. [[Especially]] vào dịp Tết, nhiều phim hài ra rạp. [[For example]], phim của Trấn Thành lúc nào cũng rất đông người xem. Người Việt thích phim hài [[because]] Tết là dịp cả gia đình đi xem phim cùng nhau, [[and]] ai cũng muốn cười để bắt đầu năm mới. Phim hài [[also]] thường có doanh thu cao nhất.", "Very popular. [[Especially]] at Tết, many comedy films come out. [[For example]], Trấn Thành's films always have a lot of viewers. Vietnamese people like comedy films [[because]] at Tết, the whole family goes to the cinema together, [[and]] everyone wants to laugh to start the new year. Comedies [[also]] usually make the most money.", "", "come out|Tết", ""], ["Why do people of all ages enjoy watching funny cartoons?", "[[Because]] phim hoạt hình đơn giản, dễ hiểu, màu sắc tươi sáng và nhân vật vui nhộn. [[Also]], người lớn hay xem cùng con để thư giãn. [[For example]], mình và em trai vẫn hay xem Doraemon dù đã lớn. Phim hoạt hình [[also]] có những bài học về tình bạn và gia đình, [[so]] người lớn cũng thấy ý nghĩa.", "[[Because]] cartoons are simple and easy to understand, with bright colours and funny characters. [[Also]], adults watch them with their kids to relax. [[For example]], my brother and I still watch Doraemon even though we're adults. Cartoons [[also]] have lessons about friendship and family, [[so]] adults find them meaningful too.", "", "easy to understand|funny characters|relax", ""], ["Do you agree that most people prefer watching comedy films to watching serious films?", "Có, mình đồng ý. [[Because]] mọi người mệt sau giờ làm, họ muốn cười và thư giãn [[instead of]] phải suy nghĩ nhiều. [[However]], phim nghiêm túc cũng có khán giả riêng, nhất là những người thích suy ngẫm. Cá nhân mình thích phim vừa hài vừa có ý nghĩa, ví dụ phim Doraemon.", "Yes, I agree. [[Because]] people are tired after work, they want to laugh and relax [[instead of]] thinking too much. [[However]], serious films also have their own audience, especially people who like to think deeply. Personally, I like films that are funny and meaningful, like Doraemon films.", "", "tired after work|laugh and relax", ""], ["Should teachers use jokes and encourage laughter in the classroom?", "Có, thỉnh thoảng, [[because]] học sinh thấy thoải mái và nhớ bài lâu hơn. [[However]], đùa quá nhiều sẽ mất thời gian học. [[For example]], thầy dạy toán của mình hay kể chuyện cười đầu giờ, [[so]] cả lớp tỉnh táo hơn. Mình nghĩ một chút tiếng cười giúp học sinh bớt sợ môn khó.", "Yes, sometimes, [[because]] students feel relaxed and remember lessons better. [[However]], too many jokes can waste time. [[For example]], my maths teacher often told a joke at the start of the lesson, [[so]] the class felt more awake. I think a little laughter helps students feel less afraid of difficult subjects.", "", "remember better|waste time", ""], ["Why are some people good at making other people laugh?", "[[Because]] họ có khiếu hài hước và để ý những chuyện vui trong cuộc sống hằng ngày. [[And]] họ rất tự tin khi nói chuyện. [[For example]], đồng nghiệp mình hay kể chuyện hằng ngày theo cách rất hài hước, [[so]] cả văn phòng hay cười. Mình nghĩ khả năng này một phần là tự nhiên, một phần là luyện tập.", "[[Because]] they have a good sense of humour, and they notice funny things in daily life. [[And]] they're very confident when they speak. [[For example]], one of my colleagues tells everyday stories in a very funny way, [[so]] the whole office often laughs. I think this ability is partly natural and partly practice.", "", "sense of humour|notice|confident", ""]]}, {"name": "Đề 65 · Inventions", "rows": [["What is the most helpful innovation at home?", "Mình nghĩ là máy giặt, [[because]] nó tiết kiệm rất nhiều thời gian và sức lực. [[While]] máy đang giặt, mọi người có thể nghỉ ngơi hoặc làm việc khác. [[In the past]], mọi người [[used to]] giặt tay, mất cả tiếng mỗi ngày. Giờ máy giặt làm việc đó, [[so]] mọi người, nhất là phụ nữ, có thêm thời gian cho bản thân và gia đình.", "I think it's the washing machine, [[because]] it saves a lot of time and energy. [[While]] it washes the clothes, people can rest or do other work. [[In the past]], people [[used to]] wash clothes by hand, and it took an hour every day. Now the washing machine does it, [[so]] people, especially women, have more time for themselves and their family.", "", "washing machine|save time", ""], ["What household appliances make us lazy?", "Có lẽ là điều khiển từ xa và robot hút bụi. [[Because of]] chúng, chúng ta hầu như không cần đi lại. [[But]] chúng rất hữu ích cho người bận rộn. [[For example]], nhiều người dùng thang máy chỉ để lên một tầng, [[and]] họ ít vận động hơn. [[So]] mình nghĩ nên dùng những thiết bị này một cách hợp lý.", "Maybe the remote control and the robot vacuum. [[Because of]] them, we don't need to move. [[But]] they're very useful for busy people. [[For example]], many people take the lift just to go up one floor, [[and]] they move less. [[So]] I think we should use these machines in a sensible way.", "", "robot vacuum|don't need to move|busy people", ""], ["What kind of invention can be used at school?", "Bảng thông minh và laptop có thể dùng ở trường. Giáo viên có thể chiếu video và hình ảnh, [[so]] bài học thú vị hơn. [[In addition]], các app học tập như Duolingo giúp học sinh luyện tập ở nhà. [[However]], trường nên giới hạn thời gian dùng thiết bị, [[because]] học sinh vẫn cần viết tay và nói chuyện trực tiếp.", "Smart boards and laptops can be used at school. Teachers can show videos and pictures, [[so]] lessons are more interesting. [[In addition]], learning apps like Duolingo help students practise at home. [[However]], schools should limit screen time, [[because]] students still need to write by hand and talk face to face.", "", "smart boards|show videos|more interesting", ""], ["Do you think AI will replace human teachers? Why?", "Mình không nghĩ vậy. AI có thể giúp học sinh luyện tập, [[but]] học sinh vẫn cần giáo viên [[because]] giáo viên tạo động lực và quan tâm đến các em. [[For example]], mình dùng AI để luyện nói tiếng Anh, [[and]] nó sửa lỗi rất nhanh. [[But]] chỉ giáo viên mới biết khi nào mình mệt hoặc mất động lực để động viên mình.", "I don't think so. AI can help students practise, [[but]] students still need teachers, [[because]] teachers motivate them and care about them. [[For example]], I use AI to practise speaking English, [[and]] it corrects my mistakes quickly. [[But]] only a teacher can see when I'm tired or unmotivated and encourage me.", "", "help practise|motivation|care", ""]]}]}, "p3_4": {"name": "Sự kiện", "topics": [{"name": "Đề 1 · Phones in public", "rows": [["Do most people mind others talking on the phone in public places?", "Có, [[if]] họ nói to. Trên xe buýt hay trong quán cà phê, điều đó khá khó chịu. [[But]] nếu cuộc gọi ngắn và nói nhỏ thì không sao. [[For example]], có lần mình ngồi trên xe buýt, một người nói điện thoại rất to suốt 20 phút, [[and]] ai cũng khó chịu. Mình nghĩ ở nơi công cộng, mọi người nên nói nhỏ hoặc nhắn tin.", "Yes, [[if]] they talk loudly. It's quite annoying on buses or in cafés. [[But]] short and quiet calls are OK. [[For example]], once on a bus, a man talked very loudly on the phone for 20 minutes, [[and]] everyone looked annoyed. I think in public places, people should speak quietly or just send a message.", "", "talk loudly|annoying", ""], ["What are the differences between sitting beside a person who keeps talking on the phone and a person who keeps talking to you?", "[[When]] ai đó nói chuyện với mình, mình có thể tham gia câu chuyện, [[so]] thấy lịch sự hơn. [[But]] nghe người khác gọi điện thì cảm giác rất kỳ. [[In addition]], khi người khác gọi điện, mình chỉ nghe được một nửa câu chuyện, [[so]] rất khó tập trung vào việc của mình. Còn khi trò chuyện trực tiếp, mình có thể chọn có tham gia hay không.", "[[When]] someone talks to you, you can join the conversation, [[so]] it feels more polite. [[But]] listening to someone's phone call feels strange. [[In addition]], when someone is on the phone, you only hear half of the conversation, [[so]] it's hard to focus on your own work. [[But]] in a real conversation, you can choose to join or not.", "", "polite|join the conversation", ""], ["Why do some people not care about what they do in public places?", "[[Because]] họ bận hoặc đang vội, [[so]] họ không để ý người xung quanh. [[Also]], không ai nhắc nhở họ. Một số người nghĩ họ sẽ không gặp lại những người xung quanh, [[so]] họ không quan tâm đến hình ảnh của mình. Mình nghĩ giáo dục từ nhỏ rất quan trọng để thay đổi điều này.", "[[Because]] they're busy or in a hurry, [[so]] they don't notice other people. [[Also]], nobody tells them to stop. Some people think they [[will]] never see the people around them again, [[so]] they don't care about their image. I think education from a young age is important to change this.", "", "in a hurry|notice", ""]]}, {"name": "Đề 4 · Apologies", "rows": [["Do people often say sorry in your country?", "Có, khá thường xuyên. Người Việt hay nói xin lỗi cả với chuyện nhỏ. [[However]], một số người thấy khó nói xin lỗi khi mắc lỗi lớn. [[For example]], khi ai đó va vào mình trên đường, họ thường nói xin lỗi ngay. [[But]] trong công việc, một số người ngại nhận lỗi [[because]] sợ mất mặt.", "Yes, quite often. People say sorry even for small things. [[However]], some people find it hard to say sorry for big mistakes. [[For example]], when someone bumps into you in the street, they usually say sorry right away. [[But]] at work, some people don't want to admit mistakes [[because]] they're afraid of losing face.", "", "small things|hard to say sorry", ""], ["Is it important to teach children to say sorry?", "Có, rất quan trọng, [[because]] trẻ học cách chịu trách nhiệm cho hành động của mình. Nó [[also]] giúp trẻ giữ được bạn bè. [[If]] trẻ không học nói xin lỗi, khi lớn lên trẻ có thể khó hòa đồng với người khác. Mình nghĩ bố mẹ nên giải thích cho con vì sao cần xin lỗi, chứ không chỉ bắt con nói.", "Yes, very important, [[because]] children learn to take responsibility for their actions. It [[also]] helps them keep their friends. [[If]] children don't learn to say sorry, they may find it hard to get along with others when they grow up. I think parents should explain why they need to say sorry, not just force them to say it.", "", "take responsibility|keep friends", ""], ["Is it important to teach children to respect others?", "Có. Tôn trọng là nền tảng của mọi mối quan hệ tốt. Bố mẹ nên làm gương, [[because]] trẻ học bằng cách nhìn người lớn. [[For example]], [[when]] bố mẹ lễ phép với người lớn tuổi, con cái cũng học theo. Trẻ biết tôn trọng người khác sẽ dễ có bạn bè và thành công hơn trong công việc sau này.", "Yes. Respect is the base of good relationships. Parents should be a good example, [[because]] children learn by watching adults. [[For example]], [[when]] parents are polite to older people, their children copy them. Kids who respect others make friends easily, [[and]] they're more successful at work later.", "", "respect|good example", ""], ["Do you think people should apologize for anything wrong they do?", "Có, [[because]] xin lỗi cho thấy mình có trách nhiệm. [[Also]], người khác sẽ dễ tha thứ cho mình hơn. [[For example]], [[if]] mình đến muộn một cuộc họp, mình nên xin lỗi mọi người. [[However]], xin lỗi thôi chưa đủ, mình [[also]] cần sửa lỗi và không lặp lại.", "Yes, [[because]] it shows you're responsible. [[Also]], other people forgive you more easily. [[For example]], [[if]] I'm late for a meeting, I should apologise to everyone. [[However]], saying sorry is not enough. We [[also]] need to fix the mistake and not repeat it.", "", "responsible|forgive", ""]]}, {"name": "Đề 5 · Changes", "rows": [["Why do some people quit and change jobs?", "Chủ yếu [[because]] họ muốn lương cao hơn. Một số người nghỉ việc [[because]] thấy chán hoặc căng thẳng ở chỗ cũ. Người khác thì muốn học điều mới. [[For example]], một người bạn của mình chuyển việc [[because]] công ty cũ không có cơ hội thăng tiến. Ngày nay người trẻ đổi việc thường xuyên hơn thế hệ trước.", "Mainly [[because]] they want a better salary. Some people quit [[because]] they feel bored or stressed at their old job. Others want to learn new things. [[For example]], one of my friends changed jobs [[because]] there was no chance of promotion at her old company. Nowadays, young people change jobs more often than the older generation.", "", "better salary|bored|learn new things", ""], ["Who can adapt better to changes, children or adults?", "Mình nghĩ trẻ em thích nghi tốt hơn, [[because]] trẻ tò mò và học nhanh. [[For example]], trẻ kết bạn rất nhanh khi chuyển sang trường mới. [[On the other hand]], người lớn có kinh nghiệm nên biết cách lên kế hoạch cho thay đổi. [[However]], người lớn thường sợ thay đổi hơn [[because]] họ có nhiều trách nhiệm.", "I think children adapt better, [[because]] they're curious and they learn fast. [[For example]], kids make new friends very quickly at a new school. [[On the other hand]], adults have experience, [[so]] they know how to plan for changes. [[However]], adults are often more afraid of change [[because]] they have more responsibilities.", "", "curious|learn fast|make friends", ""], ["When things like getting married or moving home happen, what kinds of things would you consider?", "[[First]], mình [[would]] nghĩ về tiền bạc. [[Then]], mình nghĩ về vị trí, ví dụ gần chỗ làm và trường học. [[Finally]], mình hỏi ý kiến gia đình. [[For example]], [[if]] mình chuyển nhà, mình muốn ở gần công ty để không mất nhiều thời gian đi lại. Kết hôn thì mình [[would]] nghĩ đến việc hai gia đình có hợp nhau không.", "[[First]], I [[would]] think about money. [[Then]], I [[would]] think about the location, like how close it is to work and schools. [[Finally]], I [[would]] ask my family's opinion. [[For example]], [[if]] I move house, I want to live near my office so I don't waste time travelling. For marriage, I [[would]] think about whether the two families get along.", "", "budget|location|family", ""], ["What are the disadvantages when people keep making changes?", "[[If]] cứ thay đổi liên tục, mọi người sẽ mệt mỏi và căng thẳng. [[Also]], họ không bao giờ trở thành chuyên gia, [[and]] khó xây dựng mối quan hệ lâu dài. [[For example]], [[if]] ai đó đổi việc mỗi năm, nhà tuyển dụng có thể nghĩ họ không đáng tin. [[So]] mình nghĩ thay đổi là tốt, [[but]] cần có lý do rõ ràng.", "[[If]] people keep making changes, they feel tired and stressed. [[Also]], they never become an expert, [[and]] it's hard to build long relationships. [[For example]], [[if]] someone changes jobs every year, employers may think they're not reliable. [[So]] I think change is good, [[but]] there should be a clear reason.", "", "stressed|expert|relationships", ""]]}, {"name": "Đề 6 · Being organized", "rows": [["How can parents help children to be organized?", "Bố mẹ có thể cho con một nếp sinh hoạt đơn giản. [[For example]], bảo con dọn phòng mỗi ngày, [[or]] dùng danh sách việc cần làm và lịch. [[If]] trẻ ngăn nắp từ nhỏ, khi lớn lên trẻ sẽ quản lý thời gian tốt hơn. Bố mẹ [[also]] nên làm gương, [[because]] trẻ học bằng cách bắt chước.", "Parents can give children a simple routine. [[For example]], they can ask them to tidy their room every day, [[or]] use a checklist and a calendar. [[If]] children are organized from a young age, they [[will]] manage their time better when they grow up. Parents should [[also]] be a good example, [[because]] kids learn by copying.", "", "routine|tidy|checklist", ""], ["On what occasions do people need to be organized?", "Mọi người cần ngăn nắp [[when]] tổ chức đám cưới hay sự kiện lớn. Ở chỗ làm, [[when]] có hạn chót, cũng cần. [[And]] trước một chuyến đi hoặc kỳ thi. [[For example]], ở công ty mình, trước khi chạy một chiến dịch quảng cáo, cả team phải lên kế hoạch chi tiết. [[If]] không ngăn nắp, rất dễ trễ hạn và lãng phí tiền.", "People need to be organized [[when]] they plan weddings or big events. At work, they need it [[when]] there are deadlines. [[And]] before a trip or an exam. [[For example]], at my company, before we run an ad campaign, the whole team makes a detailed plan. [[If]] we're not organized, we can easily miss deadlines and waste money.", "", "deadlines|big events", ""], ["Does everything need to be well prepared?", "Không phải mọi thứ. Việc lớn như kỳ thi hay đám cưới thì cần chuẩn bị kỹ, [[but]] việc nhỏ như đi cà phê với bạn thì có thể tùy hứng. [[In my opinion]], chuẩn bị quá kỹ cho mọi việc nhỏ làm cuộc sống căng thẳng. Đôi khi những chuyến đi bất ngờ lại là kỷ niệm đáng nhớ nhất.", "Not everything. Big things like exams or weddings need good preparation, [[but]] small things like a coffee with friends can be spontaneous. [[In my opinion]], preparing too much for every small thing makes life stressful. Sometimes, last-minute trips become the best memories.", "", "spontaneous|big things", ""], ["Do people need others’ help when organizing things?", "Có, [[especially]] với sự kiện lớn, [[because]] một người không thể làm hết. [[For example]], dịp Tết cả nhà mình cùng nhau dọn nhà, gói bánh chưng. [[When]] mọi người cùng làm, công việc nhanh hơn [[and]] vui hơn. [[However]], cần có một người chịu trách nhiệm chính để mọi thứ không bị rối.", "Yes, [[especially]] for big events, [[because]] one person can't do everything. [[For example]], at Tết, everyone in my family helps clean the house and make bánh chưng. [[When]] everyone works together, the job is faster [[and]] more fun. [[However]], there should be one main person in charge, [[so]] things don't get messy.", "", "can't do everything|help", ""], ["How would you feel when you were not well prepared for something?", "Mình [[would]] thấy lo lắng và căng thẳng, [[because]] mình sợ mắc lỗi. [[That's why]] mình luôn lên kế hoạch trước những việc quan trọng. [[For example]], lần đầu thuyết trình ở công ty, mình chuẩn bị chưa kỹ [[and]] mình nói rất run. Từ đó, mình luôn tập trước ít nhất hai lần.", "I [[would]] feel nervous and stressed, [[because]] I'm afraid of making mistakes. [[That's why]] I always make a plan before important things. [[For example]], the first time I gave a presentation at work, I wasn't well prepared, [[and]] I was very nervous. Since then, I always practise at least twice before.", "", "nervous|make mistakes|make a plan", "", "Câu hỏi dùng would → trả lời bằng would feel, không cần quá khứ."]]}, {"name": "Đề 7 · Communication", "rows": [["What benefits does the internet bring to communication?", "Internet giúp giao tiếp nhanh và rẻ. [[For example]], mình gọi video được với người thân ở xa. [[Also]], họp online giúp tiết kiệm thời gian. [[For example]], công ty mình có đồng nghiệp ở Hà Nội, [[so]] tụi mình họp qua Zoom hằng ngày. [[However]], giao tiếp online đôi khi dễ hiểu lầm [[because]] không thấy nét mặt.", "The internet makes communication fast and cheap. [[For example]], we can video call our family far away. [[Also]], online meetings save time. [[For example]], my company has colleagues in Hà Nội, [[so]] we have meetings on Zoom every day. [[However]], online communication sometimes causes misunderstandings [[because]] we can't see faces.", "", "video calls|save time", ""], ["Which one is better, being a communicator or a listener?", "Mình nghĩ cả hai đều quan trọng, [[but]] người biết lắng nghe hiếm hơn. Người lắng nghe hiểu người khác hơn, [[while]] người giỏi nói làm việc tốt. [[For example]], khi bạn mình có chuyện buồn, bạn ấy cần một người lắng nghe hơn là một người cho lời khuyên. [[So]] mình nghĩ người giỏi nhất là người biết khi nào nên nói và khi nào nên nghe.", "I think both are important, [[but]] good listeners are rarer. Listeners understand people better, [[while]] good communicators do well at work. [[For example]], when my friend is sad, she needs someone to listen more than someone to give advice. [[So]] I think the best person knows when to speak and when to listen.", "", "listener|understand", ""], ["What qualities does a person need to have to be a good communicator?", "Một người giao tiếp tốt cần nói rõ ràng và tự tin. Họ [[also]] cần thân thiện. [[And]] quan trọng là họ cũng biết lắng nghe. [[For example]], quản lý của mình giải thích công việc rất rõ ràng và luôn hỏi ý kiến cả team. [[So]] mọi người hiểu nhiệm vụ và thấy được tôn trọng.", "A good communicator needs to be clear and confident. They [[also]] need to be friendly. [[And]] importantly, they need to be good at listening too. [[For example]], my manager explains tasks very clearly, and she always asks for the team's opinions. [[So]] everyone understands their work and feels respected.", "", "clear|confident|listening", ""], ["How important is it to be a good listener when communicating?", "Rất quan trọng, [[because]] khi lắng nghe, mình hiểu được vấn đề. [[Also]], người nói cảm thấy được tôn trọng. [[If]] mình không lắng nghe, mình có thể trả lời sai ý hoặc làm người khác buồn. [[For example]], trong công việc, lắng nghe khách hàng giúp mình hiểu họ thật sự cần gì.", "It's very important, [[because]] when you listen, you understand the problem. [[Also]], people feel respected. [[If]] you don't listen, you may give the wrong answer or upset people. [[For example]], at work, listening to customers helps you understand what they really need.", "", "understand|respected", ""]]}, {"name": "Đề 9 · Big changes", "rows": [["Do children like to change schools when they are young?", "Không hẳn, [[because]] trẻ nhớ bạn cũ. [[But]] trẻ thường quen với trường mới rất nhanh. [[For example]], em họ mình chuyển trường năm lớp 6, [[and]] tuần đầu em ấy khóc vì không có bạn. [[But]] sau một tháng, em ấy đã có nhóm bạn mới và rất vui.", "Not really, [[because]] they miss their old friends. [[But]] they usually get used to the new school very quickly. [[For example]], my cousin changed schools in grade 6, [[and]] she cried in the first week because she had no friends. [[But]] after a month, she had a new group of friends and felt happy.", "", "miss friends|get used to", ""], ["What children will learn in their new school?", "Trẻ học cách kết bạn mới [[and]] cách thích nghi với môi trường mới. Trẻ [[also]] được học thêm môn mới. Trẻ [[also]] học cách tự lập và tự tin hơn khi phải làm quen với môi trường lạ. Mình nghĩ đây là những kỹ năng rất có ích cho tương lai.", "They learn how to make new friends [[and]] how to adapt to a new place. They [[also]] learn new subjects. Children [[also]] learn to be independent and confident when they have to get used to a new place. I think these skills are very useful for the future.", "", "make new friends|adapt", ""], ["How do people face big changes and what preparations do they make?", "Đa số mọi người lên kế hoạch trước. [[For example]], họ tiết kiệm tiền [[and]] hỏi ý kiến gia đình trước khi quyết định. [[For example]], trước khi chuyển việc, mình tìm hiểu về công ty mới và chuẩn bị tinh thần. Mình nghĩ giữ suy nghĩ tích cực giúp mọi người vượt qua thay đổi dễ hơn.", "Most people make a plan first. [[For example]], they save money [[and]] ask their family for advice before they decide. [[For example]], before I changed jobs, I learned about the new company and prepared myself mentally. I think a positive attitude helps people deal with change more easily.", "", "make a plan|save money|ask for advice", ""], ["When things like getting married or moving home happen, what kinds of things would you consider?", "[[First]], mình [[would]] nghĩ về tiền bạc. [[Then]], vị trí nhà, có gần chỗ làm không. [[Finally]], ý kiến của gia đình. [[For example]], [[if]] mình mua nhà, mình cần xem có gần chợ, trường học và bệnh viện không. Mình [[also]] nghĩ về khả năng trả nợ ngân hàng trong nhiều năm.", "[[First]], I [[would]] think about money. [[Then]], the location, like whether it's near my office. [[Finally]], my family's opinion. [[For example]], [[if]] I buy a home, I need to check if it's near a market, a school and a hospital. I [[would]] [[also]] think about whether I can pay back the bank loan over many years.", "", "budget|location|family", ""]]}, {"name": "Đề 14 · Conversations", "rows": [["What is the difference between the conversation between men and women?", "Phụ nữ thường nói về cảm xúc nhiều hơn, [[while]] đàn ông hay nói về công việc và thể thao. [[But]] điều này còn tùy vào từng người. [[For example]], khi gặp nhau, mẹ mình và các cô hay hỏi han chuyện gia đình, [[while]] bố mình và các chú bàn về bóng đá. [[However]], ngày nay ranh giới này ít rõ ràng hơn.", "Women often talk about feelings more, [[while]] men talk about work and sports. [[But]] it depends on the person. [[For example]], when my mother and aunts meet, they ask about each other's families, [[while]] my father and uncles talk about football. [[However]], these differences are less clear nowadays.", "", "feelings|depend on", ""], ["Which conversation is better: phone or face-to-face?", "Gặp trực tiếp tốt hơn, [[because]] mình thấy được ngôn ngữ cơ thể. [[But]] gọi điện thì nhanh và tiện hơn. [[For example]], [[when]] có chuyện quan trọng hoặc chuyện buồn, mình luôn muốn gặp trực tiếp. [[But]] với việc nhanh như hẹn giờ, gọi điện tiện hơn nhiều.", "Face-to-face is better, [[because]] you can see body language. [[But]] the phone is faster and more convenient. [[For example]], [[when]] there's something important or sad to talk about, I always prefer to meet in person. [[But]] for quick things, like making plans, a phone call is much more convenient.", "", "body language|faster", ""], ["Why do people get nervous while they give presentations?", "[[Because]] họ sợ mắc lỗi khi có nhiều người đang nhìn. [[Also]], nhiều người không luyện tập đủ trước khi thuyết trình. [[For example]], lần đầu thuyết trình, tay mình run và mình quên mất ý. Mình nghĩ cách tốt nhất là luyện tập nhiều lần và tưởng tượng mình đang nói chuyện với bạn bè.", "[[Because]] they're afraid of making mistakes when many people are looking at them. [[Also]], many people don't practise enough before the presentation. [[For example]], the first time I gave a presentation, my hands were shaking, and I forgot my ideas. I think the best way is to practise many times and imagine you're talking to friends.", "", "make mistakes|practice", ""], ["Why is body language important?", "[[Because]] nó thể hiện cảm xúc và giúp mình trông tự tin hơn. [[For example]], khi mỉm cười, người khác dễ tin mình hơn. [[In addition]], ngôn ngữ cơ thể giúp người nghe hiểu ý mình rõ hơn. [[For example]], trong buổi phỏng vấn, giao tiếp bằng mắt cho thấy mình tự tin và trung thực.", "[[Because]] it shows your feelings, and it makes you look confident. [[For example]], when you smile, people trust you more easily. [[In addition]], body language helps listeners understand you better. [[For example]], in a job interview, eye contact shows that you're confident and honest.", "", "show feelings|confident", ""]]}, {"name": "Đề 15 · Noise", "rows": [["What kinds of places should be noise-free?", "Những nơi như bệnh viện, thư viện, chùa và nhà thờ nên yên tĩnh, [[because]] mọi người cần nghỉ ngơi, học tập hoặc cầu nguyện. [[For example]], ở thư viện, chỉ một người nói to là cả phòng mất tập trung. Ở bệnh viện, bệnh nhân cần yên tĩnh để mau khỏe.", "Places like hospitals, libraries, temples and churches should be quiet, [[because]] people need to rest, study or pray there. [[For example]], in a library, one loud person can disturb the whole room. In hospitals, patients need quiet to get better quickly.", "", "hospitals|libraries", ""], ["Can people bring children to these noise-free places?", "Có, [[if]] trẻ giữ được yên lặng. Bố mẹ nên giải thích quy định cho con trước. [[But]] với trẻ quá nhỏ thì rất khó kiểm soát. [[For example]], nhiều chùa vẫn chào đón trẻ em, [[because]] đó là cách để trẻ học về văn hóa. [[If]] trẻ quấy khóc, bố mẹ nên đưa trẻ ra ngoài một lúc.", "Yes, [[if]] they're quiet. Parents should explain the rules first. [[But]] very young kids are hard to control. [[For example]], many temples welcome children, [[because]] it's a way for them to learn about culture. [[If]] a child cries, the parents should take them outside for a while.", "", "explain the rules", ""], ["Why can’t people make noise in a church?", "[[Because]] mọi người cầu nguyện ở đó, [[and]] đó là nơi linh thiêng. Làm ồn ở đó là thiếu tôn trọng. Ở Việt Nam, chùa [[also]] là nơi linh thiêng, [[so]] mọi người nói nhỏ và ăn mặc lịch sự. Mình nghĩ tôn
