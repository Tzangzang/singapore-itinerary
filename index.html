"end\">nds</u> and stay for a wee<u class=\"end\">k</u>. Maybe in the future, I will even move there and wo<u class=\"end\">rk</u> remotely."], "past": "went · felt", "alts": [{"topics": [{"n": "48", "t": "Describe a place you went to on holiday that you would recommend"}], "q": ["<b>Đổi:</b> giữ nguyên bài, thay đoạn \"I want to visit Đà Nẵng again…\" bằng lời giới thiệu.", "<span lang=\"en\" class=\"p2en\">I wou<u class=\"end\">ld</u> recomme<u class=\"end\">nd</u> Đà Nẵng for a holiday for three reaso<u class=\"end\">ns</u>. Fi<u class=\"end\">rst</u>, it&#x27;s very clo<u class=\"end\">se</u>: ju<u class=\"end\">st</u> over one hour by plane from Ho Chi Minh City. Seco<u class=\"end\">nd</u>, hote<u class=\"end\">ls</u> and foo<u class=\"end\">d</u> are no<u class=\"end\">t</u> expensive. And thi<u class=\"end\">rd</u>, it sui<u class=\"end\">ts</u> everyone: familie<u class=\"end\">s</u>, couple<u class=\"end\">s</u> and grou<u class=\"end\">ps</u> of frie<u class=\"end\">nds</u>.</span>"]}, {"topics": [{"n": "66", "t": "Describe a city you would recommend as a nice place to live (not your hometown)"}], "q": ["<b>Đổi:</b> bỏ bớt phần đi chơi, nhấn mạnh lý do đáng sống.", "<span lang=\"en\" class=\"p2en\">I thi<u class=\"end\">nk</u> Đà Nẵng is a ni<u class=\"end\">ce</u> pla<u class=\"end\">ce</u> to live. The <em class=\"red past\">co<u class=\"end\">st</u></em> of living is lower than in Ho Chi Minh City, the air is fresh, and the traffi<u class=\"end\">c</u> is no<u class=\"end\">t</u> ba<u class=\"end\">d</u>, so people do<u class=\"end\">n&#x27;t</u> spe<u class=\"end\">nd</u> hou<u class=\"end\">rs</u> on the roa<u class=\"end\">d</u> every day. It has a goo<u class=\"end\">d</u> bala<u class=\"end\">nce</u> between wo<u class=\"end\">rk</u> and relaxation, so it is goo<u class=\"end\">d</u> for young people, familie<u class=\"end\">s</u> and <em class=\"red past\">retire<u class=\"end\">d</u></em> people.</span>", "<span class=\"p2lbl\">TL</span>  <span lang=\"en\" class=\"p2en\">Maybe one day, I will move there and wo<u class=\"end\">rk</u> remotely.</span>"]}, {"topics": [{"n": "36", "t": "Describe a crowded place you have been to"}], "q": ["<b>Đổi:</b> mở rộng đoạn cầu Rồng.", "<span lang=\"en\" class=\"p2en\">The mo<u class=\"end\">st</u> crowde<u class=\"end\">d</u> pla<u class=\"end\">ce</u> I know in Đà Nẵng is the area arou<u class=\"end\">nd</u> the Dragon Bridge on weeke<u class=\"end\">nd</u> ni<u class=\"end\">ghts</u>. When the bridge breathe<u class=\"end\">s</u> fire and water, thousa<u class=\"end\">nds</u> of people sta<u class=\"end\">nd</u> on both side<u class=\"end\">s</u> of the river to watch. It&#x27;s ha<u class=\"end\">rd</u> to fi<u class=\"end\">nd</u> a parking spa<u class=\"end\">ce</u>, and you have to sta<u class=\"end\">nd</u> very clo<u class=\"end\">se</u> to strange<u class=\"end\">rs</u>.</span>", "<b>Cảm xúc:</b> <span lang=\"en\" class=\"p2en\">It&#x27;s a bi<u class=\"end\">t</u> tiring, but I still enjoy it, becau<u class=\"end\">se</u> the atmosphere is very exciting.</span>"]}, {"topics": [{"n": "54", "t": "Describe a foreign country you would like to stay or work for a short period of time"}], "q": ["<b>Đổi:</b> đề hỏi nước ngoài → đổi thành Thái Lan (Bangkok), giữ khung QK → HT → TL.", "<span class=\"p2lbl\">QK</span>  <span lang=\"en\" class=\"p2en\">I <em class=\"red past\">we<u class=\"end\">nt</u></em> to Bangko<u class=\"end\">k</u> with my family a few yea<u class=\"end\">rs</u> ago, and I also watch a lo<u class=\"end\">t</u> of Thai fi<u class=\"end\">lms</u> and a<u class=\"end\">ds</u>.</span>", "<span class=\"p2lbl\">HT</span>  <span lang=\"en\" class=\"p2en\">Bangko<u class=\"end\">k</u> has beautiful temple<u class=\"end\">s</u>, busy marke<u class=\"end\">ts</u> and deliciou<u class=\"end\">s</u> stree<u class=\"end\">t</u> foo<u class=\"end\">d</u>. There is a Skytrain, so it&#x27;s easy to ge<u class=\"end\">t</u> arou<u class=\"end\">nd</u>. Thai bra<u class=\"end\">nds</u> are very creative, especially in their a<u class=\"end\">ds</u>.</span>", "<span class=\"p2lbl\">TL</span>  <span lang=\"en\" class=\"p2en\">I wou<u class=\"end\">ld</u> li<u class=\"end\">ke</u> to wo<u class=\"end\">rk</u> at a marketing agency in Bangko<u class=\"end\">k</u> for abou<u class=\"end\">t</u> three to si<u class=\"end\">x</u> mo<u class=\"end\">nths</u>, becau<u class=\"end\">se</u> I can learn a lo<u class=\"end\">t</u>. But I only wa<u class=\"end\">nt</u> to stay for a sho<u class=\"end\">rt</u> time, becau<u class=\"end\">se</u> my family is in Vietnam, and the hea<u class=\"end\">t</u> and traffi<u class=\"end\">c</u> there can be tiring.</span>"]}], "main": {"n": "37", "t": "Describe a city you've been to and want to visit again"}, "name": "Mẫu 1 – Đà Nẵng", "short": "Mẫu 1 – Đà Nẵng"}, {"ideas": ["<b>Ở đâu:</b> một làng nhỏ gần Đồng Văn, Hà Giang → một trong những nơi yên tĩnh nhất mình biết.", "<span class=\"p2lbl\">QK</span>  Đi với 2 bạn thân năm ngoái → ở homestay nhỏ giữa núi và ruộng → một sáng dậy trước bình minh, đi dạo một mình → mây phủ núi, chỉ nghe tiếng chim và gió.", "<b>[HT] Trông thế nào:</b> xa đường lớn → rất ít xe, gần như không có tiếng ồn → không khí lạnh, trong lành, mọi thứ tĩnh lặng → nhà làm bằng đất và đá, nhiều nhà có vườn nhỏ trồng ngô, cây đào.", "<b>[HT] Con người:</b> thân thiện, giản dị, trồng lúa, ngô, nuôi trâu, dê → Chủ nhật có chợ phiên, người từ nhiều làng đến mua bán, phụ nữ mặc trang phục truyền thống sặc sỡ.", "<b>[HT] Vì sao thích:</b> sóng điện thoại yếu nên tránh xa điện thoại được → mỗi khi căng thẳng vẫn nghĩ về nơi đó → giúp quên công việc, đầu óc nhẹ nhõm → xem lại ảnh là thấy bình tĩnh.", "<span class=\"p2lbl\">TL</span>  Mong quay lại → lần sau ở lâu hơn (1 tuần), đi vào tháng 11 mùa hoa tam giác mạch."], "para": ["I<u class=\"end\">&#x27;d</u> li<u class=\"end\">ke</u> to ta<u class=\"end\">lk</u> abou<u class=\"end\">t</u> a small village near Đồng Văn in Hà Giang, which is one of the quiete<u class=\"end\">st</u> place<u class=\"end\">s</u> I know.", "<span class=\"p2lbl\">QK</span>  I <em class=\"red past\">we<u class=\"end\">nt</u></em> there with two clo<u class=\"end\">se</u> frie<u class=\"end\">nds</u> la<u class=\"end\">st</u> year. We <em class=\"red past\">staye<u class=\"end\">d</u></em> in a small homestay between the mountai<u class=\"end\">ns</u> and the ri<u class=\"end\">ce</u> fie<u class=\"end\">lds</u>. One morning, I <em class=\"red past\">wo<u class=\"end\">ke</u></em> u<u class=\"end\">p</u> before sunri<u class=\"end\">se</u> and <em class=\"red past\">walke<u class=\"end\">d</u></em> outsi<u class=\"end\">de</u> alone. There <em class=\"red past\">were</em> clou<u class=\"end\">ds</u> all over the mountai<u class=\"end\">ns</u>, and I <em class=\"red past\">cou<u class=\"end\">ld</u></em> only hear the bi<u class=\"end\">rds</u> and the wi<u class=\"end\">nd</u>.", "<span class=\"p2lbl\">HT</span>  The village is far from the main roa<u class=\"end\">d</u>, so there are very few vehicle<u class=\"end\">s</u> and almo<u class=\"end\">st</u> no traffi<u class=\"end\">c</u> noi<u class=\"end\">se</u>. The air is co<u class=\"end\">ld</u> and fresh, and everything is very still. The house<u class=\"end\">s</u> there are ma<u class=\"end\">de</u> of earth and stone, and many familie<u class=\"end\">s</u> have small garde<u class=\"end\">ns</u> with corn and peach tree<u class=\"end\">s</u>.", "The local people are friendly and simple. They grow ri<u class=\"end\">ce</u> and corn, and they kee<u class=\"end\">p</u> buffaloes and goa<u class=\"end\">ts</u>. On Sunday<u class=\"end\">s</u>, there is a local marke<u class=\"end\">t</u> where people from differe<u class=\"end\">nt</u> village<u class=\"end\">s</u> come to buy and sell thi<u class=\"end\">ngs</u>, and the women wear colourful traditional clothe<u class=\"end\">s</u>.", "The interne<u class=\"end\">t</u> is qui<u class=\"end\">te</u> wea<u class=\"end\">k</u> in some place<u class=\"end\">s</u>, so I can really stay away from my phone. Whenever I feel stresse<u class=\"end\">d</u> at wo<u class=\"end\">rk</u>, I still thi<u class=\"end\">nk</u> abou<u class=\"end\">t</u> that pla<u class=\"end\">ce</u>. It he<u class=\"end\">lps</u> me forge<u class=\"end\">t</u> abou<u class=\"end\">t</u> wo<u class=\"end\">rk</u> and clear my mi<u class=\"end\">nd</u>. Sometime<u class=\"end\">s</u> I loo<u class=\"end\">k</u> at my photo<u class=\"end\">s</u> from the tri<u class=\"end\">p</u>, and I feel calm again.", "<span class=\"p2lbl\">TL</span>  I ho<u class=\"end\">pe</u> I will go ba<u class=\"end\">ck</u> there one day. Ne<u class=\"end\">xt</u> time, I&#x27;m going to stay longer, maybe one wee<u class=\"end\">k</u>, and I will go in November, when the buckwhea<u class=\"end\">t</u> flowe<u class=\"end\">rs</u> are in bloom."], "past": "went · stayed · woke up · walked · were · could", "alts": [{"topics": [{"n": "29", "t": "Describe a home that you like to visit but did not want to live in"}], "q": ["<b>Đổi:</b> tập trung vào ngôi nhà homestay.", "<span class=\"p2lbl\">HT</span>  <span lang=\"en\" class=\"p2en\">The homestay is the home of a H&#x27;Mông family. It is a traditional hou<u class=\"end\">se</u> ma<u class=\"end\">de</u> of earth and woo<u class=\"end\">d</u>, with a small garden and a kitchen with an open fire. The family is very ki<u class=\"end\">nd</u>, and they coo<u class=\"end\">k</u> deliciou<u class=\"end\">s</u> local foo<u class=\"end\">d</u> for gue<u class=\"end\">sts</u>.</span>", "<b>Vì sao không muốn ở:</b> <span lang=\"en\" class=\"p2en\">However, I wou<u class=\"end\">ldn&#x27;t</u> wa<u class=\"end\">nt</u> to live there. It&#x27;s very far from the city, it&#x27;s very co<u class=\"end\">ld</u> in winter, and the interne<u class=\"end\">t</u> is wea<u class=\"end\">k</u>, so it&#x27;s difficu<u class=\"end\">lt</u> for me to wo<u class=\"end\">rk</u>.</span>", "<span class=\"p2lbl\">TL</span>  <span lang=\"en\" class=\"p2en\">I&#x27;m going to visi<u class=\"end\">t</u> that family again, but only for a few day<u class=\"end\">s</u>.</span>"]}, {"topics": [{"n": "47", "t": "Describe a place you have visited where you can see interesting animals"}], "q": ["<b>Đổi:</b> mở rộng phần động vật của dân làng.", "<span lang=\"en\" class=\"p2en\">The mo<u class=\"end\">st</u> interesting anima<u class=\"end\">ls</u> there are the goa<u class=\"end\">ts</u>. They can climb on very stee<u class=\"end\">p</u> ro<u class=\"end\">cks</u>, and they never fall. Local children ri<u class=\"end\">de</u> buffaloes to the fie<u class=\"end\">lds</u> every morning, which is very rare to see in the city. There are also small horse<u class=\"end\">s</u>, and people u<u class=\"end\">se</u> them to carry corn on the mountain roa<u class=\"end\">ds</u>.</span>"]}, {"topics": [{"n": "19", "t": "Describe an unusual holiday or vacation you went on"}], "q": ["<b>Đổi:</b> nhấn mạnh điểm khác thường của chuyến đi.", "<span class=\"p2lbl\">QK</span>  <span lang=\"en\" class=\"p2en\">It <em class=\"red past\">was</em> unusual becau<u class=\"end\">se</u> we <em class=\"red past\">travelle<u class=\"end\">d</u></em> by motorbi<u class=\"end\">ke</u> on mountain roa<u class=\"end\">ds</u>, li<u class=\"end\">ke</u> the Mã Pí Lèng Pa<u class=\"end\">ss</u>. We <em class=\"red past\">di<u class=\"end\">dn&#x27;t</u></em> stay in a hotel. We <em class=\"red past\">staye<u class=\"end\">d</u></em> with a local family, and there <em class=\"red past\">was</em> almo<u class=\"end\">st</u> no interne<u class=\"end\">t</u>.</span>", "<span class=\"p2lbl\">HT</span>  <span lang=\"en\" class=\"p2en\">Now, when I thi<u class=\"end\">nk</u> abou<u class=\"end\">t</u> it, I feel it <em class=\"red past\">was</em> the be<u class=\"end\">st</u> holiday of my life, becau<u class=\"end\">se</u> I really disconnecte<u class=\"end\">d</u> from my phone and my wo<u class=\"end\">rk</u>.</span>"]}], "main": {"n": "23", "t": "Describe a quiet place that you like to go to"}, "name": "Mẫu 2 – Làng Nhỏ Gần Đồng Văn, Hà Giang", "short": "Mẫu 2 – Hà Giang"}, {"ideas": ["<b>Ở đâu:</b> Landmark 81 – tòa nhà cao nhất Việt Nam, quận Bình Thạnh, cạnh sông Sài Gòn.", "<span class=\"p2lbl\">QK</span>  Lần đầu đến vài năm trước, ngay sau khi mở cửa.", "<b>[HT] Trông thế nào:</b> rất cao, mảnh, phủ kính → lấp lánh ban ngày, đèn màu ban đêm, nhìn thấy từ nhiều nơi.", "<b>[HT] Bên trong:</b> trung tâm thương mại, siêu thị, rạp phim, nhà hàng; trên đỉnh có đài quan sát nhìn cả thành phố.", "<b>[HT] Mình làm gì:</b> cuối tuần đi với bạn bè hoặc gia đình → mua sắm, ăn tối → đi dạo công viên cạnh sông, ngắm hoàng hôn → công viên rộng, trẻ con chạy chơi, nhiều gia đình ra chơi buổi tối.", "<b>[HT] Điểm trừ:</b> cuối tuần rất đông, khó gửi xe, chờ bàn lâu.", "<b>[HT] Vì sao thích:</b> cho thấy TP.HCM hiện đại → ví dụ đẹp về kiến trúc hiện đại ở Việt Nam.", "<span class=\"p2lbl\">TL</span>  Tháng sau dẫn bố mẹ lên đài quan sát."], "para": ["The pla<u class=\"end\">ce</u> I<u class=\"end\">&#x27;d</u> li<u class=\"end\">ke</u> to ta<u class=\"end\">lk</u> abou<u class=\"end\">t</u> is Landma<u class=\"end\">rk</u> 81, which is the talle<u class=\"end\">st</u> building in Vietnam.", "<span class=\"p2lbl\">QK</span>  I <em class=\"red past\">we<u class=\"end\">nt</u></em> there for the fi<u class=\"end\">rst</u> time a few yea<u class=\"end\">rs</u> ago, soon after it <em class=\"red past\">opene<u class=\"end\">d</u></em>.", "<span class=\"p2lbl\">HT</span>  It is in Bình Thạnh Distri<u class=\"end\">ct</u> in Ho Chi Minh City, ne<u class=\"end\">xt</u> to the Saigon River. The building is very tall and thin, and it is covere<u class=\"end\">d</u> with gla<u class=\"end\">ss</u>, so it shine<u class=\"end\">s</u> in the sun. At ni<u class=\"end\">ght</u>, it has colourful li<u class=\"end\">ghts</u>, and you can see it from many pa<u class=\"end\">rts</u> of the city. Insi<u class=\"end\">de</u>, there is a big shopping mall, a supermarke<u class=\"end\">t</u>, a cinema and many restaura<u class=\"end\">nts</u>. At the to<u class=\"end\">p</u>, there is an observation de<u class=\"end\">ck</u> where you can see the whole city.", "These day<u class=\"end\">s</u>, I usually go there at weeke<u class=\"end\">nds</u> with my frie<u class=\"end\">nds</u> or my family. We go shopping, have dinner and then wa<u class=\"end\">lk</u> in the pa<u class=\"end\">rk</u> ne<u class=\"end\">xt</u> to the building. The pa<u class=\"end\">rk</u> is large and green, and it is a goo<u class=\"end\">d</u> pla<u class=\"end\">ce</u> to watch the sunse<u class=\"end\">t</u> by the river. There is a lo<u class=\"end\">t</u> of spa<u class=\"end\">ce</u> for children to run and play, so many familie<u class=\"end\">s</u> go there in the evening.", "However, at weeke<u class=\"end\">nds</u> it is very crowde<u class=\"end\">d</u>, especially in the evening. It is difficu<u class=\"end\">lt</u> to fi<u class=\"end\">nd</u> a parking spa<u class=\"end\">ce</u>, and you sometime<u class=\"end\">s</u> have to wai<u class=\"end\">t</u> a long time for a table. Still, I li<u class=\"end\">ke</u> this pla<u class=\"end\">ce</u> becau<u class=\"end\">se</u> it sho<u class=\"end\">ws</u> how modern Ho Chi Minh City is. I thi<u class=\"end\">nk</u> it is also a goo<u class=\"end\">d</u> example of modern design in Vietnam.", "<span class=\"p2lbl\">TL</span>  Ne<u class=\"end\">xt</u> month, I&#x27;m going to ta<u class=\"end\">ke</u> my pare<u class=\"end\">nts</u> to the observation de<u class=\"end\">ck</u>, becau<u class=\"end\">se</u> they wa<u class=\"end\">nt</u> to see the city from above. I thi<u class=\"end\">nk</u> they will love it."], "past": "went · opened", "alts": [{"topics": [{"n": "38", "t": "Describe a shop/store you enjoy visiting"}], "q": ["<b>Đổi:</b> thu hẹp lại một cửa hàng trong tòa nhà là siêu thị ở tầng hầm.", "<span lang=\"en\" class=\"p2en\">My favouri<u class=\"end\">te</u> sho<u class=\"end\">p</u> there is the supermarke<u class=\"end\">t</u> in the baseme<u class=\"end\">nt</u>. I go there abou<u class=\"end\">t</u> o<u class=\"end\">nce</u> a wee<u class=\"end\">k</u> to buy foo<u class=\"end\">d</u> for the wee<u class=\"end\">k</u>. I li<u class=\"end\">ke</u> it becau<u class=\"end\">se</u> it is clean, the price<u class=\"end\">s</u> are reasonable, and the staff are very friendly. They alway<u class=\"end\">s</u> he<u class=\"end\">lp</u> me fi<u class=\"end\">nd</u> what I nee<u class=\"end\">d</u>.</span>"]}, {"topics": [{"n": "36", "t": "Describe a crowded place you have been to"}], "q": ["<b>Đổi:</b> mở rộng đoạn \"crowded\".", "<span lang=\"en\" class=\"p2en\">It is crowde<u class=\"end\">d</u> becau<u class=\"end\">se</u> it has everything in one pla<u class=\"end\">ce</u>: shopping, foo<u class=\"end\">d</u> and a big pa<u class=\"end\">rk</u>. On publi<u class=\"end\">c</u> holiday<u class=\"end\">s</u>, there are thousa<u class=\"end\">nds</u> of people, and the roa<u class=\"end\">ds</u> arou<u class=\"end\">nd</u> it have traffi<u class=\"end\">c</u> ja<u class=\"end\">ms</u>.</span>"]}], "main": {"n": "62", "t": "Describe a tall building in your town that you like or dislike"}, "name": "Mẫu 3 – Landmark 81", "short": "Mẫu 3 – Landmark 81"}]}, "p2_3": {"name": "Đồ vật & Media", "title": "Nhóm 3 – ĐỒ VẬT, MEDIA & KIẾN THỨC (Objects / Media)", "tips": ["<b>Mẹo nhóm này:</b> khi kể nội dung phim hoặc video, người bản xứ cũng dùng thì hiện tại (<i>The film is about… The father argues…</i>). Cách nói này hoàn toàn đúng, nên cứ dùng."], "samples": [{"ideas": ["<b>Là gì:</b> chiếc laptop.", "<span class=\"p2lbl\">QK</span>  Mua năm 2 đại học → muốn tự mua bằng tiền mình → đi dạy kèm tiếng Anh, tiết kiệm 6 tháng → giá khoảng 15 triệu.", "<b>[HT] Dùng làm gì:</b> học, làm việc, xem phim, nói chuyện với bạn. Màu bạc, nhẹ, mang đi đâu cũng được → vài miếng sticker trên nắp, một phím hơi lỏng, vẫn chạy tốt dù hơi chậm.", "<b>[HT] Vì sao đặc biệt:</b> món đồ đắt tiền đầu tiên tự trả tiền → mỗi lần mở máy thấy tự hào → gợi nhớ thời sinh viên: trong thư mục cũ vẫn còn bài tập, ảnh với bạn cùng lớp → giữ gìn cẩn thận.", "<b>[HT] Nhận xét chung:</b> laptop là phát minh hữu ích → làm và học ở đâu cũng được → nhiều bạn trẻ làm freelancer chỉ với laptop và internet.", "<span class=\"p2lbl\">TL</span>  Năm sau mua laptop mới cho công việc, nhưng vẫn giữ máy cũ vì nó có ý nghĩa đặc biệt."], "para": ["I<u class=\"end\">&#x27;d</u> li<u class=\"end\">ke</u> to ta<u class=\"end\">lk</u> abou<u class=\"end\">t</u> my lapto<u class=\"end\">p</u>.", "<span class=\"p2lbl\">QK</span>  I <em class=\"red past\">bou<u class=\"end\">ght</u></em> it when I <em class=\"red past\">was</em> a seco<u class=\"end\">nd</u>-year university stude<u class=\"end\">nt</u>. I <em class=\"red past\">wante<u class=\"end\">d</u></em> to buy it with my own money, so I <em class=\"red past\">worke<u class=\"end\">d</u></em> as an English tutor and <em class=\"red past\">save<u class=\"end\">d</u></em> money for abou<u class=\"end\">t</u> si<u class=\"end\">x</u> mo<u class=\"end\">nths</u>. It <em class=\"red past\">co<u class=\"end\">st</u></em> abou<u class=\"end\">t</u> 15 million đồng.", "<span class=\"p2lbl\">HT</span>  Now I u<u class=\"end\">se</u> it for almo<u class=\"end\">st</u> everything: studying, working, watching fi<u class=\"end\">lms</u> and talking to my frie<u class=\"end\">nds</u> online. It&#x27;s a silver lapto<u class=\"end\">p</u>, and it is qui<u class=\"end\">te</u> li<u class=\"end\">ght</u>, so I can ta<u class=\"end\">ke</u> it everywhere. It has a few sticke<u class=\"end\">rs</u> on the cover, and one key is a little loo<u class=\"end\">se</u>, but it still wo<u class=\"end\">rks</u> well, although it is a bi<u class=\"end\">t</u> slow these day<u class=\"end\">s</u>.", "It is special to me becau<u class=\"end\">se</u> it is the fi<u class=\"end\">rst</u> expensive thing that I <em class=\"red past\">pai<u class=\"end\">d</u></em> for by myself. Every time I open it, I feel prou<u class=\"end\">d</u>. It also remi<u class=\"end\">nds</u> me of my stude<u class=\"end\">nt</u> day<u class=\"end\">s</u>. In some o<u class=\"end\">ld</u> folde<u class=\"end\">rs</u>, I can still see my assignme<u class=\"end\">nts</u> and photo<u class=\"end\">s</u> with my classmate<u class=\"end\">s</u>. I ta<u class=\"end\">ke</u> very goo<u class=\"end\">d</u> care of it, becau<u class=\"end\">se</u> I know how ha<u class=\"end\">rd</u> it is to save that much money.", "In my opinion, the lapto<u class=\"end\">p</u> is one of the mo<u class=\"end\">st</u> useful inventio<u class=\"end\">ns</u>. It he<u class=\"end\">lps</u> people wo<u class=\"end\">rk</u> and study anywhere, and it make<u class=\"end\">s</u> communication much easier. Many young people in Vietnam even wo<u class=\"end\">rk</u> as freelance<u class=\"end\">rs</u> with ju<u class=\"end\">st</u> a lapto<u class=\"end\">p</u> and an interne<u class=\"end\">t</u> connection.", "<span class=\"p2lbl\">TL</span>  Ne<u class=\"end\">xt</u> year, I&#x27;m going to buy a new lapto<u class=\"end\">p</u> for wo<u class=\"end\">rk</u>, but I will kee<u class=\"end\">p</u> this o<u class=\"end\">ld</u> one, becau<u class=\"end\">se</u> it has a special meaning to me."], "past": "bought · was · wanted · worked · saved · cost · paid", "alts": [{"topics": [{"n": "65", "t": "Describe an invention that changed people's lives in a positive way"}], "q": ["<b>Đổi:</b> bỏ phần quá khứ cá nhân, nói về laptop hoặc smartphone nói chung.", "<span lang=\"en\" class=\"p2en\">A smartphone can do almo<u class=\"end\">st</u> everything: ca<u class=\"end\">lls</u>, message<u class=\"end\">s</u>, ma<u class=\"end\">ps</u>, banking and online meeti<u class=\"end\">ngs</u>. It is popular with all age<u class=\"end\">s</u>. Young people u<u class=\"end\">se</u> it to study and play game<u class=\"end\">s</u>, adu<u class=\"end\">lts</u> u<u class=\"end\">se</u> it for wo<u class=\"end\">rk</u>, and older people u<u class=\"end\">se</u> it to ma<u class=\"end\">ke</u> video ca<u class=\"end\">lls</u> with their grandchildren. I thi<u class=\"end\">nk</u> it change<u class=\"end\">s</u> people<u class=\"end\">&#x27;s</u> live<u class=\"end\">s</u> becau<u class=\"end\">se</u> it make<u class=\"end\">s</u> communication and information much faster.</span>", "<span class=\"p2lbl\">TL</span>  <span lang=\"en\" class=\"p2en\">In the future, I thi<u class=\"end\">nk</u> smartphone<u class=\"end\">s</u> will become even smarter with AI.</span>"]}, {"topics": [{"n": "21", "t": "Describe a time when you had a problem with using the computer"}, {"n": "53", "t": "Describe a problem of technology you have encountered, like a computer or a cell phone"}], "q": ["<b>Đổi:</b> dùng chính chiếc laptop này, kể theo khung QK → HT → TL.", "<span class=\"p2lbl\">QK</span>  <span lang=\"en\" class=\"p2en\">La<u class=\"end\">st</u> month, the ni<u class=\"end\">ght</u> before an importa<u class=\"end\">nt</u> presentation, my lapto<u class=\"end\">p</u> suddenly <em class=\"red past\">stoppe<u class=\"end\">d</u></em> working. I <em class=\"red past\">trie<u class=\"end\">d</u></em> to resta<u class=\"end\">rt</u> it many time<u class=\"end\">s</u>, but it <em class=\"red past\">di<u class=\"end\">dn&#x27;t</u></em> wo<u class=\"end\">rk</u>. The ne<u class=\"end\">xt</u> morning, I <em class=\"red past\">too<u class=\"end\">k</u></em> it to a repair sho<u class=\"end\">p</u>, and they <em class=\"red past\">change<u class=\"end\">d</u></em> the ha<u class=\"end\">rd</u> drive. Luckily, I <em class=\"red past\">save<u class=\"end\">d</u></em> my file<u class=\"end\">s</u> on Google Drive, so I still <em class=\"red past\">ha<u class=\"end\">d</u></em> my presentation.</span>", "<span class=\"p2lbl\">HT</span>  <span lang=\"en\" class=\"p2en\">Now I alway<u class=\"end\">s</u> save my file<u class=\"end\">s</u> online, and I che<u class=\"end\">ck</u> my lapto<u class=\"end\">p</u> regularly.</span>", "<span class=\"p2lbl\">TL</span>  <span lang=\"en\" class=\"p2en\">Ne<u class=\"end\">xt</u> time, I will be more careful, and I will alway<u class=\"end\">s</u> have a backu<u class=\"end\">p</u>.</span>"]}], "main": {"n": "52", "t": "Describe something special that you saved money to buy"}, "name": "Mẫu 1 – Chiếc Laptop", "short": "Mẫu 1 – Chiếc laptop"}, {"ideas": ["<b>Là gì:</b> phim Việt \"Bố Già\" – tên tiếng Anh \"Dad, I'm Sorry\".", "<span class=\"p2lbl\">QK</span>  Xem ở rạp với gia đình vài năm trước.", "<b>[HT] Nội dung:</b> gia đình nghèo trong hẻm nhỏ ở Sài Gòn. Nhân vật chính: ông Ba Sang – tốt bụng nhưng rất cứng đầu, hay cãi nhau với con trai là YouTuber trẻ → chủ yếu về cuộc sống hằng ngày và khoảng cách thế hệ → đạo diễn Trấn Thành đóng luôn vai bố, là danh hài nên diễn rất tự nhiên, hài hước.", "<b>[HT] Vì sao buồn cười:</b> nửa đầu rất hài → nói chuyện hài hước, nhiều tình huống ngớ ngẩn trong hẻm (hàng xóm cãi nhau chuyện nhỏ) → rất thật, giống đời sống trong hẻm ở TP.HCM → giờ nhớ lại 2 anh em vẫn cười.", "<span class=\"p2lbl\">HT</span>  Nửa sau buồn, nhiều người khóc → vừa hài vừa ý nghĩa → nhắc mình dành thời gian cho bố mẹ, biết nói xin lỗi → một trong những phim Việt thành công nhất.", "<span class=\"p2lbl\">TL</span>  Tết này xem lại với bố mẹ; mong Việt Nam có thêm phim như vậy."], "para": ["I<u class=\"end\">&#x27;d</u> li<u class=\"end\">ke</u> to ta<u class=\"end\">lk</u> abou<u class=\"end\">t</u> a Vietname<u class=\"end\">se</u> film calle<u class=\"end\">d</u> \"Bố Già\", or \"Da<u class=\"end\">d</u>, I&#x27;m Sorry\" in English.", "<span class=\"p2lbl\">QK</span>  I <em class=\"red past\">watche<u class=\"end\">d</u></em> it at a cinema with my family a few yea<u class=\"end\">rs</u> ago.", "<span class=\"p2lbl\">HT</span>  The film is abou<u class=\"end\">t</u> a poor family who live in a small alley in Saigon. The main character is a father calle<u class=\"end\">d</u> Ba <em class=\"red past\">Sang</em>. He is ki<u class=\"end\">nd</u> but very stubborn, and he often argue<u class=\"end\">s</u> with his son, who is a young YouTuber. Mo<u class=\"end\">st</u> of the film is abou<u class=\"end\">t</u> their daily life and the proble<u class=\"end\">ms</u> between the two generatio<u class=\"end\">ns</u>. The director, Trấn Thành, also play<u class=\"end\">s</u> the father. He is a famou<u class=\"end\">s</u> comedian, so his acting is very natural and funny.", "The fi<u class=\"end\">rst</u> half of the film is really funny. The characte<u class=\"end\">rs</u> ta<u class=\"end\">lk</u> in a funny way, and there are many silly situatio<u class=\"end\">ns</u> in the alley, for example, when the neighbou<u class=\"end\">rs</u> argue abou<u class=\"end\">t</u> very small thi<u class=\"end\">ngs</u>. These scene<u class=\"end\">s</u> feel very real, becau<u class=\"end\">se</u> they are ju<u class=\"end\">st</u> li<u class=\"end\">ke</u> life in many alley<u class=\"end\">s</u> in Ho Chi Minh City. My brother and I laugh every time we remember them.", "But the seco<u class=\"end\">nd</u> half is qui<u class=\"end\">te</u> sa<u class=\"end\">d</u>, and many people cry at the e<u class=\"end\">nd</u>. I li<u class=\"end\">ke</u> this film becau<u class=\"end\">se</u> it is both funny and meaningful. It remi<u class=\"end\">nds</u> me to spe<u class=\"end\">nd</u> more time with my pare<u class=\"end\">nts</u> and to say sorry when I ma<u class=\"end\">ke</u> a mista<u class=\"end\">ke</u>. It is also one of the mo<u class=\"end\">st</u> successful Vietname<u class=\"end\">se</u> fi<u class=\"end\">lms</u> ever.", "<span class=\"p2lbl\">TL</span>  I&#x27;m going to watch it again with my pare<u class=\"end\">nts</u> this Tết, and I ho<u class=\"end\">pe</u> Vietnam will ma<u class=\"end\">ke</u> more fi<u class=\"end\">lms</u> li<u class=\"end\">ke</u> this in the future."], "past": "watched", "alts": [{"topics": [{"n": "41", "t": "Describe a movie you watched recently that you felt disappointed about"}], "q": ["<b>Đổi:</b> giữ khung, đổi sang một phim gây thất vọng, đổi cảm xúc.", "<span class=\"p2lbl\">QK</span>  <span lang=\"en\" class=\"p2en\">La<u class=\"end\">st</u> month, I <em class=\"red past\">watche<u class=\"end\">d</u></em> a new action film at the cinema with my frie<u class=\"end\">nds</u>. I <em class=\"red past\">decide<u class=\"end\">d</u></em> to watch it becau<u class=\"end\">se</u> the trailer <em class=\"red past\">looke<u class=\"end\">d</u></em> exciting, and it <em class=\"red past\">ha<u class=\"end\">d</u></em> many famou<u class=\"end\">s</u> acto<u class=\"end\">rs</u>.</span>", "<span class=\"p2lbl\">HT</span>  <span lang=\"en\" class=\"p2en\">But the story is too long and predictable, and the ending is boring. The acto<u class=\"end\">rs</u> are goo<u class=\"end\">d</u>, but the scri<u class=\"end\">pt</u> is wea<u class=\"end\">k</u>.</span>", "<span class=\"p2lbl\">TL</span>  <span lang=\"en\" class=\"p2en\">Ne<u class=\"end\">xt</u> time, I will rea<u class=\"end\">d</u> revie<u class=\"end\">ws</u> before I go to the cinema.</span>"]}, {"topics": [{"n": "2", "t": "Describe an online video in which you learned something new"}], "q": ["<b>Đổi:</b> đổi thành video YouTube về cách dùng AI để học tiếng Anh.", "<span class=\"p2lbl\">QK</span>  <span lang=\"en\" class=\"p2en\">La<u class=\"end\">st</u> month, I <em class=\"red past\">watche<u class=\"end\">d</u></em> a YouTube video at home in the evening. I <em class=\"red past\">watche<u class=\"end\">d</u></em> it becau<u class=\"end\">se</u> I <em class=\"red past\">wante<u class=\"end\">d</u></em> to u<u class=\"end\">se</u> AI better for my studie<u class=\"end\">s</u>.</span>", "<span class=\"p2lbl\">HT</span>  <span lang=\"en\" class=\"p2en\">The video explai<u class=\"end\">ns</u> how to wri<u class=\"end\">te</u> clear pro<u class=\"end\">mpts</u>. For example, instea<u class=\"end\">d</u> of \"teach me vocabulary\", you can say \"a<u class=\"end\">ct</u> as an English teacher and give me 10 wo<u class=\"end\">rds</u> abou<u class=\"end\">t</u> travel\". Now I u<u class=\"end\">se</u> AI to practi<u class=\"end\">se</u> speaking every day.</span>", "<span class=\"p2lbl\">TL</span>  <span lang=\"en\" class=\"p2en\">I&#x27;m going to watch more video<u class=\"end\">s</u> from this channel.</span>"]}], "main": {"n": "61", "t": "Describe a film or movie that made you laugh"}, "name": "Mẫu 2 – Phim Bố Già", "short": "Mẫu 2 – Phim Bố Già"}, {"ideas": ["<b>Là gì:</b> chiếc radio cũ của ông.", "<span class=\"p2lbl\">QK</span>  Ông mua vào những năm 1980 → lúc đó cuộc sống rất khó khăn, ít nhà có radio.", "<b>[HT] Hiện giờ:</b> radio nhỏ màu nâu, 2 núm vặn tròn to, ăng-ten kim loại dài → không còn chạy → bố vẫn để trên kệ phòng khách → thỉnh thoảng lau chùi, kể chuyện ngày xưa.", "<b>[HT] Câu chuyện:</b> ông nói radio giống \"internet\" thời của ông → cả nhà và hàng xóm tối nào cũng nghe tin tức, nghe nhạc.", "<b>[HT] Vì sao quan trọng:</b> nhắc nhớ về ông và cuộc sống khó khăn ngày xưa → mỗi lần nhìn thấy, biết ơn hiện tại → người trẻ có smartphone thấy lạ, nhưng với gia đình đây là báu vật.", "<b>[HT] Quan điểm:</b> nhiều nhà bỏ đồ cũ mua đồ mới → nhà mình nghĩ đồ cũ có câu chuyện thì đáng giữ, vì nó kết nối mình với quá khứ.", "<span class=\"p2lbl\">TL</span>  Sau này giữ trong nhà mình, cho con xem và kể lại những câu chuyện đó."], "para": ["I<u class=\"end\">&#x27;d</u> li<u class=\"end\">ke</u> to ta<u class=\"end\">lk</u> abou<u class=\"end\">t</u> an o<u class=\"end\">ld</u> radio that <em class=\"red past\">belonge<u class=\"end\">d</u></em> to my grandfather.", "<span class=\"p2lbl\">QK</span>  He <em class=\"red past\">bou<u class=\"end\">ght</u></em> it in the 1980<u class=\"end\">s</u>, when life in Vietnam <em class=\"red past\">was</em> very difficu<u class=\"end\">lt</u> and no<u class=\"end\">t</u> many familie<u class=\"end\">s</u> <em class=\"red past\">ha<u class=\"end\">d</u></em> a radio.", "<span class=\"p2lbl\">HT</span>  It&#x27;s a small brown radio with two big rou<u class=\"end\">nd</u> butto<u class=\"end\">ns</u> and a long metal antenna. Now it doe<u class=\"end\">sn&#x27;t</u> wo<u class=\"end\">rk</u> anymore, but my father still kee<u class=\"end\">ps</u> it on a shelf in the living room. Sometime<u class=\"end\">s</u> he clea<u class=\"end\">ns</u> it carefully and te<u class=\"end\">lls</u> u<u class=\"end\">s</u> storie<u class=\"end\">s</u> abou<u class=\"end\">t</u> the o<u class=\"end\">ld</u> day<u class=\"end\">s</u>. My grandfather say<u class=\"end\">s</u> that the radio <em class=\"red past\">was</em> li<u class=\"end\">ke</u> the \"interne<u class=\"end\">t</u>\" of his time, becau<u class=\"end\">se</u> the whole family and even the neighbou<u class=\"end\">rs</u> <em class=\"red past\">listene<u class=\"end\">d</u></em> to the ne<u class=\"end\">ws</u> and musi<u class=\"end\">c</u> on it every evening.", "This radio is importa<u class=\"end\">nt</u> to my family becau<u class=\"end\">se</u> it remi<u class=\"end\">nds</u> u<u class=\"end\">s</u> of my grandfather and of how ha<u class=\"end\">rd</u> life <em class=\"red past\">was</em> in the pa<u class=\"end\">st</u>. Every time I loo<u class=\"end\">k</u> at it, I feel thankful for what I have today. Young people today have smartphone<u class=\"end\">s</u> and lapto<u class=\"end\">ps</u>, so for them, an o<u class=\"end\">ld</u> radio see<u class=\"end\">ms</u> strange. But for my family, it is a treasure.", "These day<u class=\"end\">s</u>, many familie<u class=\"end\">s</u> throw away o<u class=\"end\">ld</u> thi<u class=\"end\">ngs</u> and buy new one<u class=\"end\">s</u>. But my family thi<u class=\"end\">nks</u> that o<u class=\"end\">ld</u> thi<u class=\"end\">ngs</u> with a story are worth keeping, becau<u class=\"end\">se</u> they conne<u class=\"end\">ct</u> u<u class=\"end\">s</u> with the pa<u class=\"end\">st</u>.", "<span class=\"p2lbl\">TL</span>  In the future, I&#x27;m going to kee<u class=\"end\">p</u> this radio in my own home, and I will show it to my children and tell them the same storie<u class=\"end\">s</u>."], "past": "belonged · bought · was · had · listened", "alts": [{"topics": [{"n": "12", "t": "Describe a period in history that you are interested in"}], "q": ["<b>Đổi:</b> lấy chính giai đoạn những năm 1980 trong bài.", "<span lang=\"en\" class=\"p2en\">I&#x27;m intereste<u class=\"end\">d</u> in Vietnam in the 1980<u class=\"end\">s</u>. I learn abou<u class=\"end\">t</u> it from my grandfathe<u class=\"end\">r&#x27;s</u> storie<u class=\"end\">s</u> and from boo<u class=\"end\">ks</u>. At that time, life <em class=\"red past\">was</em> very ha<u class=\"end\">rd</u>: people <em class=\"red past\">di<u class=\"end\">dn&#x27;t</u></em> have enough foo<u class=\"end\">d</u>, and they <em class=\"red past\">ha<u class=\"end\">d</u></em> to wai<u class=\"end\">t</u> in long line<u class=\"end\">s</u> to buy ri<u class=\"end\">ce</u>. I&#x27;m intereste<u class=\"end\">d</u> in this perio<u class=\"end\">d</u> becau<u class=\"end\">se</u> it he<u class=\"end\">lps</u> me understa<u class=\"end\">nd</u> my family and how much our country is changing.</span>", "<span class=\"p2lbl\">TL</span>  <span lang=\"en\" class=\"p2en\">I&#x27;m going to rea<u class=\"end\">d</u> more boo<u class=\"end\">ks</u> abou<u class=\"end\">t</u> this perio<u class=\"end\">d</u>.</span>"]}, {"topics": [{"n": "8", "t": "Describe an impressive work of art (such as a painting) you saw"}], "q": ["<b>Đổi:</b> đổi đồ vật thành bức tranh cũ treo ở nhà ông bà, giữ đoạn \"ông kể chuyện\" và \"vì sao ý nghĩa\".", "<span class=\"p2lbl\">QK</span>  <span lang=\"en\" class=\"p2en\">I fi<u class=\"end\">rst</u> <em class=\"red past\">saw</em> it when I <em class=\"red past\">was</em> a chi<u class=\"end\">ld</u>, in my grandpare<u class=\"end\">nts&#x27;</u> hou<u class=\"end\">se</u> in Bến Tre.</span>", "<span class=\"p2lbl\">HT</span>  <span lang=\"en\" class=\"p2en\">The painting sho<u class=\"end\">ws</u> a small village with a river, coconu<u class=\"end\">t</u> tree<u class=\"end\">s</u> and green ri<u class=\"end\">ce</u> fie<u class=\"end\">lds</u>. The painter is a local arti<u class=\"end\">st</u>, a frie<u class=\"end\">nd</u> of my grandfather. I enjoy it becau<u class=\"end\">se</u> the colou<u class=\"end\">rs</u> are so<u class=\"end\">ft</u> and peaceful, and it remi<u class=\"end\">nds</u> me of my childhoo<u class=\"end\">d</u>.</span>", "<span class=\"p2lbl\">TL</span>  <span lang=\"en\" class=\"p2en\">One day, I wou<u class=\"end\">ld</u> li<u class=\"end\">ke</u> to buy a painting li<u class=\"end\">ke</u> that for my own home.</span>"]}], "main": {"n": "3", "t": "Describe an important old thing that your family has kept for a long time"}, "name": "Mẫu 3 – Chiếc Radio Cũ Của Ông", "short": "Mẫu 3 – Radio của ông"}, {"ideas": ["<b>Món gì:</b> bánh chưng – bánh truyền thống ngày Tết (Tết Nguyên đán).", "<span class=\"p2lbl\">QK</span>  Hồi nhỏ, Tết nào cũng giúp bà gói bánh → cả nhà ngồi quanh bếp lửa canh nồi bánh cả đêm → trời lạnh nhưng kể chuyện, nướng khoai lang → rất vui.", "<b>[HT] Trông thế nào, vị ra sao:</b> bánh vuông, gói lá dong xanh → bên trong: gạo nếp, đậu xanh, thịt ba chỉ → vị mềm, dẻo, hơi mặn, béo → ăn kèm dưa hành → bánh để lâu thì đem rán, giòn và ngon hơn.", "<b>[HT] Cách làm:</b> ngâm gạo và đậu qua đêm → xếp lá, gạo, đậu, thịt vào giữa → gói vuông, buộc lạt tre → luộc khoảng 10 tiếng.", "<b>[HT] Vì sao nổi tiếng:</b> biểu tượng của Tết → truyền thuyết: hình vuông tượng trưng cho đất → miền Nam có bánh tét, tương tự nhưng hình tròn dài.", "<b>[HT] Ngày nay:</b> nhiều gia đình trẻ bận nên mua ở chợ → tiện nhưng hơi buồn → điều quý nhất của bánh chưng là gắn kết gia đình.", "<span class=\"p2lbl\">TL</span>  Tết này gói bánh với gia đình, dạy cháu gói → mong truyền thống này không bao giờ mất."], "para": ["I<u class=\"end\">&#x27;d</u> li<u class=\"end\">ke</u> to ta<u class=\"end\">lk</u> abou<u class=\"end\">t</u> bánh chưng, a traditional foo<u class=\"end\">d</u> that Vietname<u class=\"end\">se</u> people ea<u class=\"end\">t</u> during Tết, the Lunar New Year.", "<span class=\"p2lbl\">QK</span>  When I <em class=\"red past\">was</em> a chi<u class=\"end\">ld</u>, I <em class=\"red past\">helpe<u class=\"end\">d</u></em> my grandmother ma<u class=\"end\">ke</u> bánh chưng every Tết. The whole family <em class=\"red past\">sa<u class=\"end\">t</u></em> arou<u class=\"end\">nd</u> the fire all ni<u class=\"end\">ght</u> and <em class=\"red past\">waite<u class=\"end\">d</u></em> for the cake<u class=\"end\">s</u> to coo<u class=\"end\">k</u>. It <em class=\"red past\">was</em> co<u class=\"end\">ld</u>, but we <em class=\"red past\">to<u class=\"end\">ld</u></em> storie<u class=\"end\">s</u> and <em class=\"red past\">a<u class=\"end\">te</u></em> swee<u class=\"end\">t</u> potatoe<u class=\"end\">s</u>, so it <em class=\"red past\">was</em> really fun.", "<span class=\"p2lbl\">HT</span>  Bánh chưng is a square ca<u class=\"end\">ke</u> wrappe<u class=\"end\">d</u> in green dong leave<u class=\"end\">s</u>. Insi<u class=\"end\">de</u>, there is sticky ri<u class=\"end\">ce</u>, mung bea<u class=\"end\">ns</u> and po<u class=\"end\">rk</u> belly. It taste<u class=\"end\">s</u> so<u class=\"end\">ft</u> and sticky, a little salty and qui<u class=\"end\">te</u> rich. People usually ea<u class=\"end\">t</u> it with pickle<u class=\"end\">d</u> onio<u class=\"end\">ns</u>, so it doe<u class=\"end\">sn&#x27;t</u> feel too heavy. When the ca<u class=\"end\">ke</u> ge<u class=\"end\">ts</u> o<u class=\"end\">ld</u>, many familie<u class=\"end\">s</u> fry it, and it become<u class=\"end\">s</u> crispy and even more deliciou<u class=\"end\">s</u>.", "Making bánh chưng take<u class=\"end\">s</u> a lo<u class=\"end\">t</u> of time. Fi<u class=\"end\">rst</u>, people soa<u class=\"end\">k</u> the ri<u class=\"end\">ce</u> and the bea<u class=\"end\">ns</u> overni<u class=\"end\">ght</u>. Then they pu<u class=\"end\">t</u> the leave<u class=\"end\">s</u>, the ri<u class=\"end\">ce</u>, the bea<u class=\"end\">ns</u> and the po<u class=\"end\">rk</u> together, wra<u class=\"end\">p</u> them into a square sha<u class=\"end\">pe</u> and tie them with bamboo stri<u class=\"end\">ngs</u>. Finally, they boil the cake<u class=\"end\">s</u> for abou<u class=\"end\">t</u> ten hou<u class=\"end\">rs</u>.", "It is famou<u class=\"end\">s</u> becau<u class=\"end\">se</u> it is a symbol of Tết. According to an o<u class=\"end\">ld</u> lege<u class=\"end\">nd</u>, the square sha<u class=\"end\">pe</u> represe<u class=\"end\">nts</u> the Earth. In the South, people ma<u class=\"end\">ke</u> a similar ca<u class=\"end\">ke</u> <em class=\"red past\">calle<u class=\"end\">d</u></em> bánh tét, but it is rou<u class=\"end\">nd</u> and long.", "These day<u class=\"end\">s</u>, many young familie<u class=\"end\">s</u> are too busy, so they ju<u class=\"end\">st</u> buy bánh chưng at the marke<u class=\"end\">t</u>. I thi<u class=\"end\">nk</u> it&#x27;s convenie<u class=\"end\">nt</u>, but it&#x27;s a little sa<u class=\"end\">d</u>, becau<u class=\"end\">se</u> for me, the be<u class=\"end\">st</u> thing abou<u class=\"end\">t</u> bánh chưng is that it bri<u class=\"end\">ngs</u> the whole family together.", "<span class=\"p2lbl\">TL</span>  This Tết, I&#x27;m going to ma<u class=\"end\">ke</u> bánh chưng with my family again, and I will teach my little nie<u class=\"end\">ce</u> how to wra<u class=\"end\">p</u> it. I ho<u class=\"end\">pe</u> this tradition will never disappear."], "past": "was · helped · sat · waited · told · ate", "alts": [{"topics": [{"n": "6", "t": "Describe a time when you prepared for a happy event successfully"}], "q": ["<b>Đổi:</b> kể việc chuẩn bị Tết, lấy gói bánh chưng làm trọng tâm.", "<span class=\"p2lbl\">QK</span>  <span lang=\"en\" class=\"p2en\">La<u class=\"end\">st</u> Tết, my family <em class=\"red past\">prepare<u class=\"end\">d</u></em> for the holiday together. We <em class=\"red past\">cleane<u class=\"end\">d</u></em> the hou<u class=\"end\">se</u>, <em class=\"red past\">bou<u class=\"end\">ght</u></em> flowe<u class=\"end\">rs</u> and <em class=\"red past\">ma<u class=\"end\">de</u></em> twenty bánh chưng. It <em class=\"red past\">was</em> tiring, but everything <em class=\"red past\">was</em> ready on time.</span> → giữ đoạn <span class=\"p2lbl\">HT</span>  về cách làm bánh."]}], "main": {"n": "30", "t": "Describe a traditional/ famous food in your hometown or country"}, "short": "Đề 30 – Bánh chưng"}, {"ideas": ["<b>Luật gì:</b> cấm túi nilon dùng một lần ở siêu thị và cửa hàng.", "<span class=\"p2lbl\">QK</span>  Biết đến vấn đề qua một video tin tức về rác nhựa ngoài biển → có con rùa biển ngậm túi nilon → thấy rất buồn.", "<b>[HT] Thực trạng:</b> ở Việt Nam ngày nào cũng dùng túi nilon → mua cà phê, trái cây, giày đều được cho túi → dùng một lần rồi bỏ, trôi ra sông biển → mất hàng trăm năm mới phân hủy.", "<b>[HT] Luật hoạt động thế nào:</b> cửa hàng không được phát túi miễn phí → mang túi vải riêng hoặc trả tiền túi giấy → ai cũng có lợi, nhất là sinh vật biển và thế hệ sau → thành phố sạch hơn.", "<b>[HT] Vì sao là luật tốt:</b> đơn giản, ai cũng làm được → một số nước đã áp dụng và hiệu quả.", "<span class=\"p2lbl\">TL</span>  Lúc đầu thấy bất tiện nhưng sẽ quen nhanh → mong chính phủ sớm áp dụng → bản thân sẽ luôn mang túi riêng khi đi mua sắm."], "para": ["I<u class=\"end\">&#x27;d</u> li<u class=\"end\">ke</u> to introdu<u class=\"end\">ce</u> a law that ba<u class=\"end\">ns</u> single-u<u class=\"end\">se</u> plasti<u class=\"end\">c</u> ba<u class=\"end\">gs</u> in supermarke<u class=\"end\">ts</u> and sho<u class=\"end\">ps</u>.", "<span class=\"p2lbl\">QK</span>  I fi<u class=\"end\">rst</u> <em class=\"red past\">learne<u class=\"end\">d</u></em> abou<u class=\"end\">t</u> this problem when I <em class=\"red past\">watche<u class=\"end\">d</u></em> a ne<u class=\"end\">ws</u> video abou<u class=\"end\">t</u> plasti<u class=\"end\">c</u> in the ocean. It <em class=\"red past\">showe<u class=\"end\">d</u></em> a sea turtle with a plasti<u class=\"end\">c</u> bag in its mouth, and I <em class=\"red past\">fe<u class=\"end\">lt</u></em> really sa<u class=\"end\">d</u>.", "<span class=\"p2lbl\">HT</span>  In Vietnam, people u<u class=\"end\">se</u> plasti<u class=\"end\">c</u> ba<u class=\"end\">gs</u> every day. When you buy a coffee, some frui<u class=\"end\">t</u> or a pair of shoe<u class=\"end\">s</u>, the sho<u class=\"end\">p</u> usually give<u class=\"end\">s</u> you a plasti<u class=\"end\">c</u> bag. Mo<u class=\"end\">st</u> of these ba<u class=\"end\">gs</u> are only use<u class=\"end\">d</u> o<u class=\"end\">nce</u>, and then they e<u class=\"end\">nd</u> u<u class=\"end\">p</u> in rive<u class=\"end\">rs</u> and the sea. They ta<u class=\"end\">ke</u> hundre<u class=\"end\">ds</u> of yea<u class=\"end\">rs</u> to brea<u class=\"end\">k</u> down.", "With this law, sho<u class=\"end\">ps</u> ca<u class=\"end\">n&#x27;t</u> give free plasti<u class=\"end\">c</u> ba<u class=\"end\">gs</u>. Instea<u class=\"end\">d</u>, people bring their own cloth ba<u class=\"end\">gs</u>, or they pay for a paper bag. Everyone benefi<u class=\"end\">ts</u> from this law, especially sea anima<u class=\"end\">ls</u> and future generatio<u class=\"end\">ns</u>. Our citie<u class=\"end\">s</u> become cleaner too.", "I thi<u class=\"end\">nk</u> it is a goo<u class=\"end\">d</u> law becau<u class=\"end\">se</u> it is simple, and everyone can follow it. Some countrie<u class=\"end\">s</u> already have this law, and it wo<u class=\"end\">rks</u> well.", "<span class=\"p2lbl\">TL</span>  At fi<u class=\"end\">rst</u>, I thi<u class=\"end\">nk</u> people will feel it is inconvenie<u class=\"end\">nt</u>, but they will ge<u class=\"end\">t</u> use<u class=\"end\">d</u> to it quickly. I really ho<u class=\"end\">pe</u> the governme<u class=\"end\">nt</u> will introdu<u class=\"end\">ce</u> this law soon. Personally, I&#x27;m going to bring my own bag every time I go shopping."], "past": "learned · watched · showed · felt", "alts": [], "main": {"n": "27", "t": "Describe a law of environment protection that you would like to introduce"}, "short": "Đề 27 – Luật túi nilon"}]}, "p2_4": {"name": "Sự kiện", "title": "Nhóm 4 – SỰ KIỆN & TRẢI NGHIỆM (Events / Experiences)", "tips": ["<b>Lưu ý riêng nhóm này:</b> đề hỏi \"a time when…\" nên <b>bắt buộc</b> phải có quá khứ, khoảng 40% bài. Cách giữ an toàn:", "Chỉ dùng <b>quá khứ đơn</b>, mỗi câu một hành động, nối bằng <i>then / so / but</i>.", "<b>Không</b> dùng <i>while I was…</i>, <i>I had lost…</i>, <i>she said she had…</i>", "Kể xong chuyển ngay sang hiện tại: <i>Now this story… / Whenever I…, I…</i>"], "samples": [{"ideas": ["<b>Chuyện gì:</b> có công việc toàn thời gian đầu tiên, khoảng 4 năm trước.", "<span class=\"p2lbl\">QK</span>  Ra trường tìm việc gần 3 tháng → rất lo → được phỏng vấn ở công ty giáo dục → thuyết trình trước 5 quản lý → rất run nhưng cố hết sức → 1 tuần sau nhận email: đậu! → cuối tuần gia đình làm tiệc nhỏ ăn mừng.", "<b>[HT] Công việc bây giờ:</b> là phần quan trọng của cuộc sống → team marketing 6 người → lên kế hoạch quảng cáo cho các khóa tiếng Anh: viết nội dung, xem số liệu, làm với designer → thích nhất lúc chiến dịch hiệu quả, nhiều học viên đăng ký.", "<b>[HT] Thay đổi tích cực:</b> mỗi ngày học điều mới: làm việc nhóm, quản lý thời gian, tự tin nói chuyện với khách → tự lập hơn, tự chi tiêu, phụ giúp bố mẹ.", "<b>[HT] Cảm xúc:</b> mỗi lần nhớ lại thấy biết ơn → bài học: cứ cố gắng thì điều tốt sẽ đến → lúc căng thẳng nhớ rằng giai đoạn khó khăn rồi sẽ qua.", "<span class=\"p2lbl\">TL</span>  Năm sau ứng tuyển trưởng nhóm → thử thách nhưng tin mình làm được."], "para": ["I<u class=\"end\">&#x27;d</u> li<u class=\"end\">ke</u> to ta<u class=\"end\">lk</u> abou<u class=\"end\">t</u> the time I <em class=\"red past\">go<u class=\"end\">t</u></em> my fi<u class=\"end\">rst</u> full-time job, abou<u class=\"end\">t</u> four yea<u class=\"end\">rs</u> ago.", "<span class=\"p2lbl\">QK</span>  After university, I <em class=\"red past\">looke<u class=\"end\">d</u></em> for a job for almo<u class=\"end\">st</u> three mo<u class=\"end\">nths</u>, and I <em class=\"red past\">fe<u class=\"end\">lt</u></em> very worrie<u class=\"end\">d</u>. Then I <em class=\"red past\">go<u class=\"end\">t</u></em> an interview at an education company. I <em class=\"red past\">ha<u class=\"end\">d</u></em> to give a presentation in fro<u class=\"end\">nt</u> of five manage<u class=\"end\">rs</u>. I <em class=\"red past\">was</em> very nervou<u class=\"end\">s</u>, but I <em class=\"red past\">trie<u class=\"end\">d</u></em> my be<u class=\"end\">st</u>. One wee<u class=\"end\">k</u> later, I <em class=\"red past\">go<u class=\"end\">t</u></em> an email from the company, and I <em class=\"red past\">go<u class=\"end\">t</u></em> the job! That weeke<u class=\"end\">nd</u>, my family <em class=\"red past\">ha<u class=\"end\">d</u></em> a small party to celebra<u class=\"end\">te</u>.", "<span class=\"p2lbl\">HT</span>  Now this job is a big pa<u class=\"end\">rt</u> of my life. I wo<u class=\"end\">rk</u> in the marketing team with five other people. My job is to plan marketing campai<u class=\"end\">gns</u> for English course<u class=\"end\">s</u>. I wri<u class=\"end\">te</u> conte<u class=\"end\">nt</u>, che<u class=\"end\">ck</u> the data and wo<u class=\"end\">rk</u> with designe<u class=\"end\">rs</u>. My favouri<u class=\"end\">te</u> mome<u class=\"end\">nt</u> is when a campaign wo<u class=\"end\">rks</u> well and a lo<u class=\"end\">t</u> of stude<u class=\"end\">nts</u> sign u<u class=\"end\">p</u> for our course<u class=\"end\">s</u>.", "Every day, I learn something new, for example, how to wo<u class=\"end\">rk</u> in a team, how to manage my time and how to ta<u class=\"end\">lk</u> to custome<u class=\"end\">rs</u> confidently. I also feel more independe<u class=\"end\">nt</u>, becau<u class=\"end\">se</u> I can pay for my own thi<u class=\"end\">ngs</u> and he<u class=\"end\">lp</u> my pare<u class=\"end\">nts</u> a little.", "Whenever I thi<u class=\"end\">nk</u> abou<u class=\"end\">t</u> that time, I feel thankful. It remi<u class=\"end\">nds</u> me that if I kee<u class=\"end\">p</u> trying, goo<u class=\"end\">d</u> thi<u class=\"end\">ngs</u> can happen. It also he<u class=\"end\">lps</u> me when I feel stresse<u class=\"end\">d</u> at wo<u class=\"end\">rk</u>, becau<u class=\"end\">se</u> I know that difficu<u class=\"end\">lt</u> time<u class=\"end\">s</u> do<u class=\"end\">n&#x27;t</u> la<u class=\"end\">st</u> forever.", "<span class=\"p2lbl\">TL</span>  Ne<u class=\"end\">xt</u> year, I&#x27;m going to apply for a team leader position. I know it will be challenging, but I believe I can do it."], "past": "got · looked · felt · had to · was · tried · had", "alts": [{"topics": [{"n": "20", "t": "Describe a piece of good news you received"}], "q": ["<b>Đổi:</b> nhấn mạnh lúc nhận tin.", "<span lang=\"en\" class=\"p2en\">One wee<u class=\"end\">k</u> after the interview, I <em class=\"red past\">go<u class=\"end\">t</u></em> an email from the company. When I rea<u class=\"end\">d</u> the fi<u class=\"end\">rst</u> line, \"Congratulatio<u class=\"end\">ns</u>\", I <em class=\"red past\">was</em> so happy that I <em class=\"red past\">calle<u class=\"end\">d</u></em> my mum immediately.</span> → giữ phần <span class=\"p2lbl\">HT</span>  và <span class=\"p2lbl\">TL</span> ."]}, {"topics": [{"n": "9", "t": "Describe a period of time that changed your life"}], "q": ["<b>Đổi:</b> kể cả giai đoạn năm đầu đi làm.", "<span lang=\"en\" class=\"p2en\">The fi<u class=\"end\">rst</u> year at wo<u class=\"end\">rk</u> <em class=\"red past\">was</em> \">t</u> tiring, but everyone <em class=\"red past\">love<u class=\"end\">d</u></em> the party.</span>", "<span class=\"p2lbl\">HT</span>  <span lang=\"en\" class=\"p2en\">Now I&#x27;m qui<u class=\"end\">te</u> goo<u class=\"end\">d</u> at organizing partie<u class=\"end\">s</u>. I alway<u class=\"end\">s</u> wri<u class=\"end\">te</u> a li<u class=\"end\">st</u> fi<u class=\"end\">rst</u>, and I a<u class=\"end\">sk</u> my family to he<u class=\"end\">lp</u>.</span>"]}, {"topics": [{"n": "7", "t": "Describe a talk you gave to a group of people"}], "q": ["<b>Đổi:</b> mở rộng phần thuyết trình lúc phỏng vấn.", "<span class=\"p2lbl\">QK</span>  <span lang=\"en\" class=\"p2en\">I <em class=\"red past\">gave</em> a 15-minu<u class=\"end\">te</u> presentation to five manage<u class=\"end\">rs</u>. It <em class=\"red past\">was</em> abou<u class=\"end\">t</u> a marketing plan for an English cou<u class=\"end\">rse</u>. I <em class=\"red past\">was</em> very nervou<u class=\"end\">s</u>, but I spo<u class=\"end\">ke</u> slowly and clearly.</span>", "<span class=\"p2lbl\">HT</span>  <span lang=\"en\" class=\"p2en\">Now I give presentatio<u class=\"end\">ns</u> at wo<u class=\"end\">rk</u> every month, and I feel much more confide<u class=\"end\">nt</u>.</span>"]}, {"topics": [{"n": "26", "t": "Describe a time when you worked in a group"}], "q": ["<b>Đổi:</b> kể dự án đầu tiên ở công ty.", "<span class=\"p2lbl\">QK</span>  <span lang=\"en\" class=\"p2en\">My fi<u class=\"end\">rst</u> proje<u class=\"end\">ct</u> <em class=\"red past\">was</em> a marketing campaign for a new English cou<u class=\"end\">rse</u>. I <em class=\"red past\">worke<u class=\"end\">d</u></em> with four people. We <em class=\"red past\">ha<u class=\"end\">d</u></em> differe<u class=\"end\">nt</u> idea<u class=\"end\">s</u>, and we <em class=\"red past\">were</em> la<u class=\"end\">te</u> for one deadline. So we <em class=\"red past\">ha<u class=\"end\">d</u></em> a meeting and <em class=\"red past\ ta<u class=\"end\">nd</u> that ki<u class=\"end\">ds</u> ge<u class=\"end\">t</u> tire<u class=\"end\">d</u>.</span>"]}, {"topics": [{"n": "43", "t": "Describe a time that you had to change your plan"}], "q": ["<b>Đổi:</b> nhấn mạnh kế hoạch bị đổi.", "<span lang=\"en\" class=\"p2en\">My plan <em class=\"red past\">was</em> to arrive in the afternoon, re<u class=\"end\">st</u> at the hotel and join the family dinner. But becau<u class=\"end\">se</u> of the delay, I <em class=\"red past\">arrive<u class=\"end\">d</u></em> at 10 p.m., so I <em class=\"red past\">misse<u class=\"end\">d</u></em> the dinner and <em class=\"red past\">we<u class=\"end\">nt</u></em> strai<u class=\"end\">ght</u> to the hotel.</span>", "<span class=\"p2lbl\">HT</span>  <span lang=\"en\" class=\"p2en\">Now I alway<u class=\"end\">s</u> have a backu<u class=\"end\">p</u> plan when I travel, and I try to arrive one day early.</span>"]}, {"topics": [{"n": "16", "t": "Describe an occasion when you used a map"}], "q": ["<b>Đổi:</b> thêm cảnh ở Đà Nẵng.", "<span lang=\"en\" class=\"p2en\">In Đà Nẵng, my phone battery die<u class=\"end\">d</u>, so I <em class=\"red past\">cou<u class=\"end\">ldn&#x27;t</u></em> u<u class=\"end\">se</u> Google Ma<u class=\"end\">ps</u>. The hotel <em class=\"red past\">gave</em> me a paper ma<u class=\"end\">p</u>, and I use<u class=\"end\">d</u> it to fi<u class=\"end\">nd</u> the wedding restaura<u class=\"end\">nt</u>. It <em class=\"red past\">too<u class=\"end\">k</u></em> a long time, but I <em class=\"red past\">fou<u class=\"end\">nd</u></em> it.</span>", "<span class=\"p2lbl\">HT</span>  <span lang=\"en\" class=\"p2en\">Now I alway<u class=\"end\">s</u> bring a power ba<u class=\"end\">nk</u>, but I thi<u class=\"end\">nk</u> it is still useful to know how to rea<u class=\"end\">d</u> a paper ma<u class=\"end\">p</u>.</span>"]}, {"topics": [{"n": "21", "t": "Describe a time when you had a problem with using the computer"}, {"n": "53", "t": "Describe a problem of technology you have encountered, like a computer or a cell phone"}], "q": ["<b>Đổi:</b> dùng chuyện điện thoại hết pin ở trên (đề 53), hoặc dùng chuyện laptop hỏng ở <b>Nhóm 3 – Mẫu 1</b> (đề 21 và 53)."]}], "main": {"n": "17", "t": "Describe an important journey that was delayed"}, "name": "Mẫu 2 – Chuyến Bay Bị Hoãn, Mất Ví", "short": "Mẫu 2 – Chuyến bay bị hoãn"}, {"ideas": ["<b>Sự kiện gì:</b> sinh nhật 80 tuổi của ông, tháng trước.", "<span class=\"p2lbl\">QK</span>  12 người trong gia đình đi ăn ở nhà hàng hải sản quận 7 → bồi bàn mang nhầm món, chờ gần 30 phút → quản lý đến xin lỗi, tặng tráng miệng miễn phí → trong bữa ăn mình ngồi cạnh ông, ông kể chuyện hồi trẻ.", "<span class=\"p2lbl\">HT</span>  Bây giờ cả nhà chỉ ăn tối cùng nhau 2–3 lần/năm vì ai cũng bận, mỗi người sống một nơi → nên rất đặc biệt.", "<b>[HT] Truyền thống gia đình:</b> mỗi bữa tiệc sinh nhật, người lớn tuổi nhất phát biểu ngắn, người nhỏ tuổi nhất rót trà cho cả nhà → mình thích nghe ông kể chuyện, ông là giáo viên về hưu, biết nhiều chuyện thú vị.", "<b>[HT] Nhà hàng:</b> món thích nhất là tôm nướng muối ớt → nhân viên thân thiện, đồ ăn tươi, có vấn đề thì xử lý nhanh → dịch vụ tốt quan trọng như đồ ăn ngon.", "<span class=\"p2lbl\">TL</span>  Năm sau quay lại mừng sinh nhật bà → sẽ ngồi cạnh ông để nghe thêm chuyện."], "para": ["I<u class=\"end\">&#x27;d</u> li<u class=\"end\">ke</u> to ta<u class=\"end\">lk</u> abou<u class=\"end\">t</u> my grandfathe<u class=\"end\">r&#x27;s</u> 80th birthday la<u class=\"end\">st</u> month.", "<span class=\"p2lbl\">QK</span>  Twelve of u<u class=\"end\">s</u> <em class=\"red past\">we<u class=\"end\">nt</u></em> to a seafoo<u class=\"end\">d</u> restaura<u class=\"end\">nt</u> in Distri<u class=\"end\">ct</u> 7 to celebra<u class=\"end\">te</u>. There <em class=\"red past\">was</em> a small problem: the waiter <em class=\"red past\">brou<u class=\"end\">ght</u></em> the wrong dish, and we <em class=\"red past\">waite<u class=\"end\">d</u></em> for almo<u class=\"end\">st</u> thirty minute<u class=\"end\">s</u>. But the manager <em class=\"red past\">came</em> to our table, <em class=\"red past\">sai<u class=\"end\">d</u></em> sorry, and <em class=\"red past\">gave</em> u<u class=\"end\">s</u> a free desse<u class=\"end\">rt</u>. During dinner, I <em class=\"red past\">sa<u class=\"end\">t</u></em> ne<u class=\"end\">xt</u> to my grandfather, and he <em class=\"red past\">to<u class=\"end\">ld</u></em> me abou<u class=\"end\">t</u> his life when he <em class=\"red past\">was</em> young.", "<span class=\"p2lbl\">HT</span>  These day<u class=\"end\">s</u>, my family has dinner together li<u class=\"end\">ke</u> this only two or three time<u class=\"end\">s</u> a year, becau<u class=\"end\">se</u> everyone is busy and we live in differe<u class=\"end\">nt</u> place<u class=\"end\">s</u>. Tha<u class=\"end\">t&#x27;s</u> why these dinne<u class=\"end\">rs</u> are very special to me.", "My family also has a small tradition. At every birthday dinner, the olde<u class=\"end\">st</u> person give<u class=\"end\">s</u> a sho<u class=\"end\">rt</u> speech, and the younge<u class=\"end\">st</u> person pou<u class=\"end\">rs</u> tea for everyone. I love listening to my grandfather. He is a retire<u class=\"end\">d</u> teacher, and he kno<u class=\"end\">ws</u> a lo<u class=\"end\">t</u> of interesting storie<u class=\"end\">s</u> abou<u class=\"end\">t</u> the o<u class=\"end\">ld</u> day<u class=\"end\">s</u>.", "I also li<u class=\"end\">ke</u> that restaura<u class=\"end\">nt</u> a lo<u class=\"end\">t</u>. My favouri<u class=\"end\">te</u> dish there is grille<u class=\"end\">d</u> shri<u class=\"end\">mp</u> with sa<u class=\"end\">lt</u> and chilli. The staff are friendly, the foo<u class=\"end\">d</u> is fresh, and when there is a problem, they try to fi<u class=\"end\">x</u> it quickly. I thi<u class=\"end\">nk</u> goo<u class=\"end\">d</u> servi<u class=\"end\">ce</u> is as importa<u class=\"end\">nt</u> as goo<u class=\"end\">d</u> foo<u class=\"end\">d</u>.", "<span class=\"p2lbl\">TL</span>  Ne<u class=\"end\">xt</u> year, we are going to go ba<u class=\"end\">ck</u> to that restaura<u class=\"end\">nt</u> for my grandmothe<u class=\"end\">r&#x27;s</u> birthday. I will si<u class=\"end\">t</u> ne<u class=\"end\">xt</u> to my grandfather again, becau<u class=\"end\">se</u> I wa<u class=\"end\">nt</u> to hear more of his storie<u class=\"end\">s</u>."], "past": "went · was · brought · waited · came · said · gave · sat · told", "alts": [{"topics": [{"n": "33", "t": "Describe an enjoyable dinner you had with your friends."}], "q": ["<b>Đổi:</b> đổi \"family\" thành \"friends\", đổi lý do.", "<span class=\"p2lbl\">QK</span>  <span lang=\"en\" class=\"p2en\">La<u class=\"end\">st</u> month, I <em class=\"red past\">ha<u class=\"end\">d</u></em> dinner with five clo<u class=\"end\">se</u> frie<u class=\"end\">nds</u> at a seafoo<u class=\"end\">d</u> restaura<u class=\"end\">nt</u> in Distri<u class=\"end\">ct</u> 7, becau<u class=\"end\">se</u> my frie<u class=\"end\">nd</u> Minh <em class=\"red past\">go<u class=\"end\">t</u></em> a new job. We <em class=\"red past\">ordere<u class=\"end\">d</u></em> <em class=\"red past\">grille<u class=\"end\">d</u></em> shri<u class=\"end\">mp</u>, crab sou<u class=\"end\">p</u> and frie<u class=\"end\">d</u> ri<u class=\"end\">ce</u>. We <em class=\"red past\">talke<u class=\"end\">d</u></em> and <em class=\"red past\">laughe<u class=\"end\">d</u></em> for three hou<u class=\"end\">rs</u>.</span>", "<span class=\"p2lbl\">HT</span>  <span lang=\"en\" class=\"p2en\">These day<u class=\"end\">s</u>, we only mee<u class=\"end\">t</u> li<u class=\"end\">ke</u> this o<u class=\"end\">nce</u> every few mo<u class=\"end\">nths</u>, becau<u class=\"end\">se</u> everyone is busy. Tha<u class=\"end\">t&#x27;s</u> why I enjoy these dinne<u class=\"end\">rs</u> so much.</span>"]}, {"topics": [{"n": "4", "t": "Describe a time when someone apologized to you"}], "q": ["<b>Đổi:</b> nhấn mạnh lời xin lỗi.", "<span lang=\"en\" class=\"p2en\">The manager <em class=\"red past\">came</em> to our table and <em class=\"red past\">sai<u class=\"end\">d</u></em>, \"I&#x27;m very sorry. The restaura<u class=\"end\">nt</u> is very busy toni<u class=\"end\">ght</u>.\" Then she <em class=\"red past\">gave</em> u<u class=\"end\">s</u> a free desse<u class=\"end\">rt</u>. I <em class=\"red past\">fe<u class=\"end\">lt</u></em> that she <em class=\"red past\">was</em> really sorry, so we <em class=\"red past\">were<u class=\"end\">n&#x27;t</u></em> angry anymore.</span>", "<span class=\"p2lbl\">HT</span>  <span lang=\"en\" class=\"p2en\">I thi<u class=\"end\">nk</u> saying sorry is very importa<u class=\"end\">nt</u>. A simple apology can ma<u class=\"end\">ke</u> people feel better.</span>"]}, {"topics": [{"n": "25", "t": "Describe a time when you received good service in a shop/store."}], "q": ["<b>Đổi:</b> giữ nhà hàng, hoặc đổi thành cửa hàng điện thoại.", "<span lang=\"en\" class=\"p2en\">La<u class=\"end\">st</u> month, I <em class=\"red past\">we<u class=\"end\">nt</u></em> to a phone sho<u class=\"end\">p</u> to buy a new phone. The staff member <em class=\"red past\">was</em> very patie<u class=\"end\">nt</u>. She <em class=\"red past\">explaine<u class=\"end\">d</u></em> everything clearly, and she <em class=\"red past\">helpe<u class=\"end\">d</u></em> me move all my photo<u class=\"end\">s</u> to the new phone for free.</span>", "<span class=\"p2lbl\">HT</span>  <span lang=\"en\" class=\"p2en\">Now I alway<u class=\"end\">s</u> buy my phone<u class=\"end\">s</u> there, becau<u class=\"end\">se</u> I tru<u class=\"end\">st</u> them.</span>"]}, {"topics": [{"n": "14", "t": "Describe an interesting conversation that you had with an old person"}], "q": ["<b>Đổi:</b> nhấn mạnh cuộc nói chuyện với ông.", "<span lang=\"en\" class=\"p2en\">He <em class=\"red past\">to<u class=\"end\">ld</u></em> me how he <em class=\"red past\">worke<u class=\"end\">d</u></em> as a teacher in a small village, how he <em class=\"red past\">ro<u class=\"end\">de</u></em> a bicycle 10 kilometre<u class=\"end\">s</u> to school every day, and how he <em class=\"red past\">me<u class=\"end\">t</u></em> my grandmother. I <em class=\"red past\">fe<u class=\"end\">lt</u></em> very surprise<u class=\"end\">d</u>, becau<u class=\"end\">se</u> I never <em class=\"red past\">knew</em> those storie<u class=\"end\">s</u>.</span>", "<span class=\"p2lbl\">HT</span>  <span lang=\"en\" class=\"p2en\">Now I call him every Sunday, and I alway<u class=\"end\">s</u> a<u class=\"end\">sk</u> him to tell me one more story.</span>"]}, {"topics": [{"n": "55", "t": "Describe a live sports event you watched before"}], "q": ["<b>Đổi:</b> giữ cấu trúc, đổi sự kiện.", "<span class=\"p2lbl\">QK</span>  <span lang=\"en\" class=\"p2en\">La<u class=\"end\">st</u> year, I <em class=\"red past\">watche<u class=\"end\">d</u></em> a football match between Vietnam and Thaila<u class=\"end\">nd</u> at the stadium with my frie<u class=\"end\">nds</u>. The stadium <em class=\"red past\">was</em> full, everyone <em class=\"red past\">wore</em> re<u class=\"end\">d</u> shi<u class=\"end\">rts</u>, and people <em class=\"red past\">sang</em> and <em class=\"red past\">cheere<u class=\"end\">d</u></em> all the time. When Vietnam <em class=\"red past\">score<u class=\"end\">d</u></em>, everyone <em class=\"red past\">jumpe<u class=\"end\">d</u></em> u<u class=\"end\">p</u> and <em class=\"red past\">hugge<u class=\"end\">d</u></em> each other.</span>", "<span class=\"p2lbl\">HT</span>  <span lang=\"en\" class=\"p2en\">Now I go to watch football at the stadium abou<u class=\"end\">t</u> o<u class=\"end\">nce</u> a year, becau<u class=\"end\">se</u> the atmosphere is much better than on TV.</span>", "<span class=\"p2lbl\">TL</span>  <span lang=\"en\" class=\"p2en\">I&#x27;m going to watch the ne<u class=\"end\">xt</u> Vietnam match with my frie<u class=\"end\">nds</u>.</span>"]}], "main": {"n": "51", "t": "Describe an important event you celebrated"}, "name": "Mẫu 3 – Sinh Nhật 80 Tuổi Của Ông", "short": "Mẫu 3 – Sinh nhật ông"}]}, "p2_5": {"name": "Hoạt động", "title": "Nhóm 5 – HOẠT ĐỘNG, THÓI QUEN & KỸ NĂNG (Activities / Habits / Skills)", "tips": ["<b>Mẹo nhóm này:</b> đây là nhóm dễ nói ở thì hiện tại nhất. Dùng nhiều <i>I usually… / I often… / It helps me…</i>"], "samples": [{"ideas": ["<b>Hoạt động gì:</b> trekking (leo núi đi bộ).", "<span class=\"p2lbl\">QK</span>  Năm ngoái Minh (đồng nghiệp) rủ thử ở Đà Lạt → đi bộ khoảng 12 km lên núi Lang Biang → rất mệt nhưng bạn bè giúp → cùng lên tới đỉnh → cảnh tuyệt đẹp.", "<span class=\"p2lbl\">HT</span>  Giờ trekking là hoạt động ngoài trời yêu thích → đi khoảng 3 lần/năm với nhóm 5–6 người → xuất phát 6h sáng cho đỡ nóng → luôn có hướng dẫn viên địa phương vì đường dốc, trơn.", "<b>[HT] Chuẩn bị:</b> trước mỗi chuyến xem thời tiết, mang nước, đồ ăn nhẹ, giày tốt → chụp nhiều ảnh → tối ngồi cùng nhau ăn đồ nướng, nói chuyện.", "<b>[HT] 2 lý do thích:</b> (1) tốt cho sức khỏe, quên chuyện công việc; (2) tình bạn gắn bó hơn → ai mệt thì người khác mang đồ giúp, động viên → mỗi lần lên tới đỉnh thấy tự hào → trekking dạy mình kiên nhẫn: đi từng bước rồi sẽ tới.", "<span class=\"p2lbl\">TL</span>  Tháng sau leo núi Bà Đen ở Tây Ninh → chạy bộ 2 lần/tuần để chuẩn bị."], "para": ["I<u class=\"end\">&#x27;d</u> li<u class=\"end\">ke</u> to ta<u class=\"end\">lk</u> abou<u class=\"end\">t</u> trekking, an exciting activity that I do with my frie<u class=\"end\">nds</u>.", "<span class=\"p2lbl\">QK</span>  La<u class=\"end\">st</u> year, my co-worker Minh <em class=\"red past\">invite<u class=\"end\">d</u></em> me to try it in Đà Lạt. We <em class=\"red past\">walke<u class=\"end\">d</u></em> abou<u class=\"end\">t</u> 12 kilometre<u class=\"end\">s</u> u<u class=\"end\">p</u> Lang Biang Mountain. It <em class=\"red past\">was</em> very ha<u class=\"end\">rd</u>, but my frie<u class=\"end\">nds</u> <em class=\"red past\">helpe<u class=\"end\">d</u></em> me, and we <em class=\"red past\">go<u class=\"end\">t</u></em> to the to<u class=\"end\">p</u> together. The view <em class=\"red past\">was</em> amazing.", "<span class=\"p2lbl\">HT</span>  Now trekking is my favouri<u class=\"end\">te</u> outdoor activity. I go trekking abou<u class=\"end\">t</u> three time<u class=\"end\">s</u> a year with a grou<u class=\"end\">p</u> of five or si<u class=\"end\">x</u> frie<u class=\"end\">nds</u>. We usually sta<u class=\"end\">rt</u> very early in the morning, at arou<u class=\"end\">nd</u> 6 a.m., becau<u class=\"end\">se</u> it i<u class=\"end\">sn&#x27;t</u> too ho<u class=\"end\">t</u>. A local gui<u class=\"end\">de</u> alway<u class=\"end\">s</u> goe<u class=\"end\">s</u> with u<u class=\"end\">s</u>, becau<u class=\"end\">se</u> some pa<u class=\"end\">ths</u> are stee<u class=\"end\">p</u> and slippery.", "Before each tri<u class=\"end\">p</u>, we che<u class=\"end\">ck</u> the weather, and we bring water, sna<u class=\"end\">cks</u> and goo<u class=\"end\">d</u> shoe<u class=\"end\">s</u>. On the way, we ta<u class=\"end\">ke</u> a lo<u class=\"end\">t</u> of photo<u class=\"end\">s</u>. In the evening, we si<u class=\"end\">t</u> together, ea<u class=\"end\">t</u> <em class=\"red past\">grille<u class=\"end\">d</u></em> foo<u class=\"end\">d</u> and ta<u class=\"end\">lk</u> for hou<u class=\"end\">rs</u>.", "I enjoy it for two reaso<u class=\"end\">ns</u>. Fi<u class=\"end\">rst</u>, it is goo<u class=\"end\">d</u> for my health, and it he<u class=\"end\">lps</u> me forge<u class=\"end\">t</u> abou<u class=\"end\">t</u> wo<u class=\"end\">rk</u>. Seco<u class=\"end\">nd</u>, it make<u class=\"end\">s</u> our friendshi<u class=\"end\">p</u> stronger. When someone fee<u class=\"end\">ls</u> tire<u class=\"end\">d</u>, the othe<u class=\"end\">rs</u> carry their thi<u class=\"end\">ngs</u> and encourage them. Every time we reach the to<u class=\"end\">p</u>, I feel really prou<u class=\"end\">d</u> of myself. I thi<u class=\"end\">nk</u> trekking also teache<u class=\"end\">s</u> me to be patie<u class=\"end\">nt</u>: if you kee<u class=\"end\">p</u> walking ste<u class=\"end\">p</u> by ste<u class=\"end\">p</u>, you will ge<u class=\"end\">t</u> there.", "<span class=\"p2lbl\">TL</span>  Ne<u class=\"end\">xt</u> month, we are going to climb Bà Đen Mountain in Tây Ninh. To prepare, I&#x27;m going to go jogging twi<u class=\"end\">ce</u> a wee<u class=\"end\">k</u>, so I ho<u class=\"end\">pe</u> it will be easier this time."], "past": "invited · walked · was · helped · got", "alts": [{"topics": [{"n": "18", "t": "Describe an outdoor activity you did in a new place recently that makes you happy"}], "q": ["<b>Đổi:</b> nhấn mạnh 3 ý: ai rủ, có nhờ giúp không, thay đổi gì sau hoạt động.", "<span class=\"p2lbl\">QK</span>  <span lang=\"en\" class=\"p2en\">Minh <em class=\"red past\">invite<u class=\"end\">d</u></em> me, becau<u class=\"end\">se</u> he love<u class=\"end\">s</u> outdoor activitie<u class=\"end\">s</u>. It <em class=\"red past\">was</em> my fi<u class=\"end\">rst</u> time, so I <em class=\"red past\">aske<u class=\"end\">d</u></em> the gui<u class=\"end\">de</u> for he<u class=\"end\">lp</u> many time<u class=\"end\">s</u>. He <em class=\"red past\">showe<u class=\"end\">d</u></em> me how to wa<u class=\"end\">lk</u> on slippery pa<u class=\"end\">ths</u> and when to ta<u class=\"end\">ke</u> a re<u class=\"end\">st</u>.</span>", "<span class=\"p2lbl\">HT</span>  <span lang=\"en\" class=\"p2en\">After that tri<u class=\"end\">p</u>, I&#x27;m fitter and more confide<u class=\"end\">nt</u>. I also spe<u class=\"end\">nd</u> le<u class=\"end\">ss</u> time on my phone at weeke<u class=\"end\">nds</u>, becau<u class=\"end\">se</u> I prefer to go outsi<u class=\"end\">de</u>.</span>"]}], "main": {"n": "11", "t": "Describe an exciting activity that you experienced with someone else"}, and the a<u class=\"end\">pp</u> alway<u class=\"end\">s</u> sho<u class=\"end\">ws</u> me something new, so it&#x27;s really ha<u class=\"end\">rd</u> to sto<u class=\"end\">p</u>. I thi<u class=\"end\">nk</u> I do it becau<u class=\"end\">se</u> I feel tire<u class=\"end\">d</u> after wo<u class=\"end\">rk</u> and I ju<u class=\"end\">st</u> wa<u class=\"end\">nt</u> to rela<u class=\"end\">x</u> withou<u class=\"end\">t</u> thinking.", "However, I know it waste<u class=\"end\">s</u> my time. After an hour of scrolling, I ca<u class=\"end\">n&#x27;t</u> remember anything useful. I also go to be<u class=\"end\">d</u> la<u class=\"end\">te</u>, so I feel sleepy the ne<u class=\"end\">xt</u> morning and I ca<u class=\"end\">n&#x27;t</u> concentra<u class=\"end\">te</u> at wo<u class=\"end\">rk</u>. Sometime<u class=\"end\">s</u> I even feel a bi<u class=\"end\">t</u> sa<u class=\"end\">d</u>, becau<u class=\"end\">se</u> I compare my life with other people<u class=\"end\">&#x27;s</u> \"perfe<u class=\"end\">ct</u>\" live<u class=\"end\">s</u> online.", "So now I try to control it. When I study, I pu<u class=\"end\">t</u> my phone in another room, and I u<u class=\"end\">se</u> the Pomodoro metho<u class=\"end\">d</u>: I wo<u class=\"end\">rk</u> for 25 minute<u class=\"end\">s</u> and then ta<u class=\"end\">ke</u> a 5-minu<u class=\"end\">te</u> brea<u class=\"end\">k</u>. It really he<u class=\"end\">lps</u> me concentra<u class=\"end\">te</u>. My frie<u class=\"end\">nds</u> have the same problem, so now we remi<u class=\"end\">nd</u> each other: \"Pu<u class=\"end\">t</u> your phone down!\"", "<span class=\"p2lbl\">TL</span>  From ne<u class=\"end\">xt</u> month, I&#x27;m going to dele<u class=\"end\">te</u> the a<u class=\"end\">pp</u> on weekday<u class=\"end\">s</u>. I thi<u class=\"end\">nk</u> I will have more time to rea<u class=\"end\">d</u> and slee<u class=\"end\">p</u>."], "past": "checked · saw · spent · was", "alts": [{"topics": [{"n": "24", "t": "Describe something that you do that can help you concentrate on work or study"}], "q": ["<b>Đổi:</b> đảo trọng tâm sang Pomodoro, đoạn TikTok chỉ còn 1–2 câu làm lý do.", "<span class=\"p2lbl\">QK</span>  <span lang=\"en\" class=\"p2en\">I <em class=\"red past\">starte<u class=\"end\">d</u></em> using the Pomodoro metho<u class=\"end\">d</u> abou<u class=\"end\">t</u> a year ago, when I <em class=\"red past\">realize<u class=\"end\">d</u></em> that TikTok <em class=\"red past\">too<u class=\"end\">k</u></em> too much of my time.</span>", "<span class=\"p2lbl\">HT</span>  <span lang=\"en\" class=\"p2en\">I u<u class=\"end\">se</u> it every day, both at wo<u class=\"end\">rk</u> and when I study English. I se<u class=\"end\">t</u> a timer for 25 minute<u class=\"end\">s</u>, and I only focu<u class=\"end\">s</u> on one ta<u class=\"end\">sk</u>. Then I ta<u class=\"end\">ke</u> a 5-minu<u class=\"end\">te</u> brea<u class=\"end\">k</u>: I dri<u class=\"end\">nk</u> water or wa<u class=\"end\">lk</u> arou<u class=\"end\">nd</u>. After four rou<u class=\"end\">nds</u>, I ta<u class=\"end\">ke</u> a longer brea<u class=\"end\">k</u>. It he<u class=\"end\">lps</u> me becau<u class=\"end\">se</u> 25 minute<u class=\"end\">s</u> fee<u class=\"end\">ls</u> sho<u class=\"end\">rt</u>, so it&#x27;s easy to sta<u class=\"end\">rt</u>, and I do<u class=\"end\">n&#x27;t</u> feel tire<u class=\"end\">d</u>.</span>", "<span class=\"p2lbl\">TL</span>  <span lang=\"en\" class=\"p2en\">I&#x27;m going to u<u class=\"end\">se</u> it every day before my IELTS te<u class=\"end\">st</u>.</span>"]}], "main": {"n": "57", "t": "Describe an activity you usually do that wastes your time"}, "name": "Mẫu 2 – Lướt Tiktok & Cách Tập Trung", "short": "Mẫu 2 – TikTok & tập trung"}, {"ideas": ["<b>Kỹ năng gì:</b> nấu ăn, học từ năm khoảng 15 tuổi.", "<span class=\"p2lbl\">QK</span>  Bố mẹ đi làm về muộn → phải nấu bữa tối cho em trai → mẹ dạy vào cuối tuần → lúc đầu sai nhiều, có lần làm cháy nguyên chảo ">d</u> po<u class=\"end\">rk</u>, sour sou<u class=\"end\">p</u> and frie<u class=\"end\">d</u> vegetable<u class=\"end\">s</u>. My signature dish is braise<u class=\"end\">d</u> po<u class=\"end\">rk</u> with e<u class=\"end\">ggs</u>, and my family alway<u class=\"end\">s</u> a<u class=\"end\">sks</u> me to coo<u class=\"end\">k</u> it at Tết.", "I can ma<u class=\"end\">ke</u> a full meal in abou<u class=\"end\">t</u> 30 minute<u class=\"end\">s</u>, which is very useful when I&#x27;m busy. Sometime<u class=\"end\">s</u> my frie<u class=\"end\">nds</u> visi<u class=\"end\">t</u> me withou<u class=\"end\">t</u> telling me fi<u class=\"end\">rst</u>, and I can still coo<u class=\"end\">k</u> three dishe<u class=\"end\">s</u> for them in half an hour. At weeke<u class=\"end\">nds</u>, I also watch cooking video<u class=\"end\">s</u> on YouTube to learn new dishe<u class=\"end\">s</u>, li<u class=\"end\">ke</u> Korean or Thai foo<u class=\"end\">d</u>.", "I thi<u class=\"end\">nk</u> this is one of the mo<u class=\"end\">st</u> useful ski<u class=\"end\">lls</u> I have. It he<u class=\"end\">lps</u> me save money, ea<u class=\"end\">t</u> more healthily and ta<u class=\"end\">ke</u> care of myself. Cooking also he<u class=\"end\">lps</u> me rela<u class=\"end\">x</u> after a long day at wo<u class=\"end\">rk</u>. When I coo<u class=\"end\">k</u>, I do<u class=\"end\">n&#x27;t</u> thi<u class=\"end\">nk</u> abou<u class=\"end\">t</u> wo<u class=\"end\">rk</u> at all.", "<span class=\"p2lbl\">TL</span>  In the future, I<u class=\"end\">&#x27;d</u> love to open a small restaura<u class=\"end\">nt</u> that serve<u class=\"end\">s</u> healthy home-<em class=\"red past\">cooke<u class=\"end\">d</u></em> foo<u class=\"end\">d</u>. Ne<u class=\"end\">xt</u> year, I&#x27;m going to ta<u class=\"end\">ke</u> a cooking cou<u class=\"end\">rse</u> to learn more dishe<u class=\"end\">s</u>."], "past": "learned · was · worked · had to · taught · made · burned", "alts": [{"topics"
