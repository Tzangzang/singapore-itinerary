<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vở luyện IELTS Speaking – thi 20/10</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Pangolin&display=swap&subset=vietnamese" rel="stylesheet">
<style>
:root{
  --paper:#FCFCFA; --grid:#E3EAF3; --grid2:#CBD8E8;
  --ink:#1E3A8A; --text:#1F2433; --muted:#5B6475;
  --red:#C62828; --red-soft:#FDECEC; --line:#D5DCE6; --nav:#F2F5F9;
  --chip:#EEF2FA; --done:#2E7D32;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#151922; --grid:#1D2330; --grid2:#252D3D;
    --ink:#9DB6F5; --text:#E6E9EF; --muted:#9AA3B5;
    --red:#FF6B6B; --red-soft:#3A1F24; --line:#2C3445; --nav:#10141B;
    --chip:#1F2738; --done:#7BC67F;
  }
}
:root[data-theme="dark"]{
  --paper:#151922; --grid:#1D2330; --grid2:#252D3D;
  --ink:#9DB6F5; --text:#E6E9EF; --muted:#9AA3B5;
  --red:#FF6B6B; --red-soft:#3A1F24; --line:#2C3445; --nav:#10141B;
  --chip:#1F2738; --done:#7BC67F;
}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 64px)}
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0}
body{
  background:var(--nav);color:var(--text);
  font-family:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  font-size:16px;line-height:1.6;
}
.red{color:var(--red);font-weight:700;font-style:normal}
.hand{font-family:"Pangolin","Comic Sans MS","Segoe Print",cursive}
.blank{display:inline-block;min-width:3.2em;border-bottom:1.5px solid var(--muted);transform:translateY(-3px);height:1em}
.layout{display:grid;grid-template-columns:260px minmax(0,1fr);min-height:100vh}
nav{
  position:sticky;top:env(safe-area-inset-top,0px);align-self:start;height:100vh;overflow:auto;
  padding:28px 18px;border-right:1px solid var(--line);background:var(--nav)
}
.brand{font-family:"Pangolin",cursive;font-size:26px;color:var(--ink);line-height:1.2;margin:0 0 4px}
.countdown{margin:0 0 22px;color:var(--muted);font-size:14px}
.countdown b{color:var(--red)}
nav ol{list-style:none;margin:0;padding:0}
nav li button{
  width:100%;text-align:left;background:none;border:0;border-radius:8px;cursor:pointer;
  padding:9px 10px;margin:1px 0;color:var(--text);font:inherit;font-size:15px;display:flex;justify-content:space-between;gap:8px;align-items:baseline
}
nav li button:hover{background:var(--chip)}
nav li button[aria-current="true"]{background:var(--paper);color:var(--ink);font-weight:600;box-shadow:inset 3px 0 0 var(--ink)}
nav .prog{font-size:12px;color:var(--muted);white-space:nowrap}
.toggle{
  margin-top:22px;display:flex;align-items:center;gap:10px;font-size:14px;color:var(--muted);cursor:pointer;
  border:1px solid var(--line);border-radius:8px;padding:9px 10px;background:var(--paper);width:100%;font-family:inherit
}
.toggle .box{width:34px;height:20px;border-radius:10px;background:var(--grid2);position:relative;flex:none;transition:background .15s}
.toggle .box::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:left .15s}
.toggle[aria-pressed="true"] .box{background:var(--ink)}
.toggle[aria-pressed="true"] .box::after{left:16px}
main{
  background-color:var(--paper);
  background-image:
    linear-gradient(var(--grid2) 1px,transparent 1px),
    linear-gradient(90deg,var(--grid2) 1px,transparent 1px),
    linear-gradient(var(--grid) 1px,transparent 1px),
    linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:96px 96px,96px 96px,24px 24px,24px 24px;
  background-attachment:local;
  padding:44px clamp(18px,5vw,64px) 96px;
  min-width:0;
}
.sheet{max-width:760px;margin:0 auto}
h1{font-size:clamp(28px,4vw,38px);line-height:1.15;color:var(--ink);margin:0 0 6px;font-weight:700;letter-spacing:-.01em}
.lead{color:var(--muted);margin:0 0 28px;max-width:62ch}
h2{font-family:"Pangolin",cursive;font-weight:400;color:var(--ink);font-size:28px;margin:44px 0 10px;line-height:1.2}
h3{font-size:18px;margin:26px 0 8px;color:var(--text)}
.kw-table{width:100%;border-collapse:collapse;margin:6px 0 16px;background:var(--paper);font-size:15px}
.kw-table td{padding:6px 10px;border-bottom:1px solid var(--line);vertical-align:top}
.kw-table td:first-child{color:var(--ink);font-weight:600;width:52%}
.scroll{overflow-x:auto}
.q{list-style:none;margin:0 0 6px;padding:16px 0 14px;border-top:1px dashed var(--grid2)}
.qhead{display:flex;gap:12px;align-items:flex-start}
.qnum{font-family:"Pangolin",cursive;color:var(--ink);font-size:20px;line-height:1.3;min-width:1.6em}
.qtext{font-weight:600;font-size:17px;line-height:1.45;flex:1}
.check{flex:none;display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);cursor:pointer;user-select:none;padding-top:3px}
.check input{width:18px;height:18px;accent-color:var(--done);cursor:pointer}
.q.is-done .qtext{color:var(--muted)}
.hint{margin:10px 0 0 calc(1.6em + 12px);display:grid;gap:6px;background:var(--paper);border-left:3px solid var(--grid2);padding:8px 0 8px 14px}
.row{display:grid;grid-template-columns:84px 1fr;gap:10px;align-items:baseline}
.tag{font-family:"Pangolin",cursive;color:var(--ink);font-size:16px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:var(--chip);color:var(--ink);border-radius:5px;padding:1px 8px;font-size:14.5px;font-style:italic}
.frame{font-style:italic}
.note{color:var(--red);font-size:14px}
.peek{display:none;margin:8px 0 0 calc(1.6em + 12px);background:none;border:1px dashed var(--grid2);color:var(--ink);border-radius:6px;padding:3px 10px;font:inherit;font-size:14px;cursor:pointer}
body.hide-hints .q:not(.open) .hint{display:none}
body.hide-hints .q:not(.open) .peek{display:inline-block}
.box-note{background:var(--red-soft);border-radius:8px;padding:12px 16px;margin:14px 0}
.box-note p{margin:0}
table.plan{width:100%;border-collapse:collapse;font-size:15px;background:var(--paper)}
table.plan th,table.plan td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
table.plan th{color:var(--muted);font-weight:500;font-size:13px}
table.plan td:first-child{white-space:nowrap;color:var(--ink);font-weight:600}
table.plan button{background:none;border:0;padding:0;color:inherit;font:inherit;cursor:pointer;text-decoration:underline;text-decoration-color:var(--grid2);text-underline-offset:3px}
ul.errs{list-style:none;padding:0;margin:8px 0}
ul.errs li{padding:7px 0 7px 28px;position:relative;border-bottom:1px solid var(--line)}
ul.errs li::before{content:"✗";position:absolute;left:4px;color:var(--red);font-weight:700}
.stat{font-size:15px}
.stat b{color:var(--ink)}
.bar{height:8px;background:var(--grid);border-radius:4px;overflow:hidden;margin:8px 0 4px;max-width:420px}
.bar i{display:block;height:100%;background:var(--ink)}
.step-label{font-weight:600;color:var(--text)}
.subtabs{display:flex;gap:6px;overflow-x:auto;padding:4px 0 10px;margin:0 0 4px;border-bottom:1px solid var(--line);scrollbar-width:thin}
.subtabs button{flex:none;border:1px solid var(--line);background:var(--paper);color:var(--text);border-radius:999px;padding:5px 12px;font:inherit;font-size:14px;cursor:pointer;white-space:nowrap}
.subtabs button:hover{border-color:var(--ink)}
.subtabs button[aria-selected="true"]{background:var(--ink);border-color:var(--ink);color:var(--paper);font-weight:600}
.subtabs .cnt{font-size:12px;opacity:.75;margin-left:2px}
.subtabs button.full:not([aria-selected="true"]){border-color:var(--done);color:var(--done)}
.src{color:var(--muted);font-size:14px;margin:-4px 0 10px}
.pager{display:flex;justify-content:space-between;gap:12px;margin-top:28px}
.pager button{background:none;border:1px solid var(--line);border-radius:8px;padding:8px 14px;font:inherit;font-size:15px;color:var(--ink);cursor:pointer}
.pager button:hover{border-color:var(--ink)}
.qtable tr.q{border-top:0;padding:0;margin:0}
.qtable{width:100%;border-collapse:collapse;background:var(--paper);margin-top:8px;table-layout:fixed}
.qtable thead th{text-align:left;font-size:13px;font-weight:500;color:var(--muted);padding:8px 12px;border-bottom:2px solid var(--grid2)}
.qtable thead th:first-child{width:36%}
.qtable td{vertical-align:top;padding:14px 12px;border-bottom:1px dashed var(--grid2)}
.qtable td.qcol{border-right:1px solid var(--line)}
.qtable .qhead{display:flex;gap:8px}
.qtable .check{margin:10px 0 0 calc(1.6em + 8px);padding:0}
.qtable .hint{margin:0;border-left:0;padding:0;gap:10px}
.qtable .peek{margin:0}
.block{display:grid;grid-template-columns:90px 1fr;gap:10px;align-items:baseline}
.qtable .idea-left{margin:12px 0 0 calc(1.6em + 8px);padding:8px 10px;background:var(--chip);border-radius:6px;display:block}
.qtable .idea-left .tag{display:block;margin-bottom:4px}
.qtable .idea-left ol.idea li{grid-template-columns:auto 1fr;gap:8px}
.qtable .idea-left ol.idea .lbl{min-width:6.5em}
ol.idea{list-style:none;margin:0;padding:0;display:grid;gap:3px}
ol.idea li{display:grid;grid-template-columns:118px 1fr;gap:8px}
ol.idea .kwi{font-weight:600;color:var(--ink)}
ol.idea .lbl{color:var(--muted);font-size:13px;padding-top:2px}
ol.formula{margin:8px 0 12px}
.notewrap{display:grid;grid-template-columns:90px 1fr;gap:10px;margin-top:12px;align-items:start}
.notewrap textarea{width:100%;min-height:52px;resize:vertical;font:inherit;font-size:15px;line-height:1.5;color:var(--text);background:var(--paper);border:1px dashed var(--ink);border-radius:6px;padding:6px 10px;overflow:hidden}
.notewrap textarea:focus{outline:2px solid var(--ink);outline-offset:1px;border-style:solid}
@media (max-width:860px){
  .qtable,.qtable tbody,.qtable tr,.qtable td{display:block;width:100%}
  .qtable thead{display:none}
  .qtable tr{border-bottom:1px dashed var(--grid2);padding:12px 0}
  .qtable td{border:0;padding:4px 0}
  .qtable td.qcol{border-right:0}
  .qtable .check{margin-left:0}
  .block,.notewrap{grid-template-columns:1fr;gap:2px}
  ol.idea li{grid-template-columns:1fr;gap:0}
}
.vh{font-size:16px;margin:22px 0 8px;color:var(--ink)}
.vtable{width:100%;border-collapse:collapse;background:var(--paper);font-size:15px}
.vtable th{text-align:left;font-size:13px;font-weight:500;color:var(--muted);padding:6px 10px;border-bottom:2px solid var(--grid2)}
.vtable td{padding:7px 10px;border-bottom:1px solid var(--line);vertical-align:top}
.vtable td.vp{color:var(--ink);font-weight:700;white-space:nowrap}
.vtable td.vex{font-style:italic;color:var(--text)}
.vtable .hl{color:var(--ink);font-style:italic}
.sheetp{margin:12px 0 0;display:flex;flex-wrap:wrap;gap:6px 6px;align-items:baseline;font-size:14px}
.sheetp .tag{margin-right:6px}
.sheetp .pm{color:var(--muted);margin-right:10px}
@media (max-width:860px){
  .vtable thead{display:none}
  .vtable,.vtable tbody,.vtable tr,.vtable td{display:block;width:100%}
  .vtable tr{padding:8px 0;border-bottom:1px solid var(--line)}
  .vtable td{border:0;padding:1px 0}
  .vtable td.vp{white-space:normal}
}
.vtable .ipa{display:block;font-weight:400;color:var(--muted);font-family:"Be Vietnam Pro","Segoe UI","Lucida Sans Unicode","DejaVu Sans",sans-serif;font-size:14px;margin-top:2px;white-space:normal}
.vtable .ipa .red{font-weight:700}
.legend{font-size:13.5px;color:var(--muted);margin:-2px 0 8px}
em.past{font-style:inherit}
.vtable .pri{display:inline-block;margin-top:4px;font-size:12px;font-weight:500;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:0 6px}
.vtable .pri.first{color:var(--ink);border-color:var(--ink)}
.vtable .tip{display:block;margin-top:3px;font-size:13.5px;color:var(--muted)}
.vtable td .vex{font-style:italic}
footer{margin-top:56px;color:var(--muted);font-size:13px}
button:focus-visible,input:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
@media (max-width:860px){
  .layout{grid-template-columns:1fr}
  nav{position:sticky;top:0;height:auto;z-index:5;padding:10px 12px calc(10px);border-right:0;border-bottom:1px solid var(--line);padding-top:calc(10px + env(safe-area-inset-top,0px));top:0}
  .brand{font-size:20px;display:inline}
  .countdown{display:inline;margin-left:8px;font-size:13px}
  nav ol{display:flex;gap:4px;overflow-x:auto;margin-top:8px;padding-bottom:2px}
  nav li button{white-space:nowrap;font-size:14px;padding:6px 10px}
  nav li button[aria-current="true"]{box-shadow:inset 0 -3px 0 var(--ink)}
  nav .prog{display:none}
  .toggle{margin-top:8px;padding:6px 10px}
  main{padding-top:28px}
  .hint{margin-left:0}
  .peek{margin-left:0}
  .row{grid-template-columns:1fr;gap:2px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* ===== Part 2 & 3 ===== */
u.end{text-decoration:underline;text-decoration-color:var(--red);text-decoration-thickness:2px;text-underline-offset:3px}
.p2lbl{display:inline-block;font-size:12px;font-weight:700;color:var(--paper);background:var(--ink);border-radius:4px;padding:0 6px;margin-right:2px;vertical-align:1px;font-style:normal;font-family:"Be Vietnam Pro",sans-serif}
.p2topic{margin:4px 0;font-weight:600;line-height:1.45}
.p2num{font-family:"Pangolin",cursive;color:var(--red);font-weight:400;margin-right:4px;white-space:nowrap}
ol.p2ideas{margin:4px 0 8px;padding-left:22px}
ol.p2ideas li{margin:4px 0}
.p2sample{background:var(--paper);border-left:3px solid var(--grid2);padding:4px 0 4px 14px}
.p2sample p{margin:0 0 10px}
.p2past{font-size:14px;color:var(--muted)}
.p2s{border-top:0}
.p2s .check{margin:14px 0 0;padding:0}
.p2s .peek{margin:0 0 8px}
.p2alt{border-top:1px dashed var(--grid2);padding:12px 0 6px}
.p2change{margin:4px 0 0;padding-left:14px;border-left:3px solid var(--grid2);font-size:15px}
.p2change p{margin:0 0 6px}
.p2en{font-style:italic}
body.hide-hints .q:not(.open) .p2sample{display:none}
body.hide-hints .q:not(.open) .p2change .p2en{display:none}
nav li.navhead{font-size:13px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;padding:16px 10px 4px}
nav li.navsub button{padding-left:24px}
@media (max-width:860px){nav li.navhead{padding:6px 4px 0 10px;align-self:center;white-space:nowrap}nav li.navsub button{padding-left:10px}}
table.plan td.p2c{white-space:nowrap;color:var(--muted);font-weight:400}
</style>

function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}
var PAST_RE = /\b(was|were|wasn't|weren't|went|had|hadn't|did|didn't|couldn't|made|got|saw|bought|found|left|met|learnt|learned|sang|took|gave|kept|wore|taught|burst|asked|binge-watched|carried|encouraged|explained|handed|hated|helped|inspired|joined|liked|looked|loved|reminded|restored|returned|scored|screamed|splashed|started|swapped|visited|walked|wanted|watched|used(?= to))\b/gi;
function pastMark(htmlText){ return htmlText.replace(PAST_RE,'<em class="red past">$1</em>'); }
function fmt(s){
  return String(s).split(/(\[\[.+?\]\])/).map(function(seg){
     return /^\[\[/.test(seg) ? '<em class="red">'+esc(seg.slice(2,-2))+'</em>' : pastMark(esc(seg));
   }).join("")
   .replace(/___/g,'<span class="blank" aria-label="chỗ trống"></span>');
}
function hintHTML(q){
  var h = '<div class="hint">';
  h += '<div class="block"><span class="tag">Từ vựng</span><span class="chips">'+q.kw.map(function(k){return '<span class="chip" lang="en">'+esc(k)+'</span>';}).join("")+'</span></div>';
  h += '<div class="block"><span class="tag">Mẫu câu</span><span class="frame" lang="en">'+fmt(q.frame)+'</span></div>';
  if(q.note) h += '<div class="block"><span class="tag">Lưu ý</span><span class="note">'+fmt(q.note)+'</span></div>';
  return h + '</div><button class="peek" type="button">Xem gợi ý</button>';
}
function ideaHTML(q){
  var h = '<div class="hint idea-left"><span class="tag">Ý tưởng</span><ol class="idea">';
  q.idea.forEach(function(x,i){ h += '<li><span class="lbl">'+IDEA_LABELS[i]+'</span><span lang="en" class="kwi">'+pastMark(esc(x))+'</span></li>'; });
  return h + '</ol></div>';
}
function rowHTML(key, num, q){
  var isDone = !!done[key], note = notes[key] || "";
  return '<tr class="q'+(isDone?' is-done':'')+'" data-key="'+esc(key)+'">'+
   '<td class="qcol"><div class="qhead"><span class="qnum">'+num+'</span><span class="qtext" lang="en">'+esc(q.q)+'</span></div>'+
   ideaHTML(q)+
   '<label class="check"><input type="checkbox"'+(isDone?' checked':'')+'> Đã luyện</label></td>'+
   '<td class="hcol">'+hintHTML(q)+
   '<label class="notewrap"><span class="tag">Ghi chú của bạn</span><textarea rows="2" data-note="'+esc(key)+'" placeholder="Câu trả lời của bạn, lỗi cần sửa, từ mới…">'+esc(note)+'</textarea></label></td></tr>';
}
function vocabHTML(name){
  var list = VOCAB[name]; if(!list) return "";
  function mark(ex, p){
    var core = p.replace(/^(a|an|the|be) /i,"").replace(/ (someone|something) /i," ");
    var i = ex.toLowerCase().indexOf(core.toLowerCase().split(" ")[0]);
    var e = esc(ex);
    if(i<0) return e;
    var re = new RegExp("("+core.split(" ").map(function(w){return w.replace(/[.*+?^${}()|[\]\\]/g,"\\$&");}).join("\\w*[ ,]+")+"\\w*)","i");
    return e.replace(re,'<b class="hl">$1</b>');
  }
  return '<h3 class="vh">Cụm từ nâng band 6</h3><div class="scroll"><table class="vtable"><thead><tr><th scope="col">Cụm từ</th><th scope="col">Nghĩa</th><th scope="col">Ví dụ</th></tr></thead><tbody>'+
    list.map(function(r){ return '<tr><td lang="en" class="vp">'+esc(r[0])+(r[3]?'<span class="ipa">'+r[3]+'</span>':'')+'</td><td>'+esc(r[1])+'</td><td lang="en" class="vex">'+pastMark(mark(r[2],r[0]))+'</td></tr>'; }).join("")+
    '</tbody></table></div>';
}
function sheetVocabHTML(name){
  var list = SHEETV[name]; if(!list) return "";
  return '<h3 class="vh">Cụm từ trong bảng tính của bạn</h3><p class="legend">Phiên âm: <em class="red">chữ đỏ</em> là âm cuối cần bật rõ (t, d, k, p, s, z, tʃ, dʒ…). Trong ví dụ và mẫu câu: <em class="red">chữ đỏ</em> là động từ quá khứ.</p><div class="scroll"><table class="vtable"><thead><tr><th scope="col">Cụm từ</th><th scope="col">Nghĩa</th><th scope="col">Ví dụ & mẹo dùng</th></tr></thead><tbody>'+
    list.map(function(r){
      var pri = r[5] ? '<span class="pri'+(r[5]==="Học trước"?' first':'')+'">'+esc(r[5])+'</span>' : '';
      return '<tr><td lang="en" class="vp">'+esc(r[0])+'<span class="ipa">'+r[6]+'</span>'+pri+'</td><td>'+esc(r[1])+'</td><td><span lang="en" class="vex">'+r[2]+'</span>'+(r[4]?'<span class="tip">'+esc(r[4])+'</span>':'')+'</td></tr>';
    }).join("")+'</tbody></table></div>';
}
function topicCount(name){
  var t = ALL[name], n=0;
  t.qs.forEach(function(q,i){ if(done["t:"+name+":"+i]) n++; });
  return {n:n,total:t.qs.length};
}
function dayCount(id){
  if(typeof P2!=="undefined" && P2[id]) return p2Count(id);
  if(!PLAN[id]) return null;
  var n=0,total=0;
  PLAN[id].forEach(function(name){ var c=topicCount(name); n+=c.n; total+=c.total; });
  return {n:n,total:total};
}

function dayPage(id){
  var meta = DAYMETA[id], list = PLAN[id];
  var idx = Math.min(subIdx[id]||0, list.length-1);
  var name = list[idx], t = ALL[name];
  var h = '<h1>'+meta.title+'</h1><p class="lead">'+meta.lead+'</p>';
  h += '<div class="subtabs" role="tablist" aria-label="Chủ đề trong ngày">';
  list.forEach(function(nm,i){
    var c = topicCount(nm), full = c.n===c.total;
    h += '<button type="button" role="tab" data-sub="'+i+'" aria-selected="'+(i===idx)+'" class="'+(full?'full':'')+'">'+esc(nm)+' <span class="cnt">'+c.n+'/'+c.total+'</span></button>';
  });
  h += '</div><h2>'+(SHEETNUM[name]?SHEETNUM[name]+'. ':'')+esc(name)+'</h2>';
  if(t.common) h += '<p class="src">Câu hỏi thường gặp của chủ đề này. Nếu bảng tính của bạn có câu khác, ưu tiên câu trong bảng.</p>';
  h += sheetVocabHTML(name);
  h += vocabHTML(name);
  h += '<h3 class="vh">Câu hỏi</h3><table class="qtable"><thead><tr><th scope="col">Câu hỏi</th><th scope="col">Gợi ý, mẫu câu & ghi chú</th></tr></thead><tbody>';
  t.qs.forEach(function(q,qi){ h += rowHTML("t:"+name+":"+qi, qi+1, q); });
  h += '</tbody></table><div class="pager">';
  if(idx>0) h += '<button type="button" data-sub="'+(idx-1)+'">‹ '+esc(list[idx-1])+'</button>'; else h += '<span></span>';
  if(idx<list.length-1) h += '<button type="button" data-sub="'+(idx+1)+'">'+esc(list[idx+1])+' ›</button>';
  return h + '</div>';
}

var P2 = {"p2_1": {"name": "Người", "title": "Nhóm 1 – NGƯỜI (People)", "tips": [], "samples": [{"ideas": ["<b>Ai:</b> Minh – đồng nghiệp, cũng là bạn từ tiểu học.", "<span class=\"p2lbl\">QK</span>  Gặp nhau ở tiểu học → nhiều năm sau vào làm cùng công ty.", "<span class=\"p2lbl\">HT</span>  Làm team marketing. Tính cách: thân thiện, hay giúp đỡ, nhiều ý tưởng.", "<b>[QK ngắn] Ví dụ:</b> tuần trước quảng cáo bị sai số liệu → Minh tự học công cụ trên YouTube trong 1 đêm → tìm ra lỗi: quảng cáo đến sai người → đổi khách hàng mục tiêu → kết quả tốt hơn.", "<span class=\"p2lbl\">HT</span>  Giờ Minh dạy cả team dùng công cụ → giải thích rất dễ hiểu, không bao giờ làm ai thấy ngại khi hỏi → cả văn phòng quý.", "<span class=\"p2lbl\">HT</span>  Có vấn đề gì mình hỏi Minh đầu tiên → Minh thích đọc sách marketing, tâm lý, hay chia sẻ bài hay vào nhóm chat → sau giờ làm chơi cầu lông, nói chuyện hồi đi học.", "<span class=\"p2lbl\">TL</span>  Năm sau Minh sẽ làm trưởng nhóm, mình sẽ học thêm từ bạn ấy.", "<b>Chốt:</b> vừa là bạn, vừa là \"thầy\" ở chỗ làm → ai cũng cần một người bạn như Minh: tốt bụng, thông minh, luôn sẵn sàng giúp."], "para": ["I<u class=\"end\">&#x27;d</u> li<u class=\"end\">ke</u> to ta<u class=\"end\">lk</u> abou<u class=\"end\">t</u> my co-worker Minh, who is also my childhoo<u class=\"end\">d</u> frie<u class=\"end\">nd</u>.", "<span class=\"p2lbl\">QK</span>  We <em class=\"red past\">me<u class=\"end\">t</u></em> at primary school. Many yea<u class=\"end\">rs</u> later, we <em class=\"red past\">go<u class=\"end\">t</u></em> jo<u class=\"end\">bs</u> at the same company.", "<span class=\"p2lbl\">HT</span>  Now Minh wo<u class=\"end\">rks</u> in the marketing team with me. He is friendly and helpful, and he alway<u class=\"end\">s</u> has new idea<u class=\"end\">s</u> to solve proble<u class=\"end\">ms</u>.", "<span class=\"p2lbl\">QK ngắn</span>  For example, la<u class=\"end\">st</u> wee<u class=\"end\">k</u> our online a<u class=\"end\">ds</u> <e =\"end\">ce</u> job. In the beginning, she only <em class=\"red past\">ha<u class=\"end\">d</u></em> a few custome<u class=\"end\">rs</u>, and she <em class=\"red past\">di<u class=\"end\">d</u></em> everything by herself.", "<span class=\"p2lbl\">HT</span>  But now her busine<u class=\"end\">ss</u> is doing really well. She has a small offi<u class=\"end\">ce</u> and five employee<u class=\"end\">s</u>, and she has custome<u class=\"end\">rs</u> all over Vietnam. She se<u class=\"end\">lls</u> her painti<u class=\"end\">ngs</u> on Faceboo<u class=\"end\">k</u> and TikTok. Every morning she dra<u class=\"end\">ws</u>, and in the afternoon she ta<u class=\"end\">lks</u> to custome<u class=\"end\">rs</u> and che<u class=\"end\">cks</u> the orde<u class=\"end\">rs</u>.", "Her be<u class=\"end\">st</u>-selling produ<u class=\"end\">ct</u> is pe<u class=\"end\">t</u> portrai<u class=\"end\">ts</u>. Custome<u class=\"end\">rs</u> se<u class=\"end\">nd</u> her a photo of their dog or ca<u class=\"end\">t</u>, and she dra<u class=\"end\">ws</u> it in abou<u class=\"end\">t</u> three day<u class=\"end\">s</u>. Many people buy them as birthday or wedding gi<u class=\"end\">fts</u>.", "I thi<u class=\"end\">nk</u> her busine<u class=\"end\">ss</u> is successful for three reaso<u class=\"end\">ns</u>. Fi<u class=\"end\">rst</u>, her painti<u class=\"end\">ngs</u> are uniqu<u class=\"end\">e</u>, and custome<u class=\"end\">rs</u> can a<u class=\"end\">sk</u> her to draw anything they wa<u class=\"end\">nt</u>. Seco<u class=\"end\">nd</u>, she alway<u class=\"end\">s</u> replie<u class=\"end\">s</u> to custome<u class=\"end\">rs</u> quickly and kindly. And thi<u class=\"end\">rd</u>, she wo<u class=\"end\">rks</u> very ha<u class=\"end\">rd</u>. She even studie<u class=\"end\">s</u> marketing online every evening. Now even my pare<u class=\"end\">nts</u> are prou<u class=\"end\">d</u> of her, and they hang her painti<u class=\"end\">ngs</u> in our living room.", "<span class=\"p </u> to be li<u class=\"end\">ke</u> her mum, and becau<u class=\"end\">se</u> drawing he<u class=\"end\">lps</u> her show her feeli<u class=\"end\">ngs</u>.</span>", "<span class=\"p2lbl\">TL</span>  <span lang=\"en\" class=\"p2en\">Ne<u class=\"end\">xt</u> year, she is going to join her mu<u class=\"end\">m&#x27;s</u> drawing cla<u class=\"end\">ss</u>.</span>"]}, {"topics": [{"n": "34", "t": "Describe a person who you think wears unusual clothes"}], "q": ["<b>Đổi:</b> giữ phần giới thiệu Hoa, thay đoạn kinh doanh bằng quần áo.", "<span lang=\"en\" class=\"p2en\">As an arti<u class=\"end\">st</u>, Hoa wea<u class=\"end\">rs</u> very colourful clothe<u class=\"end\">s</u>. She often wea<u class=\"end\">rs</u> long dresse<u class=\"end\">s</u> with her own painti<u class=\"end\">ngs</u> on them, and big handma<u class=\"end\">de</u> earri<u class=\"end\">ngs</u>. Mo<u class=\"end\">st</u> people in my family wear simple offi<u class=\"end\">ce</u> clothe<u class=\"end\">s</u>, so her style loo<u class=\"end\">ks</u> very differe<u class=\"end\">nt</u>. But I thi<u class=\"end\">nk</u> it sui<u class=\"end\">ts</u> her personality.</span>"]}], "main": {"n": "31", "t": "Describe a person you know who runs a successful business"}, "name": "Mẫu 2 – Chị Hoa", "short": "Mẫu 2 – Chị Hoa"}, {"ideas": ["<b>Ai:</b> bà ngoại, 75 tuổi, sống ở quê Bến Tre.", "<span class=\"p2lbl\">QK</span>  Hồi trẻ làm y tá 30 năm → nghỉ hưu thì bắt đầu làm vườn sau nhà.", "<span class=\"p2lbl\">HT</span>  Trồng rau muống, ớt, rau thơm, hoa. Mỗi sáng 6h dậy tưới cây, nhặt lá úa.", "<b>[HT] Khu vườn:</b> không rộng nhưng lúc nào cũng xanh, gọn gàng → không dùng hóa chất, dùng lá khô và rác bếp ủ làm phân tự nhiên.", "<b>[HT] 3 lý do thích:</b> thư giãn và vận động; có rau sạch nấu ăn; thích cho hàng xóm → chiều hàng xóm hay sang vườn nói chuyện, bà dạy họ trồng rau → mỗi lần mình về, bà cho một túi rau to.", "<span class=\"p2lbl\">TL</span>  Tết này về giúp bà làm vườn; muốn trồng rau thơm ở ban công nên sẽ nhờ bà dạy.", "<b>Chốt:</b> bà lúc nào cũng khỏe, bận rộn, vui vẻ → mong về già được như bà."], "para": ["I<u class=\"end\">&#x27;d</u> li<u class=\"end\">ke</u> to ta<u class=\"end\">lk</u> abou<u class=\"end\">t</u> my grandmother, who love<u class=\"end\">s</u> growing pla<u class=\"end\">nts</u>. She is 75 yea<u class=\"end\">rs</u> o<u class=\"end\">ld</u>, and she live<u class=\"end\">s</u> in a small village in Bến Tre.", "<span class=\"p2lbl\">QK</span>  When she <em class=\"red past\">was</em> young, she <em class=\"red past\">worke<u class=\"end\">d</u></em> as a nu<u class=\"end\">rse</u> in a hospital for thirty yea<u class=\"end\">rs</u>. When she <em class=\"red past\">retire<u class=\"end\">d</u></em>, she <em class=\"red past\">starte<u class=\"end\">d</u></em> a small garden behi<u class=\"end\">nd</u> her hou<u class=\"end\">se</u>.", "<span class=\"p2lbl\">HT</span>  Now gardening is her favouri<u class=\"end\">te</u> hobby. She gro<u class=\"end\">ws</u> vegetable<u class=\"end\">s</u> li<u class=\"end\">ke</u> morning glory and chilli, some he<u class=\"end\">rbs</u>, and a lo<u class=\"end\">t</u> of flowe<u class=\"end\">rs</u>. Every morning, she ge<u class=\"end\">ts</u> u<u class=\"end\">p</u> at 6 a.m. to water the pla<u class=\"end\">nts</u> and remove the dea<u class=\"end\">d</u> leave<u class=\"end\">s</u>. Her garden is no<u class=\"end\">t</u> very big, but it is alway<u class=\"end\">s</u> green and tidy. She doe<u class=\"end\">sn&#x27;t</u> u<u class=\"end\">se</u> any chemica<u class=\"end\">ls</u>. Instea<u class=\"end\">d</u>, she use<u class=\"end\">s</u> dry leave<u class=\"end\">s</u> and kitchen wa<u class=\"end\">ste</u> to ma<u class=\"end\">ke</u> natural fertiliser.", "She enjoy<u class=\"end\">s</u> growing pla<u class=\"end\">nts</u> for three reaso<u class=\"end\">ns</u>. Fi<u class=\"end\">rst</u>, it he<u class=\"end\">lps</u> her rela<u class=\"end\">x</u> and stay active. Seco<u class=\"end\">nd</u> đời giản dị, không khoe tiền, ít lên TV; lời bài hát ý nghĩa, tích cực.", "<span class=\"p2lbl\">TL</span>  Hy vọng sẽ đi xem concert; tin anh ấy sẽ còn làm nhạc hay nhiều năm nữa."], "para": ["I<u class=\"end\">&#x27;d</u> li<u class=\"end\">ke</u> to ta<u class=\"end\">lk</u> abou<u class=\"end\">t</u> Đen Vâu, a famou<u class=\"end\">s</u> rapper in Vietnam.", "<span class=\"p2lbl\">QK</span>  I fi<u class=\"end\">rst</u> <em class=\"red past\">hea<u class=\"end\">rd</u></em> his musi<u class=\"end\">c</u> abou<u class=\"end\">t</u> five yea<u class=\"end\">rs</u> ago, when a frie<u class=\"end\">nd</u> <em class=\"red past\">se<u class=\"end\">nt</u></em> me one of his so<u class=\"end\">ngs</u>.", "<span class=\"p2lbl\">HT</span>  Now I listen to him almo<u class=\"end\">st</u> every day. His musi<u class=\"end\">c</u> is ra<u class=\"end\">p</u>, but it is so<u class=\"end\">ft</u> and easy to listen to. His so<u class=\"end\">ngs</u> are abou<u class=\"end\">t</u> normal life, for example, working ha<u class=\"end\">rd</u>, missing home or spending time with family. My favouri<u class=\"end\">te</u> song is \"Đi Về Nhà\". It is abou<u class=\"end\">t</u> going ba<u class=\"end\">ck</u> home to see your family at Tết.", "I usually listen to his musi<u class=\"end\">c</u> when I drive to wo<u class=\"end\">rk</u> or when I feel stresse<u class=\"end\">d</u>. His voi<u class=\"end\">ce</u> is calm, so it he<u class=\"end\">lps</u> me rela<u class=\"end\">x</u>. When I listen to his so<u class=\"end\">ngs</u>, I feel li<u class=\"end\">ke</u> a frie<u class=\"end\">nd</u> is talking to me. For example, when I feel tire<u class=\"end\">d</u> at wo<u class=\"end\">rk</u>, his lyri<u class=\"end\">cs</u> remi<u class=\"end\">nd</u> me to slow down and enjoy simple thi<u class=\"end\">ngs</u>, li<u class=\"end\">ke</u> a meal with my family. Many of my frie<u class=\"end\">nds</u> li<u class=\"end\">ke</u> him too, so we often share his new so<u class=\"end\">ngs</u> in our grou<u class=\"end\">p</u> cha<u class=\"end\">t</u>.", "I li<u class=\"end\">ke</u> him becau<u class=\"end\">se</u> he is very simple in real life. He doe<u class=\"end\">sn&#x27;t</u> show off his money, and he rarely appea<u class=\"end\">rs</u> on TV. Also, his lyri<u class=\"end\">cs</u> are meaningful and positive. They remi<u class=\"end\">nd</u> young people li<u class=\"end\">ke</u> me to wo<u class=\"end\">rk</u> ha<u class=\"end\">rd</u> and love our familie<u class=\"end\">s</u>.", "<span class=\"p2lbl\">TL</span>  I ho<u class=\"end\">pe</u> I will have a cha<u class=\"end\">nce</u> to go to one of his conce<u class=\"end\">rts</u>, becau<u class=\"end\">se</u> I really wa<u class=\"end\">nt</u> to hear him live. I thi<u class=\"end\">nk</u> he will continue to ma<u class=\"end\">ke</u> goo<u class=\"end\">d</u> musi<u class=\"end\">c</u> for many yea<u class=\"end\">rs</u>."], "past": "heard · sent", "alts": [{"topics": [{"n": "10", "t": "Describe a sportsperson from your country who did well in a sports event"}], "q": ["<b>Đổi người:</b> Nguyễn Thị Oanh – vận động viên chạy. Giữ khung 4 phần.", "<span class=\"p2lbl\">QK</span>  <span lang=\"en\" class=\"p2en\">I fi<u class=\"end\">rst</u> <em class=\"red past\">saw</em> her on TV during the SEA Game<u class=\"end\">s</u>. She <em class=\"red past\">won</em> many go<u class=\"end\">ld</u> meda<u class=\"end\">ls</u> for Vietnam.</span>", "<span class=\"p2lbl\">HT</span>  <span lang=\"en\" class=\"p2en\">She is a runner. In real life, she is simple, friendly and very ha<u class=\"end\">rd</u>-working. She trai<u class=\"end\">ns</u> every day, even when the weather is ba<u class=\"end\">d</u>.</span>", "<span class=\"p2lbl\">TL</span>  <span lang=\"en\" class=\"p2en\">I ho<u class=\"end\">pe</u> she will win more meda<u class=\"end\">ls</u> in the future.</span>", "<b>Chốt:</b> <span lang=\"en\" class=\"p2en\">I admire her becau<u class=\"end\">se</u> she never give<u class=\"end\">s</u> u<u class=\"end\">p</u>.</span>"]}], "main": {"n": "44", "t": "Describe a singer whose music/songs you like"}, "name": "Mẫu 4 – Người Nổi Tiếng", "short": "Mẫu 4 – Người nổi tiếng"}]}, "p2_2": {"name": "Địa điểm", "title": "Nhóm 2 – ĐỊA ĐIỂM (Places)", "tips": ["<b>Mẹo nhóm này:</b> tả địa điểm bằng <i>there is / there are</i> và <i>you can… / people usually…</i>. Cách này giữ được thì hiện tại mà vẫn tự nhiên."], "samples": [{"ideas": ["<b>Ở đâu:</b> Đà Nẵng – thành phố biển miền Trung.", "<span class=\"p2lbl\">QK</span>  Năm ngoái bay ra dự đám cưới em họ; trước đó đi công tác vài lần → lần nào cũng thấy thư thái.", "<b>[HT] Trông thế nào:</b> nổi tiếng với biển đẹp (Mỹ Khê) → thành phố sạch, xanh, đường rộng → ít kẹt xe hơn TP.HCM nhiều.", "<b>[HT] Làm gì:</b> sáng người dân bơi, chạy bộ ở biển → tối dạo sông Hàn, ngắm cầu lên đèn → tối cuối tuần cầu Rồng phun lửa, phun nước, hàng nghìn người đến xem nên rất đông.", "<b>[HT] Gần đó &amp; đồ ăn:</b> gần Hội An, Bà Nà nên nhiều chỗ đi → đồ ăn ngon, rẻ: mì Quảng, hải sản tươi.", "<b>[HT] Con người &amp; chi phí:</b> người dân thân thiện, thành phố an toàn → chi phí sống thấp hơn Hà Nội, TP.HCM.", "<b>[HT] Vì sao muốn quay lại:</b> cân bằng giữa nghỉ ngơi và tham quan → còn nhiều nơi muốn đi, như bán đảo Sơn Trà.", "<span class=\"p2lbl\">TL</span>  Hè năm sau quay lại với bạn bè, ở 1 tuần → sau này có thể chuyển về sống, làm việc từ xa."], "para": ["I<u class=\"end\">&#x27;d</u> li<u class=\"end\">ke</u> to ta<u class=\"end\">lk</u> abou<u class=\"end\">t</u> Đà Nẵng, a coastal city in central Vietnam.", "<span class=\"p2lbl\">QK</span>  I <em class=\"red past\">we<u class=\"end\">nt</u></em> there la<u class=\"end\">st</u> year for my cousi<u class=\"end\">n&#x27;s</u> wedding. Before that, I also <em class=\"red past\">we<u class=\"end\">nt</u></em> there a few time<u class=\"end\">s</u> for wo<u class=\"end\">rk</u>, and I alway<u class=\"end\">s</u> <em class=\"red past\">fe<u class=\"end\">lt</u></em> relaxe<u class=\
