if]] sinh viên biết mình muốn làm marketing, họ có thể đi thực tập sớm. Khi tốt nghiệp, họ đã có kinh nghiệm.||[[So]] theo mình, lập kế hoạch giúp người trẻ tìm việc dễ dàng hơn.", "I think planning helps young people know what to study [[and]] not waste time.||[[That's because]] with a clear goal, they feel less stressed about the future. They can [[also]] prepare early.||[[For example]], [[if]] students know they want to work in marketing, they can do an internship early. [[Then]] they already have experience when they graduate.||[[So]] in my opinion, planning makes it easier for young people to find a job.", "", "know what to study|waste time", ""], ["Should young people ask for advice about career planning, for example from teachers or family?", "Có, mình nghĩ người trẻ nên xin lời khuyên từ giáo viên [[and]] gia đình.||[[That's because]] giáo viên [[and]] bố mẹ có nhiều kinh nghiệm. [[But]] quyết định cuối cùng nên là của người trẻ, [[because]] đó là cuộc đời của họ.||[[For example]], khi chọn ngành, mình đã hỏi bố mẹ [[and]] một thầy giáo. [[But]] cuối cùng mình chọn marketing [[because]] mình thích nó.||[[So]] có, nên xin lời khuyên, [[but]] người trẻ nên chọn công việc mình thích.", "Yes, I think young people should ask for advice.||[[That's because]] teachers [[and]] parents have a lot of experience. [[But]] the final decision should be theirs, [[because]] it's their life.||[[For example]], when I chose my major, I asked my parents [[and]] a teacher. [[But]] I chose marketing [[because]] I liked it.||[[So]] yes, they should ask for advice, [[but]] they should choose a job they like.", "", "experience|final decision", ""]]}, {"name": "Đề 58 · Friendship", "rows": [["Do you still keep in touch with your friends from childhood? Why or why not?", "Có, mình vẫn giữ liên lạc với một người bạn thời thơ ấu.||[[That's because]] tụi mình làm cùng công ty, [[so]] gặp nhau mỗi ngày. [[But]] với những bạn khác thì khó hơn, [[because]] ai cũng bận [[and]] sống ở những nơi khác nhau.||[[For example]], một số bạn của mình vẫn ở Bến Tre, [[so]] tụi mình chỉ thỉnh thoảng nhắn tin trên Facebook.||[[So]] có, mình vẫn giữ liên lạc, [[but]] chỉ thân thiết với một vài người bạn.", "Yes, I still keep in touch with one childhood friend.||[[That's because]] we work at the same company, [[so]] we meet every day. [[But]] it's harder with others, [[because]] everyone is busy [[and]] lives in different places.||[[For example]], some of my friends still live in Bến Tre, [[so]] we only chat on Facebook sometimes.||[[So]] yes, I keep in touch, [[but]] only closely with a few friends.", "", "keep in touch|chat on Facebook", ""], ["How important is childhood friendship to children?", "Mình nghĩ tình bạn thời thơ ấu rất quan trọng với trẻ.||[[That's because]] trẻ học cách chia sẻ [[and]] giúp đỡ nhau. Bạn tốt [[also]] làm cho việc đi học vui hơn.||[[For example]], [[when]] trẻ có một người bạn thân ở trường, các bé tự tin hơn [[and]] thích đi học hơn.||[[So]] theo mình, tình bạn thời thơ ấu tạo ra những kỷ niệm đẹp suốt đời.", "I think childhood friendship is very important for children.||[[That's because]] children learn to share [[and]] help each other. Good friends [[also]] make school more fun.||[[For example]], [[when]] children have a close friend at school, they feel more confident [[and]] enjoy going to school.||[[So]] in my opinion, childhood friendships create good memories for life.", "", "share|help each other", ""], ["What do you think of communicating via social media?", "Mình nghĩ giao tiếp qua mạng xã hội tiện lợi, [[but]] kém gần gũi hơn.||[[That's because]] nó nhanh, miễn phí [[and]] mình có thể nói chuyện với người ở xa. [[However]], tin nhắn đôi khi gây hiểu lầm [[because]] bạn không nghe được giọng nói.||[[For example]], mình gọi video với một người bạn ở nước ngoài mỗi tuần, [[and]] cảm giác như bạn ấy ở rất gần.||[[So]] theo mình, mạng xã hội rất hữu ích, [[but]] chúng ta cần dùng cẩn thận.", "I think it's convenient, [[but]] less personal.||[[That's because]] it's fast, free [[and]] we can talk to people far away. [[However]], messages sometimes cause misunderstandings [[because]] you can't hear the voice.||[[For example]], I video call a friend who lives abroad every week, [[and]] it feels like she is close.||[[So]] in my opinion, social media is very useful, [[but]] we need to use it carefully.", "", "fast|far away|less personal", ""], ["Do you think online communication through social media will replace face-to-face communication?", "Không, mình không nghĩ giao tiếp online sẽ thay thế gặp mặt trực tiếp.||[[That's because]] người ta vẫn cần gặp nhau. Những cái ôm [[and]] nụ cười thật không thể có trên mạng.||[[For example]], dù tụi mình nhắn tin mỗi ngày, mình [[and]] bạn bè vẫn đi cà phê vào cuối tuần ở Sài Gòn.||[[So]] không, mạng xã hội giúp giữ liên lạc, [[but]] không thể thay thế gặp mặt.", "No, I don't think it will replace face-to-face communication.||[[That's because]] people still need to meet. Hugs [[and]] real smiles can't happen online.||[[For example]], even though we chat every day, my friends [[and]] I still meet for coffee at weekends in Saigon.||[[So]] no, social media helps us keep in touch, [[but]] it can't replace meeting in person.", "", "meet in person", ""], ["What's the difference between having younger friends and older friends?", "Mình nghĩ bạn trẻ hơn thì vui vẻ, [[while]] bạn lớn tuổi hơn thì cho lời khuyên tốt.||[[That's because]] bạn trẻ hơn đầy năng lượng [[and]] biết xu hướng mới. Bạn lớn tuổi hơn có nhiều kinh nghiệm sống hơn.||[[For example]], bạn trẻ chỉ cho mình những ứng dụng mới, [[while]] bạn lớn tuổi giúp mình khi gặp vấn đề ở công ty.||[[So]] theo mình, có nhiều kiểu bạn bè khác nhau là điều tốt.", "I think younger friends are fun, [[while]] older friends give good advice.||[[That's because]] younger friends are energetic [[and]] know new trends. Older friends have more life experience.||[[For example]], my younger friends show me new apps, [[while]] my older friends help me with problems at work.||[[So]] in my opinion, it's good to have different kinds of friends.", "", "energetic|advice", ""]]}, {"name": "Đề 60 · Medical jobs", "rows": [["Why do some people choose to work in the medical field?", "Mình nghĩ người ta chọn ngành y chủ yếu vì muốn giúp đỡ người khác.||[[That's because]] cứu người mang lại cảm giác rất ý nghĩa. Đây [[also]] là công việc ổn định [[and]] được tôn trọng ở Việt Nam.||[[For example]], nhiều bố mẹ Việt Nam muốn con học y, [[and]] một số người theo nghề của bố mẹ, [[although]] học y mất khoảng sáu năm.||[[So]] theo mình, mong muốn giúp người là lý do chính.", "I think people choose medicine mainly because they want to help others.||[[That's because]] saving lives feels very meaningful. It's [[also]] a stable [[and]] respected job in Vietnam.||[[For example]], many Vietnamese parents want their children to study medicine, [[and]] some people follow their parents, [[although]] it takes six years.||[[So]] in my opinion, helping people is the main reason.", "", "help people|stable", ""], ["How does working in a medical-related profession impact a person's life?", "Mình nghĩ công việc trong ngành y ảnh hưởng rất lớn đến cuộc sống của họ.||[[That's because]] họ làm việc nhiều giờ, [[so]] có ít thời gian cho gia đình. Công việc [[also]] rất căng thẳng.||[[For example]], dì mình là y tá, [[and]] dì thường làm ca đêm, kể cả dịp Tết. [[But]] dì rất tự hào [[when]] bệnh nhân khỏe lại.||[[So]] theo mình, nghề này vất vả, [[but]] rất ý nghĩa.", "I think it changes their life a lot.||[[That's because]] they work long hours, [[so]] they have less time for family. The job is [[also]] very stressful.||[[For example]], my aunt is a nurse, [[and]] she often works night shifts, even during Tết. [[But]] she feels proud [[when]] patients get better.||[[So]] in my opinion, the job is hard, [[but]] very meaningful.", "", "long hours|proud", ""], ["Do you think medical professionals are valued in society?", "Có, mình nghĩ mọi người tôn trọng họ, [[but]] lương của họ chưa đủ cao.||[[That's because]] họ làm việc rất vất vả. Nhiều y tá phải làm thêm [[because]] lương thấp.||[[For example]], trong đại dịch, mọi người ở Việt Nam thấy rõ nhân viên y tế quan trọng như thế nào.||[[So]] có, họ được tôn trọng, [[but]] chính phủ nên tăng lương cho họ.", "Yes, people respect them, [[but]] their salary is not high enough.||[[That's because]] they work very hard. Many nurses have to do extra work [[because]] their pay is low.||[[For example]], during the pandemic, people in Vietnam saw clearly how important medical workers are.||[[So]] yes, they are respected, [[but]] the government should increase their salary.", "", "respect|salary", ""], ["In your opinion, which profession is more important: doctors or nurses?", "Mình nghĩ cả bác sĩ [[and]] y tá đều quan trọng như nhau.||[[That's because]] bác sĩ tìm ra bệnh [[and]] điều trị, [[while]] y tá chăm sóc bệnh nhân mỗi ngày.||[[For example]], sau một ca phẫu thuật, y tá theo dõi [[and]] chăm sóc bệnh nhân cả ngày lẫn đêm.||[[So]] theo mình, không nghề nào quan trọng hơn, [[because]] họ làm việc cùng nhau như một đội.", "I think both doctors [[and]] nurses are equally important.||[[That's because]] doctors find the problem [[and]] treat it, [[while]] nurses take care of patients every day.||[[For example]], after an operation, nurses watch [[and]] care for patients day [[and]] night.||[[So]] in my opinion, neither job is more important, [[because]] they work as a team.", "", "diagnose|take care of", ""], ["How can technology influence medical-related professions in the future?", "Mình nghĩ công nghệ sẽ giúp ngành y nhanh hơn [[and]] tiện hơn.||[[That's because]] AI có thể giúp bác sĩ phát hiện bệnh sớm. Robot [[also]] có thể hỗ trợ phẫu thuật.||[[For example]], nhiều bệnh viện ở Thành phố Hồ Chí Minh đã cho bệnh nhân đặt lịch khám qua ứng dụng, [[so]] họ không phải chờ lâu.||[[So]] theo mình, công nghệ rất hữu ích, [[but]] không thể thay thế sự chăm sóc của bác sĩ [[and]] y tá.", "I think technology will make medical work faster [[and]] easier.||[[That's because]] AI can help doctors find diseases early. Robots can [[also]] help in surgery.||[[For example]], many hospitals in Ho Chi Minh City let patients book appointments on an app, [[so]] they don't wait for a long time.||[[So]] in my opinion, technology is very useful, [[but]] it can't replace the care of doctors [[and]] nurses.", "", "AI|online appointments|surgery", ""]]}, {"name": "Đề 63 · Plants & farming", "rows": [["Are there many people growing their own vegetables now?", "Có, mình nghĩ bây giờ nhiều người tự trồng rau hơn trước.||[[That's because]] người ta lo về hóa chất trong thực phẩm. Trồng rau [[also]] là một sở thích giúp giảm căng thẳng.||[[For example]], nhiều người ở Sài Gòn trồng rau thơm trên ban công, [[and]] bà mình ở Bến Tre trồng rau muống [[and]] ớt sau nhà.||[[So]] có, mình nghĩ trồng rau ở nhà đang ngày càng phổ biến.", "Yes, I think more people grow vegetables now.||[[That's because]] people worry about chemicals in food. Gardening is [[also]] a hobby that reduces stress.||[[For example]], many people in Saigon grow herbs on their balcony, [[and]] my grandmother in Bến Tre grows morning glory [[and]] chilli.||[[So]] yes, I think growing vegetables at home is becoming more popular.", "", "chemicals|grow herbs|balcony", ""], ["Do you think it’s good to let kids learn how to plant?", "Có, mình nghĩ cho trẻ học trồng cây rất tốt.||[[That's because]] nó dạy trẻ kiên nhẫn [[and]] có trách nhiệm. Các bé [[also]] biết thức ăn đến từ đâu.||[[For example]], một số trường mẫu giáo ở thành phố mình có vườn rau nhỏ để trẻ chăm sóc.||[[So]] có, đây là cách học rất hay [[because]] trẻ học qua việc làm.", "Yes, I think it's very good for kids.||[[That's because]] it teaches them to be patient [[and]] responsible. They [[also]] learn where food comes from.||[[For example]], some kindergartens in my city have small vegetable gardens for children to look after.||[[So]] yes, it's a great way to learn [[because]] children learn by doing.", "", "patient|responsible|where food comes from", ""], ["What do you think of the job of a farmer?", "Mình nghĩ nghề nông rất vất vả [[but]] rất quan trọng.||[[That's because]] ai cũng cần thực phẩm. [[However]], nông dân làm việc ngoài nắng cả ngày [[and]] thu nhập thường thấp.||[[For example]], ở Bến Tre, thu nhập của nông dân phụ thuộc rất nhiều vào thời tiết [[and]] giá trái cây.||[[So]] theo mình, chính phủ nên hỗ trợ nông dân nhiều hơn, chẳng hạn giúp họ bán hàng online.", "I think farming is a very hard [[but]] important job.||[[That's because]] everyone needs food. [[However]], farmers work in the sun all day, [[and]] their income is often low.||[[For example]], in Bến Tre, farmers' income depends a lot on the weather [[and]] fruit prices.||[[So]] in my opinion, the government should support farmers more, like helping them sell online.", "", "hard job|work outside|everyone needs food", ""], ["What are the differences between traditional and modern agriculture?", "Mình nghĩ khác biệt chính là nông nghiệp hiện đại dùng máy móc [[and]] công nghệ.||[[That's because]] trước đây nông dân dùng sức người [[and]] trâu bò. Bây giờ máy móc làm việc nhanh hơn [[and]] cần ít người hơn.||[[For example]], ở quê mình, bây giờ người ta dùng máy gặt lúa. [[However]], nông nghiệp hiện đại dùng nhiều hóa chất hơn, [[so]] không tốt cho môi trường.||[[So]] theo mình, tương lai là nông nghiệp sạch, kết hợp công nghệ với phương pháp tự nhiên.", "I think the main difference is that modern farming uses machines [[and]] technology.||[[That's because]] in the past, farmers used people [[and]] animals. Now machines work faster [[and]] need fewer workers.||[[For example]], in my hometown, people now use machines to cut rice. [[However]], modern farming uses more chemicals, [[so]] it hurts the environment.||[[So]] in my opinion, the future is clean farming that mixes technology with natural methods.", "", "machines|technology|fewer workers", "", "So sánh xưa và nay: used to + động từ nguyên mẫu, không cần chia quá khứ."], ["What happened to the farmers’ income during the pandemic?", "Mình nghĩ thu nhập của nông dân đã giảm trong đại dịch.||[[That's because]] họ không thể bán sản phẩm sang các thành phố khác.||[[For example]], nhiều người ở Sài Gòn mua trái cây trực tiếp từ nông dân miền Tây trên Facebook. Gia đình mình [[also]] mua xoài theo cách này.||[[So]] theo mình, đại dịch rất khó khăn, [[but]] nó dạy nông dân cách bán hàng online.", "I think farmers' income went down during the pandemic.||[[That's because]] they couldn't sell their products to other cities.||[[For example]], many people in Saigon bought fruit directly from Mekong Delta farmers on Facebook. My family [[also]] bought mangoes this way.||[[So]] in my opinion, the pandemic was hard, [[but]] it taught farmers to sell online.", "", "went down|couldn't sell|sell online", "", "Câu hỏi về chuyện đã qua → dùng quá khứ đơn: went, couldn't, sold."]]}]}, "p3_2": {"name": "Địa điểm", "topics": [{"name": "Đề 23 · Leisure", "rows": [["How do people express happiness in your culture?", "Mình nghĩ người Việt thể hiện niềm vui bằng cách chia sẻ nó với gia đình.||[[That's because]] tin vui sẽ đặc biệt hơn [[when]] mọi người ở bên nhau. Mọi người thường cười nói vui vẻ [[and]] tổ chức tiệc hoặc ăn một bữa thật lớn.||[[For example]], [[when]] có người trong nhà mình thi đậu một kỳ thi quan trọng, cả nhà sẽ đi nhà hàng cùng nhau [[and]] tặng người đó vài món quà nhỏ.||[[So]], theo mình, ở Việt Nam, niềm vui là thứ chúng ta chia sẻ với những người mình thương.", "I think Vietnamese people show happiness by sharing it with their family.||[[That's because]] good news feels more special [[when]] everyone is together. People usually smile, laugh [[and]] have a party or a big meal.||[[For example]], [[when]] someone in my family passes an important exam, we go to a restaurant together [[and]] give them small gifts.||[[So]] in my opinion, in Vietnam, happiness is something we share with the people we love.", "", "share good news|have a big meal", ""], ["How do people spend their leisure time in your country?", "Mình nghĩ đa số mọi người dành thời gian rảnh cho bạn bè và gia đình.||[[That's because]] họ làm việc vất vả cả tuần, [[so]] họ muốn thư giãn cùng nhau. Nhiều người đi cà phê, đi trung tâm thương mại hoặc đi xem phim, [[and]] các gia đình hay đi thăm họ hàng vào cuối tuần.||[[For example]], mình thường hẹn bạn bè đi cà phê vào thứ Bảy, [[because]] vừa rẻ vừa thư giãn.||[[So]], mình nghĩ thời gian rảnh ở Việt Nam chủ yếu là để ở bên người khác.", "I think most people spend their free time with friends and family.||[[That's because]] they work hard during the week, [[so]] they want to relax together. Many people go to cafés, shopping malls or the cinema, [[and]] families often visit their relatives at weekends.||[[For example]], I usually meet my friends for coffee on Saturday, [[because]] it's cheap and relaxing.||[[So]] yes, I think leisure time in Vietnam is mostly about being with other people.", "", "go to cafés|scroll on phones|visit relatives", ""], ["How does technology affect the way people spend their leisure time?", "Mình nghĩ công nghệ khiến mọi người ở nhà nhiều hơn vào thời gian rảnh.||[[That's because]] mọi người dành rất nhiều thời gian cho điện thoại. Họ ở nhà xem video [[instead of]] ra ngoài hoặc chơi thể thao.||[[For example]], bạn bè mình hay xem TikTok hàng tiếng đồng hồ vào cuối tuần. [[However]], công nghệ cũng giúp mọi người tìm sở thích mới, ví dụ học nấu ăn trên YouTube.||[[So]], mình nghĩ công nghệ có ích, [[but]] thỉnh thoảng chúng ta nên bỏ điện thoại xuống.", "I think technology makes people stay at home more in their free time.||[[That's because]] people spend a lot of time on their phones. They watch videos at home [[instead of]] going out or playing sports.||[[For example]], my friends often watch TikTok for hours at weekends. [[However]], technology also helps people find new hobbies, like learning to cook on YouTube.||[[So]] I think technology is useful, [[but]] we should put our phones down sometimes.", "", "spend time on phones|go out|new hobbies", ""], ["Do you think only old people have time for leisure?", "Không, mình không nghĩ chỉ người già mới có thời gian giải trí.||[[That's because]] người trẻ cũng có thời gian rảnh, nhất là vào cuối tuần. Đúng là người lớn tuổi rảnh hơn, [[because]] đa số họ đã nghỉ hưu.||[[For example]], nhiều nhân viên văn phòng đi tập gym hoặc chơi cầu lông sau giờ làm. Mình cũng chạy bộ hai, ba lần một tuần.||[[So]], theo mình, thời gian giải trí là dành cho tất cả mọi người, [[because]] nó giúp giảm căng thẳng.", "No, I don't think only old people have time for leisure.||[[That's because]] young people also have free time, especially at weekends. It's true that older people have more free time, [[because]] most of them are retired.||[[For example]], many office workers go to the gym or play badminton after work. I also go running two or three times a week.||[[So]] in my opinion, leisure time is for everyone, [[because]] it helps people reduce stress.", "", "free time|retired", ""]]}, {"name": "Đề 29 · Homes", "rows": [["What makes a home comfortable to live in?", "Mình nghĩ một ngôi nhà thoải mái [[when]] nó có ánh sáng tự nhiên và có gia đình ở đó.||[[That's because]] nhà sáng sủa thì cảm giác thoáng đãng, [[and]] ở bên gia đình giúp mình thư giãn. Hàng xóm yên tĩnh cũng quan trọng.||[[For example]], căn hộ của mình không lớn lắm, [[but]] có một cửa sổ to. [[When]] mình đi làm về và ăn tối với gia đình, mình thấy rất thư giãn.||[[So]], theo mình, ánh sáng và gia đình là hai điều quan trọng nhất.", "I think a home is comfortable [[when]] it has natural light and your family is there.||[[That's because]] a bright home feels fresh, [[and]] being with your family helps you relax. Quiet neighbours are important too.||[[For example]], my apartment is not very big, [[but]] it has a big window. [[When]] I come home after work and have dinner with my family, I feel really relaxed.||[[So]] in my opinion, light and family are the most important things.", "", "space|light|quiet", ""], ["Do people's housing preferences change as they get older?", "Có, mình nghĩ sở thích về nhà ở của mọi người thay đổi khi họ lớn tuổi hơn.||[[That's because]] nhu cầu của họ thay đổi. Người trẻ muốn sống gần trung tâm, [[but]] các bậc cha mẹ muốn nhà gần trường tốt, [[and]] người lớn tuổi thích nơi yên tĩnh.||[[For example]], ông bà mình đã chuyển về quê ở Bến Tre sau khi nghỉ hưu, [[because]] ông bà muốn một cuộc sống yên bình.||[[So]], mình tin rằng ngôi nhà phù hợp phụ thuộc vào độ tuổi của mỗi người.", "Yes, I think people's housing preferences change as they get older.||[[That's because]] their needs change. Young people want to live near the city centre, [[but]] parents want a home near good schools, [[and]] older people prefer quiet places.||[[For example]], my grandparents moved back to their hometown in Bến Tre after they retired, [[because]] they wanted a peaceful life.||[[So]] yes, I believe the right home depends on your age.", "", "city centre|quiet|garden", ""], ["Is it better to live in a house or an apartment? Why?", "Với mình, căn hộ chung cư tốt hơn.||[[That's because]] nó an toàn hơn và rẻ hơn, [[and]] nhiều tòa chung cư có phòng gym và hồ bơi. [[But]] nhà riêng thì tốt hơn cho gia đình đông người, [[because]] có nhiều không gian hơn.||[[For example]], ở TP. Hồ Chí Minh, nhà riêng rất đắt, [[so]] hầu hết người trẻ như mình đều chọn chung cư.||[[So]], theo mình, hiện tại chung cư tốt hơn, [[but]] [[if]] có con, mình có thể sẽ mua một căn nhà.", "For me, an apartment is better.||[[That's because]] it's safer and cheaper, [[and]] many apartment buildings have a gym and a swimming pool. [[But]] a house is better for a big family, [[because]] it has more space.||[[For example]], in Ho Chi Minh City, houses are very expensive, [[so]] most young people like me choose apartments.||[[So]] in my opinion, an apartment is better for now, [[but]] [[if]] I have children, I might buy a house.", "", "safer|gym and pool|more space", ""]]}, {"name": "Đề 36 · Crowds & cities", "rows": [["What are some common places where large crowds gather in your country?", "Mình nghĩ trung tâm thương mại và phố đi bộ là những nơi đông người nhất ở Việt Nam.||[[That's because]] mọi người đến đó để thư giãn, ăn uống [[and]] mua sắm, nhất là vào cuối tuần. Vào các dịp lễ, những nơi du lịch như Đà Lạt cũng chật kín người.||[[For example]], vào đêm giao thừa, hàng nghìn người đến phố đi bộ Nguyễn Huệ để xem pháo hoa.||[[So]], trung tâm thương mại, phố đi bộ và các điểm du lịch là nơi tập trung nhiều người nhất.", "I think shopping malls and walking streets are the most crowded places in Vietnam.||[[That's because]] people go there to relax, eat [[and]] shop, especially at weekends. During public holidays, tourist places like Đà Lạt are also full of people.||[[For example]], on New Year's Eve, thousands of people go to Nguyễn Huệ Walking Street to watch the fireworks.||[[So]] yes, malls, walking streets and tourist places are where big crowds gather.", "", "shopping malls|bus stations|holidays", ""], ["Why do so many people move to big cities?", "Mình nghĩ mọi người chuyển lên thành phố lớn chủ yếu để có việc làm tốt hơn.||[[That's because]] thành phố có nhiều việc làm hơn và lương cao hơn. Ở đó cũng có trường học và trường đại học tốt hơn.||[[For example]], ở quê lương thấp, [[and]] không có nhiều văn phòng. Nhiều bạn của mình ở Bến Tre đã lên TP. Hồ Chí Minh để tìm việc.||[[So]], theo mình, mọi người chuyển lên thành phố vì họ thấy có nhiều cơ hội hơn ở đó.", "I think people move to big cities mainly for better jobs.||[[That's because]] cities have more jobs and higher salaries. They also have better schools and universities.||[[For example]], in the countryside, salaries are low, [[and]] there aren't many offices. Many of my friends from Bến Tre moved to Ho Chi Minh City to find work.||[[So]] in my opinion, people move to cities because they see more opportunities there.", "", "jobs|education|opportunities", ""], ["Why do some people enjoy being in crowded or lively places?", "Mình nghĩ một số người thích nơi đông đúc vì bầu không khí sôi động.||[[That's because]] [[when]] ở giữa đám đông, họ không thấy cô đơn. Ở đó cũng có nhiều thứ thú vị để xem và làm.||[[For example]], bạn bè mình rất thích đi chợ đêm hoặc lễ hội âm nhạc, [[because]] họ thấy tràn đầy năng lượng ở đó. Mình thỉnh thoảng cũng thích, [[but]] mình mệt rất nhanh.||[[So]], nơi đông đúc mang lại năng lượng và niềm vui cho một số người.", "I think some people enjoy crowded places because of the lively atmosphere.||[[That's because]] [[when]] they're in a crowd, they don't feel lonely. There are also many interesting things to see and do.||[[For example]], my friends love going to night markets or music festivals, [[because]] they feel full of energy there. I enjoy it sometimes, [[but]] I get tired quickly.||[[So]] yes, crowded places give some people energy and fun.", "", "lively|lonely", ""], ["Do modern cities have fewer green spaces than in the past? Why might this be the case?", "Có, mình nghĩ các thành phố hiện đại có ít không gian xanh hơn so với trước đây.||[[That's because]] ngày càng nhiều người chuyển đến thành phố, [[so]] họ cần nhiều nhà ở hơn. [[As a result]], rất nhiều đất được dùng để xây nhà và làm đường [[instead of]] làm công viên.||[[For example]], ở TP. Hồ Chí Minh, một số công viên cũ đã trở thành trung tâm thương mại hoặc chung cư.||[[So]], các thành phố đang mất dần không gian xanh, [[and]] đây là một vấn đề cho trẻ em và các gia đình.", "Yes, I think modern cities have fewer green spaces than in the past.||[[That's because]] more and more people move to cities, [[so]] they need more homes. [[As a result]], a lot of land is used for buildings and roads [[instead of]] parks.||[[For example]], in Ho Chi Minh City, some old parks became shopping malls or apartment buildings.||[[So]] yes, cities are losing green spaces, [[and]] this is a problem for children and families.", "", "buildings and roads|need homes", ""], ["What can be done to improve the situation of overcrowding and lack of greenery in cities?", "Mình nghĩ chính phủ nên xây thêm công viên và chuyển bớt người ra khỏi trung tâm thành phố.||[[That's because]] nhiều cây xanh hơn thì thành phố sạch hơn, [[and]] ít người ở trung tâm hơn thì ít kẹt xe hơn. Các công ty cũng có thể cho nhân viên làm việc ở nhà vài ngày mỗi tuần.||[[For example]], công ty mình cho nhân viên làm ở nhà vào thứ Sáu, [[so]] đường sá bớt đông hơn một chút.||[[So]], theo mình, nhiều công viên hơn và ít xe cộ hơn sẽ giúp thành phố đáng sống hơn.", "I think the government should build more parks and move some people out of the city centre.||[[That's because]] more trees make the city cleaner, [[and]] fewer people in the centre means less traffic. Companies can also let people work from home a few days a week.||[[For example]], my company lets us work from home on Fridays, [[so]] the roads are a bit less busy.||[[So]] in my opinion, more parks and less traffic will make cities better places to live.", "", "parks|move out|plant trees", ""]]}, {"name": "Đề 37 · City & countryside", "rows": [["What is the difference between living in the countryside and the city?", "Mình nghĩ thành phố thì nhộn nhịp và tiện lợi, [[while]] nông thôn thì yên tĩnh và bình yên.||[[That's because]] ở thành phố, bạn có thể tìm thấy mọi thứ ở gần. [[In contrast]], nông thôn có không khí trong lành, [[but]] lại có ít việc làm hơn.||[[For example]], ở TP. Hồ Chí Minh, mình có thể đặt đồ ăn hoặc gọi Grab bất cứ lúc nào. [[But]] ở Bến Tre, mình ngủ rất ngon [[because]] ở đó rất yên tĩnh.||[[So]], thành phố tốt hơn về sự tiện lợi, [[and]] nông thôn tốt hơn để thư giãn.", "I think the city is busy and convenient, [[while]] the countryside is quiet and peaceful.||[[That's because]] in the city, you can find everything nearby. [[In contrast]], the countryside has fresh air, [[but]] there are fewer jobs.||[[For example]], in Ho Chi Minh City, I can order food or take a Grab at any time. [[But]] in Bến Tre, I sleep really well [[because]] it's so quiet.||[[So]] the city is better for convenience, [[and]] the countryside is better for relaxing.", "", "convenient|fresh air|fewer jobs", ""], ["Do you prefer to live in the city or in the countryside?", "Hiện tại, mình thích sống ở thành phố hơn.||[[That's because]] công việc của mình ở đó, [[and]] mọi thứ đều tiện lợi. Mình cũng có thể gặp nhiều người và học được những điều mới cho sự nghiệp.||[[For example]], mình làm marketing, [[so]] hầu hết các công ty như của mình đều ở TP. Hồ Chí Minh. [[But]] mình không thích kẹt xe, [[so]] mình hay về Bến Tre vào cuối tuần.||[[So]], hiện tại thành phố hợp với mình hơn, [[but]] khi lớn tuổi mình muốn có cuộc sống yên tĩnh.", "For now, I prefer to live in the city.||[[That's because]] my job is there, [[and]] everything is convenient. I can also meet many people and learn new things for my career.||[[For example]], I work in marketing, [[so]] most companies like mine are in Ho Chi Minh City. [[But]] I don't like the traffic, [[so]] I often visit Bến Tre at weekends.||[[So]] yes, the city is better for me now, [[but]] I'd like a quiet life when I'm older.", "", "convenient|when I'm old", ""], ["Is it good for elderly people to live in large cities?", "Còn tùy.||[[That's because]] thành phố có bệnh viện tốt, [[and]] con cái họ thường sống gần đó. [[But]] tiếng ồn và ô nhiễm không tốt cho sức khỏe của họ.||[[For example]], ông bà mình từng ở với gia đình mình tại TP. Hồ Chí Minh một tháng, [[and]] ông bà thấy mệt vì tiếng ồn.||[[So]], theo mình, một khu yên tĩnh trong thành phố, gần công viên, là lựa chọn tốt nhất cho người lớn tuổi.", "It depends.||[[That's because]] cities have good hospitals, [[and]] their children often live nearby. [[But]] the noise and pollution are not good for their health.||[[For example]], my grandparents once stayed with us in Ho Chi Minh City for a month, [[and]] they felt tired because of the noise.||[[So]] in my opinion, a quiet area in a city, near a park, is the best choice for older people.", "", "hospitals|pollution|noise", ""], ["Is it possible that all of the population will move to cities?", "Không, mình không nghĩ tất cả mọi người sẽ chuyển lên thành phố.||[[That's because]] chúng ta vẫn cần nông dân trồng lương thực, [[so]] một số người phải ở lại nông thôn. Nhiều người cũng đơn giản là yêu cuộc sống yên tĩnh ở đó.||[[For example]], bây giờ công nghệ cho phép mọi người làm việc ở nhà, [[so]] một số người trẻ còn chuyển về quê, như anh họ mình ở Bến Tre.||[[So]], mình tin rằng thành phố sẽ tiếp tục phát triển, [[but]] nông thôn sẽ không bao giờ trống vắng.", "No, I don't think everyone will move to cities.||[[That's because]] we still need farmers to grow food, [[so]] some people must stay in the countryside. Many people also simply love the quiet life there.||[[For example]], technology now lets people work from home, [[so]] some young people even move back to their hometown, like my cousin in Bến Tre.||[[So]] I believe cities will keep growing, [[but]] the countryside will never be empty.", "", "grow food|quiet life", ""]]}, {"name": "Đề 38 · Shopping", "rows": [["Do people in your country go to the shopping mall frequently?", "Có, người Việt Nam đi trung tâm thương mại khá thường xuyên, chủ yếu vào cuối tuần.||[[That's because]] trung tâm thương mại có máy lạnh, [[and]] mọi người có thể ăn uống, xem phim và mua sắm ở cùng một chỗ. Nhiều người đến đó chỉ để thư giãn, không phải để mua đồ.||[[For example]], gia đình mình thường đến Vincom vào Chủ nhật để ăn trưa và đi dạo.||[[So]], trung tâm thương mại là nơi phổ biến để mọi người dành thời gian cuối tuần ở Việt Nam.", "Yes, people in Vietnam go to shopping malls quite often, mostly at weekends.||[[That's because]] malls are air-conditioned, [[and]] people can eat, watch films and shop in one place. Many people go there just to relax, not to buy things.||[[For example]], my family usually goes to Vincom on Sunday to have lunch and walk around.||[[So]] yes, malls are a popular place to spend the weekend in Vietnam.", "", "at weekends|air-conditioned", ""], ["How have people’s shopping habits changed in recent decades?", "Mình nghĩ thay đổi lớn nhất là bây giờ mọi người mua sắm online nhiều hơn rất nhiều.||[[That's because]] nó nhanh hơn, [[and]] họ có thể so sánh giá dễ dàng. Hầu hết mọi người bây giờ cũng thanh toán bằng mã QR, [[so]] mua sắm rất nhanh.||[[For example]], mẹ mình [[used to]] đi chợ mỗi ngày, [[but]] bây giờ mẹ mua nhiều thứ trên Shopee hoặc TikTok Shop.||[[So]], theo mình, bây giờ mua sắm tiện lợi hơn nhiều, [[but]] chất lượng không phải lúc nào cũng tốt.", "I think the biggest change is that people shop online much more now.||[[That's because]] it's faster, [[and]] they can compare prices easily. Most people also pay by QR code now, [[so]] shopping is very quick.||[[For example]], my mother [[used to]] go to the local market every day, [[but]] now she buys a lot of things on Shopee or TikTok Shop.||[[So]] in my opinion, shopping is much more convenient now, [[but]] the quality is not always good.", "", "shop online|Shopee", ""], ["Do you think shops and shopping malls will disappear in the future?", "Không, mình không nghĩ cửa hàng và trung tâm thương mại sẽ biến mất.||[[That's because]] mọi người vẫn muốn nhìn và chạm vào sản phẩm trước khi mua. Trung tâm thương mại cũng là nơi để gặp bạn bè và vui chơi.||[[For example]], mình luôn thử giày chạy bộ ở cửa hàng trước khi mua. [[However]], một số cửa hàng nhỏ có thể đóng cửa [[because]] giá online rẻ hơn.||[[So]], mình tin rằng cửa hàng sẽ vẫn tồn tại, [[but]] họ cần mang lại trải nghiệm tốt hơn.", "No, I don't think shops and malls will disappear.||[[That's because]] people still want to see and touch products before they buy them. Malls are also places to meet friends and have fun.||[[For example]], I always try on running shoes in a shop before I buy them. [[However]], some small shops may close [[because]] online prices are cheaper.||[[So]] I believe shops will stay, [[but]] they need to offer a better experience.", "", "see and touch|have fun", ""], ["What are the differences between shopping in street markets and big shopping malls?", "Mình nghĩ chợ thì rẻ hơn, [[but]] trung tâm thương mại thì thoải mái hơn.||[[That's because]] ở chợ, bạn có thể trả giá với người bán. Trung tâm thương mại thì sạch sẽ và có máy lạnh, [[but]] đồ ở đó thường đắt hơn.||[[For example]], ở chợ Bến Thành, bạn có thể mua quà lưu niệm với giá rẻ [[if]] bạn giỏi trả giá.||[[So]], theo mình, chợ thích hợp để mua đồ rẻ, [[and]] trung tâm thương mại thích hợp khi bạn muốn chất lượng và giá cố định.", "I think street markets are cheaper, [[but]] shopping malls are more comfortable.||[[That's because]] at markets, you can bargain with the sellers. Malls are clean and air-conditioned, [[but]] things there are usually more expensive.||[[For example]], at Bến Thành Market, you can buy souvenirs cheaply [[if]] you're good at bargaining.||[[So]] in my opinion, markets are good for cheap things, [[and]] malls are good for quality and fixed prices.", "", "bargain|comfortable|expensive", ""]]}, {"name": "Đề 47 · Animals", "rows": [["Do you think people are more interested in animals now than they were in the past?", "Có, mình nghĩ bây giờ mọi người quan tâm đến động vật nhiều hơn.||[[That's because]] nhiều người nuôi thú cưng và coi chúng như thành viên trong gia đình. Họ cũng quan tâm nhiều hơn đến quyền động vật, [[and]] video về động vật rất phổ biến trên mạng.||[[For example]], nhiều bạn trẻ ở TP. Hồ Chí Minh nhận nuôi chó mèo hoang [[instead of]] mua chúng.||[[So]], mình tin rằng mọi người yêu thương và quan tâm đến động vật nhiều hơn trước.", "Yes, I think people are more interested in animals now.||[[That's because]] many people keep pets and treat them like family members. They also care more about animal rights, [[and]] animal videos are very popular online.||[[For example]], many young people in Ho Chi Minh City adopt stray dogs and cats [[instead of]] buying them.||[[So]] yes, I believe people love and care about animals more than before.", "", "keep pets|animal videos", ""], ["Is there any difference between the way animals were used for work in the past and nowadays?", "Có, có một sự khác biệt lớn.||[[That's because]] [[in the past]], nông dân [[used to]] dùng trâu để cày ruộng, [[but]] bây giờ máy móc làm việc này. Ngày nay, động vật chủ yếu là thú cưng hoặc được dùng cho du lịch.||[[For example]], [[when]] mình đi Hà Giang, mình thấy người dân vẫn dùng ngựa để chở ngô trên núi.||[[So]], bây giờ động vật làm việc ít hơn nhiều, trừ ở một số vùng núi.", "Yes, there is a big difference.||[[That's because]] [[in the past]], farmers [[used to]] use buffaloes in the rice fields, [[but]] now machines do this work. Today, animals are mostly pets or are used for tourism.||[[For example]], [[when]] I went to Hà Giang, I saw people still using horses to carry corn in the mountains.||[[So]] yes, animals do much less work now, except in some mountain areas.", "", "buffaloes|machines|tourism", ""]]}, {"name": "Đề 48 · Tourism", "rows": [["Why do people enjoy traveling?", "Mình nghĩ mọi người thích đi du lịch vì nó giúp họ thư giãn và học được điều mới.||[[That's because]] họ có thể quên đi công việc, ngắm cảnh mới và thử món ăn mới. Du lịch cũng giúp mọi người hiểu về những nền văn hóa khác nhau.||[[For example]], [[when]] mình đi Hà Giang, mình đã học được rất nhiều về cuộc sống của người dân tộc thiểu số.||[[So]], theo mình, du lịch vừa giúp thư giãn vừa mang tính giáo dục.", "I think people enjoy travelling because it helps them relax and learn new things.||[[That's because]] they can forget about work, see new places and try new food. Travelling also teaches people about different cultures.||[[For example]], [[when]] I went to Hà Giang, I learned a lot about the life of ethnic minority people.||[[So]] in my opinion, travelling is both relaxing and educational.", "", "relax|new places|new food", ""], ["What makes a place attractive to tourists?", "Mình nghĩ thiên nhiên đẹp và đồ ăn ngon khiến một nơi trở nên hấp dẫn.||[[That's because]] khách du lịch muốn thư giãn và tận hưởng. Người dân thân thiện, giao thông thuận tiện và giá cả hợp lý cũng quan trọng.||[[For example]], Đà Nẵng hấp dẫn [[because]] có bãi biển đẹp, hải sản ngon và sân bay hiện đại.||[[So]], theo mình, [[if]] một nơi đẹp, sạch sẽ và an toàn, khách du lịch sẽ quay lại.", "I think beautiful nature and good food make a place attractive.||[[That's because]] tourists want to relax and enjoy themselves. Friendly local people, good transport and reasonable prices are also important.||[[For example]], Đà Nẵng is attractive [[because]] it has beautiful beaches, delicious seafood and a modern airport.||[[So]] in my opinion, [[if]] a place is beautiful, clean and safe, tourists will come back again.", "", "nature|friendly|reasonable prices", ""], ["Do people prefer traveling alone or with others? Why?", "Mình nghĩ đa số mọi người thích đi du lịch cùng người khác hơn.||[[That's because]] như vậy an toàn hơn và vui hơn, [[and]] họ có thể chia sẻ chi phí. [[But]] một số người thích đi một mình, [[because]] họ được tự do hơn.||[[For example]], mình thường đi du lịch với gia đình hoặc bạn thân, [[because]] tụi mình có thể chụp ảnh cho nhau.||[[So]], đi cùng người khác phổ biến hơn, [[but]] đi một mình một lần cũng là một trải nghiệm hay.", "I think most people prefer to travel with others.||[[That's because]] it's safer and more fun, [[and]] they can share the costs. [[But]] some people like travelling alone, [[because]] they have more freedom.||[[For example]], I usually travel with my family or close friends, [[because]] we can take photos for each other.||[[So]] yes, travelling with others is more popular, [[but]] travelling alone once is a good experience too.", "", "safer|freedom", ""], ["How has tourism changed in recent years?", "Mình nghĩ bây giờ du lịch dễ dàng và rẻ hơn nhiều.||[[That's because]] mọi người đặt mọi thứ trên mạng, [[and]] vé máy bay rẻ hơn. Nhiều người chọn điểm đến dựa vào review trên TikTok.||[[For example]], [[in the past]], mọi người [[used to]] đi tour với công ty du lịch. Bây giờ mình và bạn bè tự lên kế hoạch đi Đà Lạt hay Bangkok trên điện thoại.||[[So]], bây giờ đi du lịch dễ hơn, [[but]] một số nơi nổi tiếng lại quá đông.", "I think tourism is much easier and cheaper now.||[[That's because]] people book everything online, [[and]] flights are cheaper. Many people choose places from TikTok reviews.||[[For example]], [[in the past]], people [[used to]] go on tours with a travel agency. Now my friends and I plan our own trips to Đà Lạt or Bangkok on our phones.||[[So]] yes, travelling is easier now, [[but]] some popular places are too crowded.", "", "book online|reviews|cheap flights", ""]]}, {"name": "Đề 54 · Working abroad", "rows": [["Why do people sometimes go to other cities or other countries to travel?", "Mình nghĩ mọi người đi đến nơi khác vì họ muốn trải nghiệm những nền văn hóa khác nhau.||[[That's because]] những nơi mới rất thú vị, [[and]] du lịch là cách tốt để nghỉ ngơi sau công việc. Du lịch nước ngoài cũng giúp mọi người luyện tiếng Anh.||[[For example]], nhiều người Việt đi Thái Lan hoặc Hàn Quốc, [[because]] gần và không quá đắt. Mình rất thích Bangkok [[because]] đồ ăn đường phố rất ngon.||[[So]], theo mình, mọi người đi du lịch để khám phá văn hóa mới và để nghỉ ngơi.", "I think people travel to other places because they want to experience different cultures.||[[That's because]] new places are exciting, [[and]] travelling is a good break from work. Travelling abroad also helps people practise English.||[[For example]], many Vietnamese people go to Thailand or Korea, [[because]] it's close and not too expensive. I love Bangkok [[because]] the street food is great.||[[So]] in my opinion, people travel to see new cultures and to take a break.", "", "different cultures|have a break", ""], ["Why do people like travelling?", "Mình nghĩ mọi người thích đi du lịch vì nó vừa thú vị vừa thư giãn.||[[That's because]] họ có thể học được những điều mới về thế giới [[and]] tạo ra những kỷ niệm đẹp với người đi cùng.||[[For example]], [[after]] một tháng làm việc bận rộn, một chuyến đi ngắn lên Đà Lạt giúp mình thư giãn [[and]] quay lại làm việc với nhiều ý tưởng mới.||[[So]], mình tin rằng du lịch mang lại năng lượng và những kỷ niệm vui cho mọi người.", "I think people like travelling because it's exciting and relaxing.||[[That's because]] they can learn new things about the world [[and]] make good memories with the people they travel with.||[[For example]], [[after]] a busy month at work, a short trip to Đà Lạt helps me relax [[and]] come back to work with new ideas.||[[So]] yes, I believe travelling gives people energy and happy memories.", "", "exciting|memories", ""], ["What jobs can people do abroad for a short period of time?", "Mình nghĩ mọi người có thể làm phục vụ, công nhân nông trại hoặc giáo viên tiếng Anh ở nước ngoài.||[[That's because]] những công việc này không cần hợp đồng dài. Nhiều khách sạn và nhà hàng cần thêm người làm vào mùa du lịch.||[[For example]], một số sinh viên Việt Nam làm ở nông trại tại Úc vài tháng, [[and]] những bạn khác thì đi thực tập ở công ty nước ngoài.||[[So]], theo mình, có nhiều công việc ngắn hạn ở nước ngoài, [[and]] chúng giúp mọi người kiếm tiền và có thêm kinh nghiệm.", "I think people can work as waiters, farm workers or English teachers abroad.||[[That's because]] these jobs don't need a long contract. Many hotels and restaurants need extra workers during the tourist season.||[[For example]], some Vietnamese students work on farms in Australia for a few months, [[and]] others do internships at foreign companies.||[[So]] in my opinion, there are many short jobs abroad, [[and]] they help people earn money and gain experience.", "", "internships|teach English", ""], ["Is it good that now people have an opportunity to work abroad?", "Có, mình nghĩ việc mọi người có cơ hội làm việc ở nước ngoài là điều tốt.||[[That's because]] họ có thể kiếm nhiều tiền hơn [[and]] giúp đỡ gia đình. Họ cũng học được kỹ năng mới và một ngôn ngữ mới.||[[For example]], anh họ mình đã làm việc ở Nhật ba năm, [[and]] bây giờ anh ấy có công việc tốt hơn ở Việt Nam [[because]] anh ấy nói được tiếng Nhật.||[[So]], làm việc ở nước ngoài là một cơ hội tốt, [[but]] mọi người nên cẩn thận với những lời mời làm việc giả.", "Yes, I think it's good that people can work abroad.||[[That's because]] they can earn more money [[and]] help their families. They also learn new skills and a new language.||[[For example]], my cousin worked in Japan for three years, [[and]] now he has a better job in Vietnam [[because]] he can speak Japanese.||[[So]] yes, working abroad is a good chance, [[but]] people should be careful with fake job offers.", "", "earn more|new skills", ""], ["Why might some people not want to work in another country?", "Mình nghĩ một số người không muốn làm việc ở nước ngoài vì họ nhớ gia đình.||[[That's because]] sống xa nhà rất khó khăn. Ngôn ngữ cũng có thể là một vấn đề lớn, [[and]] chi phí sinh hoạt thường rất cao.||[[For example]], nhiều người lao động Việt Nam thấy cô đơn vào dịp Tết, [[when]] mọi người ở quê đều đoàn tụ với gia đình.||[[So]], theo mình, gia đình và sự cô đơn là lý do chính khiến mọi người ở lại trong nước.", "I think some people don't want to work abroad because they miss their family.||[[That's because]] it's hard to live far from home. Language can also be a big problem, [[and]] the cost of living is often very high.||[[For example]], many Vietnamese workers feel lonely at Tết, [[when]] everyone at home is with their family.||[[So]] in my opinion, family and loneliness are the main reasons people stay at home.", "", "miss family|language|cost of living", ""]]}, {"name": "Đề 62 · Buildings", "rows": [["What do you think buildings will be like in the future?", "Mình nghĩ các tòa nhà trong tương lai sẽ cao hơn, thông minh hơn và xanh hơn.||[[That's because]] các thành phố cần tiết kiệm năng lượng và giảm ô nhiễm. Các tòa nhà sẽ dùng năng lượng mặt trời [[and]] có nhiều cây xanh hơn.||[[For example]], các tòa nhà mới có thể có hệ thống thông minh [[which]] tự động tắt đèn và máy lạnh, giống như ở một số văn phòng mới tại TP. Hồ Chí Minh.||[[So]], theo mình, các tòa nhà tương lai sẽ thông minh và thân thiện với môi trường.", "I think buildings in the future will be taller, smarter and greener.||[[That's because]] cities need to save energy and reduce pollution. Buildings will use solar energy [[and]] have more trees on them.||[[For example]], new buildings may have smart systems [[which]] turn off the lights and air conditioning automatically, like in some new offices in Ho Chi Minh City.||[[So]] in my opinion, future buildings will be smart and good for the environment.", "", "solar energy|smart|green buildings", "", "Câu hỏi về tương lai → I think… will…"], ["Which do most people prefer, living in a bungalow or in a tall building?", "Còn tùy.||[[That's because]] đa số người Việt thích nhà riêng, [[because]] họ muốn có nhiều không gian hơn. [[But]] ở các thành phố lớn, nhiều người trẻ sống ở chung cư, [[because]] chung cư rẻ hơn và an toàn hơn.||[[For example]], mình sống trong một căn hộ ở TP. Hồ Chí Minh, [[and]] ở đó có phòng gym, hồ bơi và bảo vệ.||[[So]], theo mình, điều này thật sự phụ thuộc vào ngân sách và lối sống của mỗi người.", "It depends.||[[That's because]] most Vietnamese people prefer a house, [[because]] they want more space. [[But]] in big cities, many young people live in apartments, [[because]] they're cheaper and safer.||[[For example]], I live in an apartment in Ho Chi Minh City, [[and]] it has a gym, a pool and security guards.||[[So]] in my opinion, it really depends on people's budget and lifestyle.", "", "more space|own garden|apartment", ""], ["Why are taller and taller buildings being constructed nowadays?", "Mình nghĩ các tòa nhà ngày càng cao vì thành phố không có đủ đất.||[[That's because]] ngày càng nhiều người chuyển đến thành phố, [[and]] nhà cao tầng có thể chứa rất nhiều người. Chúng cũng là biểu tượng của một thành phố hiện đại.||[[For example]], Landmark 81 ở TP. Hồ Chí Minh có văn phòng, căn hộ và trung tâm thương mại trong cùng một tòa nhà.||[[So]], nhà cao tầng giúp tiết kiệm đất, [[but]] quá nhiều nhà cao tầng có thể khiến thành phố nóng và chật chội.", "I think taller buildings are built because cities don't have enough land.||[[That's because]] more and more people move to cities, [[and]] tall buildings can hold a lot of people. They are also a symbol of a modern city.||[[For example]], Landmark 81 in Ho Chi Minh City has offices, apartments and a shopping mall in one building.||[[So]] yes, tall buildings save land, [[but]] too many of them can make the city hot and crowded.", "", "enough land|move to cities|symbol", ""]]}, {"name": "Đề 66 · Where to live", "rows": [["What kinds of places do older people prefer to live in?", "Mình nghĩ người lớn tuổi thích những nơi yên tĩnh, gần con cái và bệnh viện.||[[That's because]] họ muốn không khí trong lành và cuộc sống chậm rãi. Nhiều người cũng muốn ở lại quê, [[because]] bạn bè của họ ở đó.||[[For example]], bà mình ở Bến Tre không muốn lên thành phố, [[because]] bà rất thích khu vườn và hàng xóm của mình.||[[So]], theo mình, người lớn tuổi thích một nơi yên tĩnh, gần những người họ thương.", "I think older people prefer quiet places near their children and hospitals.||[[That's because]] they want clean air and a slow life. Many of them also want to stay in their hometown, [[because]] their friends are there.||[[For example]], my grandmother in Bến Tre doesn't want to move to the city, [[because]] she loves her garden and her neighbours.||[[So]] in my opinion, older people like a quiet place close to the people they love.", "", "quiet|near hospitals|hometown", ""], ["What are the advantages of living close to the workplace?", "Mình nghĩ lợi ích lớn nhất là bạn tiết kiệm được thời gian và tiền bạc.||[[That's because]] bạn không bị kẹt xe, [[so]] bạn thấy bớt căng thẳng. [[As a result]], bạn có nhiều thời gian hơn cho gia đình và tập thể dục.||[[For example]], mình sống cách văn phòng khoảng 30 phút, [[so]] mỗi ngày mình mất một tiếng đi đường. [[If]] sống gần hơn, mình có thể chạy bộ mỗi sáng.||[[So]], sống gần nơi làm việc giúp cuộc sống dễ dàng và khỏe mạnh hơn.", "I think the biggest advantage is that you save time and money.||[[That's because]] you don't get stuck in traffic jams, [[so]] you feel less stressed. [[As a result]], you have more time for your family and exercise.||[[For example]], I live about 30 minutes from my office, [[so]] I spend one hour on the road every day. [[If]] I lived closer, I could go running every morning.||[[So]] yes, living near work makes life easier and healthier.", "", "save time|traffic jams|more time", ""], ["Why do many people move to the city?", "Mình nghĩ nhiều người chuyển lên thành phố chủ yếu để có việc làm tốt hơn.||[[That's because]] thành phố có nhiều việc làm hơn và lương cao hơn. Ở đó cũng có trường học, bệnh viện và chỗ vui chơi tốt hơn.||[[For example]], mình đã lên TP. Hồ Chí Minh để làm công việc marketing. [[However]], thành phố lớn cũng có kẹt xe, ô nhiễm và giá thuê nhà cao.||[[So]], theo mình, mọi người chuyển lên thành phố vì cơ hội, [[but]] họ cũng phải đối mặt với nhiều áp lực.", "I think many people move to the city mainly for better jobs.||[[That's because]] cities have more jobs and higher salaries. They also have better schools, hospitals and entertainment.||[[For example]], I moved to Ho Chi Minh City for my job in marketing. [[However]], big cities also have traffic jams, pollution and high rent.||[[So]] in my opinion, people move to cities for opportunities, [[but]] they also face a lot of stress.", "", "better jobs|better schools|entertainment", ""], ["Where do people like to live in your country?", "Mình nghĩ đa số mọi người thích sống ở các thành phố lớn như Hà Nội và TP. Hồ Chí Minh.||[[That's because]] ở đó có nhiều việc làm hơn. Gần đây, các thành phố biển như Đà Nẵng cũng đang được ưa chuộng, [[because]] không khí trong lành và cuộc sống ít áp lực hơn.||[[For example]], một số bạn của mình làm việc online, [[so]] họ đã chuyển đến Đà Nẵng để sống gần biển.||[[So]], theo mình, thành phố lớn vẫn là lựa chọn hàng đầu, [[but]] các thành phố nhỏ hơn đang ngày càng được ưa chuộng.", "I think most people like to live in big cities like Hà Nội and Ho Chi Minh City.||[[That's because]] there are more jobs there. Recently, coastal cities like Đà Nẵng are also becoming popular, [[because]] the air is fresh and life is less stressful.||[[For example]], some of my friends work online, [[so]] they moved to Đà Nẵng to live near the beach.||[[So]] in my opinion, big cities are still the top choice, [[but]] smaller cities are becoming more popular.", "", "big cities|coastal cities|popular", ""]]}]}, "p3_3": {"name": "Đồ vật & Media", "topics": [{"name": "Đề 2 · Online learning", "rows": [["Do you think online learning will replace face-to-face learning?", "Không, tôi không nghĩ học online sẽ thay thế học trực tiếp.||[[That's because]] học sinh cần giáo viên để tạo động lực, đặc biệt là trẻ nhỏ.||[[For example]], trong mùa dịch, tôi học online nhiều tháng [[and]] rất khó tập trung. Trong lớp thật, tôi có thể hỏi giáo viên ngay [[and]] luyện tập với bạn cùng lớp.||[[So]], tôi nghĩ học online chỉ là một lựa chọn thêm rất tốt, chứ không thay thế được lớp học thật.", "No, I don't think online learning will replace face-to-face learning.||[[That's because]] students need teachers to motivate them, especially young children.||[[For example]], during the pandemic, I studied online for months, [[and]] it was hard to focus. In a real class, I can ask the teacher right away [[and]] practise with classmates.||[[So]], I think online learning is a good extra option, [[but]] it can't replace real classes.", "", "motivate|extra option", ""], ["What are the advantages of online learning?", "Tôi nghĩ ưu điểm lớn nhất của học online là sự linh hoạt.||[[That's because]] bạn có thể học bất cứ lúc nào, ở bất cứ đâu có internet, [[and]] nó thường rẻ hơn.||[[For example]], tôi vừa làm marketing vừa học thạc sĩ, [[so]] tôi xem bài giảng vào buổi tối sau giờ làm ở Thành phố Hồ Chí Minh.||[[So]], học online rất tiện cho người bận rộn, [[but]] bạn cần nhiều kỷ luật.", "I think the biggest advantage of online learning is flexibility.||[[That's because]] you can study at any time, anywhere with the internet, [[and]] it's usually cheaper.||[[For example]], I work in marketing [[and]] study for a master's degree, [[so]] I watch lectures in the evening after work in Ho Chi Minh City.||[[So]], online learning is very convenient for busy people, [[but]] you need a lot of self-discipline.", "", "flexible|cheaper|anywhere", ""], ["Why are so many young people obsessed with short videos?", "Tôi nghĩ giới trẻ thích video ngắn vì chúng dễ xem và vui.||[[That's because]] video ngắn và hài hước, [[and]] ứng dụng luôn đề xuất video mới, [[so]] rất dễ thư giãn mà không cần suy nghĩ.||[[For example]], bạn bè tôi xem TikTok mỗi tối để theo kịp các xu hướng mới, [[because]] họ không muốn bị lạc hậu.||[[So]], video ngắn rất hấp dẫn, [[but]] tôi nghĩ chúng làm chúng ta khó tập trung hơn.", "I think young people love short videos because they're easy and fun.||[[That's because]] the videos are short and funny, [[and]] the app always shows new ones, [[so]] it's easy to relax without thinking.||[[For example]], my friends watch TikTok every night to follow new trends, [[because]] they don't want to miss anything.||[[So]], short videos are very attractive, [[but]] I think they make it harder for us to focus.", "", "short and funny|relax", ""], ["Do you think people spend too much time watching short videos? Why?", "Có, tôi nghĩ nhiều người dành quá nhiều thời gian xem video ngắn.||[[That's because]] họ dễ quên mất thời gian, [[and]] điều này khiến họ ngủ muộn [[and]] lãng phí thời gian đọc sách hay tập thể dục.||[[For example]], đôi khi tôi xem TikTok cả tiếng đồng hồ, [[so]] bây giờ tôi cố gắng xem ít lại để có thời gian đi chạy bộ.||[[So]], có, tôi nghĩ mọi người nên đặt giới hạn, ví dụ 30 phút mỗi ngày.", "Yes, I think people spend too much time on short videos.||[[That's because]] they lose track of time, [[and]] this makes them sleep late [[and]] waste time for reading or exercise.||[[For example]], I sometimes watch TikTok for an hour, [[so]] now I try to cut down [[and]] go running instead.||[[So]] yes, I think everyone should set a limit, like 30 minutes a day.", "", "lose track of time", ""]]}, {"name": "Đề 3 · Old things", "rows": [["What kind of old things do people like to keep?", "Mọi người thường giữ ảnh, thư và quà cũ từ gia đình.||[[That's because]] mỗi món đồ cũ thường có một câu chuyện gia đình, [[and]] người lớn tuổi không muốn lãng phí thứ gì.||[[For example]], gia đình tôi ở Bến Tre vẫn giữ chiếc radio của ông tôi, đã hơn 40 năm tuổi.||[[So]], tôi nghĩ người ta thích giữ những món đồ có ý nghĩa với gia đình.", "People usually keep photos, letters and old gifts from their family.||[[That's because]] each old thing has a family story, [[and]] older people don't want to waste anything.||[[For example]], my family in Bến Tre still keeps my grandfather's radio, which is more than 40 years old.||[[So]], I think people like to keep things that mean a lot to their family.", "", "photos|letters|gifts", ""], ["Why do people keep old things?", "Tôi nghĩ người ta giữ đồ cũ chủ yếu vì kỷ niệm.||[[That's because]] đồ cũ nhắc họ nhớ về người thân [[and]] những ngày đã qua. [[Also]], một số đồ cũ trở nên có giá trị.||[[For example]], tôi vẫn giữ những lá thư bạn bè viết cho tôi hồi cấp ba. Mỗi lần đọc lại, tôi nhớ về những ngày đi học vui vẻ.||[[So]], theo tôi, đồ cũ quan trọng vì chúng giữ lại những kỷ niệm đẹp.", "I think people keep old things mainly for memories.||[[That's because]] old things remind them of their family [[and]] the past. [[Also]], some old things become valuable.||[[For example]], I still keep letters from my high school friends. Every time I read them, I remember my happy school days.||[[So]] in my opinion, old things are important because they keep good memories.", "", "memories|remind|valuable", ""], ["What are the differences between the things old people keep and those young people keep?", "Người lớn tuổi thường giữ đồ vật thật, [[while]] người trẻ giữ đồ công nghệ và đồ kỹ thuật số.||[[That's because]] người lớn tuổi coi trọng những thứ họ có thể cầm [[and]] nhìn thấy, [[but]] người trẻ lưu mọi thứ trên điện thoại.||[[For example]], ông tôi giữ một hộp ảnh đen trắng, [[while]] tôi giữ hàng nghìn tấm ảnh trên Google Photos.||[[So]], tôi nghĩ sự khác biệt chính là đồ vật thật và đồ kỹ thuật số.", "Old people keep real objects, [[while]] young people keep gadgets and digital things.||[[That's because]] older people value things they can hold [[and]] see, [[but]] young people keep everything on their phones.||[[For example]], my grandfather keeps a box of black-and-white photos, [[while]] I keep thousands of photos on Google Photos.||[[So]], I think the main difference is real things versus digital things.", "", "furniture|gadgets|on their phones", ""], ["What are the differences between the things that people keep today and the things that people kept in the past?", "Ngày xưa người ta giữ thư và ảnh giấy, [[but]] bây giờ họ giữ ảnh và tin nhắn kỹ thuật số.||[[That's because]] đồ kỹ thuật số dễ lưu giữ, [[but]] cũng rất dễ bị mất.||[[For example]], [[if]] điện thoại bị hỏng [[and]] bạn không sao lưu, bạn có thể mất hết ảnh. Mẹ tôi vẫn giữ những album ảnh giấy cũ ở Bến Tre.||[[So]], tôi nghĩ chúng ta nên in một số ảnh quan trọng ra để giữ lâu dài.", "In the past, people kept letters and paper photos, [[but]] now they keep digital photos and messages.||[[That's because]] digital things are easy to keep, [[but]] they're also easy to lose.||[[For example]], [[if]] your phone breaks [[and]] you have no backup, you can lose all your photos. My mother still keeps old paper albums in Bến Tre.||[[So]], I think we should print some important photos to keep for a long time.", "", "paper photos|digital|easy to lose", ""], ["Do you think that keeping old things in a family is a great way to connect with the past?", "Có, tôi đồng ý.||[[That's because]] đồ cũ có những câu chuyện, [[and]] chúng giúp các thế hệ trong gia đình gần nhau hơn.||[[For example]], khi bố tôi lau chiếc radio cũ, ông kể cho chúng tôi nghe chuyện ngày xưa, [[and]] chúng tôi hiểu lịch sử gia đình hơn.||[[So]], có, tôi nghĩ giữ đồ cũ là một cách tuyệt vời để kết nối với quá khứ.", "Yes, I agree.||[[That's because]] old things have stories, [[and]] they bring different generations closer.||[[For example]], when my father cleans the old radio, he tells us stories about the past, [[and]] we understand our family history better.||[[So]] yes, I think keeping old things is a great way to connect with the past.", "", "stories|connect with the past", ""]]}, {"name": "Đề 8 · Art", "rows": [["What are the differences between painting and drawing?", "Tôi nghĩ vẽ phác thường đơn giản hơn, [[while]] vẽ tranh màu phức tạp hơn.||[[That's because]] vẽ phác thường dùng bút chì, [[but]] vẽ tranh màu cần màu, cọ [[and]] nhiều kỹ năng hơn.||[[For example]], ở công ty, tôi vẽ phác nhanh để ghi lại ý tưởng quảng cáo, [[but]] một bức tranh màu có thể mất nhiều ngày.||[[So]], vẽ phác nhanh và đơn giản, còn vẽ tranh màu mất thời gian hơn [[and]] trông hoàn chỉnh hơn.", "I think drawing is simpler, [[while]] painting is more difficult.||[[That's because]] drawing usually uses pencils, [[but]] painting needs colours, brushes [[and]] more skills.||[[For example]], at work I draw quick sketches to note down ad ideas, [[but]] a painting can take many days.||[[So]], drawing is quick and simple, [[and]] painting takes more time [[but]] looks more complete.", "", "pencils|brushes", ""], ["Why do some people keep a painting for a long time?", "Người ta giữ tranh lâu vì tranh đẹp [[and]] chứa đựng kỷ niệm.||[[That's because]] một bức tranh có thể nhắc họ về một nơi hay một người đặc biệt. [[Also]], một số bức tranh có giá trị hơn theo thời gian.||[[For example]], ông bà tôi có một bức tranh vẽ làng quê đã hơn 20 năm. Nó nhắc cả nhà nhớ về quê hương, [[so]] không ai muốn bỏ đi.||[[So]], tôi nghĩ người ta giữ tranh chủ yếu vì ý nghĩa tình cảm.", "People keep a painting because it's beautiful [[and]] it has memories.||[[That's because]] a painting can remind them of a special place or person. [[Also]], some paintings become more valuable over time.||[[For example]], my grandparents have a painting of a village, which is more than 20 years old. It reminds us of our hometown, [[so]] nobody wants to throw it away.||[[So]], I think people keep paintings mainly for their meaning.", "", "memories|valuable", ""], ["How does building style affect people’s lives?", "Tôi nghĩ phong cách kiến trúc ảnh hưởng nhiều đến tâm trạng và sức khỏe của con người.||[[That's because]] thiết kế tốt mang lại nhiều ánh sáng [[and]] không khí trong lành, [[but]] thiết kế tồi làm thành phố trở nên chật chội.||[[For example]], phố cổ Hội An có những ngôi nhà vàng rất đẹp, [[so]] du khách thấy thư thái. [[But]] ở một số khu mới tại Thành phố Hồ Chí Minh, nhà quá sát nhau [[and]] không có cây xanh.||[[So]], tôi nghĩ kiến trúc đẹp giúp mọi người sống vui vẻ và khỏe mạnh hơn.", "I think building style affects people's mood and health a lot.||[[That's because]] good design gives more light [[and]] fresh air, [[but]] bad design makes a city feel crowded.||[[For example]], Hội An's old town has beautiful yellow houses, [[so]] visitors feel relaxed. [[But]] in some new areas of Ho Chi Minh City, buildings are too close [[and]] there are no trees.||[[So]], I think good buildings help people live happier and healthier lives.", "", "light and air|crowded", ""], ["Should children learn to draw?", "Có, tôi nghĩ trẻ em nên học vẽ.||[[That's because]] vẽ giúp trẻ sáng tạo [[and]] thể hiện cảm xúc. Đó [[also]] là cách tốt để thư giãn sau giờ học.||[[For example]], cháu gái tôi vẽ mỗi tối sau giờ học, [[and]] con bé trông rất vui [[and]] bình tĩnh hơn.||[[So]], có, trẻ em nên học vẽ, [[but]] cha mẹ chỉ nên để con vẽ cho vui, không nên ép con thành họa sĩ.", "Yes, I think children should learn to draw.||[[That's because]] drawing helps them be creative [[and]] show their feelings. It's [[also]] a good way to relax after school.||[[For example]], my niece draws every evening after school, [[and]] she looks happier [[and]] calmer.||[[So]] yes, children should learn to draw, [[but]] parents should just let them draw for fun.", "", "creative|relax", ""], ["What is the meaning of what they draw? What do they often draw?", "Trẻ em thường vẽ gia đình, nhà cửa, con vật [[and]] nhân vật hoạt hình, [[and]] tranh của trẻ thể hiện cảm xúc.||[[That's because]] trẻ vẽ những gì chúng yêu thích [[and]] cảm nhận. Màu sắc tươi sáng thường có nghĩa là trẻ đang vui.||[[For example]], cháu gái tôi hay vẽ cả nhà nắm tay nhau, [[and]] điều đó cho thấy con bé cảm thấy hạnh phúc [[and]] an toàn.||[[So]], tôi nghĩ cha mẹ nên hỏi con về tranh vẽ để hiểu con hơn.", "Children often draw their family, home, animals [[and]] cartoon characters, [[and]] their drawings show their feelings.||[[That's because]] they draw what they love [[and]] feel. Bright colours usually mean they're happy.||[[For example]], my niece often draws our family holding hands, [[and]] this shows she feels happy [[and]] safe.||[[So]], I think parents should ask their kids about their drawings to understand them better.", "", "family|cartoon characters|feelings", ""]]}, {"name": "Đề 12 · History", "rows": [["Should everyone know history?", "Có, tôi nghĩ mọi người nên biết ít nhất lịch sử cơ bản.||[[That's because]] lịch sử giúp chúng ta hiểu đất nước mình hơn [[and]] học từ những sai lầm trong quá khứ.||[[For example]], biết lịch sử giúp tôi hiểu vì sao người Việt Nam coi trọng gia đình [[and]] độc lập đến vậy.||[[So]], có, mọi người nên biết lịch sử, [[but]] không cần nhớ quá nhiều ngày tháng, chỉ cần hiểu các sự kiện chính.", "Yes, I think everyone should know basic history.||[[That's because]] history helps us understand our country [[and]] learn from past mistakes.||[[For example]], knowing history helps me understand why Vietnamese people value family [[and]] independence so much.||[[So]] yes, everyone should know history, [[but]] they don't need to remember many dates, just the main events.", "", "understand|past mistakes", ""], ["In what ways can children learn history?", "Trẻ em có thể học lịch sử qua sách, phim [[and]] bảo tàng.||[[That's because]] câu chuyện [[and]] hình ảnh giúp trẻ nhớ tốt hơn là học thuộc lòng.||[[For example]], ở Bảo tàng Lịch sử tại Thành phố Hồ Chí Minh, trẻ em có thể nhìn thấy đồ vật thật từ hàng trăm năm trước.||[[So]], tôi nghĩ phim [[and]] tham quan bảo tàng là những cách dễ nhất để trẻ học lịch sử.", "Children can learn history from books, films [[and]] museums.||[[That's because]] stories [[and]] pictures help them remember better than learning by heart.||[[For example]], at the History Museum in Ho Chi Minh City, children can see real objects from hundreds of years ago.||[[So]], I think films [[and]] museum visits are the easiest ways for children to learn history.", "", "films|museums", ""], ["What are the differences between learning history from books and from videos?", "Sách cho nhiều chi tiết hơn, [[while]] video thú vị hơn [[and]] dễ nhớ hơn.||[[That's because]] video có hình ảnh [[and]] âm thanh. [[However]], một số video trên mạng không chính xác.||[[For example]], tôi thấy học lịch sử bằng sách ở trường khá chán, [[but]] khi xem phim tài liệu trên YouTube, tôi nhớ nhiều hơn.||[[So]], tôi nghĩ video dễ nhớ hơn, [[but]] sách đáng tin cậy hơn.", "Books give more details, [[while]] videos are more interesting [[and]] easier to remember.||[[That's because]] videos have pictures [[and]] sounds. [[However]], some videos online are not correct.||[[For example]], I found history books at school quite boring, [[but]] when I watch documentaries on YouTube, I remember more.||[[So]], I think videos are easier to remember, [[but]] books are more reliable.", "", "details|easy to remember|not correct", ""], ["Is it difficult to protect and preserve historic buildings?", "Có, khá khó.||[[That's because]] việc này tốn rất nhiều tiền, [[and]] thời tiết nóng ẩm ở Việt Nam làm các tòa nhà cũ hư hỏng nhanh.||[[For example]], ở Thành phố Hồ Chí Minh, một số người phá nhà cũ để xây nhà mới, [[because]] đất ở thành phố rất đắt.||[[So]], có, việc này khó, [[and]] tôi nghĩ chính phủ nên có luật để bảo vệ những tòa nhà này.", "Yes, it's quite difficult.||[[That's because]] it costs a lot of money, [[and]] the hot, humid weather in Vietnam damages old buildings quickly.||[[For example]], in Ho Chi Minh City, some people knock down old houses to build new ones, [[because]] land is very expensive.||[[So]] yes, it's hard, [[and]] I think the government should make laws to protect these buildings.", "", "costs a lot|damage", ""]]}, {"name": "Đề 27 · Environment", "rows": [["Why is environmental protection important?", "Bảo vệ môi trường quan trọng vì chúng ta chỉ có một Trái Đất.||[[That's because]] ô nhiễm làm con người bị bệnh, [[and]] [[if]] không bảo vệ môi trường, thế hệ sau sẽ không có không khí [[and]] nước sạch.||[[For example]], ở Thành phố Hồ Chí Minh, không khí đôi khi ô nhiễm đến mức tôi phải đeo khẩu trang khi đi chạy bộ.||[[So]], tôi nghĩ bảo vệ môi trường cũng là bảo vệ sức khỏe của chính chúng ta.", "Environmental protection is important because we only have one Earth.||[[That's because]] pollution makes people sick, [[and]] [[if]] we don't protect the environment, future generations won't have clean air [[and]] water.||[[For example]], in Ho Chi Minh City, the air is sometimes so dirty that I wear a mask when I go running.||[[So]], I think protecting the environment means protecting our own health.", "", "pollution|future generations|clean air", ""], ["What environmental problems are common in cities?", "Các vấn đề phổ biến nhất là ô nhiễm không khí, rác nhựa [[and]] ngập lụt.||[[That's because]] có quá nhiều xe máy, [[and]] mọi người không phân loại rác.||[[For example]], Thành phố Hồ Chí Minh thường bị ngập khi mưa lớn, [[and]] tôi thấy rất nhiều túi nhựa trên đường mỗi ngày.||[[So]], [[if]] không có gì thay đổi, tôi nghĩ những vấn đề này sẽ ngày càng tệ hơn.", "The most common problems are air pollution, plastic rubbish [[and]] floods.||[[That's because]] there are too many motorbikes, [[and]] people don't separate their rubbish.||[[For example]], Ho Chi Minh City often floods when it rains heavily, [[and]] I see a lot of plastic bags on the streets every day.||[[So]], [[if]] nothing changes, I think these problems will get worse.", "", "air pollution|rubbish|flooding", ""], ["Should governments or individuals take more responsibility?", "Tôi nghĩ cả hai, [[but]] chính phủ nên chịu trách nhiệm nhiều hơn.||[[That's because]] chính phủ có thể đặt ra luật, còn mỗi cá nhân chỉ có thể tái chế [[and]] dùng ít nhựa hơn.||[[For example]], chính phủ có thể cấm túi nilon dùng một lần ở siêu thị. [[But]] luật chỉ hiệu quả [[when]] mọi người tuân theo, như mang túi vải khi đi chợ.||[[So]], theo tôi, chính phủ nên dẫn đầu, [[but]] mọi người cũng cần giúp sức.", "I think both, [[but]] governments should take more responsibility.||[[That's because]] governments can make laws, [[while]] individuals can only recycle [[and]] use less plastic.||[[For example]], the government can ban plastic bags in supermarkets. [[But]] laws only work [[when]] everyone follows them, like bringing a cloth bag to the market.||[[So]] in my opinion, governments should lead, [[but]] everyone needs to help.", "", "make laws|recycle|use less plastic", ""], ["How can schools teach children about environmental protection?", "Tôi nghĩ trường học nên dạy về môi trường qua các hoạt động thực tế.||[[That's because]] [[when]] trẻ tự làm, chúng nhớ lâu [[and]] hình thành thói quen tốt.||[[For example]], trường có thể dạy học sinh tái chế, tổ chức ngày dọn rác trong khu phố, [[or]] cho các em trồng cây.||[[So]], tôi nghĩ các bài học ngoài trời là cách tốt nhất để dạy trẻ bảo vệ môi trường.", "I think schools should teach children through real activities.||[[That's because]] [[when]] children do things by themselves, they remember for a long time [[and]] build good habits.||[[For example]], schools can teach students to recycle, organise clean-up days in the neighbourhood, [[or]] let them plant trees.||[[So]], I think outdoor lessons are the best way to teach children about the environment.", "", "outdoor lessons|recycling|clean-up days", ""], ["Should companies be punished for pollution?", "Có, chắc chắn rồi.||[[That's because]] [[if]] phải nộp phạt nặng, các công ty sẽ cẩn thận hơn.||[[For example]], [[if]] một nhà máy xả nước bẩn ra sông, người dân sống gần đó sẽ bị ảnh hưởng, như ở một số vùng nông thôn gần Bến Tre.||[[So]], có, các công ty nên bị phạt [[and]] cũng phải làm sạch môi trường.", "Yes, definitely.||[[That's because]] [[if]] they pay big fines, they will be more careful.||[[For example]], [[if]] a factory puts dirty water into a river, the people nearby suffer, like in some villages near Bến Tre.||[[So]] yes, companies should pay fines [[and]] also clean up the environment.", "", "fines|careful", ""]]}, {"name": "Đề 41 · Films", "rows": [["Do you believe in movie reviews?", "Đôi khi thôi, tôi không tin hoàn toàn.||[[That's because]] một số bài đánh giá thực chất là quảng cáo trả tiền. Tôi làm marketing, [[so]] tôi biết điều này khá rõ.||[[For example]], có lần tôi đọc rất nhiều bài khen một bộ phim, [[but]] khi xem thì phim khá chán.||[[So]], bây giờ tôi đọc nhiều bài đánh giá khác nhau trước khi quyết định.", "It depends. I don't believe them completely.||[[That's because]] some reviews are paid ads. I work in marketing, [[so]] I know this well.||[[For example]], once I read very good reviews about a film, [[but]] when I watched it, it was quite boring.||[[So]], now I read several different reviews before I decide.", "", "read reviews|paid ads", ""], ["What are the different types of films in your country?", "Ở Việt Nam có phim hài, phim gia đình, phim kinh dị [[and]] phim lịch sử.||[[That's because]] khán giả ngày càng ủng hộ phim Việt, [[so]] ngành điện ảnh phát triển nhanh [[and]] có nhiều thể loại hơn.||[[For example]], phim hài [[and]] phim gia đình rất nổi tiếng vào dịp Tết, [[and]] gần đây phim kinh dị Việt được giới trẻ rất yêu thích.||[[So]], tôi nghĩ phim Việt bây giờ rất đa dạng.", "In Vietnam, there are comedy, family, horror [[and]] historical films.||[[That's because]] audiences support local films more now, [[so]] the film industry is growing fast.||[[For example]], comedy [[and]] family films are very popular at Tết, [[and]] recently Vietnamese horror films are popular with young people.||[[So]], I think Vietnamese films are quite varied now.", "", "comedy|horror|historical", ""], ["Are historical films popular in your country? Why?", "Có, phim lịch sử đang ngày càng được yêu thích.||[[That's because]] mọi người muốn tìm hiểu về lịch sử theo cách thú vị hơn.||[[For example]], một số phim lịch sử gần đây rất thành công ở rạp. [[However]], loại phim này rất tốn kém [[because]] cần trang phục [[and]] bối cảnh xưa.||[[So]], phim lịch sử đang phổ biến hơn, [[but]] vẫn chưa nhiều bằng phim hài.", "Yes, historical films are becoming popular.||[[That's because]] people want to learn about history in a fun way.||[[For example]], some recent historical films did very well at the cinema. [[However]], they're expensive to make [[because]] they need old costumes [[and]] settings.||[[So]], historical films are more popular now, [[but]] there are still fewer of them than comedies.", "", "learn about history", ""], ["Do you think films with famous actors or actresses would be more popular?", "Có, thường là vậy.||[[That's because]] người hâm mộ sẽ ra rạp để xem thần tượng của họ.||[[For example]], nhiều người đi xem phim chỉ vì có một ca sĩ hay diễn viên nổi tiếng. [[But]] [[if]] cốt truyện dở, mọi người sẽ đánh giá xấu trên mạng.||[[So]], có, diễn viên nổi tiếng giúp phim hút khách, [[but]] một câu chuyện hay vẫn quan trọng hơn.", "Yes, usually.||[[That's because]] fans go to the cinema to see their idols.||[[For example]], many people see a film just because of a famous singer or actor. [[But]] [[if]] the story is bad, people give bad reviews online.||[[So]] yes, famous actors help, [[but]] a good story is more important.", "", "fans|idols|good story", ""], ["Should the director pay a lot of money to famous actors?", "Không, tôi nghĩ không nên trả quá nhiều.||[[That's because]] tiền nên được dùng cho câu chuyện [[and]] hiệu ứng, [[and]] các diễn viên trẻ tài năng cũng cần cơ hội.||[[For example]], [[if]] đạo diễn chỉ chọn diễn viên nổi tiếng, diễn viên mới sẽ khó phát triển. [[However]], ngôi sao lớn đúng là giúp bán thêm vé.||[[So]], theo tôi, đạo diễn nên trả mức hợp lý [[and]] dành nhiều tiền hơn cho câu chuyện.", "No, I think they shouldn't pay too much.||[[That's because]] the money should go to the story [[and]] the effects, [[and]] talented young actors also need chances.||[[For example]], [[if]] directors only choose famous actors, new actors find it hard to grow. [[However]], big stars do help sell tickets.||[[So]] in my opinion, directors should pay a fair amount [[and]] spend more on the story.", "", "story and effects|sell tickets", ""]]}, {"name": "Đề 61 · Comedy", "rows": [["How popular are comedy films in your country?", "Phim hài rất được yêu thích ở Việt Nam.||[[That's because]] vào dịp Tết, cả gia đình đi xem phim cùng nhau, [[and]] ai cũng muốn cười để bắt đầu năm mới.||[[For example]], phim của Trấn Thành ra mắt dịp Tết luôn có rất nhiều khán giả, [[and]] gia đình tôi thường đi xem cùng nhau.||[[So]], tôi nghĩ phim hài là thể loại phổ biến nhất [[and]] thường kiếm nhiều tiền nhất.", "Comedy films are very popular in Vietnam.||[[That's because]] at Tết, the whole family goes to the cinema together, [[and]] everyone wants to laugh to start the new year.||[[For example]], Trấn Thành's Tết films always have a lot of viewers, [[and]] my family often goes to see them together.||[[So]], I think comedy is the most popular type [[and]] usually makes the most money.", "", "come out|Tết", ""], ["Why do people of all ages enjoy watching funny cartoons?", "Tôi nghĩ mọi lứa tuổi đều thích phim hoạt hình vì chúng đơn giản [[and]] vui.||[[That's because]] phim hoạt hình dễ hiểu, có màu sắc tươi sáng [[and]] nhân vật hài hước. [[Also]], chúng có bài học về tình bạn [[and]] gia đình.||[[For example]], anh trai tôi [[and]] tôi vẫn xem Doraemon dù đã là người lớn, [[because]] nó giúp chúng tôi thư giãn.||[[So]], phim hoạt hình vừa vui vừa ý nghĩa với mọi lứa tuổi.", "I think people of all ages enjoy cartoons because they're simple [[and]] fun.||[[That's because]] cartoons are easy to understand, with bright colours [[and]] funny characters. [[Also]], they have lessons about friendship [[and]] family.||[[For example]], my brother [[and]] I still watch Doraemon as adults, [[because]] it helps us relax.||[[So]], cartoons are fun [[and]] meaningful for everyone.", "", "easy to understand|funny characters|relax", ""], ["Do you agree that most people prefer watching comedy films to watching serious films?", "Có, tôi đồng ý.||[[That's because]] mọi người mệt sau giờ làm, [[so]] họ muốn cười [[and]] thư giãn [[instead of]] suy nghĩ quá nhiều.||[[For example]], sau một ngày làm việc dài, tô
