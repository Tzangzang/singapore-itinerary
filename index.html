i thường xem phim hài hoặc Doraemon. [[However]], phim nghiêm túc cũng có khán giả riêng.||[[So]], có, tôi nghĩ đa số mọi người thích phim hài hơn.", "Yes, I agree.||[[That's because]] people are tired after work, [[so]] they want to laugh [[and]] relax [[instead of]] thinking too much.||[[For example]], after a long day at work, I usually watch a comedy or Doraemon. [[However]], serious films still have their own fans.||[[So]] yes, I think most people prefer comedies.", "", "tired after work|laugh and relax", ""], ["Should teachers use jokes and encourage laughter in the classroom?", "Có, thỉnh thoảng thôi.||[[That's because]] học sinh sẽ thấy thoải mái [[and]] nhớ bài tốt hơn.||[[For example]], thầy dạy toán của tôi thường kể một câu chuyện cười đầu giờ, [[so]] cả lớp tỉnh táo hơn [[and]] bớt sợ môn khó.||[[So]], có, giáo viên nên dùng một chút tiếng cười, [[but]] quá nhiều chuyện cười sẽ lãng phí thời gian.", "Yes, sometimes.||[[That's because]] students feel relaxed [[and]] remember lessons better.||[[For example]], my maths teacher often told a joke at the start of the lesson, [[so]] the class felt more awake [[and]] less afraid.||[[So]] yes, teachers should use a little laughter, [[but]] too many jokes can waste time.", "", "remember better|waste time", ""], ["Why are some people good at making other people laugh?", "Tôi nghĩ họ có khiếu hài hước [[and]] rất tự tin.||[[That's because]] họ để ý những điều buồn cười trong cuộc sống hằng ngày [[and]] kể chuyện rất tự nhiên.||[[For example]], một đồng nghiệp ở công ty tôi kể chuyện thường ngày rất hài, [[so]] cả văn phòng thường cười vang.||[[So]], theo tôi, khả năng này một phần là bẩm sinh [[and]] một phần là do luyện tập.", "I think they have a good sense of humour [[and]] a lot of confidence.||[[That's because]] they notice funny things in daily life [[and]] tell stories naturally.||[[For example]], one of my colleagues tells everyday stories in a very funny way, [[so]] the whole office often laughs.||[[So]] in my opinion, this ability is partly natural [[and]] partly practice.", "", "sense of humour|notice|confident", ""]]}, {"name": "Đề 65 · Inventions", "rows": [["What is the most helpful innovation at home?", "Tôi nghĩ phát minh hữu ích nhất trong nhà là máy giặt.||[[That's because]] nó tiết kiệm rất nhiều thời gian [[and]] sức lực. [[While]] máy giặt quần áo, mọi người có thể nghỉ ngơi hoặc làm việc khác.||[[For example]], mẹ tôi ở Bến Tre từng giặt tay mỗi ngày mất cả tiếng. Bây giờ bà có thêm thời gian cho bản thân [[and]] gia đình.||[[So]], theo tôi, máy giặt là phát minh hữu ích nhất.", "I think the most helpful innovation at home is the washing machine.||[[That's because]] it saves a lot of time [[and]] energy. [[While]] it washes the clothes, people can rest or do other work.||[[For example]], my mother in Bến Tre used to wash clothes by hand for an hour every day. Now she has more time for herself [[and]] the family.||[[So]] in my opinion, the washing machine is the most helpful innovation.", "", "washing machine|save time", ""], ["What household appliances make us lazy?", "Tôi nghĩ điều khiển từ xa [[and]] robot hút bụi có thể làm chúng ta lười.||[[That's because]] nhờ chúng, chúng ta không cần di chuyển nhiều.||[[For example]], ở chung cư tại Thành phố Hồ Chí Minh, nhiều người đi thang máy chỉ để lên một tầng, [[so]] họ vận động ít hơn.||[[So]], những máy này rất hữu ích cho người bận rộn, [[but]] chúng ta nên dùng một cách hợp lý.", "I think the remote control [[and]] the robot vacuum can make us lazy.||[[That's because]] with them, we don't need to move much.||[[For example]], in apartments in Ho Chi Minh City, many people take the lift just to go up one floor, [[so]] they move less.||[[So]], these machines are useful for busy people, [[but]] we should use them in a sensible way.", "", "robot vacuum|don't need to move|busy people", ""], ["What kind of invention can be used at school?", "Bảng thông minh [[and]] máy tính xách tay rất hữu ích ở trường.||[[That's because]] giáo viên có thể chiếu video [[and]] hình ảnh, [[so]] bài học thú vị hơn.||[[For example]], các ứng dụng học tập như Duolingo giúp học sinh luyện tập ở nhà. Công ty giáo dục của tôi [[also]] làm ứng dụng học IELTS bằng AI.||[[So]], công nghệ rất tốt cho trường học, [[but]] nhà trường nên giới hạn thời gian dùng màn hình.", "Smart boards [[and]] laptops are very useful at school.||[[That's because]] teachers can show videos [[and]] pictures, [[so]] lessons are more interesting.||[[For example]], learning apps like Duolingo help students practise at home. My education company [[also]] makes an AI app for IELTS.||[[So]], technology is great for schools, [[but]] schools should limit screen time.", "", "smart boards|show videos|more interesting", ""], ["Do you think AI will replace human teachers? Why?", "Không, tôi không nghĩ AI sẽ thay thế giáo viên.||[[That's because]] học sinh vẫn cần giáo viên tạo động lực [[and]] quan tâm đến mình.||[[For example]], tôi dùng AI để luyện nói tiếng Anh, [[and]] nó sửa lỗi cho tôi rất nhanh. [[But]] chỉ có giáo viên mới nhận ra khi tôi mệt [[and]] động viên tôi.||[[So]], tôi nghĩ AI là một công cụ hỗ trợ tốt, [[but]] không thể thay thế giáo viên.", "No, I don't think AI will replace human teachers.||[[That's because]] students still need teachers to motivate them [[and]] care about them.||[[For example]], I use AI to practise speaking English, [[and]] it corrects my mistakes quickly. [[But]] only a teacher can see when I'm tired [[and]] encourage me.||[[So]], I think AI is a good helper, [[but]] it can't replace teachers.", "", "help practise|motivation|care", ""]]}]}, "p3_4": {"name": "Sự kiện", "topics": [{"name": "Đề 1 · Phones in public", "rows": [["Do most people mind others talking on the phone in public places?", "Có, tôi nghĩ hầu hết mọi người đều thấy phiền, [[but]] chỉ khi người đó nói quá to.||[[That's because]] những cuộc gọi ồn ào rất khó chịu ở những nơi nhỏ như xe buýt hay quán cà phê. Những cuộc gọi ngắn và nhỏ tiếng thì không sao.||[[For example]], có lần trên xe buýt ở TP.HCM, một người đàn ông nói chuyện điện thoại rất to suốt 20 phút, [[and]] ai cũng tỏ ra khó chịu.||[[So]], đúng là mọi người thấy phiền, [[and]] tôi nghĩ ở nơi công cộng chúng ta nên nói nhỏ hoặc chỉ nhắn tin thôi.", "Yes, I think most people mind it, [[but]] only when the person talks loudly.||[[That's because]] loud phone calls are annoying in small places like buses or cafés. Short and quiet calls are OK.||[[For example]], once on a bus in Ho Chi Minh City, a man talked very loudly on the phone for 20 minutes, [[and]] everyone looked annoyed.||[[So]] yes, people mind it, [[and]] I think we should speak quietly or just send a message in public.", "", "talk loudly|annoying", ""], ["What are the differences between sitting beside a person who keeps talking on the phone and a person who keeps talking to you?", "Tôi nghĩ ngồi cạnh một người nói chuyện với mình thì dễ chịu hơn nhiều.||[[That's because]] trong một cuộc trò chuyện thật, bạn có thể chọn tham gia hoặc không. [[But]] với cuộc gọi điện thoại, bạn chỉ nghe được một nửa câu chuyện, [[so]] cảm giác rất kỳ lạ.||[[For example]], khi tôi làm việc ở quán cà phê [[and]] có người gần đó nói chuyện điện thoại, tôi không thể tập trung vào máy tính.||[[So]], theo tôi, một người nói chuyện với mình thì lịch sự hơn một người nói chuyện điện thoại.", "I think sitting beside a person who talks to you is much more comfortable.||[[That's because]] in a real conversation, you can choose to join or not. [[But]] with a phone call, you only hear half of the conversation, [[so]] it feels strange.||[[For example]], when I work in a café [[and]] someone near me is on the phone, I can't focus on my laptop.||[[So]] in my opinion, a person talking to you feels more polite than a person on the phone.", "", "polite|join the conversation", ""], ["Why do some people not care about what they do in public places?", "Tôi nghĩ một số người không quan tâm [[because]] họ bận rộn hoặc đang vội.||[[That's because]] họ không để ý đến những người xung quanh. [[Also]], họ nghĩ sẽ không bao giờ gặp lại những người này, [[so]] họ không quan tâm đến hình ảnh của mình.||[[For example]], ở TP.HCM, một số người xả rác ra đường [[because]] không ai nhắc họ dừng lại.||[[So]], tôi nghĩ giáo dục từ nhỏ rất quan trọng để thay đổi điều này.", "I think some people don't care [[because]] they are busy or in a hurry.||[[That's because]] they don't notice other people around them. [[Also]], they think they will never see these people again, [[so]] they don't care about their image.||[[For example]], in Ho Chi Minh City, some people throw rubbish on the street [[because]] nobody tells them to stop.||[[So]] I think education from a young age is important to change this.", "", "in a hurry|notice", ""]]}, {"name": "Đề 4 · Apologies", "rows": [["Do people often say sorry in your country?", "Có, người Việt Nam khá hay nói xin lỗi, [[especially]] với những chuyện nhỏ.||[[That's because]] đó là một thói quen lịch sự. [[However]], một số người thấy khó nói xin lỗi khi mắc lỗi lớn [[because]] họ sợ mất mặt.||[[For example]], khi ai đó va vào bạn trên đường, họ thường xin lỗi ngay. [[But]] ở chỗ làm, một số người không muốn thừa nhận sai lầm.||[[So]], đúng là chúng tôi hay nói xin lỗi, [[but]] chủ yếu là với những chuyện nhỏ.", "Yes, people in Vietnam say sorry quite often, [[especially]] for small things.||[[That's because]] it is a polite habit. [[However]], some people find it hard to say sorry for big mistakes [[because]] they are afraid of losing face.||[[For example]], when someone bumps into you in the street, they usually say sorry right away. [[But]] at work, some people don't want to admit mistakes.||[[So]] yes, we say sorry often, [[but]] mostly for small things.", "", "small things|hard to say sorry", ""], ["Is it important to teach children to say sorry?", "Có, tôi nghĩ điều đó rất quan trọng.||[[That's because]] trẻ em học được cách chịu trách nhiệm với hành động của mình. Điều đó [[also]] giúp các em giữ được bạn bè.||[[For example]], [[if]] đứa em họ nhỏ của tôi ở Bến Tre làm hỏng đồ chơi của bạn [[and]] nói xin lỗi, hai đứa có thể chơi với nhau tiếp. Bố mẹ nên giải thích lý do, chứ không chỉ ép con nói.||[[So]], đúng vậy, dạy trẻ nói xin lỗi giúp các em hòa hợp với người khác khi lớn lên.", "Yes, I think it is very important.||[[That's because]] children learn to take responsibility for their actions. It [[also]] helps them keep their friends.||[[For example]], [[if]] my little cousin in Bến Tre breaks a friend's toy [[and]] says sorry, they can play together again. Parents should explain why, not just force them.||[[So]] yes, teaching children to say sorry helps them get along with others when they grow up.", "", "take responsibility|keep friends", ""], ["Is it important to teach children to respect others?", "Có, điều đó rất quan trọng.||[[That's because]] sự tôn trọng là nền tảng của các mối quan hệ tốt. Trẻ em học bằng cách quan sát người lớn, [[so]] bố mẹ nên làm gương.||[[For example]], [[when]] bố mẹ lễ phép với người lớn tuổi, con cái sẽ bắt chước theo. Những đứa trẻ biết tôn trọng người khác thì dễ kết bạn.||[[So]], đúng vậy, tôi nghĩ trẻ em nên học cách tôn trọng từ sớm, [[because]] điều đó giúp các em ở trường và cả trong công việc sau này.", "Yes, it is very important.||[[That's because]] respect is the base of good relationships. Children learn by watching adults, [[so]] parents should be a good example.||[[For example]], [[when]] parents are polite to older people, their children copy them. Kids who respect others make friends easily.||[[So]] yes, I think children should learn respect early, [[because]] it helps them at school and at work later.", "", "respect|good example", ""], ["Do you think people should apologize for anything wrong they do?", "Có, tôi nghĩ mọi người nên xin lỗi mỗi khi làm sai điều gì đó.||[[That's because]] điều đó cho thấy bạn là người có trách nhiệm. [[Also]], người khác sẽ dễ tha thứ cho bạn hơn.||[[For example]], [[if]] tôi đến họp trễ ở công ty, tôi xin lỗi mọi người. [[But]] tôi [[also]] cố gắng đến sớm vào lần sau.||[[So]], đúng vậy, chúng ta nên xin lỗi, [[but]] chúng ta [[also]] cần sửa sai và không lặp lại lỗi đó.", "Yes, I think people should always apologise when they do something wrong.||[[That's because]] it shows you are responsible. [[Also]], other people forgive you more easily.||[[For example]], [[if]] I'm late for a meeting at my company, I apologise to everyone. [[But]] I [[also]] try to come early next time.||[[So]] yes, we should say sorry, [[but]] we [[also]] need to fix the mistake and not repeat it.", "", "responsible|forgive", ""]]}, {"name": "Đề 5 · Changes", "rows": [["Why do some people quit and change jobs?", "Tôi nghĩ người ta đổi việc chủ yếu [[because]] họ muốn mức lương cao hơn.||[[That's because]] chi phí sinh hoạt rất cao. Một số người [[also]] nghỉ việc [[because]] họ thấy chán hoặc căng thẳng, [[or]] họ muốn học điều mới.||[[For example]], một người bạn của tôi đã đổi việc [[because]] ở công ty cũ không có cơ hội thăng tiến.||[[So]], theo tôi, tiền lương và sự phát triển sự nghiệp là lý do chính khiến người ta đổi việc.", "I think people mainly change jobs [[because]] they want a better salary.||[[That's because]] living costs are high. Some people [[also]] quit [[because]] they feel bored or stressed, [[or]] they want to learn new things.||[[For example]], one of my friends changed jobs [[because]] there was no chance of promotion at her old company.||[[So]] in my opinion, money and career growth are the main reasons people change jobs.", "", "better salary|bored|learn new things", ""], ["Who can adapt better to changes, children or adults?", "Tôi nghĩ trẻ em thích nghi với thay đổi tốt hơn người lớn.||[[That's because]] trẻ em tò mò [[and]] học rất nhanh. Người lớn thường sợ thay đổi hơn [[because]] họ có nhiều trách nhiệm hơn.||[[For example]], trẻ em kết bạn rất nhanh ở trường mới. [[But]] một người lớn cần vài tháng mới thấy thoải mái ở công việc mới.||[[So]], theo tôi, trẻ em thích nghi tốt hơn, [[although]] người lớn giỏi lên kế hoạch cho những thay đổi hơn.", "I think children adapt to changes better than adults.||[[That's because]] children are curious [[and]] they learn fast. Adults are often more afraid of change [[because]] they have more responsibilities.||[[For example]], kids make new friends very quickly at a new school. [[But]] an adult needs months to feel comfortable in a new job.||[[So]] in my opinion, children adapt better, [[although]] adults are better at planning for changes.", "", "curious|learn fast|make friends", ""], ["When things like getting married or moving home happen, what kinds of things would you consider?", "Tôi nghĩ tôi sẽ cân nhắc tiền bạc, vị trí và ý kiến của gia đình.||[[That's because]] những thay đổi lớn này ảnh hưởng đến cuộc sống của tôi trong nhiều năm. [[First]], tôi cần đủ tiền, [[and]] [[then]] tôi cần một nơi ở tốt.||[[For example]], [[if]] tôi chuyển nhà, tôi muốn sống gần văn phòng ở TP.HCM, [[so]] tôi không mất thời gian vì kẹt xe.||[[So]], tiền bạc, vị trí và gia đình là những điều quan trọng nhất đối với tôi.", "I think I would consider money, location and my family's opinion.||[[That's because]] these big changes affect my life for many years. [[First]], I need enough money, [[and]] [[then]] I need a good place to live.||[[For example]], [[if]] I move house, I want to live near my office in Ho Chi Minh City, [[so]] I don't waste time in traffic.||[[So]], money, location and family are the most important things for me.", "", "budget|location|family", ""], ["What are the disadvantages when people keep making changes?", "Tôi nghĩ những người liên tục thay đổi sẽ cảm thấy mệt mỏi và căng thẳng.||[[That's because]] họ luôn phải bắt đầu lại từ đầu. [[Also]], họ không bao giờ trở thành chuyên gia, [[and]] rất khó xây dựng các mối quan hệ lâu dài.||[[For example]], [[if]] ai đó đổi việc mỗi năm, nhà tuyển dụng có thể nghĩ họ không đáng tin cậy.||[[So]], theo tôi, thay đổi là tốt, [[but]] cần có một lý do rõ ràng.", "I think people who keep making changes feel tired and stressed.||[[That's because]] they always need to start again. [[Also]], they never become an expert, [[and]] it is hard to build long relationships.||[[For example]], [[if]] someone changes jobs every year, employers may think they are not reliable.||[[So]] in my opinion, change is good, [[but]] there should be a clear reason for it.", "", "stressed|expert|relationships", ""]]}, {"name": "Đề 6 · Being organized", "rows": [["How can parents help children to be organized?", "Tôi nghĩ bố mẹ có thể giúp con bằng cách cho con một thói quen hằng ngày đơn giản.||[[That's because]] trẻ em học bằng cách bắt chước [[and]] lặp lại. [[If]] các em ngăn nắp từ nhỏ, sau này các em sẽ quản lý thời gian tốt hơn.||[[For example]], bố mẹ có thể yêu cầu con dọn phòng mỗi ngày, [[or]] dùng danh sách việc cần làm [[and]] lịch để làm bài tập.||[[So]], một thói quen đơn giản mỗi ngày và tấm gương tốt từ bố mẹ là cách tốt nhất.", "I think parents can help children by giving them a simple routine.||[[That's because]] children learn by copying [[and]] repeating. [[If]] they are organized from a young age, they manage their time better later.||[[For example]], parents can ask them to tidy their room every day, [[or]] use a checklist [[and]] a calendar for homework.||[[So]], a simple daily routine and a good example from parents are the best ways.", "", "routine|tidy|checklist", ""], ["On what occasions do people need to be organized?", "Mọi người cần ngăn nắp khi có sự kiện lớn, hạn chót trong công việc, chuyến đi và kỳ thi.||[[That's because]] những việc này có rất nhiều đầu việc nhỏ. [[If]] chúng ta không ngăn nắp, chúng ta dễ trễ hạn và lãng phí tiền.||[[For example]], ở công ty tôi, trước khi chạy một chiến dịch quảng cáo cho khóa học, cả nhóm lập một kế hoạch rất chi tiết.||[[So]], tôi nghĩ chúng ta cần ngăn nắp mỗi khi có việc gì lớn hoặc quan trọng.", "People need to be organized for big events, deadlines at work, trips and exams.||[[That's because]] these things have many small tasks. [[If]] we are not organized, we can easily miss deadlines and waste money.||[[For example]], at my company, before we run an ad campaign for a course, the whole team makes a detailed plan.||[[So]], I think we need to be organized whenever something is big or important.", "", "deadlines|big events", ""], ["Does everything need to be well prepared?", "Không, tôi không nghĩ mọi thứ đều cần chuẩn bị kỹ.||[[That's because]] chuẩn bị quá nhiều cho mọi chuyện nhỏ khiến cuộc sống căng thẳng. Chỉ những việc lớn như thi cử [[or]] đám cưới mới cần chuẩn bị kỹ.||[[For example]], đi cà phê với bạn bè có thể ngẫu hứng. Có lần tôi và bạn bè quyết định đi Đà Lạt vào phút chót, [[and]] đó là một chuyến đi tuyệt vời.||[[So]], theo tôi, chúng ta nên chuẩn bị kỹ cho việc lớn [[but]] thoải mái với những việc nhỏ.", "No, I don't think everything needs to be well prepared.||[[That's because]] preparing too much for every small thing makes life stressful. Only big things like exams [[or]] weddings need good preparation.||[[For example]], a coffee with friends can be spontaneous. Once my friends and I went to Đà Lạt at the last minute, [[and]] it was a great trip.||[[So]] in my opinion, we should prepare well for big things [[but]] relax about small things.", "", "spontaneous|big things", ""], ["Do people need others’ help when organizing things?", "Có, mọi người cần sự giúp đỡ, [[especially]] với những sự kiện lớn.||[[That's because]] một người không thể làm hết mọi việc. [[When]] mọi người cùng làm, công việc nhanh hơn [[and]] vui hơn.||[[For example]], vào dịp Tết, cả nhà tôi ở Bến Tre cùng nhau dọn nhà [[and]] nấu ăn. Mẹ tôi là người chỉ huy chính.||[[So]], đúng vậy, chúng ta cần người khác giúp, [[but]] nên có một người dẫn dắt [[so]] mọi việc không bị rối.", "Yes, people need help, [[especially]] for big events.||[[That's because]] one person can't do everything. [[When]] everyone works together, the job is faster [[and]] more fun.||[[For example]], at Tết, everyone in my family in Bến Tre helps clean the house [[and]] cook. My mother is the main person in charge.||[[So]] yes, we need others' help, [[but]] there should be one leader [[so]] things don't get messy.", "", "can't do everything|help", ""], ["How would you feel when you were not well prepared for something?", "Tôi sẽ cảm thấy lo lắng và căng thẳng.||[[That's because]] tôi sợ mắc lỗi trước mặt người khác.||[[For example]], lần đầu tiên tôi thuyết trình ở công ty, tôi đã không chuẩn bị kỹ, [[and]] tay tôi run lên. Bây giờ tôi luôn tập ít nhất hai lần.||[[So]], tôi rất lo lắng [[when]] không chuẩn bị, [[and]] [[that's why]] tôi luôn lên kế hoạch trước những việc quan trọng.", "I would feel nervous and stressed.||[[That's because]] I'm afraid of making mistakes in front of other people.||[[For example]], the first time I gave a presentation at work, I wasn't well prepared, [[and]] my hands were shaking. Now I always practise at least twice.||[[So]], I feel very nervous [[when]] I'm not prepared, [[and]] [[that's why]] I always make a plan before important things.", "", "nervous|make mistakes|make a plan", "", "Câu hỏi dùng would → trả lời bằng would feel, không cần quá khứ."]]}, {"name": "Đề 7 · Communication", "rows": [["What benefits does the internet bring to communication?", "Tôi nghĩ internet giúp việc giao tiếp nhanh chóng và rẻ.||[[That's because]] chúng ta có thể nhắn tin [[and]] gọi video miễn phí. Họp trực tuyến [[also]] tiết kiệm rất nhiều thời gian.||[[For example]], công ty tôi có đồng nghiệp ở Hà Nội, [[so]] chúng tôi họp qua Zoom mỗi ngày. Tôi [[also]] gọi video cho gia đình ở Bến Tre.||[[So]], internet giúp chúng ta nói chuyện với bất kỳ ai một cách dễ dàng, [[but]] chúng ta vẫn nên cẩn thận với những hiểu lầm.", "I think the internet makes communication fast and cheap.||[[That's because]] we can send messages [[and]] make video calls for free. Online meetings [[also]] save a lot of time.||[[For example]], my company has colleagues in Hà Nội, [[so]] we have meetings on Zoom every day. I [[also]] video call my family in Bến Tre.||[[So]], the internet helps us talk to anyone easily, [[but]] we should still be careful about misunderstandings.", "", "video calls|save time", ""], ["Which one is better, being a communicator or a listener?", "Tôi nghĩ cả hai đều quan trọng, [[but]] người biết lắng nghe thì hiếm hơn.||[[That's because]] người biết lắng nghe hiểu người khác hơn, [[while]] người giao tiếp giỏi thì làm việc tốt.||[[For example]], khi bạn tôi buồn, cô ấy cần một người lắng nghe hơn là một người cho lời khuyên.||[[So]], theo tôi, người giỏi nhất là người biết khi nào nên nói và khi nào nên nghe.", "I think both are important, [[but]] good listeners are rarer.||[[That's because]] listeners understand people better, [[while]] good communicators do well at work.||[[For example]], when my friend is sad, she needs someone to listen more than someone to give advice.||[[So]] in my opinion, the best person knows when to speak and when to listen.", "", "listener|understand", ""], ["What qualities does a person need to have to be a good communicator?", "Tôi nghĩ một người giao tiếp giỏi cần rõ ràng, tự tin và thân thiện.||[[That's because]] mọi người hiểu thông điệp rõ ràng rất nhanh. [[And]] quan trọng là người giao tiếp giỏi [[also]] cần biết lắng nghe.||[[For example]], quản lý của tôi giải thích công việc rất rõ ràng, [[and]] chị ấy luôn hỏi ý kiến của cả nhóm.||[[So]], sự rõ ràng và biết lắng nghe là những phẩm chất quan trọng nhất.", "I think a good communicator needs to be clear, confident and friendly.||[[That's because]] people understand clear messages quickly. [[And]] importantly, a good communicator [[also]] needs to be a good listener.||[[For example]], my manager explains tasks very clearly, [[and]] she always asks for the team's opinions.||[[So]], being clear and listening well are the most important qualities.", "", "clear|confident|listening", ""], ["How important is it to be a good listener when communicating?", "Tôi nghĩ điều đó rất quan trọng.||[[That's because]] khi lắng nghe, bạn hiểu được vấn đề, [[and]] người khác cảm thấy được tôn trọng. [[If]] không lắng nghe, bạn có thể trả lời sai.||[[For example]], trong công việc marketing của tôi, lắng nghe học viên [[and]] phụ huynh giúp chúng tôi hiểu họ thật sự cần gì.||[[So]], đúng vậy, biết lắng nghe là chìa khóa để giao tiếp tốt.", "I think it is very important.||[[That's because]] when you listen, you understand the problem, [[and]] people feel respected. [[If]] you don't listen, you may give the wrong answer.||[[For example]], in my marketing job, listening to students [[and]] parents helps us understand what they really need.||[[So]] yes, being a good listener is the key to good communication.", "", "understand|respected", ""]]}, {"name": "Đề 9 · Big changes", "rows": [["Do children like to change schools when they are young?", "Không, tôi không nghĩ trẻ em thích chuyển trường.||[[That's because]] các em nhớ bạn bè [[and]] thầy cô cũ. [[But]] các em thường quen với trường mới rất nhanh.||[[For example]], em họ tôi chuyển trường năm lớp 6, [[and]] em ấy đã khóc trong tuần đầu tiên. [[But]] sau một tháng, em ấy đã có bạn mới.||[[So]], lúc đầu trẻ em không thích, [[but]] sau đó các em thường thấy vui.", "No, I don't think children like to change schools.||[[That's because]] they miss their old friends [[and]] teachers. [[But]] they usually get used to the new school quickly.||[[For example]], my cousin changed schools in grade 6, [[and]] she cried in the first week. [[But]] after a month, she had new friends.||[[So]], children don't like it at first, [[but]] they are usually happy later.", "", "miss friends|get used to", ""], ["What children will learn in their new school?", "Tôi nghĩ các em học được cách kết bạn mới [[and]] thích nghi với nơi ở mới.||[[That's because]] mọi thứ đều mới, [[so]] các em cần can đảm [[and]] tự lập. Các em [[also]] học thêm những môn học mới.||[[For example]], một đứa trẻ chuyển từ Bến Tre lên học ở TP.HCM sẽ học cách nói chuyện với bạn cùng lớp mới [[and]] làm theo những quy định mới.||[[So]], trẻ em học được cách tự lập và tự tin, [[and]] những kỹ năng này rất có ích cho tương lai.", "I think they learn how to make new friends [[and]] adapt to a new place.||[[That's because]] everything is new, [[so]] they need to be brave [[and]] independent. They [[also]] learn new subjects.||[[For example]], a child who moves from Bến Tre to a school in Ho Chi Minh City learns to talk to new classmates [[and]] follow new rules.||[[So]], children learn to be independent and confident, [[and]] these skills are useful for the future.", "", "make new friends|adapt", ""], ["How do people face big changes and what preparations do they make?", "Tôi nghĩ hầu hết mọi người lên kế hoạch trước [[before]] một thay đổi lớn.||[[That's because]] kế hoạch giúp họ cảm thấy an tâm hơn. Họ thường tiết kiệm tiền [[and]] hỏi ý kiến gia đình.||[[For example]], trước khi đổi việc, tôi đã tìm hiểu về công ty mới [[and]] chuẩn bị tinh thần.||[[So]], lập kế hoạch và có thái độ tích cực giúp mọi người đối mặt với những thay đổi lớn.", "I think most people make a plan first [[before]] a big change.||[[That's because]] a plan makes them feel safer. They usually save money [[and]] ask their family for advice.||[[For example]], before I changed jobs, I learned about the new company [[and]] prepared myself mentally.||[[So]], making a plan and having a positive attitude help people deal with big changes.", "", "make a plan|save money|ask for advice", ""], ["When things like getting married or moving home happen, what kinds of things would you consider?", "Tôi sẽ cân nhắc tiền bạc, vị trí và ý kiến của gia đình.||[[That's because]] nhà cửa hay hôn nhân là chuyện của nhiều năm, [[so]] tôi cần lựa chọn cẩn thận.||[[For example]], [[if]] tôi mua nhà, tôi cần xem nó có gần chợ, trường học [[and]] bệnh viện không. Tôi [[also]] cần trả khoản vay ngân hàng.||[[So]], tiền bạc và vị trí là những điều tôi cân nhắc đầu tiên, [[and]] [[then]] mới đến ý kiến gia đình.", "I would think about money, location and my family's opinion.||[[That's because]] a home or a marriage is for many years, [[so]] I need to choose carefully.||[[For example]], [[if]] I buy a home, I need to check if it's near a market, a school [[and]] a hospital. I [[also]] need to pay back the bank loan.||[[So]], money and location are the first things I consider, [[and]] [[then]] my family's opinion.", "", "budget|location|family", ""]]}, {"name": "Đề 14 · Conversations", "rows": [["What is the difference between the conversation between men and women?", "Tôi nghĩ phụ nữ thường nói về cảm xúc nhiều hơn, [[while]] đàn ông nói về công việc và thể thao.||[[That's because]] đàn ông và phụ nữ thường có sở thích khác nhau. [[But]] điều này thật ra tùy vào từng người.||[[For example]], khi mẹ và các dì tôi ở Bến Tre gặp nhau, họ hỏi thăm gia đình của nhau, [[while]] bố và các chú tôi nói về bóng đá.||[[So]], có một vài khác biệt, [[but]] ngày nay chúng không còn rõ ràng lắm.", "I think women often talk about feelings more, [[while]] men talk about work and sports.||[[That's because]] men and women usually have different interests. [[But]] it really depends on the person.||[[For example]], when my mother and aunts in Bến Tre meet, they ask about each other's families, [[while]] my father and uncles talk about football.||[[So]], there are some differences, [[but]] they are less clear nowadays.", "", "feelings|depend on", ""], ["Which conversation is better: phone or face-to-face?", "Tôi nghĩ nói chuyện trực tiếp thì tốt hơn.||[[That's because]] bạn có thể thấy ngôn ngữ cơ thể, [[so]] dễ hiểu cảm xúc của nhau hơn. [[But]] điện thoại thì nhanh và tiện hơn.||[[For example]], [[when]] có chuyện quan trọng hoặc buồn cần nói, tôi luôn gặp trực tiếp bạn bè. [[But]] với những kế hoạch nhanh, tôi chỉ gọi điện.||[[So]], theo tôi, nói chuyện trực tiếp tốt hơn cho những chuyện quan trọng, [[and]] điện thoại thì phù hợp cho những việc nhanh gọn.", "I think face-to-face conversation is better.||[[That's because]] you can see body language, [[so]] it's easier to understand feelings. [[But]] the phone is faster and more convenient.||[[For example]], [[when]] there's something important or sad to talk about, I always meet my friends in person. [[But]] for quick plans, I just call.||[[So]] in my opinion, face-to-face is better for important talks, [[and]] the phone is good for quick things.", "", "body language|faster", ""], ["Why do people get nervous while they give presentations?", "Tôi nghĩ mọi người lo lắng [[because]] họ sợ mắc lỗi.||[[That's because]] có rất nhiều người đang nhìn họ. [[Also]], nhiều người không luyện tập đủ trước buổi thuyết trình.||[[For example]], lần đầu tiên tôi thuyết trình ở công ty, tay tôi run lên, [[and]] tôi quên hết ý.||[[So]], nỗi sợ và việc luyện tập chưa đủ là những lý do chính, [[and]] luyện tập nhiều lần thật sự rất có ích.", "I think people get nervous [[because]] they are afraid of making mistakes.||[[That's because]] many people are looking at them. [[Also]], many people don't practise enough before the presentation.||[[For example]], the first time I gave a presentation at work, my hands were shaking, [[and]] I forgot my ideas.||[[So]], fear and not enough practice are the main reasons, [[and]] practising many times really helps.", "", "make mistakes|practice", ""], ["Why is body language important?", "Tôi nghĩ ngôn ngữ cơ thể rất quan trọng.||[[That's because]] nó thể hiện cảm xúc của bạn [[and]] giúp người nghe hiểu bạn hơn. Nó [[also]] giúp bạn trông tự tin.||[[For example]], trong buổi phỏng vấn xin việc, giao tiếp bằng mắt [[and]] nụ cười cho thấy bạn tự tin và trung thực.||[[So]], ngôn ngữ cơ thể tốt giúp người khác dễ tin tưởng bạn hơn.", "I think body language is very important.||[[That's because]] it shows your feelings [[and]] helps listeners understand you better. It [[also]] makes you look confident.||[[For example]], in a job interview, eye contact [[and]] a smile show that you are confident and honest.||[[So]], good body language helps people trust you more easily.", "", "show feelings|confident", ""]]}, {"name": "Đề 15 · Noise", "rows": [["What kinds of places should be noise-free?", "Tôi nghĩ bệnh viện, thư viện và chùa chiền nên là những nơi yên tĩnh.||[[That's because]] mọi người cần nghỉ ngơi, học tập hoặc cầu nguyện ở đó.||[[For example]], trong thư viện, chỉ một người ồn ào cũng có thể làm phiền cả phòng. Ở bệnh viện, bệnh nhân cần yên tĩnh để mau khỏe.||[[So]], theo tôi, bất kỳ nơi nào để nghỉ ngơi, học tập hay cầu nguyện đều nên yên tĩnh.", "I think hospitals, libraries and temples should be noise-free.||[[That's because]] people need to rest, study or pray there.||[[For example]], in a library, one loud person can disturb the whole room. In hospitals, patients need quiet to get better quickly.||[[So]] in my opinion, any place for resting, studying or praying should be quiet.", "", "hospitals|libraries", ""], ["Can people bring children to these noise-free places?", "Còn tùy. Có, [[if]] các em có thể giữ trật tự.||[[That's because]] những nơi này giúp trẻ em tìm hiểu về văn hóa. [[But]] trẻ quá nhỏ thì rất khó kiểm soát.||[[For example]], nhiều ngôi chùa ở Việt Nam chào đón trẻ em. [[If]] một đứa trẻ khóc, bố mẹ nên đưa bé ra ngoài một lúc.||[[So]], đúng vậy, mọi người có thể đưa trẻ em đến, [[but]] bố mẹ nên giải thích quy định trước.", "It depends. Yes, [[if]] the children can stay quiet.||[[That's because]] these places help children learn about culture. [[But]] very young kids are hard to control.||[[For example]], many temples in Vietnam welcome children. [[If]] a child cries, the parents should take them outside for a while.||[[So]] yes, people can bring children, [[but]] parents should explain the rules first.", "", "explain the rules", ""], ["Why can’t people make noise in a church?", "Tôi nghĩ mọi người không được làm ồn trong nhà thờ [[because]] đó là một nơi linh thiêng.||[[That's because]] mọi người đến đó để cầu nguyện, [[so]] làm ồn là thiếu tôn trọng.||[[For example]], ở Việt Nam, chùa chiền [[also]] là nơi linh thiêng, [[so]] mọi người nói nhỏ và ăn mặc lịch sự ở đó.||[[So]], giữ yên lặng trong nhà thờ là tôn trọng niềm tin của người khác.", "I think people can't make noise in a church [[because]] it is a sacred place.||[[That's because]] people go there to pray, [[so]] making noise is disrespectful.||[[For example]], in Vietnam, temples are [[also]] sacred places, [[so]] people speak quietly and dress politely there.||[[So]], keeping quiet in a church means respecting other people's beliefs.", "", "pray|sacred|disrespectful", ""], ["What public morals should people follow in your country?", "Tôi nghĩ mọi người nên xếp hàng, không xả rác và nhường ghế cho người lớn tuổi.||[[That's because]] những việc nhỏ này làm nơi công cộng dễ chịu hơn cho mọi người. Nói nhỏ [[also]] rất quan trọng.||[[For example]], trên xe buýt ở TP.HCM, người trẻ thường đứng lên nhường chỗ cho hành khách lớn tuổi, [[and]] tôi thấy điều đó rất đẹp.||[[So]], [[if]] ai cũng làm theo những quy tắc đơn giản này, thành phố của chúng ta sẽ văn minh hơn.", "I think people should queue, not litter, and give their seats to old people.||[[That's because]] these small things make public places nicer for everyone. Speaking quietly is [[also]] important.||[[For example]], on buses in Ho Chi Minh City, young people often stand up for older passengers, [[and]] I think that's lovely.||[[So]], [[if]] everyone follows these simple rules, our cities will be more civilised.", "", "queue|litter|give seats", ""]]}, {"name": "Đề 16 · Maps", "rows": [["What do people usually do when they get lost?", "Tôi nghĩ hầu hết mọi người dùng Google Maps khi bị lạc.||[[That's because]] bây giờ gần như ai cũng có điện thoại thông minh. [[If]] điện thoại hết pin, họ hỏi người dân địa phương [[or]] gọi cho bạn bè.||[[For example]], khi tôi đi Hà Giang, điện thoại tôi mất sóng, [[so]] tôi đã hỏi đường người dân ở đó. Họ rất thân thiện.||[[So]], mọi người thường dùng điện thoại trước, [[and]] [[then]] mới hỏi người khác.", "I think most people use Google Maps when they get lost.||[[That's because]] almost everyone has a smartphone now. [[If]] their phone dies, they ask local people [[or]] call a friend.||[[For example]], when I went to Hà Giang, my phone lost signal, [[so]] I asked local people for directions. They were very friendly.||[[So]], people usually use their phones first, [[and]] [[then]] they ask other people.", "", "Google Maps|ask local people", ""], ["What are the differences between paper and digital maps?", "Tôi nghĩ bản đồ số tiện hơn, [[but]] bản đồ giấy thì không cần pin.||[[That's because]] bản đồ số tự cập nhật và hiển thị tình hình giao thông. Bản đồ giấy thì khó đọc hơn.||[[For example]], Google Maps gợi ý đường đi để tránh kẹt xe ở TP.HCM. [[But]] bản đồ giấy lại hữu ích ở vùng núi không có internet.||[[So]], bản đồ số tốt hơn khi ở thành phố, [[and]] bản đồ giấy là phương án dự phòng tốt.", "I think digital maps are more useful, [[but]] paper maps don't need a battery.||[[That's because]] digital maps update by themselves and show the traffic. Paper maps are harder to read.||[[For example]], Google Maps suggests ways to avoid traffic jams in Ho Chi Minh City. [[But]] paper maps are useful in the mountains with no internet.||[[So]], digital maps are better for cities, [[and]] paper maps are a good backup.", "", "traffic|battery", ""], ["What do you think of in-car GPS navigation systems?", "Tôi nghĩ hệ thống GPS trên ô tô rất hữu ích.||[[That's because]] tài xế không bị lạc đường [[and]] họ tiết kiệm được thời gian. [[However]], đôi khi GPS chỉ sai, [[so]] tài xế vẫn cần cẩn thận.||[[For example]], tài xế Grab ở TP.HCM dùng GPS cả ngày, [[so]] họ không cần nhớ hết mọi con đường.||[[So]], GPS rất tuyệt, [[but]] mọi người không nên phụ thuộc vào nó quá nhiều.", "I think in-car GPS systems are very useful.||[[That's because]] drivers don't get lost [[and]] they save time. [[However]], sometimes GPS is wrong, [[so]] drivers still need to be careful.||[[For example]], Grab drivers in Ho Chi Minh City use GPS all day, [[so]] they don't need to remember every road.||[[So]], GPS is great, [[but]] people shouldn't depend on it too much.", "", "get lost|wrong", ""], ["Why do most people prefer to use a paper map?", "Thật ra, tôi không nghĩ ngày nay hầu hết mọi người thích dùng bản đồ giấy.||[[That's because]] điện thoại nhanh và dễ dùng hơn. Chỉ một số người lớn tuổi vẫn dùng bản đồ giấy, [[because]] họ tin giấy hơn [[and]] nó dùng được mà không cần internet.||[[For example]], tôi chỉ thấy dân phượt hoặc người leo núi dùng bản đồ giấy, như trong những chuyến trekking ở Hà Giang.||[[So]], rất ít người thích bản đồ giấy, [[but]] biết cách đọc bản đồ giấy cũng tốt, để phòng khi cần.", "Actually, I don't think most people prefer paper maps nowadays.||[[That's because]] phones are faster and easier. Only some older people still use paper maps, [[because]] they trust paper more [[and]] it works without the internet.||[[For example]], I only see backpackers or hikers with paper maps, like on trekking trips in Hà Giang.||[[So]], few people prefer paper maps, [[but]] it's good to know how to read one, just in case.", "", "without internet", ""]]}, {"name": "Đề 17 · Transport", "rows": [["How to improve the traffic condition in a city?", "Tôi nghĩ chính phủ nên xây thêm phương tiện công cộng, như tàu điện ngầm.||[[That's because]] trung tâm thành phố có quá nhiều ô tô và xe máy. Các công ty [[also]] có thể cho nhân viên giờ làm việc linh hoạt.||[[For example]], ở TP.HCM, tuyến metro giúp nhiều người đi làm mà không bị kẹt xe. Mọi người [[also]] có thể đi chung xe.||[[So]], theo tôi, phương tiện công cộng tốt hơn là cách tốt nhất để cải thiện giao thông thành phố.", "I think the government should build more public transport, like the metro.||[[That's because]] there are too many cars and motorbikes in the city centre. Companies can [[also]] offer flexible working hours.||[[For example]], in Ho Chi Minh City, the metro helps many people go to work without traffic jams. People can [[also]] share rides.||[[So]] in my opinion, better public transport is the best way to improve city traffic.", "", "metro|city centre|flexible hours", ""], ["Do people still drive a car if public transportation is free of charge?", "Có, tôi nghĩ nhiều người vẫn sẽ lái xe.||[[That's because]] ô tô thoải mái và riêng tư hơn. [[But]] một số người sẽ chuyển sang đi xe buýt để tiết kiệm tiền.||[[For example]], tuyến metro ở TP.HCM rất đông khách [[because]] nó nhanh, sạch sẽ và có máy lạnh.||[[So]], đúng vậy, một số người vẫn sẽ lái xe, [[but]] [[if]] phương tiện công cộng tốt, nhiều người sẽ thay đổi suy nghĩ.", "Yes, I think many people would still drive.||[[That's because]] cars are more comfortable and private. [[But]] some people would switch to buses to save money.||[[For example]], the metro in Ho Chi Minh City is busy [[because]] it is fast, clean and air-conditioned.||[[So]] yes, some people will still drive, [[but]] [[if]] public transport is good, many will change their minds.", "", "comfortable|switch to buses", ""], ["How can transportation in rural areas be developed?", "Tôi nghĩ chính phủ nên làm đường tốt hơn [[and]] thêm nhiều tuyến xe buýt ở nông thôn.||[[That's because]] nông dân có thể bán nông sản dễ dàng hơn, [[and]] trẻ em có thể đến trường an toàn hơn.||[[For example]], một số bản làng vùng núi ở Hà Giang vẫn còn đường đất, [[so]] đi lại rất khó khăn vào mùa mưa.||[[So]], đường sá tốt hơn và nhiều xe buýt hơn thật sự rất cần thiết cho vùng nông thôn.", "I think the government should build better roads [[and]] add more buses in rural areas.||[[That's because]] farmers can sell their products more easily, [[and]] children can go to school more safely.||[[For example]], some villages in the mountains in Hà Giang still have dirt roads, [[so]] it is hard to travel in the rainy season.||[[So]], better roads and more buses are really necessary for rural areas.", "", "better roads|buses|dirt roads", ""]]}, {"name": "Đề 19 · Holidays", "rows": [["Do you think people in your country have long enough holidays?", "Không, tôi không nghĩ người Việt Nam có kỳ nghỉ đủ dài.||[[That's because]] hầu hết người lao động chỉ có khoảng 12 ngày phép mỗi năm. Tết là kỳ nghỉ dài duy nhất.||[[For example]], sau Tết, mọi người ở công ty tôi đều có nhiều năng lượng hơn [[and]] làm việc tốt hơn.||[[So]], theo tôi, người lao động cần thêm vài ngày nghỉ, [[because]] nghỉ ngơi giúp họ làm việc tốt hơn.", "No, I don't think people in Vietnam have long enough holidays.||[[That's because]] most workers only have about 12 days off a year. Tết is the only long holiday.||[[For example]], after Tết, everyone at my company has more energy [[and]] works better.||[[So]] in my opinion, workers need a few more days off, [[because]] rest helps them work better.", "", "days off|long holiday", ""], ["Which holidays are popular in your country?", "Tôi nghĩ ngày lễ phổ biến nhất ở Việt Nam là Tết.||[[That's because]] đó là kỳ nghỉ dài nhất, [[and]] các gia đình được sum họp. Các dịp lễ 30/4 [[and]] 2/9 [[also]] rất phổ biến.||[[For example]], vào dịp lễ 30/4, Vũng Tàu và Đà Lạt đông nghịt khách du lịch từ TP.HCM.||[[So]], Tết là phổ biến nhất, [[and]] sau đó là các dịp lễ 30/4 và 2/9.", "I think the most popular holiday in Vietnam is Tết.||[[That's because]] it is the longest holiday, [[and]] families get together. The 30/4 [[and]] 2/9 holidays are [[also]] popular.||[[For example]], on the 30/4 holiday, Vũng Tàu and Đà Lạt are full of tourists from Ho Chi Minh City.||[[So]], Tết is the most popular, [[and]] then the 30/4 and 2/9 holidays.", "", "Tết|national holidays", ""], ["What is the difference between old and young people when spending their holidays?", "Tôi nghĩ người trẻ thích những chuyến đi phiêu lưu, [[while]] người lớn tuổi thích nghỉ ngơi hơn.||[[That's because]] người trẻ muốn sự hào hứng, [[but]] người lớn tuổi cần nghỉ ngơi hơn. Người lớn tuổi [[also]] thích đi thăm họ hàng.||[[For example]], tôi và bạn bè thường đi xe máy lên Đà Lạt, [[while]] bố mẹ tôi thích đi tour và ở khách sạn tiện nghi.||[[So]], người trẻ muốn phiêu lưu, [[and]] người lớn tuổi muốn sự thoải mái.", "I think young people like adventure trips, [[while]] older people prefer to relax.||[[That's because]] young people want excitement, [[but]] older people need rest more. Older people [[also]] like to visit their relatives.||[[For example]], my friends and I often ride motorbikes to Đà Lạt, [[while]] my parents prefer a tour and a comfortable hotel.||[[So]], young people want adventure, [[and]] older people want comfort.", "", "adventure|relaxing", ""]]}, {"name": "Đề 20 · News", "rows": [["Is it good to share something on social media?", "Có, tôi nghĩ đôi khi điều đó là tốt.||[[That's because]] bạn bè có thể biết tin tức của bạn. [[But]] bạn không nên chia sẻ thông tin cá nhân, như địa chỉ nhà.||[[For example]], tôi đã đăng ảnh tốt nghiệp lên Facebook, [[and]] tôi nhận được rất nhiều lời chúc mừng.||[[So]], đúng vậy, chia sẻ là tốt, [[but]] chia sẻ quá nhiều có thể nguy hiểm.", "Yes, I think it is good sometimes.||[[That's because]] your friends can know your news. [[But]] you shouldn't share private information, like your address.||[[For example]], I posted my graduation photos on Facebook, [[and]] I got a lot of congratulations.||[[So]] yes, sharing is good, [[but]] sharing too much can be dangerous.", "", "share news|private information", ""], ["Should the media only publish good news?", "Không, tôi không nghĩ truyền thông chỉ nên đăng tin tốt.||[[That's because]] mọi người cần biết sự thật. [[If]] truyền thông chỉ đăng tin tốt, mọi người sẽ không biết về những vấn đề thật sự.||[[For example]], người dân Việt Nam cần tin tức về bão [[and]] lũ lụt [[so]] họ có thể chuẩn bị.||[[So]], theo tôi, truyền thông cũng nên đưa tin xấu, [[but]] cần cẩn thận, không làm mọi người hoảng sợ.", "No, I don't think the media should only publish good news.||[[That's because]] people need to know the truth. [[If]] the media only publish good news, people won't know about real problems.||[[For example]], people in Vietnam need news about storms [[and]] floods [[so]] they can prepare.||[[So]] in my opinion, the media should report bad news too, [[but]] carefully, without scaring people.", "", "truth", ""], ["How does social media help people access information?", "Tôi nghĩ mạng xã hội giúp mọi người tiếp cận thông tin rất nhanh.||[[That's because]] tin tức xuất hiện trên đó chỉ trong vài phút. [[However]], trên đó có rất nhiều tin giả.||[[For example]], khi có bão, mọi người biết ngay trên Facebook và Zalo, [[so]] họ có thể chuẩn bị.||[[So]], mạng xã hội nhanh và hữu ích, [[but]] tôi luôn kiểm tra các trang tin chính thống trước khi chia sẻ bất cứ điều gì.", "I think social media helps people get information very fast.||[[That's because]] news appears there in minutes. [[However]], there is a lot of fake news on it.||[[For example]], when there's a storm, people find out right away on Facebook and Zalo, [[so]] they can prepare.||[[So]], social media is fast and useful, [[but]] I always check official news websites before I share anything.", "", "fast|fake news", ""], ["What kind of good news do people often share in the community?", "Tôi nghĩ mọi người thường chia sẻ tin về đám cưới, em bé mới chào đời, kết quả thi [[and]] công việc mới.||[[That's because]] đây là những khoảnh khắc hạnh phúc, [[and]] mọi người muốn người khác cùng vui với mình.||[[For example]], ở khu phố tôi, khi một học sinh đậu đại học, ai cũng biết [[and]] chúc mừng em ấy.||[[So]], tin vui trong gia đình là phổ biến nhất, [[and]] tôi nghĩ đó là một nét đẹp của văn hóa Việt Nam.", "I think people often share news about weddings, new babies, exam results [[and]] new jobs.||[[That's because]] these are happy moments, [[and]] people want others to be happy with them.||[[For example]], in my neighbourhood, when a student passes the university entrance exam, everyone knows [[and]] congratulates them.||[[So]], happy family news is the most common, [[and]] I think it's a lovely part of Vietnamese culture.", "", "exam results|new jobs", ""], ["Do most people like to share good news with others?", "Có, tôi nghĩ hầu hết mọi người thích chia sẻ tin vui.||[[That's because]] chia sẻ làm niềm vui nhân đôi, [[and]] họ nhận được nhiều lời chúc mừng. [[However]], một số người sợ người khác ghen tị.||[[For example]], khi tôi có công việc mới trong ngành marketing, tôi báo tin cho gia đình ở Bến Tre đầu tiên, [[and]] mọi người rất vui.||[[So]], đúng vậy, mọi người thích chia sẻ tin vui, [[but]] tôi chỉ chia sẻ với gia đình và bạn thân.", "Yes, I think most people like to share good news.||[[That's because]] sharing doubles the happiness, [[and]] they get a lot of congratulations. [[However]], some people are afraid others will be jealous.||[[For example]], when I got a new job in marketing, I told my family in Bến Tre first, [[and]] they were very happy.||[[So]] yes, people like to share good news, [[but]] I only share it with my family and close friends.", "", "congratulations", ""]]}, {"name": "Đề 21 · Screens", "rows": [["Why do people often have problems when using new products?", "Tôi nghĩ mọi người gặp khó khăn [[because]] sản phẩm mới thường khá phức tạp.||[[That's because]] nhiều người không đọc hướng dẫn sử dụng, [[and]] các tính năng mới rất khó hiểu, [[especially]] với người lớn tuổi.||[[For example]], bố mẹ tôi mua một chiếc smart TV mới, [[but]] họ không biết cách mở YouTube, [[so]] tôi phải chỉ cho họ.||[[So]], tôi nghĩ các công ty nên làm sản phẩm và hướng dẫn đơn giản hơn.", "I think people have problems [[because]] new products are often complicated.||[[That's because]] many people don't read the instructions, [[and]] new features are hard to understand, [[especially]] for older people.||[[For example]], my parents bought a new smart TV, [[but]] they didn't know how to open YouTube, [[so]] I had to show them.||[[So]] I think companies should make their products and instructions simpler.", "", "instructions|complicated", ""], ["Do people spend too much time looking at digital screens? Why?", "Có, tôi nghĩ mọi người dành quá nhiều thời gian nhìn màn hình.||[[That's because]] mọi người làm việc với máy tính cả ngày, [[and]] buổi tối lại thư giãn bằng điện thoại. Điều này không tốt cho mắt và giấc ngủ.||[[For example]], tôi làm marketing, [[so]] tôi nhìn màn hình khoảng 10 tiếng mỗi ngày, [[and]] buổi tối mắt tôi rất mỏi.||[[So]], đúng là chúng ta dùng màn hình quá nhiều, [[and]] giờ tôi cố gắng nghỉ ngắn mỗi giờ.", "Yes, I think people spend too much time looking at screens.||[[That's because]] people work on computers all day, [[and]] they relax on their phones in the evening. This is bad for their eyes and sleep.||[[For example]], I work in marketing, [[so]] I look at screens for about 10 hours a day, [[and]] my eyes feel very tired at night.||[[So]] yes, we use screens too much, [[and]] now I try to take a short break every hour.", "", "screens|eyes and sleep", ""], ["What do people do with mobile phones?", "Mọi người dùng điện thoại cho hầu hết mọi việc trong cuộc sống hằng ngày.||[[That's because]] giờ đây điện thoại giống như một chiếc máy tính nhỏ. Mọi người dùng nó để nhắn tin, gọi điện, xem video, thanh toán [[and]] mua sắm online.||[[For example]], ở TP.HCM, tôi dùng điện thoại để đặt Grab, gọi đồ ăn [[and]] học tiếng Anh mỗi ngày.||[[So]], theo tôi, bây giờ mọi người gần như không thể sống thiếu điện thoại.", "People use mobile phones for almost everything in their daily life.||[[That's because]] a phone is like a small computer now. People use it to chat, call, watch videos, pay [[and]] shop online.||[[For example]], in Ho Chi Minh City, I use my phone to book a Grab, order food [[and]] study English every day.||[[So]] in my opinion, people can hardly live without their phones now.", "", "pay online|social media", ""]]}, {"name": "Đề 25 · Reviews", "rows": [["What kinds of things do people write online reviews about in your country?", "Ở Việt Nam, mọi người chủ yếu viết đánh giá về nhà hàng, quán cà phê và khách sạn.||[[That's because]] những nơi này rất phổ biến, [[and]] mọi người muốn chia sẻ trải nghiệm tốt hay xấu. Họ [[also]] đánh giá quần áo mua online.||[[For example]], trước khi đến một nhà hàng mới ở TP.HCM, tôi luôn đọc đánh giá trên Google Maps. [[If]] quán có đánh giá xấu về vệ sinh, tôi sẽ không đến.||[[So]], quán ăn và khách sạn là những nơi được đánh giá nhiều nhất ở nước tôi.", "In Vietnam, people mostly write reviews about restaurants, cafés and hotels.||[[That's because]] these places are popular, [[and]] people want to share good or bad experiences. They [[also]] review clothes they buy online.||[[For example]], before I go to a new restaurant in Ho Chi Minh City, I always read reviews on Google Maps. [[If]] it has bad reviews about hygiene, I don't go.||[[So]], food places and hotels get the most reviews in my country.", "", "restaurants|hotels", ""], ["Why do some people write online reviews?", "Tôi nghĩ phần lớn mọi người viết đánh giá để giúp những người mua khác.||[[That's because]] họ muốn người khác tránh mua phải sản phẩm tệ. Một số người [[also]] muốn phàn nàn về dịch vụ kém, [[or]] họ được giảm giá khi viết đánh giá.||[[For example]], nhiều shop trên Shopee tặng một voucher nhỏ [[if]] bạn viết đánh giá. [[However]], có những đánh giá là giả [[because]] công ty trả tiền để người ta viết.||[[So]], mọi người viết đánh giá vì nhiều lý do, [[but]] người đọc cần cẩn thận.", "I think most people write reviews to help other buyers.||[[That's because]] they want others to avoid bad products. Some people [[also]] want to complain about bad service, [[or]] they get a discount for a review.||[[For example]], many shops on Shopee give a small voucher [[if]] you write a review. [[However]], some reviews are fake [[because]] companies pay for them.||[[So]], people write reviews for many reasons, [[but]] readers need to be careful.", "", "help other buyers|complain|discounts", ""], ["Do you think that online reviews are good for both shoppers and companies?", "Có, tôi nghĩ đánh giá online có lợi cho cả hai bên.||[[That's because]] người mua có thể chọn sản phẩm tốt hơn, [[and]] công ty biết mình cần cải thiện điều gì.||[[For example]], ở công ty giáo dục của tôi, chúng tôi đọc đánh giá của học viên mỗi tháng để cải thiện khóa học.||[[So]], đúng vậy, đánh giá giúp cả hai bên, [[but]] những đánh giá xấu không công bằng có thể làm hại các shop nhỏ.", "Yes, I think online reviews are good for both of them.||[[That's because]] shoppers can choose better products, [[and]] companies know what they need to improve.||[[For example]], at my education company, we read students' reviews every month to improve our courses.||[[So]] yes, reviews help both sides, [[but]] unfair bad reviews can hurt small shops.", "", "choose better|improve", ""], ["What do you think it might be like to work in a customer service job?", "Tôi nghĩ làm chăm sóc khách hàng khá căng thẳng.||[[That's because]] một số khách hàng rất thô lỗ, [[and]] bạn phải luôn giữ bình tĩnh.||[[For example]], bạn tôi làm ở tổng đài, [[and]] cô ấy phải giữ bình tĩnh khi khách hàng quát mắng. [[But]] cô ấy học được cách giải quyết vấn đề và giao tiếp tốt hơn.||[[So]], theo tôi, đó là một công việc vất vả, [[but]] nó dạy bạn sự kiên nhẫn.", "I think working in customer service is quite stressful.||[[That's because]] some customers are rude, [[and]] you have to stay calm all the time.||[[For example]], my friend works in a call centre, [[and]] she has to stay calm when customers shout at her. [[But]] she learns to solve problems and communicate better.||[[So]] in my opinion, it's a hard job, [[but]] it teaches you to be patient.", "", "stressful|rude|patience", ""]]}, {"name": "Đề 26 · Teamwork", "rows": [["Why do some people prefer to work by themselves?", "Tôi nghĩ một số người thích làm việc một mình [[because]] họ tập trung tốt hơn.||[[That's because]] họ không cần chờ người khác, [[and]] cũng không có tranh cãi.||[[For example]], khi tôi viết một kế hoạch marketing dài, tôi thích làm một mình ở một quán cà phê yên tĩnh. [[But]] khi làm nhóm, tôi thường nghe được những ý tưởng mới.||[[So]], làm việc một mình giúp tập trung, [[but]] đôi khi sẽ có ít ý tưởng mới hơn.", "I think some people prefer to work alone [[because]] they can focus better.||[[That's because]] they don't need to wait for others, [[and]] there are no arguments.||[[For example]], when I write a long marketing plan, I like to work alone in a quiet café. [[But]] in a team, I often hear new ideas.||[[So]], working alone is good for focus, [[but]] it sometimes means fewer new ideas.", "", "focus|arguments", ""], ["What should a leader do to make team members want to follow him or her?", "Tôi nghĩ người lãnh đạo nên lắng nghe đội nhóm và công bằng với mọi người.||[[That's because]] mọi người sẽ đi theo người lãnh đạo mà họ tin tưởng. Một người lãnh đạo tốt [[also]] làm việc chăm chỉ và là tấm gương tốt.||[[For example]], người quản lý tốt nhất của tôi luôn giúp cả nhóm khi có vấn đề, [[instead of]] chỉ ra lệnh.||[[So]], theo tôi, một người lãnh đạo công bằng và biết giúp đỡ sẽ khiến mọi người muốn đi theo.", "I think a leader should listen to the team and be fair to everyone.||[[That's because]] people follow a leader they trust. A good leader [[also]] works hard and is a good example.||[[For example]], my best manager always helps the team when there are problems, [[instead of]] just giving orders.||[[So]] in my opinion, a fair and helpful leader makes people want to follow.", "", "listen|fair|example", ""], ["Should students learn to do group work?", "Có, tôi nghĩ học sinh nên học cách làm việc nhóm.||[[That's because]] sau này đi làm các em sẽ cần kỹ năng làm việc nhóm. Các em [[also]] học được cách chia sẻ ý tưởng và xử lý bất đồng.||[[For example]], trong công việc marketing, ngày nào tôi cũng làm việc với designer và giáo viên. [[However]], giáo viên nên chia việc nhóm ở trường thật rõ ràng.||[[So]], đúng vậy, làm việc nhóm rất hữu ích cho công việc tương lai của học sinh.", "Yes, I think students should learn to do group work.||[[That's because]] they will need teamwork skills at work. They [[also]] learn to share ideas and deal with disagreements.||[[For example]], in my marketing job, I work with designers and teachers every day. [[However]], teachers should divide school group work clearly.||[[So]] yes, group work is very useful for students' future jobs.", "", "teamwork|share ideas", ""], ["What group tasks are there in schools?", "Có rất nhiều hoạt động nhóm, như thuyết trình, dự án khoa học và dọn vệ sinh lớp học.||[[That's because]] nhà trường muốn học sinh làm việc cùng nhau và giúp đỡ lẫn nhau.||[[For example]], hồi đại học, lớp tôi làm một dự án marketing cho một quán cà phê thật ở TP.HCM, [[and]] chúng tôi học được cách làm việc như một công ty thật.||[[So]], các hoạt động nhóm rất phổ biến, [[and]] tôi nghĩ đó là một trải nghiệm tuyệt vời.", "There are many group tasks, like presentations, science projects and cleaning the classroom.||[[That's because]] schools want students to work together and help each other.||[[For example]], at university, my class did a marketing project for a real café in Ho Chi Minh City, [[and]] we learned how to work like a real company.||[[So]], group tasks are very common, [[and]] I think they are a great experience.", "", "presentations|projects", ""]]}, {"name": "Đề 33 · Festival meals", "rows": [["Is it common for students to dine with each other on school days in your country?", "Có, học sinh ăn cùng nhau vào ngày đi học là rất phổ biến.||[[That's because]] nhiều học sinh ăn trưa ở trường, [[and]] sau giờ học, các bạn lớn hơn thường đi ăn vặt cùng nhau.||[[For example]], hồi cấp ba, tôi và bạn bè thường ăn bánh mì và uống trà sữa sau giờ học.||[[So]], đúng vậy, ăn cùng nhau là một cách hay để học sinh trò chuyện và thân nhau hơn.", "Yes, it's very common for students to eat together on school days.||[[That's because]] many students have lunch at school, [[and]] after class, older students often eat street food together.||[[For example]], in high school, my friends and I often ate bánh mì and drank milk tea after class.||[[So]] yes, eating together is a nice way for students to talk and become closer.", "", "have lunch|street food", ""], ["Do people prefer to eat out at restaurants or eat at home during the Spring Festival?", "Tôi nghĩ hầu hết mọi người thích ăn ở nhà trong dịp Tết.||[[That's because]] các gia đình cùng nhau nấu món ăn truyền thống, [[and]] nhiều nhà hàng đóng cửa trong dịp Tết.||[[For example]], gia đình tôi ở Bến Tre luôn nấu một bữa ăn lớn ở nhà. [[But]] một số gia đình trẻ đi ăn ngoài vào mùng hai hoặc mùng ba [[because]] nấu nướng rất mệt.||[[So]], với hầu hết mọi người, bữa cơm Tết ở nhà vẫn là quan trọng nhất.", "I think most people prefer to eat at home during Tết.||[[That's because]] families cook traditional food together, [[and]] many restaurants are closed during Tết.||[[For example]], my family in Bến Tre always cooks a big meal at home. [[But]] some young families eat out on the second or third day [[because]] cooking is tiring.||[[So]], for most people, the Tết meal at home is still the most important.", "", "traditional food|closed", ""], ["What food do you eat on special occasions, like during the Spring Festival or the Mid-autumn Festival?", "Vào dịp Tết, chúng tôi ăn bánh chưng và thịt kho trứng, [[and]] vào Trung thu, chúng tôi ăn bánh trung thu.||[[That's because]] mỗi món ăn đều có một ý nghĩa đặc biệt.||[[For example]], bánh chưng vuông tượng trưng cho đất, [[and]] bánh trung thu tròn tượng trưng cho sự đoàn viên. Tôi [[also]] rất thích nấu thịt kho cùng mẹ.||[[So]], những món ăn truyền thống này là một phần quan trọng của các dịp lễ.", "At Tết, we eat bánh chưng and braised pork with eggs, [[and]] at Mid-Autumn, we eat mooncakes.||[[That's because]] each dish has a special meaning.||[[For example]], square bánh chưng represents the Earth, [[and]] round mooncakes represent family reunion. I [[also]] love cooking braised pork with my mother.||[[So]], these traditional dishes are a big part of our festivals.", "", "bánh chưng|mooncakes", ""], ["Why do people like to have meals together during important festivals?", "Tôi nghĩ mọi người thích ăn cùng nhau [[because]] lễ hội là thời gian dành cho gia đình.||[[That's because]] ăn cùng nhau giúp giữ gìn truyền thống, [[and]] mọi người có thể kể cho nhau nghe chuyện của mình.||[[For example]], nhiều người trong gia đình tôi làm việc ở thành phố khác, [[so]] Tết là dịp hiếm hoi để cả nhà ăn cùng nhau ở Bến Tre.||[[So]], theo tôi, những bữa ăn chung giúp gia đình gắn bó hơn.", "I think people like to eat together [[because]] festivals are family time.||[[That's because]] eating together keeps traditions alive, [[and]] people can share news with each other.||[[For example]], many people in my family work in other cities, [[so]] Tết is a rare chance for everyone to eat together in Bến Tre.||[[So]] in my opinion, shared meals bring families closer.", "", "family time|traditions", ""]]}, {"name": "Đề 40 · Losing things", "rows": [["What do people often feel after losing things?", "Tôi nghĩ mọi người cảm thấy lo lắng và bực bội sau khi làm mất đồ.||[[That's because]] họ thường làm mất những thứ quan trọng như căn cước hay ví, [[and]] làm lại rất mất công.||[[For example]], khi bạn mất ví, bạn không chỉ mất tiền. Bạn [[also]] phải làm lại giấy tờ, [[which]] mất rất nhiều thời gian.||[[So]], mất đồ rất căng thẳng, [[and]] cảm giác đó có thể kéo dài nhiều ngày.", "I think people feel worried and angry after losing things.||[[That's because]] they often lose important things, like their ID card or wallet, [[and]] getting new ones is hard.||[[For example]], when you lose your wallet, you don't just lose money. You [[also]] have to get new documents, [[which]] takes a lot of time.||[[So]], losing things is very stressful, [[and]] the stress can last for days.", "", "worried|important", ""], ["What can we do to reduce the possibility of losing things?", "Tôi nghĩ chúng ta có thể để đồ ở một chỗ cố định và kiểm tra trước khi đi.||[[That's because]] thói quen tốt giúp chúng ta nhớ đồ của mình. Chúng ta [[also]] có thể dùng ứng dụng định vị cho điện thoại và ví.||[[For example]], tôi luôn để chìa khóa và ví trong một chiếc túi nhỏ trước người. [[If]] tôi bận, tôi đặt lời nhắc trên điện thoại.||[[So]], những thói quen đơn giản như vậy giúp chúng ta ít bị mất đồ hơn.", "I think we can keep things in one place and check before we leave.||[[That's because]] good habits help us remember our things. We can [[also]] use tracking apps for phones and wallets.||[[For example]], I always keep my keys and wallet in a small bag in front of me. [[If]] I'm busy, I set reminders on my phone.||[[So]], simple habits like these can help us lose things less often.", "", "one place|check|tracking apps", ""], ["What kinds of people may lose things often?", "Tôi nghĩ những người bận rộn là hay mất đồ nhất.||[[That's because]] họ làm nhiều việc cùng một lúc. Trẻ em và người già hay quên [[also]] dễ làm mất đồ.||[[For example]], tôi hay để quên ô ở quán cà phê [[when]] tôi vội đi làm.||[[So]], người bận rộn nên chậm lại và kiểm tra đồ đạc trước khi rời đi.", "I think busy people lose things most often.||[[That's because]] they do many things at the same time. Children and forgetful old people [[also]] lose things easily.||[[For example]], I often forget my umbrella at cafés [[when]] I'm in a hurry to go to work.||[[So]], busy people should slow down and check their things before they leave.", "", "busy|forgetful", ""], ["Is it effective to offer rewards to find lost things?", "Có, tôi nghĩ treo thưởng khá hiệu quả.||[[That's because]] sẽ có nhiều người giúp tìm đồ bị mất hơn. [[But]] người trung thực thì đằng nào cũng trả lại.||[[For example]], [[when]] người Việt Nam bị lạc thú cưng, họ thường đăng lên Facebook và treo thưởng, [[and]] họ thường tìm lại được.||[[So]], đúng vậy, treo thưởng có hiệu quả, [[and]] đó cũng là cách hay để cảm ơn người tốt.", "Yes, I think offering a reward is quite effective.||[[That's because]] more people will help look for the lost thing. [[But]] honest people return things anyway.||[[For example]], [[when]] people in Vietnam lose a pet, they often post on Facebook and offer a reward, [[and]] they usually find it.||[[So]] yes, a reward works well, [[and]] it's a nice way to thank a good person.", "", "rewards|honest", ""]]}, {"name": "Đề 42 · Getting up early", "rows": [["Why do people get up early?", "Mọi người dậy sớm để đi làm, đi học [[or]] tập thể dục.||[[That's because]] ở các thành phố lớn như TP.HCM, giao thông rất tệ vào cuối buổi sáng. Dậy sớm [[also]] giúp mọi người có thêm thời gian.||[[For example]], bố tôi dậy lúc 5 giờ sáng để chạy bộ trong công viên, [[and]] thỉnh thoảng tôi cũng đi chạy trước giờ làm.||[[So]], dậy sớm giúp mọi người bắt đầu ngày mới thong thả hơn.", "People get up early to go to work, to school [[or]] to exercise.||[[That's because]] in big cities like Ho Chi Minh City, the traffic is terrible later in the morning. Getting up early [[also]] gives people more time.||[[For example]], my father gets up at 5 a.m. to go jogging in the park, [[and]] I sometimes go running before work too.||[[So]], getting up early gives people a calmer start to the day.", "", "avoid traffic|exercise", ""], ["Are there any situations when it's not good to arrive early?", "Có, đến sớm khi đến thăm nhà người khác là không hay.||[[That's because]] chủ nhà có thể chưa chuẩn bị xong. Đến bữa tiệc quá sớm [[also]] hơi kỳ.||[[For example]], ở Việt Nam, [[if]] bạn đến quá sớm, chủ nhà có thể thấy ngại [[because]] họ vẫn đang dọn dẹp hoặc nấu ăn.||[[So]], theo tôi, tốt nhất là đến đúng giờ hoặc báo trước cho chủ nhà.", "Yes, it's not good to arrive early when you visit someone's home.||[[That's because]] the host may not be ready. Arriving too early at a party is [[also]] a bit strange.||[[For example]], in Vietnam, [[if]] you arrive too early, the host may feel embarrassed [[because]] they are still cleaning or cooking.||[[So]] in my opinion, it's best to arrive on time or tell the host first.", "", "host|not ready", ""], ["Is it good to arrive early in any situation?", "Có, đến sớm là tốt trong nhiều tình huống, [[especially]] khi đi phỏng vấn, đi thi và đi máy bay.||[[That's because]] bạn có thời gian để bình tĩnh, [[and]] điều đó cho thấy bạn tôn trọng thời gian của người khác.||[[For example]], [[when]] đi phỏng vấn, tôi luôn đến sớm 15 phút để chuẩn bị. [[But]] tôi không làm vậy khi đi tiệc.||[[So]], đúng vậy, đến sớm thường là tốt, [[but]] không phải sự kiện nào cũng vậy.", "Yes, arriving early is good in many situations, [[especially]] for interviews, exams and flights.||[[That's because]] you have time to calm down, [[and]] it shows you respect other people's time.||[[For example]], [[when]] I go to an interview, I always arrive 15 minutes early to get ready. [[But]] I don't do this for parties.||[[So]] yes, arriving early is usually good, [[but]] not for every event.", "", "interviews|flights", ""], ["Why do some people stay up late at night?", "Tôi nghĩ mọi người thức khuya chủ yếu [[because]] họ cần làm việc hoặc học bài.||[[That's because]] ban ngày họ có quá nhiều việc. Một số người [[also]] thích ban đêm [[because]] lúc đó yên tĩnh.||[[For example]], [[when]] có deadline ở công ty, tôi thường thức đến 1 giờ sáng để làm xong việc.||[[So]], công việc là lý do chính, [[but]] thức khuya thường xuyên không tốt cho sức khỏe.", "I think people stay up late mainly [[because]] they need to work or study.||[[That's because]] they have too much to do during the day. Some people [[also]] like the night [[because]] it's quiet.||[[For example]], [[when]] I have a deadline at work, I often stay up until 1 a.m. to finish my tasks.||[[So]], work is the main reason, [[but]] staying up late often is bad for our health.", "", "quiet|phones", ""]]}, {"name": "Đề 43 · Changing plans", "rows": [["Why do people sometimes change their plans?", "Mọi người thay đổi kế hoạch [[because]] thời tiết xấu, việc gấp [[or]] bị ốm.||[[That's because]] có những chuyện xảy ra bất ngờ, [[and]] chúng ta không kiểm soát được.||[[For example]], tháng trước tôi và bạn bè định đi biển, [[but]] có bão, [[so]] chúng tôi đi xem phim thay vào đó.||[[So]], đôi khi thay đổi kế hoạch là điều không thể tránh khỏi.", "People change their plans [[because]] of bad weather, urgent work [[or]] sickness.||[[That's because]] some things happen suddenly, [[and]] we can't control them.||[[For example]], last month, my friends and I planned to go to the beach, [[but]] there was a storm, [[so]] we went to the cinema instead.||[[So]], sometimes changing plans can't be avoided.", "", "weather|sick", ""], ["Is it important to be flexible in life?", "Có, tôi nghĩ linh hoạt là rất quan trọng.||[[That's because]] cuộc sống khó đoán trước. [[If]] bạn linh hoạt, bạn sẽ ít căng thẳng hơn khi mọi thứ thay đổi.||[[For example]], [[when]] chuyến bay đi Bangkok của tôi bị hoãn, tôi giữ bình tĩnh và đổi kế hoạch, [[and]] mọi thứ vẫn ổn.||[[So]], đúng vậy, người linh hoạt thường hạnh phúc hơn [[because]] họ không lo lắng quá nhiều.", "Yes, I think it's very important to be flexible.||[[That's because]] life is unpredictable. [[If]] you're flexible, you feel less stressed when things change.||[[For example]], [[when]] my flight to Bangkok was delayed, I stayed calm and changed my plan, [[and]] everything was fine.||[[So]] yes, flexible people are usually happier [[because]] they don't worry too much.", "", "unpredictable|less stress", ""], ["Do young people change plans more often than older people?", "Có, tôi nghĩ người trẻ thay đổi kế hoạch thường xuyên hơn.||[[That's because]] người trẻ có nhiều lựa chọn hơn, [[while]] người lớn tuổi thích sự ổn định, nếp quen.||[[For example]], người trẻ có thể đổi việc hay chuyển nhà dễ dàng [[because]] họ chưa có gia đình. [[But]] người lớn tuổi đã có con cái và công việc ổn định.||[[So]], đúng vậy, người trẻ tự do thay đổi hơn, [[and]] người lớn tuổi thích mọi thứ giữ nguyên.", "Yes, I think young people change plans more often.||[[That's because]] young people have more choices, [[while]] older people prefer a routine.||[[For example]], young people can change jobs or move house easily [[because]] they don't have a family yet. [[But]] older people have children and stable jobs.||[[So]] yes, young people are freer to change, [[and]] older people like things to stay the same.", "", "choices|routine", ""], ["How do people feel when their plans suddenly change?", "Tôi nghĩ hầu hết mọi người cảm thấy bực bội và căng thẳng.||[[That's because]] họ đã chuẩn bị kỹ, [[and]] rồi lại phải thay đổi mọi thứ. [[But]] đôi khi sự thay đổi lại là một bất ngờ thú vị.||[[For example]], [[when]] một cuộc họp ở công ty bị dời đột ngột, tôi thấy bực [[because]] tôi đã chuẩn bị rất kỹ.||[[So]], mọi người thường thấy bực bội, [[but]] tôi nghĩ chúng ta nên tận dụng tốt thời gian rảnh đó.", "I think most people feel annoyed and stressed.||[[That's because]] they prepare carefully, [[and]] then they have to change everything. [[But]] sometimes a change is a nice surprise.||[[For example]], [[when]] a meeting at my company is suddenly moved, I feel annoyed [[because]] I prepared carefully for it.||[[So]], people usually feel annoyed, [[but]] I think we should use the free time well.", "", "annoyed|surprise", ""]]}, {"name": "Đề 46 · Decisions", "rows": [["Do advertisements influence consumers' decisions?", "Có, tôi nghĩ quảng cáo ảnh hưởng rất nhiều đến người tiêu dùng.||[[That's because]] mọi người thường mua những thứ họ thấy trên TikTok, [[and]] khuyến mãi khiến người ta mua nhanh mà không suy nghĩ.||[[For example]], có lần tôi mua một cái máy xay sinh tố [[because]] tôi thấy quảng cáo trên TikTok, [[but]] tôi gần như không bao giờ dùng nó.||[[So]], đúng vậy, quảng cáo rất có sức ảnh hưởng, [[especially]] với người trẻ.", "Yes, I think advertisements influence consumers a lot.||[[That's because]] people often buy things they see on TikTok, [[and]] discounts make people buy quickly without thinking.||[[For example]], I once bought a blender [[because]] I saw an ad on TikTok, [[but]] I almost never use it.||[[So]] yes, ads are very powerful, [[especially]] for young people.", "", "influence|discounts", ""], ["Who do young people like to ask for advice when making decisions?", "Tôi nghĩ người trẻ thường hỏi ý kiến bạn bè.||[[That's because]] bạn bè hiểu họ rõ. [[But]] với những quyết định lớn, họ hỏi bố mẹ.||[[For example]], [[when]] chọn trường đại học, tôi đã hỏi bố mẹ và các anh chị đi trước. Bây giờ nhiều bạn trẻ [[also]] tìm lời khuyên trên mạng.||[[So]], bạn bè và bố mẹ là người tư vấn chính, [[but]] lời khuyên trên mạng không phải lúc nào cũng đúng.", "I think young people usually ask their friends for advice.||[[That's because]] friends understand them well. [[But]] for big decisions, they ask their parents.||[[For example]], [[when]] I chose my university, I asked my parents and older friends. Now many young people [[also]] look for advice online.||[[So]], friends and parents are the main advisers, [[but]] online advice is not always correct.", "", "friends|parents", ""], ["Do you think it’s necessary for kids to make as many decisions by themselves as they can?", "Có, tôi nghĩ trẻ nên tự đưa ra những quyết định nhỏ.||[[That's because]] các em sẽ tự lập hơn. [[If]] bố mẹ quyết định mọi thứ, sau này trẻ sẽ khó tự đưa ra quyết định.||[[For example]], em họ tôi ở Bến Tre tự chọn quần áo và đồ ăn, [[but]] bố mẹ em giúp em với những quyết định lớn như chọn trường.||[[So]], đúng vậy, bố mẹ nên để trẻ chọn trong một vài lựa chọn.", "Yes, I think kids should make small decisions by themselves.||[[That's because]] they become more independent. [[If]] parents decide everything, kids find it hard to make decisions later.||[[For example]], my cousin in Bến Tre chooses her own clothes and food, [[but]] her parents help her with big decisions like school.||[[So]] yes, parents should let kids choose from a few options.", "", "independent", ""], ["Do you think some people can make decisions without asking for advice from others?", "Có, tôi nghĩ một số người có thể tự quyết định mà không cần lời khuyên.||[[That's because]] họ tự tin và có kinh nghiệm.||[[For example]], quản lý của tôi phải ra quyết định rất nhanh trong các cuộc họp. [[But]] với những việc lớn như mua nhà, lời khuyên vẫn giúp chúng ta tránh sai lầm.||[[So]], đúng vậy, một số người làm được, [[but]] tôi nghĩ ai cũng nên xin lời khuyên khi quyết định việc lớn.", "Yes, I think some people can make decisions without advice.||[[That's because]] they're confident and experienced.||[[For example]], my manager has to make decisions very quickly in meetings. [[But]] for big things like buying a house, advice still helps us avoid mistakes.||[[So]] yes, some people can, [[but]] I think everyone should ask for advice for big decisions.", "", "confident|avoid mistakes", ""]]}, {"name": "Đề 51 · Celebrations", "rows": [["Do you like to celebrate important events? Why?", "Có, tôi rất thích tổ chức các sự kiện quan trọng.||[[That's because]] đó là dịp để tôi gặp gia đình, [[and]] những buổi ăn mừng làm cuộc sống vui hơn.||[[For example]], vào sinh nhật bố năm nay, gia đình tôi đã có một bữa tối nhỏ ở Bến Tre và cùng nhau xem lại ảnh cũ.||[[So]], đúng vậy, tôi thích những dịp ăn mừng [[because]] chúng giúp mọi người gần nhau hơn.", "Yes, I really like to celebrate important events.||[[That's because]] it's a chance to meet my family, [[and]] celebrations make life more fun.||[[For example]], for my father's birthday this year, my family had a small dinner in Bến Tre and looked at old photos together.||[[So]] yes, I love celebrations [[because]] they bring people closer.", "", "chance to meet|fun", ""], ["What kinds of events do people usually celebrate?", "Mọi người thường tổ chức Tết, sinh nhật, đám cưới và lễ tốt nghiệp.||[[That's because]] đây là những cột mốc lớn trong cuộc đời. Một số người [[also]] ăn mừng khi có việc làm mới.||[[For example]], người Việt Nam tổ chức Trung thu và ngày Phụ nữ 8/3. Giờ đây người trẻ [[also]] đón Giáng sinh và Halloween.||[[So]], mọi người tổ chức cả những dịp truyền thống lẫn hiện đại.", "People usually celebrate Tết, birthdays, weddings and graduations.||[[That's because]] these are big moments in life. Some people [[also]] celebrate when they get a new job.||[[For example]], Vietnamese people celebrate the Mid-Autumn Festival and Women's Day on 8 March. Young people [[also]] celebrate Christmas and Halloween now.||[[So]], people celebrate both traditional and modern events.", "", "Tết|weddings|graduations", ""], ["Do people often celebrate events with a large group of people or just a few people?", "Điều đó còn tùy vào sự kiện.||[[That's because]] có những sự kiện rất lớn, [[but]] có những dịp mang tính riêng tư hơn.||[[For example]], một đám cưới ở Việt Nam thường có hàng trăm khách, [[but]] sinh nhật thì chỉ có gia đình và bạn thân.||[[So]], còn tùy, [[but]] tôi thích tiệc nhỏ hơn [[because]] bạn có thể nói chuyện với mọi người.", "It depends on the event.||[[That's because]] some events are very big, [[but]] others are more private.||[[For example]], a Vietnamese wedding often has hundreds of guests, [[but]] for birthdays, there's just family and close friends.||[[So]] it depends, [[but]] I prefer small parties [[because]] you can talk to everyone.", "", "depend on|guests|close friends", ""], ["Do people often celebrate festivals with families?", "Có, mọi người thường đón lễ hội cùng gia đình, [[especially]] là dịp Tết.||
