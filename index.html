<style>

    --ink:#1B3A34; --ink-soft:#4B5F58; --line:#D7DFCD;
    --gold:#A8761F; --gold-soft:#F5E7CA;
    --coral:#B8462A; --coral-soft:#F7E1D8;
    --alert:#9E2B18; --alert-soft:#FBDED7;
    --night-bg:#1B2444; --night-ink:#EDEFFA;
    --shadow:0 1px 2px rgba(27,58,52,.06), 0 6px 20px rgba(27,58,52,.08);
  }
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]){
      --bg:#12180F; --surface:#1B2317; --surface-2:#212B1C;
      --ink:#EDEFE6; --ink-soft:#B7C2AE; --line:#33402C;
      --gold:#E8B84B; --gold-soft:#3A2F16;
      --coral:#FF9271; --coral-soft:#3A231C;
      --alert:#FF8D74; --alert-soft:#3D1E17;
      --night-bg:#0F1430; --night-ink:#E7E9FA;
      --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35);
    }
  }
  :root[data-theme="dark"]{
    --bg:#12180F; --surface:#1B2317; --surface-2:#212B1C;
    --ink:#EDEFE6; --ink-soft:#B7C2AE; --line:#33402C;
    --gold:#E8B84B; --gold-soft:#3A2F16;
    --coral:#FF9271; --coral-soft:#3A231C;
    --alert:#FF8D74; --alert-soft:#3D1E17;
    --night-bg:#0F1430; --night-ink:#E7E9FA;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35);
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:'Public Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    line-height:1.55;-webkit-font-smoothing:antialiased;}
  a{color:inherit;}

  .wrap{max-width:790px;margin:0 auto;padding:0 20px;}

  header.hero{padding:38px 20px 26px;max-width:790px;margin:0 auto;}
  .toprow{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;}
  .eyebrow{font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:12.5px;
    letter-spacing:.09em;text-transform:uppercase;color:var(--gold);font-weight:600;}
  h1{font-family:'Fraunces',Georgia,serif;font-weight:600;
    font-size:clamp(29px,6vw,43px);margin:8px 0 10px;text-wrap:balance;letter-spacing:-.01em;}
  .sub{color:var(--ink-soft);font-size:16px;max-width:58ch;}

  .langtoggle{display:flex;gap:0;border:1px solid var(--line);border-radius:999px;
    overflow:hidden;background:var(--surface);flex:0 0 auto;}
  .langtoggle button{background:transparent;border:0;cursor:pointer;
    font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:12px;font-weight:600;
    letter-spacing:.05em;padding:7px 13px;color:var(--ink-soft);}
  .langtoggle button[aria-pressed="true"]{background:var(--gold);color:#fff;}
  :root[data-theme="dark"] .langtoggle button[aria-pressed="true"],
  .langtoggle button[aria-pressed="true"]{color:#fff;}
  .langtoggle button:focus-visible{outline:2px solid var(--gold);outline-offset:2px;}

  .facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px;
    background:var(--line);border:1px solid var(--line);border-radius:14px;
    overflow:hidden;margin-top:22px;}
  .fact{background:var(--surface);padding:14px 16px;}
  .fact .k{font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:11px;
    text-transform:uppercase;letter-spacing:.07em;color:var(--ink-soft);}
  .fact .v{font-weight:600;font-size:14.5px;margin-top:3px;}

  nav.daynav{position:sticky;top:0;z-index:20;background:var(--bg);
    border-bottom:1px solid var(--line);padding:10px 20px;}
  .daynav-inner{max-width:790px;margin:0 auto;display:flex;gap:8px;
    overflow-x:auto;scrollbar-width:none;}
  .daynav-inner::-webkit-scrollbar{display:none;}
  .daynav a{flex:0 0 auto;text-decoration:none;
    font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:12.5px;font-weight:600;
    color:var(--ink-soft);background:var(--surface);border:1px solid var(--line);
    padding:6px 12px;border-radius:999px;white-space:nowrap;}
  .daynav a:hover,.daynav a:focus-visible{color:var(--ink);border-color:var(--gold);outline:none;}

  .callout{background:var(--alert-soft);border:1px solid var(--alert);
    border-radius:14px;padding:18px 20px;margin-top:28px;}
  .callout h2{font-family:'Fraunces',Georgia,serif;font-size:17px;margin:0 0 4px;color:var(--ink);}
  .callout .csub{font-size:13px;color:var(--ink-soft);margin:0 0 12px;}
  .callout ul{margin:0;padding-left:20px;}
  .callout li{margin-bottom:9px;font-size:14.5px;color:var(--ink);}
  .callout li:last-child{margin-bottom:0;}

  .day{margin-top:34px;scroll-margin-top:64px;}
  .day-card{background:var(--surface);border:1px solid var(--line);border-radius:20px;
    box-shadow:var(--shadow);overflow:hidden;}
  .day-head{padding:22px 24px 18px;border-bottom:1px solid var(--line);
    display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;}
  .day-head.night{background:var(--night-bg);color:var(--night-ink);border-bottom-color:transparent;}
  .day-num{font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:12.5px;
    letter-spacing:.08em;text-transform:uppercase;opacity:.75;}
  .day-title{font-family:'Fraunces',Georgia,serif;font-weight:600;font-size:23px;
    margin:4px 0 0;text-wrap:balance;}
  .day-tag{font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:11.5px;font-weight:600;

  .day-head.night .day-tag{background:rgba(255,255,255,.16);color:var(--night-ink);}

  .item:last-child{border-bottom:none;}
  .item .time{font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:13px;font-weight:600;

  .item .body .note{color:var(--ink-soft);font-size:13.5px;display:block;margin-top:3px;}
  .item.star .body>b:first-child{color:var(--coral);}

  .food .flabel{font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:10.5px;

    display:block;margin-bottom:3px;}
  .food .fname{font-weight:600;}
  .food .frating{color:var(--ink-soft);}

  .day-foot{padding:15px 24px 20px;font-size:13px;color:var(--ink-soft);border-top:1px solid var(--line);}
  .day-foot b{color:var(--ink);}

  .plans{display:grid;grid-template-columns:1fr 1fr;gap:14px;padding:4px 24px 22px;}
  .plan{border:1px solid var(--line);border-radius:14px;padding:14px 16px;background:var(--surface-2);}
  .plan.safe{border-color:var(--gold);}
  .plan h4{margin:0 0 3px;font-family:'Fraunces',Georgia,serif;font-size:15.5px;}
  .plan .cond{font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:10.5px;
    text-transform:uppercase;letter-spacing:.05em;color:var(--gold);font-weight:600;margin-bottom:8px;}
  .plan ul{margin:0;padding-left:17px;font-size:13px;}
  .plan li{margin-bottom:5px;}

  section.block{margin-top:44px;}
  section.block h2{font-family:'Fraunces',Georgia,serif;font-size:22px;margin:0 0 4px;}
  section.block p.lead{color:var(--ink-soft);font-size:14px;margin:0 0 16px;}
  .tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:var(--surface);}
  table{border-collapse:collapse;width:100%;min-width:560px;font-size:13.5px;}
  th,td{text-align:left;padding:11px 14px;border-bottom:1px solid var(--line);vertical-align:top;}
  th{font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:11px;text-transform:uppercase;
    letter-spacing:.06em;color:var(--ink-soft);font-weight:600;background:var(--surface-2);}
  tbody tr:last-child td{border-bottom:none;}
  td.d{font-family:'IBM Plex Mono',ui-monospace,monospace;font-weight:600;white-space:nowrap;
    font-variant-numeric:tabular-nums;}
  td.rate{font-variant-numeric:tabular-nums;white-space:nowrap;}
  .pri{font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:10.5px;font-weight:600;

  .pri.must{background:var(--alert-soft);color:var(--alert);}
  .pri.opt{background:var(--surface-2);color:var(--ink-soft);}
  .pri.free{background:var(--gold-soft);color:var(--gold);}

  footer{margin-top:44px;padding:24px 0 60px;border-top:1px solid var(--line);
    font-size:13px;color:var(--ink-soft);}
  footer a{color:var(--ink-soft);}
  footer ul{padding-left:18px;margin:10px 0 0;}
  footer li{margin-bottom:5px;}

  @media (max-width:480px){
    .item{grid-template-columns:56px 1fr;gap:10px;}
    .food{margin-left:66px;}
  }
</style>
</head>

     ["s","22:00","<b>Embers of Night</b> — trình diễn lửa tại Entrance Courtyard, khoảng 10 phút.","Suất 22:00 chỉ có vào thứ Sáu, thứ Bảy và đêm trước ngày lễ. 29/8 là thứ Bảy nên xem được, và vị trí ngay cổng ra nên xem xong là về luôn."],
     ["i","22:15","<b>Shuttle M2 → Khatib → City Hall → khách sạn.</b>","Về phòng khoảng 23:25. Kiểm tra hàng chờ M2 ngay khi ra khỏi cổng."]],
    foot:"<b>Ngày nặng nhất — gần 17 tiếng ngoài đường.</b> Nếu đuối, cắt theo thứ tự: (1) nửa sau Zoo sau 12:40, (2) East Lodge Trail buổi tối, (3) Wild Africa. <b>Không cắt gấu trúc, tram, và Embers of Night.</b> Mang thuốc chống muỗi và áo mưa mỏng."},

   {id:"d4",num:"Ngày 4 · Thứ Hai 31/8",title:"Minion Land, USS & Harry Potter",tag:"Minion là ưu tiên số 1",
    blocks:[
     ["i","08:10","<b>Bencoolen → Chinatown → HarbourFront → Waterfront</b> bằng DTL, NEL rồi Sentosa Express.","Phải xếp hàng ở cổng USS trước 09:30."],
     ["i","09:15","<b>Xếp hàng chờ mở cổng (rope drop).</b>","Mở sẵn app Universal Studios Singapore để xem thời gian chờ theo thời gian thực."],
     ["s","10:00","<b>MINION LAND — vào ngay khi mở cổng.</b> Minion Mayhem → Buggie Boogie → Silly Swirly.","Khu này mở tháng 2/2025 và đông dần về sau trong ngày. Vào đầu tiên là cách duy nhất chơi mà gần như không phải xếp hàng."],
     ["i","11:15","<b>Battlestar Galactica (cả hai đường ray) → Revenge of the Mummy.</b>","TRANSFORMERS đóng 23/8–4/9, không cần ghé."],
     ["f","Trong Minion Land","Super Hungry Food Stand","Cơm cà ri karaage kiểu Nhật, burger nấm chay, bánh phô mai cầu vồng. Ăn ngay trong khu, đúng chủ đề và không mất thời gian đi xa. Tránh bữa quá nặng vì chiều còn nhiều trò lắc."],
     ["i","13:20","<b>Far Far Away: Enchanted Airways → Puss In Boots' Giant Journey.</b>","Dùng lối Single Rider nếu có."],
     ["i","14:45","<b>The Lost World: Jurassic Park Rapids → Canopy Flyer → Dino-Soarin'.</b>","Sẽ ướt, mang áo mưa mỏng. WaterWorld đang đóng."],
     ["i","16:30","<b>New York, Hollywood và Sesame Street Spaghetti Space Chase.</b>","USS không còn khu Madagascar — chính chỗ đó đã thành Minion Land."],
     ["s","17:15","<b>Quay lại Minion Land lần hai</b> — chơi lại trò thích nhất, gặp nhân vật và mua quà ở Minion Marketplace.","Cuối ngày là lúc dễ chụp ảnh với Minion nhất. Không xếp vào hàng nào có thời gian chờ vượt quá 18:10."],
     ["f","Tầm trung · 4.2★ (816 đánh giá)","Din Tai Fung @ WEAVE","Xiao long bao, cơm chiên trứng, mì bò. Nằm ngay giữa USS và Harry Potter nên không phải quay ngược về VivoCity. Đến sớm vì giờ đông phải xếp hàng."],
     ["s","19:30","<b>Harry Potter: Visions of Magic</b> — WEAVE, tầng B1 Forum. Mười không gian nhập vai gồm Chamber of Secrets và The Trap Door, có trải nghiệm đũa phép tương tác.","Dành 60–90 phút. Vé riêng, không nằm trong vé USS. Đặt khung giờ trước và đến sớm 10–15 phút."],
     ["i","21:05","<b>Waterfront → HarbourFront → Chinatown → Bencoolen → khách sạn.</b>","Về phòng khoảng 22:15. Tối nay không có mốc giờ bắt buộc — tranh thủ sắp đồ trước khi ngủ."]],
    foot:"<b>Đặt vé USS và Harry Potter online trước, đây là hai vé tách biệt.</b> Vì TRANSFORMERS và WaterWorld đều đóng, số trò phải xếp hàng ít hơn ngày thường nên vé thường có thể đã đủ, không nhất thiết mua Express Pass."},

en:{
  lang:"en",
  eyebrow:"Travel itinerary · 5 days, 4 nights",
  title:"Singapore, Aug 28 → Sep 1",
  sub:"From leaving the hotel at 3pm Friday to a 1pm Tuesday flight — a full Mandai day closing with a 10pm fire show, Universal Studios opening at Minion Land, Harry Potter on the 31st, and two options for splitting between Changi T1 and T3 on the last day.",
  facts:[["Hotel","Grand Pacific, 101 Victoria St"],["Party","2 people"],["Back by 10pm","Aug 28 & Aug 30"],["Flight home","Sep 1, 1:00pm — T1 & T3"]],
  nav:[["#luuy","Read first"],["#d1","Aug 28 · Marina Bay"],["#d2","Aug 29 · Mandai"],["#d3","Aug 30 · Chinatown"],["#d4","Aug 31 · USS"],["#d5","Sep 1 · Changi"],["#an","Food"],["#ve","Tickets"]],
  note:{h:"Five things to know before you go", sub:"Checked against official sources, updated 23 Aug 2026.", items:[
    "<b>The fire show is now called “Embers of Night”</b>, not Thumbuakar. It runs at the Entrance Courtyard, usually 9pm, with an extra 10pm slot on Fridays, Saturdays and eves of public holidays. Aug 29 is a Saturday, so the 10pm show is available — this itinerary uses it to close the day.",
    "<b>Creatures of the Night requires an online seat booking</b>, with three shows at 7:30pm, 8:30pm and 9:30pm. Booking opens exactly 2 hours before each show, so 5:30pm is when you reserve the 7:30pm slot. Arrive 15 minutes early; gates shut 10 minutes before showtime.",
    "<b>Harry Potter does exist in Singapore</b> — just not inside Universal Studios. It is the “Harry Potter: Visions of Magic” exhibition at WEAVE, Level B1 Forum, Resorts World Sentosa, right next to USS. Separate ticket, 60–90 minutes.",
    "<b>Three things at USS are closed during your dates:</b> WaterWorld through Aug 31, TRANSFORMERS The Ride Aug 23 – Sep 4, and Pantages Theater from Aug 30. Also, <b>USS no longer has a Madagascar zone</b> — that space became Minion Land.",
    "<b>Garden Rhapsody has two shows, 7:45pm and 8:45pm.</b> August runs the National Day edition, “Songs of Singapore”. This plan takes the 8:45pm slot so it pairs with Spectra at 8pm the same evening."]},
  days:[
   {id:"d1",num:"Day 1 · Friday Aug 28",title:"Marina Bay, one way only",tag:"Back by 10pm",
    blocks:[
     ["i","3:00pm","<b>Drop bags, change shoes, leave the hotel.</b>","Don't linger past 15 minutes — the whole evening is one continuous walking route."],
     ["i","3:15pm","<b>City Hall → Raffles Place</b> on the EWL, exactly one stop, then walk out toward Fullerton.",""],
     ["i","3:40pm","<b>Merlion Park</b> — the best angle puts the Merlion against Marina Bay Sands.",""],
     ["i","4:20pm","<b>Jubilee Bridge → Esplanade</b>, walking the bayfront.","One direction, no doubling back. Carry water."],
     ["f","Budget · 4.1★ (4,161 reviews)","Makansutra Gluttons Bay","Satay, sambal stingray, oyster omelette, sugarcane juice. Eat at 5:05pm to beat the 7–8pm rush."],
     ["i","6:00pm","<b>Helix Bridge → Marina Bay Sands.</b>","Shoot the bridge while there's still daylight."],
     ["i","6:30pm","<b>MBS and ArtScience Museum from the outside.</b>","Don't go inside the museum — doing so costs you one of tonight's two shows."],
     ["i","7:40pm","<b>Get to Event Plaza and pick your spot.</b>","Stand facing the water."],
     ["s","8:00pm","<b>Spectra</b> — free light and water show, about 15 minutes.","Take the first slot at 8pm; it's the only one that connects to Garden Rhapsody."],
     ["i","8:15pm","<b>Walk straight to Supertree Grove.</b>","No shopping stops. There's a built-in 10-minute buffer here."],
     ["s","8:45pm","<b>Garden Rhapsody</b> — August runs the National Day edition, “Songs of Singapore”. Free, 15 minutes.",""],
     ["i","9:00pm","<b>Photos at Supertree Grove after the show.</b>","Don't stay past 9:10pm."],
     ["i","9:10pm","<b>Bayfront → Promenade → Bras Basah</b>, then walk to the hotel.","Back in the room around 9:40pm."]],
    foot:"The whole evening is a straight line: Merlion → Esplanade → MBS → Gardens, with no backtracking anywhere. That's why dinner is at 5:05pm rather than 7pm."},

   {id:"d2",num:"Day 2 · Saturday Aug 29",title:"A full day at Mandai, ending in fire",tag:"Longest day — back ~11:25pm",night:true,
    blocks:[
     ["f","Budget · 4.1★ (2,993 reviews)","YY Kafei Dian","Kaya bun, soft-boiled eggs, kopi. On Beach Road, a 9-minute walk from the hotel and open early — eat at 6:35am and grab extra buns to take along."],
     ["i","7:10am","<b>Bras Basah → Caldecott (CCL) → Springleaf (TEL) → bus 138 → Singapore Zoo.</b>","Be there before 8:30am."],
     ["s","8:30am","<b>Treetops Trail → Orangutan Island → Fragile Forest.</b>","The most valuable window in the Zoo — animals are most active in the morning."],
     ["i","10:15am","<b>Wild Africa → Elephant Trail.</b>","Use the in-park tram when your legs go; don't try to walk everything."],
     ["f","On-route · not a high-rated spot","Ah Meng Restaurant (inside the Zoo)","Chicken rice or laksa. Chosen because it's inside the Zoo — leaving to eat costs 60–90 minutes and wrecks the evening."],
     ["i","12:40pm","<b>Great Rift Valley → Australasia → whatever else you still want.</b>","Leave the Zoo gate no later than 2:40pm."],
     ["i","2:40pm","<b>Walk over to River Wonders and scan in.</b>","Don't stop at the zones near the entrance."],

const $ = s => document.querySelector(s);

function esc(s){return String(s);}

function renderBlocks(blocks){
  return blocks.map(b=>{
    if(b[0]==="f"){
      return `<div class="food"><span class="flabel">${b[1]}</span>`+
        `<span class="fname">${b[2]}</span> — <span class="frating">${b[3]}</span></div>`;
    }
    const star = b[0]==="s" ? " star" : "";
    const note = b[3] ? `<span class="note">${b[3]}</span>` : "";
    return `<div class="item${star}"><div class="time">${b[1]}</div>`+
      `<div class="body">${b[2]}${note}</div></div>`;
  }).join("");
}

function renderPlans(p){
  const col = (o,cls)=>`<div class="plan ${cls}"><div class="cond">${o.cond}</div>`+
    `<h4>${o.title}</h4><ul>${o.items.map(i=>`<li>${i}</li>`).join("")}</ul></div>`;
  return `<div class="plans">${col(p.a,"")}${col(p.b,"safe")}</div>`;
}

function renderTable(t, isTickets){
  const rows = t.rows.map(r=>{
    const cells = r.map((c,i)=>{
      if(Array.isArray(c)) return `<td><span class="pri ${c[0]}">${c[1]}</span></td>`;
      if(i===0) return `<td class="d">${c}</td>`;
      if(!isTickets && i===2) return `<td class="rate">${c}</td>`;
      return `<td>${c}</td>`;
    }).join("");
    return `<tr>${cells}</tr>`;
  }).join("");
  return `<h2>${t.h}</h2><p class="lead">${t.lead}</p><div class="tablewrap"><table>`+
    `<thead><tr>${t.head.map(h=>`<th>${h}</th>`).join("")}</tr></thead><tbody>${rows}</tbody></table></div>`;
}

function render(lang){
  const d = DATA[lang];
  document.documentElement.lang = d.lang;
  $("#eyebrow").textContent = d.eyebrow;
  $("#h1").textContent = d.title;
  $("#sub").textContent = d.sub;
  $("#facts").innerHTML = d.facts.map(f=>`<div class="fact"><div class="k">${f[0]}</div><div class="v">${f[1]}</div></div>`).join("");
  $("#daynav").innerHTML = d.nav.map(n=>`<a href="${n[0]}">${n[1]}</a>`).join("");
  $("#luuy").innerHTML = `<h2>${d.note.h}</h2><p class="csub">${d.note.sub}</p><ul>`+
    d.note.items.map(i=>`<li>${i}</li>`).join("")+`</ul>`;

  $("#days").innerHTML = d.days.map(day=>{
    const head = `<div class="day-head${day.night?" night":""}"><div>`+
      `<div class="day-num">${day.num}</div><h2 class="day-title">${day.title}</h2></div>`+
      `<div class="day-tag">${day.tag}</div></div>`;
    let inner = `<div class="timeline">${renderBlocks(day.blocks)}</div>`;
    if(day.plans) inner += renderPlans(day.plans);
    if(day.blocks2) inner += `<div class="timeline" style="padding-top:0">${renderBlocks(day.blocks2)}</div>`;
    return `<div class="day" id="${day.id}"><div class="day-card">${head}${inner}`+
      `<div class="day-foot">${day.foot}</div></div></div>`;
  }).join("");

  $("#an").innerHTML = renderTable(d.food, false);
  $("#ve").innerHTML = renderTable(d.tickets, true);

  $("#footer").innerHTML = `<b style="color:var(--ink)">${d.footer.h}</b><br>`+
    d.footer.links.map(l=>`<a href="${l[0]}" target="_blank" rel="noopener">${l[1]}</a>`).join(" · ")+
    `<ul>${d.footer.notes.map(n=>`<li>${n}</li>`).join("")}</ul>`;

  document.querySelectorAll(".langtoggle button").forEach(b=>{
    b.setAttribute("aria-pressed", b.dataset.lang===lang ? "true":"false");
  });
  document.title = lang==="vi" ? "Singapore 5 Ngày" : "Singapore in 5 Days";
}

let current = "vi";
try{ const saved = localStorage.getItem("sg-lang"); if(saved==="en"||saved==="vi") current = saved; }catch(e){}

document.querySelectorAll(".langtoggle button").forEach(b=>{
  b.addEventListener("click",()=>{
    current = b.dataset.lang;
    try{ localStorage.setItem("sg-lang", current); }catch(e){}
    render(current);
  });
});

render(current);
</script>
