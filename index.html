[[That's because]] Tết là thời gian dành cho gia đình, [[so]] mọi người từ các thành phố lớn về quê.||[[For example]], Tết nào tôi cũng về Bến Tre. Gia đình tôi cùng nhau gói bánh chưng, [[and]] đêm giao thừa cả nhà cùng xem pháo hoa.||[[So]], đúng vậy, Tết là thời gian gia đình quan trọng nhất của người Việt.", "Yes, people usually celebrate festivals with their families, [[especially]] at Tết.||[[That's because]] Tết is a time for family, [[so]] people travel home from big cities.||[[For example]], I go back to Bến Tre every Tết. My family makes bánh chưng together, [[and]] we watch the fireworks on New Year's Eve.||[[So]] yes, Tết is the most important family time for Vietnamese people.", "", "travel home|bánh chưng", ""], ["Why is it important to celebrate festivals?", "Tôi nghĩ tổ chức lễ hội rất quan trọng đối với văn hóa và gia đình.||[[That's because]] lễ hội giúp chúng ta giữ gìn truyền thống, [[and]] trẻ em được tìm hiểu về văn hóa.||[[For example]], vào Trung thu, trẻ em Việt Nam rước đèn và nghe những câu chuyện xưa. Lễ hội [[also]] cho người lớn lý do để nghỉ ngơi và gặp gỡ nhau.||[[So]], theo tôi, nếu không có lễ hội, cuộc sống sẽ chỉ có công việc và rất nhàm chán.", "I think celebrating festivals is important for our culture and our families.||[[That's because]] festivals help us keep our traditions, [[and]] children learn about our culture.||[[For example]], at Mid-Autumn, children in Vietnam carry lanterns and learn old stories. Festivals [[also]] give adults a reason to rest and meet each other.||[[So]] in my opinion, without festivals, life would be just work and very boring.", "", "traditions|bring together|culture", ""]]}, {"name": "Đề 53 · Technology", "rows": [["What kinds of technological problems do people often face?", "Mọi người thường gặp vấn đề với mạng chậm, điện thoại hết pin [[and]] tài khoản bị hack.||[[That's because]] chúng ta dùng công nghệ suốt ngày, [[so]] những sự cố nhỏ cũng có thể làm gián đoạn công việc.||[[For example]], tuần trước, wifi ở văn phòng tôi bị hỏng cả buổi sáng, [[so]] không ai làm việc được.||[[So]], những vấn đề này cho thấy chúng ta phụ thuộc vào công nghệ nhiều như thế nào.", "People often have problems with slow internet, dead batteries [[and]] hacked accounts.||[[That's because]] we use technology all the time, [[so]] small problems can stop our work.||[[For example]], last week, the wifi at my office stopped working for the whole morning, [[so]] nobody could work.||[[So]], these problems show how much we depend on technology.", "", "slow internet|battery|hacked", ""], ["Do older people have more difficulty using technology than young people?", "Có, tôi nghĩ người lớn tuổi thấy công nghệ khó dùng hơn.||[[That's because]] họ không lớn lên cùng công nghệ. [[But]] người trẻ có thể dạy họ.||[[For example]], bà tôi rất muốn gọi video cho các cháu, [[so]] tôi đã dạy bà dùng Zalo. Giờ bà có thể tự gọi.||[[So]], đúng vậy, việc đó khó hơn với họ, [[but]] họ có thể học được nếu có người giúp.", "Yes, I think older people find technology more difficult.||[[That's because]] they didn't grow up with technology. [[But]] young people can teach them.||[[For example]], my grandmother really wanted to video call her grandchildren, [[so]] I taught her how to use Zalo. Now she can call by herself.||[[So]] yes, it's harder for them, [[but]] they can learn with some help.", "", "grow up with|teach", ""], ["How has technology made people's lives easier?", "Tôi nghĩ công nghệ làm cuộc sống của chúng ta dễ dàng hơn rất nhiều.||[[That's because]] chúng ta có thể thanh toán online, gọi đồ ăn [[and]] làm việc tại nhà. Nó giúp chúng ta tiết kiệm rất nhiều thời gian.||[[For example]], trước đây, mọi người phải xếp hàng ở ngân hàng để chuyển tiền. Bây giờ tôi chuyển tiền cho bố mẹ ở Bến Tre chỉ trong vài giây.||[[So]], công nghệ giúp chúng ta tiết kiệm thời gian mỗi ngày.", "I think technology makes our lives much easier.||[[That's because]] we can pay online, order food [[and]] work from home. It saves us a lot of time.||[[For example]], in the past, people waited in line at the bank to send money. Now I send money to my parents in Bến Tre in a few seconds.||[[So]], technology saves us time every day.", "", "online payments|delivery", ""], ["Do you think people depend too much on technology nowadays?", "Có, tôi nghĩ mọi người phụ thuộc quá nhiều vào công nghệ.||[[That's because]] chúng ta không thể sống thiếu điện thoại, [[and]] mọi người hoảng hốt khi mất mạng.||[[For example]], [[when]] Grab hay ứng dụng ngân hàng bị lỗi ở TP.HCM, nhiều người không biết làm sao để về nhà hay thanh toán.||[[So]], đúng vậy, chúng ta phụ thuộc quá nhiều, [[but]] [[if]] dùng một cách khôn ngoan, công nghệ sẽ làm cuộc sống tốt hơn.", "Yes, I think people depend too much on technology.||[[That's because]] we can't live without our phones, [[and]] people panic when the internet is down.||[[For example]], [[when]] Grab or banking apps stop working in Ho Chi Minh City, many people don't know how to go home or pay.||[[So]] yes, we depend on it too much, [[but]] [[if]] we use it wisely, it makes life better.", "", "depend on|can't live without", ""]]}, {"name": "Đề 55 · Sports events", "rows": [["Do you think it is necessary to award prizes and incentives to athletes?", "Có, tôi nghĩ vận động viên nên được nhận giải thưởng và tiền thưởng.||[[That's because]] họ tập luyện rất vất vả, [[and]] giải thưởng tạo động lực cho các vận động viên trẻ.||[[For example]], các vận động viên giành huy chương SEA Games thường được nhận tiền thưởng, [[and]] số tiền đó giúp gia đình họ có cuộc sống tốt hơn.||[[So]], đúng vậy, giải thưởng là cần thiết, [[but]] các vận động viên trẻ [[also]] cần được hỗ trợ ngay từ đầu.", "Yes, I think athletes should get prizes and incentives.||[[That's because]] they train very hard, [[and]] prizes motivate young athletes.||[[For example]], athletes who win SEA Games medals usually get prize money, [[and]] it helps their families have a better life.||[[So]] yes, prizes are necessary, [[but]] young athletes [[also]] need support from the beginning.", "", "train hard|motivate", ""], ["What kind of sports are popular in your country?", "Bóng đá là môn thể thao phổ biến nhất ở Việt Nam.||[[That's because]] bóng đá dễ chơi [[and]] xem rất vui. Cầu lông, chạy bộ và pickleball [[also]] đang rất phổ biến.||[[For example]], công viên gần nhà tôi sáng nào cũng đông người chơi pickleball, [[and]] tôi cũng hay chạy bộ ở đó.||[[So]], bóng đá đứng đầu, [[but]] ngày càng nhiều người chơi các môn khác [[because]] họ quan tâm đến sức khỏe.", "Football is the most popular sport in Vietnam.||[[That's because]] it's easy to play [[and]] fun to watch. Badminton, running and pickleball are [[also]] very popular now.||[[For example]], the park near my house is full of people playing pickleball every morning, [[and]] I often go running there too.||[[So]], football is number one, [[but]] more people play other sports [[because]] they care about their health.", "", "football|running", ""], ["What kind of competitions do people in your country like to watch?", "Người Việt Nam rất thích xem các giải bóng đá, [[especially]] AFF Cup và SEA Games.||[[That's because]] những trận đấu này khiến mọi người cảm thấy đoàn kết. Nhiều người [[also]] thích các cuộc thi hát trên TV.||[[For example]], [[when]] đội tuyển quốc gia thi đấu, cả nước cùng xem, [[and]] các quán cà phê ở TP.HCM lúc nào cũng kín chỗ.||[[So]], các giải bóng đá là thứ được xem nhiều nhất.", "People in Vietnam love watching football tournaments, [[especially]] the AFF Cup and the SEA Games.||[[That's because]] these matches make people feel united. Many people [[also]] like singing contests on TV.||[[For example]], [[when]] the national team plays, the whole country watches, [[and]] cafés in Ho Chi Minh City are always full.||[[So]], football competitions are the most popular to watch.", "", "AFF Cup|SEA Games", ""], ["Do you think there should be more matches or competitions broadcast on TV?", "Có, tôi nghĩ nên chiếu nhiều cuộc thi hơn trên TV, [[especially]] các môn thể thao nữ.||[[That's because]] [[if]] được lên sóng nhiều hơn, sẽ có thêm nhà tài trợ, [[and]] trẻ em có thể khám phá những môn thể thao mới.||[[For example]], đội tuyển bóng đá nữ Việt Nam rất giỏi, [[but]] các trận đấu của họ không thường được chiếu trên TV.||[[So]], đúng vậy, chúng ta cần nhiều thể thao hơn trên TV, [[but]] mọi người vẫn nên tự tập thể dục.", "Yes, I think there should be more competitions on TV, [[especially]] women's sports.||[[That's because]] [[if]] there's more TV coverage, there will be more sponsors, [[and]] children can discover new sports.||[[For example]], Vietnam's women's football team is very good, [[but]] their matches are not often on TV.||[[So]] yes, we need more sports on TV, [[but]] people should still exercise themselves.", "", "women's football|sponsors", ""]]}, {"name": "Đề 59 · Children's behaviour", "rows": [["What do young children do when they behave badly?", "Khi trẻ nhỏ cư xử không ngoan, chúng thường khóc, la hét [[or]] không chịu nghe lời.||[[That's because]] các em chưa kiểm soát được cảm xúc của mình.||[[For example]], có lần tôi thấy một cậu bé nằm lăn ra sàn siêu thị [[because]] mẹ không mua đồ chơi cho cậu.||[[So]], khóc lóc và la hét là những hành vi không ngoan phổ biến nhất ở trẻ nhỏ.", "When young children behave badly, they often cry, shout [[or]] refuse to listen.||[[That's because]] they can't control their feelings yet.||[[For example]], once I saw a little boy lie on the floor of a supermarket [[because]] his mother didn't buy him a toy.||[[So]], crying and shouting are the most common bad behaviour in young children.", "", "cry and shout|refuse", ""], ["How should parents stop their children from behaving badly?", "Tôi nghĩ bố mẹ nên giải thích một cách bình tĩnh và đặt ra quy tắc rõ ràng.||[[That's because]] trẻ cần hiểu mình đã làm sai điều gì. Bố mẹ [[also]] nên khen ngợi khi con cư xử tốt.||[[For example]], [[if]] một đứa trẻ đang la hét, bố mẹ có thể đưa con đến chỗ yên tĩnh và nói chuyện nhẹ nhàng.||[[So]], theo tôi, nói chuyện bình tĩnh hiệu quả hơn là quát mắng hay đánh đòn.", "I think parents should explain calmly and set clear rules.||[[That's because]] children need to understand what they did wrong. Parents should [[also]] praise good behaviour.||[[For example]], [[if]] a child is shouting, parents can take them to a quiet place and talk gently.||[[So]] in my opinion, calm talking works better than shouting or hitting.", "", "explain calmly|clear rules|praise", ""], ["Were parents in the past more strict with their children than parents these days?", "Có, tôi nghĩ bố mẹ ngày xưa nghiêm khắc hơn.||[[That's because]] họ phạt con nhiều hơn, [[but]] bây giờ bố mẹ trò chuyện với con nhiều hơn.||[[For example]], bố mẹ tôi rất nghiêm khắc, [[and]] tôi hiếm khi được nói ý kiến của mình. Bây giờ các bố mẹ trẻ đối xử với con như bạn bè.||[[So]], đúng vậy, ngày xưa bố mẹ nghiêm hơn, [[but]] bây giờ một số bố mẹ lại quá nuông chiều con.", "Yes, I think parents in the past were more strict.||[[That's because]] they punished their children more, [[but]] now parents talk with their kids more.||[[For example]], my parents were very strict, [[and]] I rarely gave my opinion. Now young parents treat their kids like friends.||[[So]] yes, parents were stricter before, [[but]] now some parents spoil their kids too much.", "", "strict|punish|talk", ""], ["Whose influence on children is more important? Friends or parents?", "Điều đó còn tùy vào độ tuổi của trẻ.||[[That's because]] với trẻ nhỏ, bố mẹ quan trọng hơn, [[but]] với tuổi teen, bạn bè lại quan trọng hơn.||[[For example]], [[when]] học cấp ba, tôi nghe lời bạn bè hơn bố mẹ, [[especially]] về quần áo và âm nhạc.||[[So]], còn tùy, [[and]] bố mẹ nên gần gũi con tuổi teen và biết bạn bè của con.", "It depends on the child's age.||[[That's because]] for young children, parents are more important, [[but]] for teenagers, friends are more important.||[[For example]], [[when]] I was in high school, I listened to my friends more than my parents, [[especially]] about clothes and music.||[[So]] it depends, [[and]] parents should stay close to their teenagers and know their friends.", "", "young kids|teenagers", ""], ["The best way to change someone’s behaviour is to set a good example. What do you think?", "Tôi đồng ý rằng làm gương tốt là cách tốt nhất.||[[That's because]] trẻ con bắt chước người lớn. [[If]] bố mẹ nói một đằng [[but]] làm một nẻo, con sẽ không nghe.||[[For example]], [[if]] bố mẹ đọc sách, con cũng sẽ đọc sách. Mẹ tôi rất thích nấu ăn, [[so]] bây giờ tôi cũng thích nấu ăn.||[[So]], tôi nghĩ làm gương hiệu quả hơn nhiều so với nói hay phạt.", "I agree that setting a good example is the best way.||[[That's because]] children copy adults. [[If]] parents say one thing [[but]] do another, children won't listen.||[[For example]], [[if]] parents read books, their kids read too. My mother loves cooking, [[so]] now I love cooking too.||[[So]] I think a good example works much better than talking or punishing.", "", "copy|good example", ""]]}]}, "p3_5": {"name": "Hoạt động", "topics": [{"name": "Đề 11 · Adventure", "rows": [["What kinds of activities do young people like to do?", "Tôi nghĩ người trẻ thích mạng xã hội, đi cà phê và chơi thể thao.||[[That's because]] những hoạt động này vui [[and]] họ có thể gặp bạn bè. Họ quan tâm đến trải nghiệm hơn là mua sắm.||[[For example]], nhiều bạn trẻ ở TP.HCM thích làm việc ở quán cà phê [[or]] tham gia câu lạc bộ chạy bộ. Tôi cũng tham gia một câu lạc bộ chạy bộ.||[[So]], theo tôi, người trẻ thích những hoạt động có tính kết nối [[and]] năng động.", "I think young people like social media, cafés and sports.||[[That's because]] these activities are fun [[and]] they can meet friends. They care more about experiences than shopping.||[[For example]], many young people in Ho Chi Minh City like working in cafés [[or]] joining running clubs. I join a running club too.||[[So]] in my opinion, young people like activities that are social [[and]] active.", "", "gaming|concerts|travelling", ""], ["Why do some young people like adventurous activities?", "Tôi nghĩ họ thích các hoạt động mạo hiểm vì họ muốn có cảm giác mạnh.||[[That's because]] họ muốn thử thách bản thân. [[Also]], họ muốn chụp ảnh đẹp để đăng lên mạng xã hội.||[[For example]], năm ngoái tôi đã leo núi Lang Biang ở Đà Lạt. [[When]] lên tới đỉnh, tôi thấy rất tự hào.||[[So]], tôi nghĩ người trẻ thích những hoạt động này để thấy hào hứng [[and]] tự hào, [[but]] họ nên đi cùng hướng dẫn viên để an toàn.", "I think they like adventurous activities because they want excitement.||[[That's because]] they want to challenge themselves. [[Also]], they want to take nice photos for social media.||[[For example]], last year I climbed Lang Biang Mountain in Đà Lạt. [[When]] I reached the top, I felt very proud.||[[So]] I think young people like these activities to feel excited [[and]] proud, [[but]] they should go with a guide to stay safe.", "", "excitement|challenge themselves|photos", ""], ["Do you think old people would like to have changes?", "It depends, [[but]] phần lớn người lớn tuổi thích nếp sinh hoạt quen thuộc.||[[That's because]] họ thấy thoải mái với những điều quen thuộc. [[But]] họ vẫn chấp nhận thay đổi [[if]] thay đổi đó có ích cho họ.||[[For example]], bà tôi ở Bến Tre đã 70 tuổi, [[but]] bà vẫn học dùng điện thoại thông minh để gọi video cho cả nhà.||[[So]], tôi nghĩ người lớn tuổi không thích thay đổi nhiều, [[but]] họ thích những thay đổi có ích.", "It depends, [[but]] most old people prefer a routine.||[[That's because]] they feel comfortable with things they know. [[But]] they accept changes [[if]] the changes are useful for them.||[[For example]], my grandmother in Bến Tre is 70, [[but]] she still learns to use a smartphone to make video calls with us.||[[So]] I think old people don't like many changes, [[but]] they like useful ones.", "", "routine|new hobbies", ""], ["Can you give some (other) examples of adventurous or risky activities?", "Một số ví dụ khác là trekking, leo núi đá, dù lượn [[and]] lặn biển.||[[That's because]] những hoạt động này rất thú vị, [[but]] người chơi dễ bị thương.||[[For example]], ở Việt Nam, nhiều người đi dù lượn ở Đà Lạt, lặn biển ở Nha Trang [[and]] trekking ở Hà Giang hay Sa Pa.||[[So]], có rất nhiều hoạt động mạo hiểm, [[and]] tôi nghĩ mọi người nên kiểm tra sức khỏe [[and]] chọn một công ty an toàn.", "Some other examples are trekking, rock climbing, paragliding [[and]] diving in the sea.||[[That's because]] these activities are exciting, [[but]] people can get hurt easily.||[[For example]], in Vietnam, many people go paragliding in Đà Lạt, diving in Nha Trang [[and]] trekking in Hà Giang or Sa Pa.||[[So]] there are many risky activities, [[and]] I think people should check their health [[and]] choose a safe company.", "", "trekking|paragliding|diving", ""]]}, {"name": "Đề 13 · Being late", "rows": [["Do you think it’s ok to arrive late when meeting a friend?", "It depends. Trễ vài phút thì không sao, [[but]] trễ quá nhiều là thiếu lịch sự.||[[That's because]] giao thông thường rất tệ, [[but]] thời gian của bạn mình cũng quan trọng.||[[For example]], [[if]] bạn tôi trễ năm phút, tôi sẵn sàng chờ. [[But]] [[if]] bạn ấy trễ 30 phút mà không nhắn tin, tôi thấy bạn ấy không tôn trọng mình.||[[So]], tôi nghĩ trễ một chút thì được, [[but]] mọi người nên luôn nhắn tin báo.", "It depends. Being a few minutes late is OK, [[but]] being very late is rude.||[[That's because]] traffic is often bad, [[but]] your friend's time is important too.||[[For example]], [[if]] my friend is five minutes late, I'm happy to wait. [[But]] [[if]] they're 30 minutes late without a message, I feel they don't respect me.||[[So]] I think a little late is fine, [[but]] people should always send a message.", "", "text them|rude", ""], ["What should happen to people who arrive late for work?", "Tôi nghĩ trước tiên họ nên bị nhắc nhở.||[[That's because]] đôi khi có kẹt xe. [[But]] [[if]] họ hay đi trễ, công ty có thể trừ thưởng.||[[For example]], công ty tôi cho phép bắt đầu làm từ 8 đến 9 giờ sáng, [[so]] chúng tôi tránh được giờ cao điểm [[and]] ít người đi trễ hơn.||[[So]], theo tôi, công ty nên nhắc nhở trước [[and]] cũng nên cho giờ làm linh hoạt.", "I think they should get a warning first.||[[That's because]] sometimes there are traffic jams. [[But]] [[if]] they're often late, the company can cut their bonus.||[[For example]], my company lets us start between 8 and 9 a.m., [[so]] we can avoid rush hour [[and]] fewer people are late.||[[So]] in my opinion, companies should give a warning first [[and]] offer flexible hours too.", "", "warning|bonus|traffic jams", ""], ["Can you suggest how people can make sure they don’t arrive late?", "Tôi nghĩ mọi người nên chuẩn bị sớm [[and]] ra khỏi nhà sớm hơn một chút.||[[That's because]] giao thông rất khó đoán. Họ có thể xem Google Maps [[and]] đặt báo thức.||[[For example]], tôi luôn chuẩn bị quần áo [[and]] túi xách từ tối hôm trước. Nhờ vậy buổi sáng nhanh hơn, [[and]] tôi không bao giờ phải vội.||[[So]], lời khuyên của tôi là lên kế hoạch từ tối hôm trước [[and]] ra khỏi nhà sớm.", "I think people should prepare early [[and]] leave a bit earlier.||[[That's because]] traffic is hard to guess. They can check Google Maps [[and]] set an alarm.||[[For example]], I always prepare my clothes [[and]] bag the night before. It makes my mornings faster, [[and]] I never have to rush.||[[So]] my advice is to plan the night before [[and]] leave home early.", "", "leave early|set an alarm", ""]]}, {"name": "Đề 18 · Outdoor activities", "rows": [["Where do people like to go for these activities?", "Mọi người thường đi núi, đi biển [[or]] ra công viên.||[[That's because]] những nơi này trong lành [[and]] yên tĩnh. Mọi người muốn thoát khỏi thành phố ồn ào.||[[For example]], cuối tuần, nhiều người ở TP.HCM đi cắm trại ở Đồng Nai [[or]] đi biển Vũng Tàu. Họ có thể đi [[and]] về trong ngày.||[[So]], tôi nghĩ mọi người thích những nơi thiên nhiên gần thành phố.", "People usually go to the mountains, the beach [[or]] parks.||[[That's because]] these places are fresh [[and]] quiet. People want to escape the busy city.||[[For example]], at weekends, many people in Ho Chi Minh City go camping in Đồng Nai [[or]] to the beach in Vũng Tàu. They can go [[and]] come back in one day.||[[So]] I think people like nature places that are close to the city.", "", "mountains|beaches|parks", ""], ["What outdoor activities are popular in Vietnam?", "Tôi nghĩ cắm trại, trekking, chạy bộ [[and]] đạp xe đang phổ biến ở Việt Nam.||[[That's because]] mọi người muốn thoát khỏi thành phố ồn ào [[and]] sống khỏe mạnh hơn.||[[For example]], tôi tham gia một nhóm chạy bộ vào mỗi sáng Chủ nhật ở TP.HCM. Nhiều bạn của tôi [[also]] đi trekking ở Hà Giang.||[[So]], theo tôi, các hoạt động ngoài trời tốt cho sức khỏe hiện rất phổ biến.", "I think camping, trekking, running [[and]] cycling are popular in Vietnam.||[[That's because]] people want to escape the noisy city [[and]] live a healthier life.||[[For example]], I join a running group every Sunday morning in Ho Chi Minh City. Many of my friends [[also]] go trekking in Hà Giang.||[[So]] in my opinion, outdoor activities for health are very popular now.", "", "camping|trekking|cycling", ""], ["Are those people who like dangerous activities more likely to be successful?", "It depends. Họ dũng cảm, [[but]] như vậy chưa đủ để thành công.||[[That's because]] thành công cũng cần lập kế hoạch cẩn thận. Người thích nguy hiểm có thể ra quyết định vội vàng mà không suy nghĩ.||[[For example]], trong công việc marketing của tôi, chúng tôi thử ý tưởng mới, [[but]] luôn thử với ngân sách nhỏ trước.||[[So]], tôi nghĩ thành công đến từ sự cân bằng giữa dũng cảm [[and]] cẩn thận.", "It depends. They are brave, [[but]] that is not enough for success.||[[That's because]] success needs careful planning too. People who love danger may make quick decisions without thinking.||[[For example]], in my marketing job, we try new ideas, [[but]] we always test them with a small budget first.||[[So]] I think success comes from a balance between being brave [[and]] being careful.", "", "brave|take risks|careful", ""], ["Do you think it’s better for people to change jobs when there are new chances?", "Yes, tôi nghĩ nên đổi [[if]] đó là một cơ hội tốt.||[[That's because]] công việc mới có thể cho lương cao hơn [[or]] kỹ năng mới. [[But]] mọi người không nên đổi việc quá thường xuyên.||[[For example]], tôi chuyển sang công việc hiện tại [[because]] nó cho tôi nhiều cơ hội học hỏi hơn, [[and]] đó là quyết định đúng.||[[So]], đúng vậy, mọi người nên nắm bắt cơ hội tốt, [[but]] trước đó nên tìm hiểu kỹ về công ty mới.", "Yes, I think it's better [[if]] it's a good chance.||[[That's because]] a new job can give a better salary [[or]] new skills. [[But]] people shouldn't change jobs too often.||[[For example]], I moved to my current job [[because]] it gave me more chances to learn, [[and]] it was the right decision.||[[So]] yes, people should take good chances, [[but]] they should learn about the new company carefully first.", "", "good chance|too often", ""]]}, {"name": "Đề 24 · Concentration", "rows": [["Is it important for children to learn how to concentrate?", "Yes, tôi nghĩ điều đó rất quan trọng.||[[That's because]] [[when]] trẻ tập trung, các em học tốt hơn [[and]] làm bài tập về nhà nhanh hơn.||[[For example]], nhiều em vừa làm bài tập vừa xem điện thoại, [[so]] mất rất nhiều thời gian [[and]] làm sai nhiều.||[[So]], đúng vậy, trẻ nên học cách tập trung từ sớm, [[because]] điều đó giúp các em sau này.", "Yes, I think it's very important.||[[That's because]] [[when]] children concentrate, they learn better [[and]] finish their homework faster.||[[For example]], many kids look at their phones while doing homework, [[so]] it takes a long time [[and]] they make many mistakes.||[[So]] yes, children should learn to focus early, [[because]] it helps them in the future.", "", "learn better", ""], ["What can employers do to help employees concentrate?", "Tôi nghĩ nhà tuyển dụng có thể tạo khu làm việc yên tĩnh [[and]] bớt họp.||[[That's because]] tiếng ồn [[and]] quá nhiều tin nhắn làm nhân viên mất tập trung. Nghỉ giải lao ngắn [[also]] giúp mọi người tập trung lại.||[[For example]], công ty tôi có một phòng yên tĩnh cho người cần tập trung. Quản lý [[also]] cố gắng không nhắn tin công việc liên tục.||[[So]], theo tôi, một nơi yên tĩnh [[and]] ít bị làm phiền sẽ giúp nhân viên tập trung.", "I think employers can create quiet working areas [[and]] have fewer meetings.||[[That's because]] noise [[and]] too many messages distract employees. Short breaks [[also]] help people focus again.||[[For example]], my company has a quiet room for people who need to focus. Managers [[also]] try not to send work messages all the time.||[[So]] in my opinion, a quiet place [[and]] fewer interruptions help employees concentrate.", "", "quiet areas|fewer meetings|breaks", ""], ["What kinds of jobs require higher concentration at work?", "Tôi nghĩ những nghề như bác sĩ, phi công, tài xế [[and]] kế toán cần mức độ tập trung cao.||[[That's because]] một lỗi nhỏ có thể gây ra hậu quả lớn.||[[For example]], bác sĩ phẫu thuật có thể phải tập trung hàng giờ liền. Công việc marketing của tôi [[also]] cần tập trung [[when]] tôi phân tích dữ liệu, [[because]] một con số sai có thể ảnh hưởng cả kế hoạch.||[[So]], tôi nghĩ những nghề có rủi ro lớn cần tập trung nhiều nhất.", "I think jobs like doctors, pilots, drivers [[and]] accountants need high concentration.||[[That's because]] a small mistake can cause big problems.||[[For example]], a surgeon may need to focus for hours. My marketing job [[also]] needs focus [[when]] I analyse data, [[because]] one wrong number can affect the whole plan.||[[So]] I think jobs with big risks need the most focus.", "", "doctors|pilots|accountants", ""], ["Have you ever felt it difficult to concentrate?", "Yes, tôi thường thấy khó tập trung.||[[That's because]] điện thoại của tôi cứ rung liên tục [[when]] tôi làm việc.||[[For example]], bây giờ tôi dùng phương pháp Pomodoro. Tôi làm 25 phút, nghỉ 5 phút, [[and]] để điện thoại ở phòng khác. Tôi làm xong việc nhanh hơn.||[[So]], đúng vậy, việc đó khó với tôi, [[but]] phương pháp này thật sự giúp tôi tập trung.", "Yes, I often find it difficult to concentrate.||[[That's because]] my phone keeps buzzing [[when]] I work.||[[For example]], now I use the Pomodoro method. I work for 25 minutes, take a 5-minute break, [[and]] leave my phone in another room. I finish my work faster.||[[So]] yes, it's hard for me, [[but]] this method really helps me concentrate.", "", "phone|Pomodoro", ""]]}, {"name": "Đề 35 · Dream jobs", "rows": [["What jobs do children want to do when they grow up?", "Nhiều trẻ muốn làm bác sĩ, giáo viên hay cầu thủ bóng đá, [[and]] giờ nhiều em muốn làm YouTuber.||[[That's because]] trẻ con thích những nghề mà các em thấy hằng ngày [[or]] trên mạng.||[[For example]], cháu trai tôi muốn làm YouTuber [[because]] ngày nào cháu cũng xem kênh đồ chơi.||[[So]], tôi nghĩ nghề mơ ước của trẻ đến từ những gì các em thấy xung quanh.", "Many children want to be doctors, teachers or footballers, [[and]] now many want to be YouTubers.||[[That's because]] children like the jobs they see every day [[or]] online.||[[For example]], my nephew wants to be a YouTuber [[because]] he watches toy channels every day.||[[So]] I think children's dream jobs come from what they see around them.", "", "YouTubers|footballers", ""], ["What should people consider when choosing jobs?", "Tôi nghĩ mọi người nên cân nhắc lương, sở thích [[and]] môi trường làm việc.||[[That's because]] những điều này quyết định [[if]] họ có vui khi đi làm hay không.||[[For example]], [[when]] chọn công việc, tôi nghĩ nhiều về cơ hội học hỏi [[and]] đồng nghiệp. Tôi [[also]] tìm hiểu về làm việc từ xa, [[because]] tôi đang học thạc sĩ.||[[So]], theo tôi, mọi người nên nhìn toàn bộ công việc, không chỉ tiền lương.", "I think people should consider the salary, their interests [[and]] the working environment.||[[That's because]] these things decide [[if]] they are happy at work.||[[For example]], [[when]] I chose my job, I thought about the chance to learn [[and]] my colleagues. I [[also]] checked remote work, [[because]] I'm doing a master's degree.||[[So]] in my opinion, people should look at the whole job, not only the money.", "", "salary|interest|environment", ""], ["Is salary the main reason people choose a certain job?", "It depends. Với nhiều người, lương là lý do chính.||[[That's because]] họ cần lo cho gia đình. [[But]] người trẻ bây giờ [[also]] quan tâm đến đam mê.||[[For example]], nhiều bạn của tôi chấp nhận lương thấp hơn để làm công việc sáng tạo [[or]] có ý nghĩa. [[But]] [[when]] đã có gia đình, lương thường quan trọng hơn.||[[So]], tôi nghĩ lương quan trọng, [[but]] đó không phải là lý do duy nhất.", "It depends. For many people, salary is the main reason.||[[That's because]] they need to support their family. [[But]] young people [[also]] care about passion now.||[[For example]], many of my friends accept a lower salary to do creative [[or]] meaningful work. [[But]] [[when]] people have a family, salary becomes more important.||[[So]] I think salary is important, [[but]] it is not the only reason.", "", "support family|passion", ""], ["What kind of job can be called a “dream job”?", "Tôi nghĩ công việc mơ ước là công việc bạn yêu thích [[and]] được trả lương tốt.||[[That's because]] bạn thấy vui [[and]] không phải lo lắng về tiền. Nó [[also]] giúp bạn cân bằng giữa công việc và cuộc sống.||[[For example]], [[for me]], công việc mơ ước là trong ngành giáo dục, [[because]] tôi có thể giúp mọi người học tốt hơn.||[[So]], theo tôi, công việc mơ ước là công việc khiến bạn muốn thức dậy mỗi sáng.", "I think a dream job is a job you love [[and]] that pays well.||[[That's because]] you feel happy [[and]] you don't worry about money. It [[also]] gives you a good work-life balance.||[[For example]], [[for me]], a dream job is in education, [[because]] I can help people learn better.||[[So]] in my opinion, a dream job makes you want to get up every morning.", "", "love|work-life balance", ""]]}, {"name": "Đề 57 · Pressure & rules", "rows": [["How do you balance life and work?", "Tôi cố gắng không làm việc vào cuối tuần.||[[That's because]] tôi cần thời gian nghỉ ngơi [[and]] gặp bạn bè. Tôi [[also]] tắt thông báo công việc vào buổi tối.||[[For example]], Chủ nhật tôi đi chạy bộ [[and]] nấu ăn cho bạn bè. [[However]], vào mùa cao điểm, tôi vẫn phải làm thêm giờ.||[[So]], với tôi, cân bằng nghĩa là tôi được nghỉ ngơi đủ trong cả tháng.", "I try not to work at weekends.||[[That's because]] I need time to rest [[and]] see my friends. I [[also]] turn off work notifications at night.||[[For example]], on Sunday I go running [[and]] cook for my friends. [[However]], in busy seasons, I still have to work overtime.||[[So]] for me, balance means I have enough rest during the whole month.", "", "at weekends|exercise|notifications", ""], ["Will you continue doing something when you are aware that it’s a waste of time?", "Yes, đôi khi tôi vẫn làm.||[[That's because]] rất khó bỏ một thói quen. Những thói quen này [[also]] giúp mình thư giãn trong chốc lát.||[[For example]], tôi biết TikTok làm tốn thời gian, [[but]] tôi vẫn xem trước khi ngủ. Giờ tôi đang cố giảm xuống còn 20 phút.||[[So]], đúng vậy, đôi khi tôi vẫn tiếp tục, [[but]] tôi nghĩ đặt giới hạn là điều quan trọng.", "Yes, sometimes I do.||[[That's because]] it's hard to stop a habit. These habits [[also]] help us relax for a short time.||[[For example]], I know TikTok wastes my time, [[but]] I still watch it before bed. Now I'm trying to cut down to 20 minutes.||[[So]] yes, I sometimes continue, [[but]] I think setting a limit is the key.", "", "habits|cut down", ""], ["What kinds of things make people feel pressured?", "Tôi nghĩ thi cử, hạn chót công việc [[and]] tiền bạc khiến mọi người áp lực.||[[That's because]] mọi người lo lắng về tương lai. [[Also]], họ so sánh bản thân với người khác trên mạng xã hội.||[[For example]], học sinh Việt Nam chịu nhiều áp lực từ kỳ thi đại học. Người đi làm ở TP.HCM thì lo chuyện mua nhà.||[[So]], theo tôi, học tập, công việc [[and]] tiền bạc là những áp lực chính.", "I think exams, work deadlines [[and]] money make people feel pressured.||[[That's because]] people worry about the future. [[Also]], they compare themselves with others on social media.||[[For example]], Vietnamese students feel a lot of pressure from the university entrance exam. Working adults in Ho Chi Minh City worry about buying a house.||[[So]] in my opinion, study, work [[and]] money are the main pressures.", "", "deadlines|money|compare", ""], ["Why do some people refuse to abide by rules?", "Tôi nghĩ một số người phạm luật vì họ đang vội.||[[That's because]] họ nghĩ luật không công bằng, [[or]] họ nghĩ không ai kiểm tra.||[[For example]], ở TP.HCM, một số người vượt đèn đỏ [[when]] họ bị trễ giờ làm.||[[So]], tôi nghĩ chúng ta cần nhiều camera hơn [[and]] phạt nặng hơn, [[and]] nên dạy thói quen tốt từ nhỏ.", "I think some people break rules because they are in a hurry.||[[That's because]] they think the rules are not fair, [[or]] they think nobody is checking.||[[For example]], in Ho Chi Minh City, some people run red lights [[when]] they're late for work.||[[So]] I think we need more cameras [[and]] bigger fines, [[and]] we should teach good habits from a young age.", "", "not fair|in a hurry|run red lights", ""]]}, {"name": "Đề 64 · Skills", "rows": [["Where do children learn skills in your country?", "Trẻ em học kỹ năng ở trường, ở nhà [[and]] ở các lớp học thêm.||[[That's because]] trường học ở Việt Nam tập trung vào kiến thức nhiều hơn kỹ năng sống.||[[For example]], nhiều phụ huynh ở TP.HCM cho con đi học bơi [[or]] học tiếng Anh vào cuối tuần.||[[So]], tôi nghĩ các lớp học thêm [[and]] cha mẹ rất quan trọng với kỹ năng của trẻ.", "Children learn skills at school, at home [[and]] at extra classes.||[[That's because]] schools in Vietnam focus more on knowledge than life skills.||[[For example]], many parents in Ho Chi Minh City send their children to swimming [[or]] English classes at weekends.||[[So]] I think extra classes [[and]] parents are very important for children's skills.", "", "at school|extra classes", ""], ["What are the differences between learning skills on your own and from others?", "Tôi nghĩ học từ người khác nhanh hơn, [[but]] tự học thì linh hoạt hơn.||[[That's because]] giáo viên có thể sửa lỗi cho mình. [[But]] tự học thì miễn phí [[and]] mình có thể chọn thời gian.||[[For example]], tôi tự học nấu ăn qua YouTube, [[but]] mất rất nhiều thời gian. Học tiếng Anh với giáo viên thì tôi tiến bộ nhanh hơn nhiều.||[[So]], tôi thích học với giáo viên hơn, [[because]] nó tiết kiệm thời gian.", "I think learning from others is faster, [[but]] learning on your own is more flexible.||[[That's because]] a teacher can correct your mistakes. [[But]] learning alone is free [[and]] you can choose your time.||[[For example]], I learned to cook from YouTube by myself, [[but]] it took a long time. With an English teacher, I improve much faster.||[[So]] I prefer learning with a teacher, [[because]] it saves time.", "", "flexible|fewer mistakes", ""], ["What important skills should a child learn?", "Tôi nghĩ trẻ em nên học bơi, giao tiếp [[and]] nấu những món ăn đơn giản.||[[That's because]] bơi giúp các em an toàn, [[and]] giao tiếp giúp các em tự tin.||[[For example]], Việt Nam có nhiều sông [[and]] biển, như ở Bến Tre, [[so]] biết bơi rất quan trọng cho an toàn.||[[So]], theo tôi, bơi là kỹ năng quan trọng nhất đối với trẻ em.", "I think children should learn to swim, communicate [[and]] cook basic food.||[[That's because]] swimming keeps them safe, [[and]] communication helps them feel confident.||[[For example]], Vietnam has many rivers [[and]] beaches, like in Bến Tre, [[so]] swimming is important for safety.||[[So]] in my opinion, swimming is the most important skill for children.", "", "swimming|communication|cooking", ""], ["What skills do you think teenagers should have?", "Tôi nghĩ thanh thiếu niên nên học quản lý thời gian [[and]] quản lý tiền bạc.||[[That's because]] những kỹ năng này giúp các em tự lập khi học đại học [[and]] đi làm.||[[For example]], nhiều bạn trẻ mới đi làm không biết quản lý lương, [[so]] hết tiền ngay giữa tháng.||[[So]], tôi nghĩ kỹ năng quản lý tiền [[and]] thời gian là hữu ích nhất cho thanh thiếu niên.", "I think teenagers should learn time management [[and]] how to manage money.||[[That's because]] these skills help them become independent at university [[and]] at work.||[[For example]], many young people with their first job don't know how to manage their salary, [[so]] they run out of money in the middle of the month.||[[So]] I think money [[and]] time skills are the most useful for teenagers.", "", "time management|safely|managing money", ""], ["What are the differences between children's learning skills and adults' learning skills?", "Tôi nghĩ trẻ em học nhanh hơn, [[but]] người lớn có mục tiêu rõ ràng hơn.||[[That's because]] não của trẻ còn non trẻ [[and]] các em học qua việc chơi. Người lớn biết vì sao mình học, [[but]] họ có ít thời gian hơn.||[[For example]], cháu gái tôi học tiếng Anh qua bài hát rất nhanh, [[while]] tôi phải học ngữ pháp từng bước cho kỳ thi IELTS.||[[So]], theo tôi, trẻ em học nhanh hơn, [[but]] người lớn thường quyết tâm hơn.", "I think children learn faster, [[but]] adults have clearer goals.||[[That's because]] children's brains are young [[and]] they learn by playing. Adults know why they're learning, [[but]] they have less time.||[[For example]], my niece learns English through songs very quickly, [[while]] I have to study grammar step by step for my IELTS test.||[[So]] in my opinion, children learn faster, [[but]] adults are usually more determined.", "", "learn faster|clear goals|less time", ""]]}]}};
var P3ORDER = ["p3_2","p3_1","p3_3","p3_4","p3_5"];
var P3LEAD = 'Mỗi câu trả lời theo công thức <em class="red">O – R – E – O</em>: <b>O</b>pinion (trả lời thẳng 1 câu) → <b>R</b>eason (<em class="red">That\'s because…</em>) → <b>E</b>xample (<em class="red">For example…</em>) → <b>O</b>pinion nhắc lại (<em class="red">So…</em>). Bật “Ẩn gợi ý” để tự trả lời trước.';
P3ORDER.forEach(function(id){
  var g = P3G[id];
  PLAN[id] = g.topics.map(function(t){ return t.name; });
  g.topics.forEach(function(t){ var x = T(t.name, null, t.rows); TOPICS.push(x); ALL[t.name] = x; });
  DAYMETA[id] = {title:"Part 3 – "+g.name, lead:P3LEAD};
  DAYS.push({id:id, label:g.name});
  RENDER[id] = function(){ return dayPage(id).replace("Gợi ý, mẫu câu & ghi chú","Câu trả lời mẫu"); };
});
var _rowP1 = rowHTML;
rowHTML = function(){ var h=_rowP1.apply(this,arguments); if(!/^p3_/.test(current)) return h;
  return h.replace(/<label class="notewrap">[\s\S]*?<\/label>/,''); };
var _ideaP1 = ideaHTML, _hintP1 = hintHTML;
ideaHTML = function(q){
  if(!/^p3_/.test(current)) return _ideaP1(q);
  return '';
};
hintHTML = function(q){
  if(!/^p3_/.test(current)) return _hintP1(q);
  var h = '<div class="hint">';
  var LB=["O","R","E","O"], LT=["Opinion","Reason","Example","Opinion"];
  function oreo(txt, cls, lang){ var parts=String(txt).split("||"); if(parts.length!==4) return '<span class="'+cls+'"'+(lang?' lang="'+lang+'"':'')+'>'+fmt(txt)+'</span>';
    return '<span class="'+cls+'"'+(lang?' lang="'+lang+'"':'')+'>'+fmt(parts.map(function(p){ return p.trim(); }).join(" "))+'</span>'; }
  h += '<div class="block"><span class="tag">Gợi ý tiếng Việt</span>'+oreo(q.idea[0],"p3vi","")+'</div>';
  h += '<div class="block"><span class="tag">Câu mẫu</span>'+oreo(q.idea[1],"p3en","en")+'</div>';
  h += '<div class="block"><span class="tag">Từ vựng</span><span class="chips">'+q.kw.map(function(k){ return '<span class="chip" lang="en">'+esc(k)+'</span>'; }).join("")+'</span></div>';
  if(q.note) h += '<div class="block"><span class="tag">Lưu ý</span><span class="note">'+fmt(q.note)+'</span></div>';
  return h + '</div><button class="peek" type="button">Xem gợi ý</button>';
};
var current = store.get("ielts-tab2") || "d9";
if(!RENDER[current]) current = "d9";

function renderNav(){
  document.getElementById("navlist").innerHTML = DAYS.map(function(d){
    var c = dayCount(d.id), prog = c ? '<span class="prog">'+c.n+'/'+c.total+'</span>' : '';
    return '<li><button type="button" data-go="'+d.id+'"'+(d.id===current?' aria-current="true"':'')+'>'+esc(d.label)+prog+'</button></li>';
  }).join("");
}
function sizeAll(){ document.querySelectorAll("textarea[data-note]").forEach(autosize); }
function autosize(el){ el.style.height="auto"; el.style.height=(el.scrollHeight+2)+"px"; }
function render(){
  document.getElementById("sheet").innerHTML = RENDER[current]() + '<footer>Đánh dấu “Đã luyện” và ghi chú được lưu trên trình duyệt này.</footer>';
  renderNav(); sizeAll();
}
function goTop(){ window.scrollTo(0,0); }
function go(id){
  if(!RENDER[id]) return;
  current = id; store.set("ielts-tab2", id); render(); goTop();
}
function setSub(i){
  subIdx[current] = i; store.set("ielts-sub", JSON.stringify(subIdx)); render();
  var h = document.querySelector("#sheet h2"); if(h) h.scrollIntoView({block:"start"});
  var sel = document.querySelector('.subtabs [aria-selected="true"]'); if(sel) sel.scrollIntoView({block:"nearest",inline:"center"});
}

document.addEventListener("click", function(e){
  var g = e.target.closest("[data-go]"); if(g){ go(g.getAttribute("data-go")); return; }
  var s = e.target.closest("[data-sub]"); if(s){ setSub(parseInt(s.getAttribute("data-sub"),10)); return; }
  var p = e.target.closest(".peek"); if(p){ p.closest(".q").classList.add("open"); return; }
});
document.addEventListener("input", function(e){
  var k = e.target.getAttribute && e.target.getAttribute("data-note");
  if(k !== null && k !== undefined){
    var v = e.target.value;
    if(v.trim()) notes[k] = v; else delete notes[k];
    saveNotes(); autosize(e.target);
  }
});
document.addEventListener("change", function(e){
  if(e.target.matches(".check input")){
    var row = e.target.closest(".q"), key = row.getAttribute("data-key");
    if(e.target.checked) done[key]=1; else delete done[key];
    row.classList.toggle("is-done", e.target.checked);
    saveDone(); renderNav();
    var sel = document.querySelector('.subtabs [aria-selected="true"]');
    if(sel && PLAN[current]){ var nm = PLAN[current][subIdx[current]||0], c = topicCount(nm);
      sel.querySelector(".cnt").textContent = c.n+"/"+c.total; sel.classList.toggle("full", c.n===c.total); }
  }
});
window.addEventListener("pagehide", function(){ store.set("ielts-notes", JSON.stringify(notes)); });
var hideBtn = document.getElementById("hideToggle");
function setHide(on){
  document.body.classList.toggle("hide-hints", on);
  hideBtn.setAttribute("aria-pressed", on ? "true" : "false");
  store.set("ielts-hide", on ? "1" : "0");
  document.querySelectorAll(".q.open").forEach(function(q){ q.classList.remove("open"); });
}
hideBtn.addEventListener("click", function(){ setHide(!document.body.classList.contains("hide-hints")); });
setHide(store.get("ielts-hide")==="1");

(function(){
  var now = new Date(); var exam = new Date(2026,9,20);
  var today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  var days = Math.round((exam - today)/86400000);
  var el = document.getElementById("countdown");
  el.innerHTML = days > 0 ? 'Còn <b>'+days+' ngày</b> đến ngày thi 20/10' : (days === 0 ? '<b>Hôm nay thi.</b> Chúc bạn may mắn!' : 'Đã qua ngày thi 20/10');
})();

render();

</script>
