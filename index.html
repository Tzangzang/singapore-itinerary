trọng nơi thờ cúng là tôn trọng niềm tin của người khác.", "[[Because]] people pray there, [[and]] it's a sacred place. Making noise there is disrespectful. In Vietnam, temples are [[also]] sacred places, [[so]] people speak quietly and dress politely. I think respecting places of worship means respecting other people's beliefs.", "", "pray|sacred|disrespectful", ""], ["What public morals should people follow in your country?", "Mọi người nên xếp hàng, không xả rác [[and]] nhường ghế cho người già trên xe buýt. Nói nhỏ ở nơi công cộng [[also]] rất quan trọng. [[In addition]], ở nơi công cộng, mọi người nên giữ vệ sinh và không hút thuốc. [[If]] ai cũng làm những việc nhỏ này, thành phố sẽ văn minh hơn.", "People should queue, not litter, [[and]] give their seats to old people on buses. Speaking quietly in public is [[also]] important. [[In addition]], in public places, people should keep things clean and not smoke. [[If]] everyone does these small things, our cities [[will]] be more civilised.", "", "queue|litter|give seats", ""]]}, {"name": "Đề 16 · Maps", "rows": [["What do people usually do when they get lost?", "Đa số mọi người dùng Google Maps. [[If]] điện thoại hết pin, họ hỏi người dân xung quanh [[or]] gọi cho bạn bè. [[For example]], khi đi Hà Giang, điện thoại mình mất sóng, [[so]] mình phải hỏi đường người dân địa phương. Họ rất nhiệt tình và chỉ đường rất cẩn thận.", "Most people use Google Maps. [[If]] their phone dies, they ask local people [[or]] call a friend. [[For example]], when I went to Hà Giang, my phone lost signal, [[so]] I had to ask local people for directions. They were very friendly and helped me carefully.", "", "Google Maps|ask local people", ""], ["What are the differences between paper and digital maps?", "Bản đồ số tự cập nhật và hiện cả tình trạng giao thông, [[while]] bản đồ giấy không cần pin. [[But]] bản đồ giấy khó đọc hơn. [[For example]], Google Maps còn gợi ý đường tránh kẹt xe, rất tiện ở TP.HCM. [[But]] bản đồ giấy lại hữu ích ở vùng núi không có mạng.", "Digital maps update by themselves and show the traffic, [[while]] paper maps don't need a battery. [[But]] paper maps are harder to read. [[For example]], Google Maps even suggests ways to avoid traffic jams, [[which]] is very useful in Ho Chi Minh City. [[But]] paper maps are useful in the mountains where there's no internet.", "", "traffic|battery", ""], ["What do you think of in-car GPS navigation systems?", "Rất hữu ích, [[because]] tài xế không bị lạc. [[However]], đôi khi GPS chỉ sai đường, [[so]] tài xế vẫn cần chú ý. [[For example]], tài xế Grab dùng GPS cả ngày, [[so]] họ không cần nhớ đường. [[However]], một số người quá phụ thuộc vào GPS và không còn tự nhớ đường được nữa.", "They're very useful, [[because]] drivers don't get lost. [[However]], sometimes they're wrong, [[so]] drivers still need to be careful. [[For example]], Grab drivers use GPS all day, [[so]] they don't need to remember the roads. [[However]], some people depend on GPS too much, [[and]] they can't remember directions by themselves.", "", "get lost|wrong", ""], ["Why do most people prefer to use a paper map?", "Thực ra đa số mọi người không thích dùng bản đồ giấy. [[But]] một số người lớn tuổi vẫn dùng, [[because]] họ tin bản đồ giấy hơn và nó dùng được khi không có mạng. [[However]], ngày nay rất ít người dùng bản đồ giấy, chủ yếu là người đi phượt hoặc đi leo núi. Mình nghĩ nên biết đọc bản đồ giấy để dùng khi cần.", "Actually, most people don't prefer paper maps. [[But]] some older people still use them, [[because]] they trust paper more, and it works without the internet. [[However]], very few people use paper maps nowadays, mainly backpackers or hikers. I think it's good to know how to read one, just in case.", "", "without internet", ""]]}, {"name": "Đề 17 · Transport", "rows": [["How to improve the traffic condition in a city?", "Mình nghĩ chính phủ nên xây thêm giao thông công cộng, như metro. [[Also]], nên hạn chế ô tô, xe máy ở trung tâm, [[and]] các công ty có thể cho giờ làm linh hoạt. [[In addition]], người dân nên đi chung xe hoặc đi xe đạp cho quãng đường ngắn. [[If]] làm được, thành phố [[will]] bớt kẹt xe và không khí sạch hơn.", "I think the government should build more public transport, like the metro. [[Also]], there should be fewer cars and motorbikes in the city centre, [[and]] companies can offer flexible working hours. [[In addition]], people should share rides or cycle for short trips. [[If]] we can do this, the city [[will]] have fewer traffic jams and cleaner air.", "", "metro|city centre|flexible hours", ""], ["Do people still drive a car if public transportation is free of charge?", "Mình nghĩ nhiều người vẫn [[would]] lái xe, [[because]] ô tô thoải mái và riêng tư hơn. [[But]] một số người sẽ chuyển sang đi xe buýt để tiết kiệm tiền. [[However]], [[if]] xe buýt sạch sẽ, đúng giờ và có máy lạnh, mình nghĩ nhiều người sẽ đổi ý. [[For example]], metro ở TP.HCM rất đông người đi [[because]] nhanh và thoải mái.", "I think many people [[would]] still drive, [[because]] cars are more comfortable and private. [[But]] some people [[would]] switch to buses to save money. [[However]], [[if]] buses are clean, on time and air-conditioned, I think many people [[will]] change their minds. [[For example]], the metro in Ho Chi Minh City is busy [[because]] it's fast and comfortable.", "", "comfortable|switch to buses", ""], ["How can transportation in rural areas be developed?", "Chính phủ nên làm đường tốt hơn [[and]] thêm xe buýt giữa các làng và thị trấn. [[For example]], một số làng ở vùng núi vẫn còn đường đất. [[If]] giao thông ở nông thôn tốt hơn, nông dân sẽ bán nông sản dễ hơn [[and]] trẻ em đi học an toàn hơn. [[So]] mình nghĩ đây là việc rất cần thiết.", "The government should build better roads [[and]] add more buses between villages and towns. [[For example]], some villages in the mountains still have dirt roads. [[If]] rural transport is better, farmers can sell their products more easily, [[and]] children can go to school more safely. [[So]] I think it's really necessary.", "", "better roads|buses|dirt roads", ""]]}, {"name": "Đề 19 · Holidays", "rows": [["Do you think people in your country have long enough holidays?", "Không hẳn. Đa số người đi làm chỉ có khoảng 12 ngày phép một năm. Tết là kỳ nghỉ dài duy nhất. [[In my opinion]], người lao động cần thêm vài ngày nghỉ, [[because]] nghỉ ngơi giúp họ làm việc hiệu quả hơn. [[For example]], sau Tết, ai cũng có nhiều năng lượng hơn.", "Not really. Most workers only have about 12 days off a year. Tết is the only long holiday. [[In my opinion]], workers need a few more days off, [[because]] rest helps them work better. [[For example]], after Tết, everyone has more energy.", "", "days off|long holiday", ""], ["Which holidays are popular in your country?", "Kỳ nghỉ phổ biến nhất là Tết. [[Also]], lễ 30/4 và 2/9 cũng rất phổ biến, [[and]] nhiều người đi biển vào những dịp này. [[For example]], dịp 30/4, Vũng Tàu và Đà Lạt rất đông khách từ TP.HCM. Nhiều gia đình [[also]] dùng kỳ nghỉ để về quê thăm ông bà.", "The most popular holiday is Tết. [[Also]], the 30/4 and 2/9 holidays are popular, [[and]] many people go to the beach then. [[For example]], on the 30/4 holiday, Vũng Tàu and Đà Lạt are full of tourists from Ho Chi Minh City. Many families [[also]] use the holiday to visit their grandparents.", "", "Tết|national holidays", ""], ["What is the difference between old and young people when spending their holidays?", "Người trẻ thích đi phượt cùng bạn bè, [[while]] người lớn tuổi thích nghỉ ngơi hoặc về thăm họ hàng. [[For example]], tụi mình thường đi xe máy lên Đà Lạt, [[while]] bố mẹ mình thích đi tour, ở khách sạn thoải mái. Mình nghĩ đó là vì người lớn tuổi cần nghỉ ngơi hơn là cảm giác mạnh.", "Young people like adventure trips with their friends, [[while]] older people prefer to relax or visit their relatives. [[For example]], my friends and I often ride motorbikes to Đà Lạt, [[while]] my parents prefer a tour and a comfortable hotel. I think older people need rest more than excitement.", "", "adventure|relaxing", ""]]}, {"name": "Đề 20 · News", "rows": [["Is it good to share something on social media?", "Thỉnh thoảng thì tốt, [[because]] bạn bè biết tin của mình. [[But]] mình không nên chia sẻ thông tin quá riêng tư. [[For example]], mình đăng ảnh tốt nghiệp lên Facebook, [[and]] nhận được rất nhiều lời chúc. [[However]], chia sẻ quá nhiều có thể gặp nguy hiểm, ví dụ người lạ biết nhà mình ở đâu.", "Yes, sometimes, [[because]] your friends can know your news. [[But]] you shouldn't share private information. [[For example]], I posted my graduation photos on Facebook, [[and]] I got a lot of congratulations. [[However]], sharing too much can be dangerous, [[for example]] strangers can find out where you live.", "", "share news|private information", ""], ["Should the media only publish good news?", "Không, [[because]] mọi người cần biết sự thật. [[But]] mình nghĩ có nhiều tin tốt hơn thì cũng hay. [[If]] báo chí chỉ đăng tin tốt, mọi người sẽ không biết các vấn đề như thiên tai hay ô nhiễm. [[However]], báo chí nên đăng tin xấu một cách nhẹ nhàng, không gây hoảng sợ.", "No, [[because]] people need to know the truth. [[But]] I think more good news would be nice. [[If]] the media only publish good news, people won't know about problems like natural disasters or pollution. [[However]], they should report bad news carefully, without scaring people.", "", "truth", ""], ["How does social media help people access information?", "Mạng xã hội giúp tiếp cận thông tin rất nhanh, tin tức xuất hiện chỉ trong vài phút. [[However]], trên đó có nhiều tin giả. [[For example]], khi có bão, mọi người biết ngay qua Facebook và Zalo để chuẩn bị. [[So]] mình luôn kiểm tra tin trên các trang báo chính thống trước khi chia sẻ.", "Social media is very fast, and news appears in minutes. [[However]], there is a lot of fake news on it. [[For example]], when there's a storm, people find out right away on Facebook and Zalo, [[so]] they can prepare. [[So]] I always check official news websites before I share anything.", "", "fast|fake news", ""], ["What kind of good news do people often share in the community?", "Mọi người hay chia sẻ tin về đám cưới, em bé mới sinh, kết quả thi [[and]] việc làm mới. [[For example]], ở khu mình, khi có học sinh đỗ đại học, cả xóm đều biết và chúc mừng. Mình nghĩ đây là nét đẹp của văn hóa Việt Nam.", "People often share news about weddings, new babies, exam results [[and]] new jobs. [[For example]], in my neighbourhood, when a student passes the university entrance exam, everyone knows and congratulates them. I think it's a lovely part of Vietnamese culture.", "", "exam results|new jobs", ""], ["Do most people like to share good news with others?", "Có, [[because]] niềm vui được nhân đôi khi chia sẻ. [[Also]], họ nhận được nhiều lời chúc mừng. [[However]], một số người không thích chia sẻ, [[because]] họ sợ người khác ghen tị. Cá nhân mình chỉ chia sẻ tin vui với gia đình và bạn thân.", "Yes, [[because]] sharing doubles the happiness. [[Also]], they get a lot of congratulations. [[However]], some people don't like to share, [[because]] they're afraid others [[will]] be jealous. Personally, I only share good news with my family and close friends.", "", "congratulations", ""]]}, {"name": "Đề 21 · Screens", "rows": [["Why do people often have problems when using new products?", "[[Because]] họ không đọc hướng dẫn. [[Also]], các tính năng mới khá phức tạp, [[and]] người lớn tuổi thấy khó hơn. [[For example]], bố mẹ mình mua tivi thông minh mới [[but]] không biết cách mở YouTube, [[so]] mình phải hướng dẫn. Mình nghĩ nhà sản xuất nên làm hướng dẫn đơn giản hơn.", "[[Because]] they don't read the instructions. [[Also]], new features are complicated, [[and]] older people find them harder. [[For example]], my parents bought a new smart TV, [[but]] they didn't know how to open YouTube, [[so]] I had to show them. I think companies should make their instructions simpler.", "", "instructions|complicated", ""], ["Do people spend too much time looking at digital screens? Why?", "Có. Mọi người làm việc trên máy tính cả ngày, [[and]] giải trí bằng điện thoại vào buổi tối. Điều này không tốt cho mắt và giấc ngủ. [[For example]], mình nhìn màn hình khoảng 10 tiếng mỗi ngày, [[and]] buổi tối mắt mình rất mỏi. [[So]] giờ mình cố nghỉ 5 phút mỗi giờ và không dùng điện thoại trước khi ngủ.", "Yes. People work on computers all day, [[and]] they relax on their phones in the evening. It's bad for their eyes and sleep. [[For example]], I look at screens for about 10 hours a day, [[and]] my eyes feel very tired at night. [[So]] now I try to take a 5-minute break every hour and avoid my phone before bed.", "", "screens|eyes and sleep", ""], ["What do people do with mobile phones?", "Mọi người dùng điện thoại để nhắn tin, gọi điện, xem video [[and]] dùng mạng xã hội. Bây giờ nhiều người [[also]] dùng điện thoại để thanh toán và mua sắm online. [[For example]], mình dùng điện thoại để đặt Grab, gọi đồ ăn và học tiếng Anh. Điện thoại giờ giống như một chiếc máy tính nhỏ, [[so]] mọi người hầu như không thể sống thiếu nó.", "People use phones to chat, call, watch videos [[and]] use social media. Now many people [[also]] use them to pay and shop online. [[For example]], I use my phone to book a Grab, order food and study English. A phone is like a small computer now, [[so]] people can hardly live without it.", "", "pay online|social media", ""]]}, {"name": "Đề 25 · Reviews", "rows": [["What kinds of things do people write online reviews about in your country?", "Mọi người hay viết review về nhà hàng, quán cà phê và khách sạn. Họ [[also]] review quần áo mua online. [[For example]], trước khi đi ăn, mình luôn đọc review trên Google Maps. [[If]] một quán có nhiều đánh giá xấu về vệ sinh, mình sẽ không đến.", "People often write reviews about restaurants, cafés and hotels. They [[also]] review clothes they buy online. [[For example]], before I go to a restaurant, I always read reviews on Google Maps. [[If]] a place has many bad reviews about hygiene, I don't go there.", "", "restaurants|hotels", ""], ["Why do some people write online reviews?", "[[Because]] họ muốn giúp người mua khác. Một số người viết review để phàn nàn về dịch vụ kém. [[Also]], có nơi giảm giá cho khách khi viết review. [[However]], một số review là giả, [[because]] công ty trả tiền để người khác viết. [[So]] mình nghĩ người đọc cần cẩn thận và đọc nhiều review khác nhau.", "[[Because]] they want to help other buyers. Some people write reviews to complain about bad service. [[Also]], some shops give discounts for reviews. [[However]], some reviews are fake, [[because]] companies pay people to write them. [[So]] I think readers need to be careful and read many different reviews.", "", "help other buyers|complain|discounts", ""], ["Do you think that online reviews are good for both shoppers and companies?", "Có. Người mua chọn được sản phẩm tốt hơn, [[and]] công ty biết mình cần cải thiện điều gì. [[For example]], ở công ty mình, tụi mình đọc review của học viên để cải thiện khóa học. [[But]] review xấu không công bằng có thể làm hại các cửa hàng nhỏ.", "Yes. Shoppers can choose better, [[and]] companies know what they need to improve. [[For example]], at my company, we read students' reviews to improve our courses. [[But]] unfair bad reviews can hurt small shops.", "", "choose better|improve", ""], ["What do you think it might be like to work in a customer service job?", "Mình nghĩ khá căng thẳng, [[because]] một số khách hàng thô lỗ. [[But]] làm công việc này giúp mình học được tính kiên nhẫn. [[For example]], bạn mình làm chăm sóc khách hàng qua điện thoại, [[and]] bạn ấy phải giữ bình tĩnh khi khách la mắng. [[But]] bạn ấy học được cách giải quyết vấn đề và giao tiếp tốt hơn.", "I think it's quite stressful, [[because]] some customers are rude. [[But]] you learn to be patient. [[For example]], my friend works in a call centre, [[and]] she has to stay calm when customers shout at her. [[But]] she learns how to solve problems and communicate better.", "", "stressful|rude|patience", ""]]}, {"name": "Đề 26 · Teamwork", "rows": [["Why do some people prefer to work by themselves?", "[[Because]] họ tập trung tốt hơn khi làm một mình. [[Also]], họ không phải chờ người khác, [[and]] không có tranh cãi. [[However]], làm một mình đôi khi thiếu ý tưởng mới. [[For example]], khi làm nhóm, mình thường nghe được những cách nghĩ mà mình chưa từng nghĩ tới.", "[[Because]] they can focus better. [[Also]], they don't need to wait for others, [[and]] there are no arguments. [[However]], working alone sometimes means fewer new ideas. [[For example]], when I work in a team, I often hear ideas [[which]] I never thought about.", "", "focus|arguments", ""], ["What should a leader do to make team members want to follow him or her?", "Một người trưởng nhóm giỏi nên lắng nghe các thành viên và công bằng với mọi người. [[Also]], họ nên làm việc chăm chỉ để làm gương. [[For example]], quản lý tốt nhất của mình luôn giúp team khi có khó khăn, chứ không chỉ ra lệnh. [[So]] mọi người tin tưởng và sẵn sàng làm theo cô ấy.", "A good leader should listen to the team members and be fair to everyone. [[Also]], they should work hard and be a good example. [[For example]], my best manager always helps the team when there are problems, [[instead of]] just giving orders. [[So]] everyone trusts her and is happy to follow her.", "", "listen|fair|example", ""], ["Should students learn to do group work?", "Có, [[because]] sau này đi làm các em sẽ cần kỹ năng làm việc nhóm. Các em [[also]] học được cách chia sẻ ý tưởng. Làm nhóm [[also]] dạy học sinh cách giải quyết bất đồng. [[However]], giáo viên nên chia việc rõ ràng, [[because]] đôi khi chỉ một hai bạn làm hết.", "Yes, [[because]] they will need teamwork skills at work. They [[also]] learn to share ideas. Group work [[also]] teaches students how to deal with disagreements. [[However]], teachers should divide the work clearly, [[because]] sometimes only one or two students do everything.", "", "teamwork|share ideas", ""], ["What group tasks are there in schools?", "[[For example]], học sinh làm thuyết trình nhóm, dự án khoa học, [[or]] cùng nhau trực nhật lớp. [[For example]], ở lớp mình hồi đại học, tụi mình làm dự án marketing cho một quán cà phê thật. Đó là một trải nghiệm rất hay, [[because]] tụi mình học được cách làm việc như ở công ty.", "[[For example]], students do group presentations, science projects, [[or]] clean the classroom together. [[For example]], at university, my class did a marketing project for a real café. It was a great experience, [[because]] we learned how to work like a real company.", "", "presentations|projects", ""]]}, {"name": "Đề 33 · Festival meals", "rows": [["Is it common for students to dine with each other on school days in your country?", "Có, vào bữa trưa. Nhiều học sinh ăn trưa bán trú ở trường. [[After school]], học sinh lớn hay đi ăn vặt cùng nhau. [[For example]], hồi cấp ba, nhóm mình hay ăn bánh mì và uống trà sữa sau giờ học. Đó là cách để tụi mình nói chuyện và thân nhau hơn.", "Yes, at lunchtime. Many students have lunch at school. [[After school]], older students often eat street food together. [[For example]], in high school, my friends and I often ate bánh mì and drank milk tea after class. It was a way to talk and become closer.", "", "have lunch|street food", ""], ["Do people prefer to eat out at restaurants or eat at home during the Spring Festival?", "Đa số mọi người ăn ở nhà dịp Tết, [[because]] cả gia đình cùng nấu món truyền thống. [[Also]], nhiều nhà hàng đóng cửa trong những ngày này. [[However]], gần đây một số gia đình trẻ đi ăn nhà hàng vào mùng 2, mùng 3 Tết để đỡ mệt. [[But]] với đa số, bữa cơm Tết ở nhà vẫn là quan trọng nhất.", "Most people eat at home, [[because]] families cook traditional food together. [[Also]], many restaurants are closed during Tết. [[However]], recently, some young families eat out on the second or third day of Tết, [[because]] cooking is tiring. [[But]] for most people, the Tết meal at home is still the most important.", "", "traditional food|closed", ""], ["What food do you eat on special occasions, like during the Spring Festival or the Mid-autumn Festival?", "Dịp Tết, nhà mình ăn bánh chưng và thịt kho trứng. Dịp Trung thu, mọi người ăn bánh trung thu. Mỗi món ăn đều có ý nghĩa. [[For example]], bánh chưng hình vuông tượng trưng cho đất, [[and]] bánh trung thu tròn tượng trưng cho sự đoàn viên.", "At Tết, we eat bánh chưng and braised pork with eggs. At the Mid-Autumn Festival, people eat mooncakes. Each dish has a meaning. [[For example]], square bánh chưng represents the Earth, [[and]] round mooncakes represent family reunion.", "", "bánh chưng|mooncakes", ""], ["Why do people like to have meals together during important festivals?", "[[Because]] đó là thời gian dành cho gia đình. [[Also]], ăn cùng nhau giúp giữ truyền thống, [[and]] mọi người kể chuyện cho nhau nghe. [[For example]], nhà mình có rất nhiều người làm ở thành phố khác, [[so]] Tết là dịp hiếm hoi cả nhà ngồi ăn cùng nhau. Mình nghĩ bữa ăn chung giúp gia đình gắn kết hơn.", "[[Because]] it's family time. [[Also]], eating together keeps traditions alive, [[and]] people can share news with each other. [[For example]], many people in my family work in other cities, [[so]] Tết is a rare chance for everyone to eat together. I think shared meals bring families closer.", "", "family time|traditions", ""]]}, {"name": "Đề 40 · Losing things", "rows": [["What do people often feel after losing things?", "Họ thấy lo lắng và bực bội, [[especially]] khi mất đồ quan trọng như thẻ căn cước. [[For example]], khi mất ví, mình không chỉ mất tiền mà còn phải làm lại giấy tờ, rất mất thời gian. [[So]] cảm giác lo lắng và mệt mỏi kéo dài vài ngày.", "They feel worried and angry, [[especially]] when they lose important things like their ID card. [[For example]], when you lose your wallet, you don't just lose money; you [[also]] have to get new documents, [[which]] takes a lot of time. [[So]] the stress can last for days.", "", "worried|important", ""], ["What can we do to reduce the possibility of losing things?", "Mình có thể để đồ ở một chỗ cố định [[and]] kiểm tra trước khi rời đi. [[Also]], có thể dùng app định vị cho điện thoại và ví. [[For example]], mình luôn để chìa khóa và ví trong một cái túi nhỏ phía trước. [[If]] mình bận, mình đặt nhắc nhở trên điện thoại để không quên đồ.", "We can keep things in one place [[and]] check before we leave. [[Also]], we can use tracking apps for phones and wallets. [[For example]], I always keep my keys and wallet in a small bag in front of me. [[If]] I'm busy, I set reminders on my phone so I don't forget things.", "", "one place|check|tracking apps", ""], ["What kinds of people may lose things often?", "Người bận rộn hay mất đồ, [[because]] họ làm nhiều việc cùng lúc. Trẻ em và người già hay quên [[also]] dễ mất đồ. [[For example]], mình hay quên ô ở quán cà phê [[when]] đang vội đi làm. [[So]] mình nghĩ người bận rộn nên chậm lại một chút và kiểm tra đồ trước khi đi.", "Busy people often lose things, [[because]] they do many things at the same time. Children and forgetful old people [[also]] lose things easily. [[For example]], I often forget my umbrella at cafés [[when]] I'm in a hurry to go to work. [[So]] I think busy people should slow down and check their things before they leave.", "", "busy|forgetful", ""], ["Is it effective to offer rewards to find lost things?", "Có, [[because]] sẽ có nhiều người giúp tìm hơn. [[But]] người tốt thì vẫn trả lại dù không có thưởng. [[For example]], [[when]] mất thú cưng, nhiều người đăng tin trên Facebook kèm tiền thưởng, [[and]] thường tìm lại được. Mình nghĩ tiền thưởng là cách để cảm ơn người tốt.", "Yes, [[because]] more people will help look for it. [[But]] honest people return things anyway. [[For example]], [[when]] people lose a pet, they often post on Facebook and offer a reward, [[and]] they usually find it. I think a reward is a nice way to thank a good person.", "", "rewards|honest", ""]]}, {"name": "Đề 42 · Getting up early", "rows": [["Why do people get up early?", "Mọi người dậy sớm để đi làm, đi học [[or]] tập thể dục. Ở thành phố lớn, nhiều người dậy sớm để tránh kẹt xe. [[For example]], bố mình dậy lúc 5 giờ sáng để chạy bộ trong công viên. Dậy sớm giúp mọi người có thêm thời gian buổi sáng và bắt đầu ngày mới thoải mái hơn.", "People get up early to go to work, to school [[or]] to exercise. In big cities, many people get up early to avoid traffic. [[For example]], my father gets up at 5 a.m. to go jogging in the park. Getting up early gives people more time in the morning and a calmer start to the day.", "", "avoid traffic|exercise", ""], ["Are there any situations when it's not good to arrive early?", "Có, [[when]] đến nhà người khác, đến sớm không tốt, [[because]] chủ nhà có thể chưa chuẩn bị xong. Đến tiệc quá sớm [[also]] hơi kỳ. [[In Vietnam]], đến nhà người khác quá sớm có thể làm chủ nhà ngại, [[because]] họ chưa dọn dẹp xong. [[So]] tốt nhất là đến đúng giờ hoặc báo trước.", "Yes, [[when]] you visit someone's home, [[because]] the host may not be ready. Arriving too early at a party is [[also]] a bit strange. [[In Vietnam]], arriving too early at someone's house can make the host feel embarrassed, [[because]] they haven't finished cleaning. [[So]] it's best to arrive on time or tell them first.", "", "host|not ready", ""], ["Is it good to arrive early in any situation?", "Thường là có, [[especially]] với phỏng vấn, kỳ thi và chuyến bay. [[But]] với tiệc thì không nên đến quá sớm. [[For example]], [[when]] đi phỏng vấn, mình luôn đến sớm 15 phút để bình tĩnh và chuẩn bị. Đến sớm cho thấy mình tôn trọng thời gian của người khác.", "Usually yes, [[especially]] for interviews, exams and flights. [[But]] not for parties. [[For example]], [[when]] I go to an interview, I always arrive 15 minutes early to calm down and get ready. Arriving early shows you respect other people's time.", "", "interviews|flights", ""], ["Why do some people stay up late at night?", "[[Because]] họ phải làm việc hoặc học bài. Một số người [[also]] xem phim, dùng điện thoại. [[And]] một số người thích ban đêm vì yên tĩnh. [[For example]], [[when]] có deadline, mình hay thức đến 1 giờ sáng để làm cho xong. [[But]] thức khuya thường xuyên không tốt cho sức khỏe, [[so]] mình đang cố ngủ sớm hơn.", "[[Because]] they need to work or study. Some people [[also]] watch films or use their phones. [[And]] some people like the night, [[because]] it's quiet. [[For example]], [[when]] I have a deadline, I often stay up until 1 a.m. to finish my work. [[But]] staying up late often is bad for your health, [[so]] I'm trying to sleep earlier.", "", "quiet|phones", ""]]}, {"name": "Đề 43 · Changing plans", "rows": [["Why do people sometimes change their plans?", "[[Because]] thời tiết xấu hoặc có việc đột xuất ở công ty. [[Sometimes]], họ bị ốm, [[so]] phải đổi kế hoạch. [[For example]], tháng trước nhóm mình định đi biển [[but]] trời mưa bão, [[so]] tụi mình đổi sang đi xem phim. Đôi khi đổi kế hoạch là việc không tránh khỏi.", "[[Because]] of bad weather or urgent work. [[Sometimes]], they feel sick, [[so]] they have to change their plans. [[For example]], last month, my friends and I planned to go to the beach, [[but]] there was a storm, [[so]] we went to the cinema instead. Sometimes changing plans can't be avoided.", "", "weather|sick", ""], ["Is it important to be flexible in life?", "Có, [[because]] cuộc sống rất khó đoán. [[If]] mình linh hoạt, mình sẽ bớt căng thẳng khi mọi thứ thay đổi. [[For example]], [[when]] chuyến bay của mình bị hoãn, mình bình tĩnh đổi kế hoạch [[and]] mọi thứ vẫn ổn. [[In my opinion]], người linh hoạt thường hạnh phúc hơn [[because]] họ không quá lo lắng.", "Yes, [[because]] life is unpredictable. [[If]] you're flexible, you feel less stressed when things change. [[For example]], [[when]] my flight was delayed, I stayed calm and changed my plan, [[and]] everything was fine. [[In my opinion]], flexible people are usually happier [[because]] they don't worry too much.", "", "unpredictable|less stress", ""], ["Do young people change plans more often than older people?", "Có, [[because]] người trẻ có nhiều lựa chọn hơn, [[while]] người lớn tuổi thích nếp sinh hoạt quen thuộc. [[For example]], người trẻ có thể đổi việc hay chuyển nhà dễ dàng [[because]] họ chưa có gia đình. [[But]] người lớn tuổi có con cái và công việc ổn định, [[so]] họ thích sự chắc chắn.", "Yes, [[because]] young people have more choices, [[while]] older people prefer a routine. [[For example]], young people can change jobs or move house easily [[because]] they don't have a family yet. [[But]] older people have children and stable jobs, [[so]] they prefer things to stay the same.", "", "choices|routine", ""], ["How do people feel when their plans suddenly change?", "Đa số mọi người thấy bực mình và căng thẳng. [[But]] đôi khi đổi kế hoạch lại là một bất ngờ thú vị. [[For example]], [[when]] cuộc họp bị dời đột ngột, mình thấy bực vì đã chuẩn bị rất kỹ. [[But]] mình nghĩ thay vì giận, mình nên tìm cách tận dụng thời gian rảnh đó.", "Most people feel annoyed and stressed. [[But]] sometimes, a change of plan is a nice surprise. [[For example]], [[when]] a meeting is suddenly moved, I feel annoyed because I prepared carefully. [[But]] I think instead of getting angry, we should find a way to use that free time.", "", "annoyed|surprise", ""]]}, {"name": "Đề 46 · Decisions", "rows": [["Do advertisements influence consumers' decisions?", "Có, rất nhiều. Mọi người hay mua những thứ thấy trên TikTok. [[Also]], chương trình giảm giá khiến người ta mua rất nhanh mà không suy nghĩ. [[For example]], mình từng mua một cái máy xay sinh tố [[because]] thấy quảng cáo trên TikTok, [[but]] mình gần như không dùng. Mình nghĩ quảng cáo rất mạnh, nhất là với người trẻ.", "Yes, a lot. People often buy things they see on TikTok. [[Also]], discounts make people buy quickly without thinking. [[For example]], I once bought a blender [[because]] I saw an ad on TikTok, [[but]] I almost never use it. I think ads are very powerful, especially for young people.", "", "influence|discounts", ""], ["Who do young people like to ask for advice when making decisions?", "Người trẻ thường hỏi bạn bè. [[But]] với những quyết định lớn, họ hỏi bố mẹ. Một số người [[also]] tìm lời khuyên trên các diễn đàn mạng. [[For example]], [[when]] chọn trường đại học, mình đã hỏi bố mẹ và anh chị đi trước. [[However]], nhiều bạn trẻ giờ tìm lời khuyên trên mạng, [[which]] không phải lúc nào cũng đúng.", "They usually ask their friends. [[But]] for big decisions, they ask their parents. Some people [[also]] look for advice on online forums. [[For example]], [[when]] I chose my university, I asked my parents and older friends. [[However]], many young people now look for advice online, [[which]] is not always correct.", "", "friends|parents", ""], ["Do you think it’s necessary for kids to make as many decisions by themselves as they can?", "Có, với những việc nhỏ như chọn quần áo hay đồ ăn, [[because]] trẻ sẽ tự lập hơn. [[But]] việc lớn thì bố mẹ nên giúp. [[If]] bố mẹ quyết định mọi thứ, khi lớn lên trẻ sẽ khó tự quyết. [[So]] mình nghĩ bố mẹ nên cho con lựa chọn trong một vài phương án.", "Yes, for small things like choosing clothes or food, [[because]] they become more independent. [[But]] parents should help with big decisions. [[If]] parents decide everything, children [[will]] find it hard to make decisions when they grow up. [[So]] I think parents should let kids choose from a few options.", "", "independent", ""], ["Do you think some people can make decisions without asking for advice from others?", "Có, một số người làm được, [[because]] họ tự tin và có kinh nghiệm. [[But]] lời khuyên vẫn giúp tránh sai lầm. [[For example]], quản lý của mình phải ra quyết định rất nhanh trong các cuộc họp. [[But]] với việc lớn như mua nhà, mình nghĩ ai cũng nên hỏi ý kiến người khác.", "Yes, some people can, [[because]] they're confident and experienced. [[But]] advice still helps us avoid mistakes. [[For example]], my manager has to make decisions very quickly in meetings. [[But]] for big things like buying a house, I think everyone should ask for advice.", "", "confident|avoid mistakes", ""]]}, {"name": "Đề 51 · Celebrations", "rows": [["Do you like to celebrate important events? Why?", "Có, mình thích, [[because]] đó là dịp gặp gia đình. [[Also]], ăn mừng làm cuộc sống vui hơn. [[For example]], sinh nhật bố mình năm nay, cả nhà tổ chức một bữa tối nhỏ và cùng xem lại ảnh cũ. Những dịp như vậy giúp mọi người gần nhau hơn.", "Yes, I do, [[because]] it's a chance to meet my family. [[Also]], celebrations make life more fun. [[For example]], for my father's birthday this year, my family had a small dinner and looked at old photos together. Occasions like this bring people closer.", "", "chance to meet|fun", ""], ["What kinds of events do people usually celebrate?", "Mọi người thường ăn mừng Tết và sinh nhật. [[Also]], đám cưới và lễ tốt nghiệp. Một số người còn ăn mừng khi có việc làm mới. [[In addition]], người Việt ăn mừng Trung thu và ngày 8/3 cho phụ nữ. Gần đây, người trẻ [[also]] ăn mừng Giáng sinh và Halloween, dù đó không phải lễ truyền thống.", "People usually celebrate Tết and birthdays. [[Also]], weddings and graduations. Some people even celebrate when they get a new job. [[In addition]], Vietnamese people celebrate the Mid-Autumn Festival and Women's Day on 8 March. Recently, young people [[also]] celebrate Christmas and Halloween, even though they're not traditional.", "", "Tết|weddings|graduations", ""], ["Do people often celebrate events with a large group of people or just a few people?", "Còn tùy sự kiện. Đám cưới thường có hàng trăm khách, [[but]] sinh nhật thì chỉ có gia đình và bạn thân. [[In my opinion]], tiệc nhỏ ấm cúng hơn, [[because]] mình có thể nói chuyện với từng người. Tiệc lớn thì vui [[but]] tốn kém và mệt.", "It depends on the event. For weddings, there are hundreds of guests, [[but]] for birthdays, there's just family and close friends. [[In my opinion]], small parties are warmer, [[because]] you can talk to everyone. Big parties are fun, [[but]] they're expensive and tiring.", "", "depend on|guests|close friends", ""], ["Do people often celebrate festivals with families?", "Có, [[especially]] dịp Tết. Mọi người từ thành phố về quê. [[For example]], gia đình mình cùng nhau gói bánh chưng. [[For example]], đêm Giao thừa, cả nhà mình ngồi cùng nhau xem pháo hoa và chúc Tết ông bà. Mình nghĩ Tết là dịp quan trọng nhất trong năm của người Việt.", "Yes, [[especially]] at Tết. People travel home from big cities. [[For example]], my family makes bánh chưng together. [[For example]], on New Year's Eve, my whole family sits together, watches the fireworks and wishes our grandparents a happy new year. I think Tết is the most important time of the year for Vietnamese people.", "", "travel home|bánh chưng", ""], ["Why is it important to celebrate festivals?", "[[Because]] lễ hội giúp giữ gìn truyền thống [[and]] gắn kết gia đình. [[Also]], trẻ em được học về văn hóa của mình. [[If]] không có lễ hội, cuộc sống sẽ chỉ có công việc và rất nhàm chán. Lễ hội cho mọi người lý do để nghỉ ngơi, gặp nhau và cảm thấy mình thuộc về một cộng đồng.", "[[Because]] festivals help us keep our traditions [[and]] bring families together. [[Also]], children learn about our culture. [[If]] there were no festivals, life [[would]] be just work and very boring. Festivals give people a reason to rest, meet each other and feel part of a community.", "", "traditions|bring together|culture", ""]]}, {"name": "Đề 53 · Technology", "rows": [["What kinds of technological problems do people often face?", "Mọi người hay gặp vấn đề như mạng chậm, điện thoại hết pin, [[or]] bị virus và hack tài khoản. [[For example]], tuần trước wifi ở công ty mình bị hỏng cả buổi sáng, [[so]] không ai làm việc được. Điều này cho thấy chúng ta phụ thuộc vào công nghệ nhiều như thế nào.", "People often have problems with slow internet, phone batteries dying, [[or]] viruses and hacked accounts. [[For example]], last week, the wifi at my office stopped working for the whole morning, [[so]] nobody could work. It shows how much we depend on technology.", "", "slow internet|battery|hacked", ""], ["Do older people have more difficulty using technology than young people?", "Có, [[because]] họ không lớn lên cùng công nghệ. [[But]] người trẻ có thể dạy họ. [[For example]], bà mình rất muốn gọi video với cháu, [[so]] mình dạy bà cách dùng Zalo. Giờ bà có thể tự gọi, [[and]] bà rất vui.", "Yes, [[because]] they didn't grow up with technology. [[But]] young people can teach them. [[For example]], my grandmother really wanted to video call her grandchildren, [[so]] I taught her how to use Zalo. Now she can call by herself, [[and]] she's very happy.", "", "grow up with|teach", ""], ["How has technology made people's lives easier?", "Công nghệ giúp cuộc sống dễ dàng hơn. [[For example]], mình thanh toán online, đặt đồ ăn giao tận nhà, [[and]] làm việc tại nhà. [[In the past]], mọi người [[used to]] xếp hàng ở ngân hàng để chuyển tiền. Bây giờ chỉ mất vài giây trên điện thoại. Công nghệ giúp mình tiết kiệm rất nhiều thời gian mỗi ngày.", "Technology makes life easier. [[For example]], we can pay online, order food delivery [[and]] work from home. [[In the past]], people [[used to]] wait in line at the bank to send money. Now it only takes a few seconds on a phone. Technology saves us a lot of time every day.", "", "online payments|delivery", ""], ["Do you think people depend too much on technology nowadays?", "Có. Chúng ta gần như không sống được thiếu điện thoại. [[For example]], mọi người hoảng lên khi mất mạng. [[However]], mình nghĩ vấn đề không phải công nghệ, mà là cách chúng ta dùng nó. [[If]] dùng hợp lý, công nghệ giúp cuộc sống tốt hơn, [[but]] dùng quá nhiều sẽ ảnh hưởng đến sức khỏe và các mối quan hệ.", "Yes. We can't live without our phones. [[For example]], people panic when the internet is down. [[However]], I think the problem is not technology, it's how we use it. [[If]] we use it wisely, it makes life better, [[but]] too much can affect our health and relationships.", "", "depend on|can't live without", ""]]}, {"name": "Đề 55 · Sports events", "rows": [["Do you think it is necessary to award prizes and incentives to athletes?", "Có, [[because]] vận động viên tập luyện rất vất vả. [[Also]], giải thưởng tạo động lực cho các vận động viên trẻ. [[For example]], các vận động viên giành huy chương SEA Games thường được thưởng tiền, [[and]] điều này giúp gia đình họ có cuộc sống tốt hơn. [[However]], mình nghĩ vận động viên trẻ [[also]] cần được hỗ trợ ngay từ đầu.", "Yes, [[because]] they train very hard. [[Also]], prizes motivate young athletes. [[For example]], athletes who win SEA Games medals usually get prize money, [[and]] it helps their families have a better life. [[However]], I think young athletes [[also]] need support from the beginning.", "", "train hard|motivate", ""], ["What kind of sports are popular in your country?", "Bóng đá là môn phổ biến nhất. [[Also]], cầu lông, chạy bộ và pickleball cũng rất phổ biến. [[For example]], công viên gần nhà mình mỗi sáng có rất nhiều người chơi pickleball. Mình nghĩ thể thao ngày càng phổ biến [[because]] mọi người quan tâm đến sức khỏe hơn.", "Football is the most popular. [[Also]], badminton, running and pickleball are very popular. [[For example]], the park near my house is full of people playing pickleball every morning. I think sports are becoming more popular [[because]] people care more about their health.", "", "football|running", ""], ["What kind of competitions do people in your country like to watch?", "Mọi người thích xem các giải bóng đá, [[especially]] AFF Cup và SEA Games. Nhiều người [[also]] thích xem các cuộc thi hát trên TV. [[When]] đội tuyển Việt Nam thi đấu, cả nước cùng xem, và các quán cà phê luôn kín chỗ. Những trận đấu như vậy giúp mọi người cảm thấy đoàn kết.", "People love watching football tournaments, [[especially]] the AFF Cup and the SEA Games. Many people [[also]] like singing contests on TV. [[When]] the Vietnamese national team plays, the whole country watches, and cafés are always full. Matches like these make people feel united.", "", "AFF Cup|SEA Games", ""], ["Do you think there should be more matches or competitions broadcast on TV?", "Có, [[especially]] thể thao nữ. Bóng đá nữ rất hay nhưng ít được chiếu. [[If]] được chiếu nhiều hơn, sẽ có thêm nhà tài trợ. [[In addition]], chiếu các môn thể thao ít phổ biến như bơi hay điền kinh sẽ giúp trẻ em biết thêm nhiều môn. [[However]], quá nhiều trận đấu trên TV có thể khiến mọi người ít tự tập thể dục.", "Yes, [[especially]] women's sports. Women's football is good, but it's not often on TV. [[If]] there's more TV coverage, there [[will]] be more sponsors. [[In addition]], showing less popular sports like swimming or athletics helps children discover new sports. [[However]], too many matches on TV may make people exercise less themselves.", "", "women's football|sponsors", ""]]}, {"name": "Đề 59 · Children's behaviour", "rows": [["What do young children do when they behave badly?", "Trẻ thường khóc và la hét. Một số trẻ chạy lung tung ở nơi công cộng [[or]] không chịu nghe lời. [[For example]], có lần mình thấy một bé trai nằm lăn ra sàn siêu thị [[because]] mẹ không mua đồ chơi. Trẻ nhỏ làm vậy [[because]] chưa biết cách kiểm soát cảm xúc.", "They often cry and shout. Some run around in public [[or]] refuse to listen. [[For example]], once I saw a little boy lie on the floor of a supermarket [[because]] his mother didn't buy him a toy. Young children do this [[because]] they can't control their feelings yet.", "", "cry and shout|refuse", ""], ["How should parents stop their children from behaving badly?", "Bố mẹ nên giải thích bình tĩnh và đặt quy định rõ ràng. [[Also]], nên khen khi con cư xử tốt. [[For example]], [[if]] con la hét, bố mẹ nên đưa con ra chỗ yên tĩnh và nói chuyện nhẹ nhàng. Mình nghĩ quát mắng hay đánh con không giúp con hiểu mình sai ở đâu.", "Parents should explain calmly and set clear rules. [[Also]], they should praise good behaviour. [[For example]], [[if]] a child is shouting, parents should take them to a quiet place and talk gently. I don't think shouting or hitting helps children understand what they did wrong.", "", "explain calmly|clear rules|praise", ""], ["Were parents in the past more strict with their children than parents these days?", "Có. Bố mẹ ngày xưa [[used to]] phạt con nhiều hơn, [[but]] bây giờ bố mẹ nói chuyện với con nhiều hơn. [[For example]], ngày xưa bố mẹ mình rất nghiêm, [[and]] mình ít khi dám nói ý kiến. Bây giờ bố mẹ trẻ coi con như bạn, [[but]] đôi khi họ quá chiều con.", "Yes. Parents [[used to]] punish their children more, [[but]] now they talk with their kids more. [[For example]], my parents were very strict, [[and]] I rarely gave my opinion. Now young parents treat their kids like friends, [[but]] sometimes they spoil them too much.", "", "strict|punish|talk", ""], ["Whose influence on children is more important? Friends or parents?", "Với trẻ nhỏ, bố mẹ ảnh hưởng nhiều hơn. [[But]] với tuổi teen, bạn bè ảnh hưởng nhiều hơn, [[so]] bố mẹ nên biết bạn của con là ai. [[For example]], [[when]] lên cấp ba, mình nghe lời bạn bè nhiều hơn bố mẹ, nhất là về quần áo và âm nhạc. [[So]] bố mẹ nên giữ mối quan hệ gần gũi để con vẫn chia sẻ với mình.", "For young children, parents are more important. [[But]] for teenagers, friends are, [[so]] parents should know their kids' friends. [[For example]], [[when]] I was in high school, I listened to my friends more than my parents, especially about clothes and music. [[So]] parents should stay close to their kids, [[so]] they still share things.", "", "young kids|teenagers", ""], ["The best way to change someone’s behaviour is to set a good example. What do you think?", "Mình đồng ý, [[because]] trẻ bắt chước người lớn. [[For example]], [[if]] bố mẹ đọc sách, con cũng sẽ đọc sách. [[If]] bố mẹ nói một đằng làm một nẻo, trẻ sẽ không nghe lời. [[So]] mình nghĩ làm gương hiệu quả hơn nhiều so với nói hay phạt.", "I agree, [[because]] children copy adults. [[For example]], [[if]] parents read books, their kids read too. [[If]] parents say one thing but do another, children won't listen. [[So]] I think setting an example works much better than talking or punishing.", "", "copy|good example", ""]]}]}, "p3_5": {"name": "Hoạt động", "topics": [{"name": "Đề 11 · Adventure", "rows": [["What kinds of activities do young people like to do?", "Người trẻ thích chơi game và dùng mạng xã hội. Họ [[also]] thích đi cà phê và đi concert. Một số người thích thể thao và du lịch. [[For example]], nhiều bạn trẻ ở TP.HCM thích đi cà phê làm việc hoặc tham gia câu lạc bộ chạy bộ. Mình nghĩ người trẻ ngày nay quan tâm đến trải nghiệm hơn là mua sắm.", "Young people like gaming and social media. They [[also]] like going to cafés and concerts. Some like sports and travelling. [[For example]], many young people in Ho Chi Minh City like working in cafés or joining running clubs. I think young people today care more about experiences than shopping.", "", "gaming|concerts|travelling", ""], ["Why do some young people like adventurous activities?", "[[Because]] họ muốn cảm giác mạnh và muốn thử thách bản thân. [[Also]], họ muốn chụp ảnh đẹp để đăng mạng xã hội. [[For example]], năm ngoái mình leo núi Lang Biang lần đầu, [[and]] khi lên tới đỉnh, mình thấy rất tự hào. [[However]], các hoạt động này cần an toàn, nên đi cùng hướng dẫn viên.", "[[Because]] they want excitement, and they want to challenge themselves. [[Also]], they want to take nice photos for social media. [[For example]], last year I climbed Lang Biang Mountain for the first time, [[and]] when I reached the top, I felt very proud. [[However]], these activities need to be safe, [[so]] people should go with a guide.", "", "excitement|challenge themselves|photos", ""], ["Do you think old people would like to have changes?", "Không hẳn. Người lớn tuổi thích nếp sinh hoạt quen thuộc. [[However]], một số người thích thử sở thích mới, như khiêu vũ hay yoga. [[For example]], bà mình 70 tuổi mà vẫn học dùng điện thoại thông minh để gọi video. [[So]] mình nghĩ người già không ngại thay đổi [[if]] thay đổi đó có ích cho họ.", "Not really. They prefer a routine. [[However]], some of them like to try new hobbies, like dancing or yoga. [[For example]], my grandmother is 70, [[but]] she still learns to use a smartphone to make video calls. [[So]] I think older people accept changes [[if]] the changes are useful for them.", "", "routine|new hobbies", ""], ["Can you give some (other) examples of adventurous or risky activities?", "[[For example]], trekking, leo núi đá, dù lượn [[or]] lặn biển. Ở Việt Nam, các hoạt động này phổ biến ở Đà Lạt, Nha Trang và Sa Pa. [[But]] mình nghĩ người tham gia cần kiểm tra sức khỏe và chọn công ty uy tín.", "[[For example]], trekking, rock climbing, paragliding [[or]] diving in the sea. In Vietnam, these activities are popular in Đà Lạt, Nha Trang and Sa Pa. [[But]] I think people should check their health and choose a safe company.", "", "trekking|paragliding|diving", ""]]}, {"name": "Đề 13 · Being late", "rows": [["Do you think it’s ok to arrive late when meeting a friend?", "[[If]] chỉ trễ vài phút thì không sao, [[but]] mình nên nhắn tin báo trước. Trễ quá nhiều là thiếu lịch sự. [[For example]], [[if]] bạn mình trễ 5 phút, mình vẫn vui vẻ chờ. [[But]] nếu trễ 30 phút mà không báo, mình sẽ thấy không được tôn trọng.", "[[If]] it's only a few minutes, it's OK, [[but]] you should text your friend first. Being very late is rude. [[For example]], [[if]] my friend is five minutes late, I'm happy to wait. [[But]] [[if]] they're 30 minutes late without a message, I feel they don't respect me.", "", "text them|rude", ""], ["What should happen to people who arrive late for work?", "[[First]], nên nhắc nhở. [[If]] họ hay đi trễ, công ty có thể trừ thưởng. [[But]] quản lý cũng nên thông cảm chuyện kẹt xe. [[However]], công ty [[also]] có thể cho giờ làm linh hoạt để nhân viên tránh giờ cao điểm. [[For example]], công ty mình cho bắt đầu làm từ 8 đến 9 giờ, [[so]] ít người đi trễ hơn.", "[[First]], they should get a warning. [[If]] they're often late, the company can cut their bonus. [[But]] managers should understand traffic jams too. [[However]], companies can [[also]] offer flexible hours, [[so]] employees can avoid rush hour. [[For example]], my company lets us start between 8 and 9 a.m., [[so]] fewer people are late.", "", "warning|bonus|traffic jams", ""], ["Can you suggest how people can make sure they don’t arrive late?", "Mọi người nên đi sớm hơn một chút. [[Also]], nên xem tình trạng giao thông trên Google Maps [[and]] đặt báo thức. [[For example]], mình luôn chuẩn bị quần áo và túi từ tối hôm trước. Cách này giúp buổi sáng nhanh hơn [[and]] mình không bao giờ phải vội.", "People should leave a bit earlier. [[Also]], they should check the traffic on Google Maps [[and]] set an alarm. [[For example]], I always prepare my clothes and bag the night before. It makes my mornings faster, [[and]] I never have to rush.", "", "leave early|set an alarm", ""]]}, {"name": "Đề 18 · Outdoor activities", "rows": [["Where do people like to go for these activities?", "Mọi người thường đi vùng núi như Đà Lạt, Sa Pa, [[or]] đi biển. Ở thành phố, nhiều người ra công viên. [[For example]], cuối tuần nhiều người ở TP.HCM đi cắm trại ở Đồng Nai hoặc đi biển Vũng Tàu. Những nơi này gần thành phố, [[so]] đi về trong ngày được.", "People usually go to the mountains, like Đà Lạt or Sa Pa, [[or]] to the beach. In cities, many people go to parks. [[For example]], at weekends, many people in Ho Chi Minh City go camping in Đồng Nai or to the beach in Vũng Tàu. These places are close to the city, [[so]] people can go there and come back in one day.", "", "mountains|beaches|parks", ""], ["What outdoor activities are popular in Vietnam?", "Cắm trại và trekking rất phổ biến. Gần đây, chạy bộ và đạp xe [[also]] ngày càng phổ biến. Những hoạt động này phổ biến [[because]] mọi người muốn thoát khỏi thành phố ồn ào và sống khỏe hơn. [[For example]], mình tham gia một nhóm chạy bộ vào sáng Chủ nhật.", "Camping and trekking are popular. Recently, running and cycling have [[also]] become popular. These activities are popular [[because]] people want to escape the noisy city and live a healthier life. [[For example]], I join a running group every Sunday morning.", "", "camping|trekking|cycling", ""], ["Are those people who like dangerous activities more likely to be successful?", "Có thể, [[because]] họ dũng cảm và dám chấp nhận rủi ro. [[But]] thành công cũng cần kế hoạch cẩn thận. [[However]], người thích mạo hiểm cũng có thể đưa ra quyết định vội vàng. [[So]] mình nghĩ thành công đến từ sự cân bằng giữa dũng cảm và cẩn thận.", "Maybe, [[because]] they're brave, and they take risks. [[But]] success also needs careful planning. [[However]], people who love danger may also make quick decisions without thinking. [[So]] I think success comes from a balance between being brave and being careful.", "", "brave|take risks|careful", ""], ["Do you think it’s better for people to change jobs when there are new chances?", "Có, [[if]] đó là cơ hội tốt, ví dụ lương cao hơn hoặc học được kỹ năng mới. [[But]] không nên đổi việc quá thường xuyên. [[For example]], mình chuyển sang công việc hiện tại [[because]] có cơ hội học hỏi nhiều hơn, [[and]] đó là quyết định đúng. [[But]] trước khi đổi, mọi người nên tìm hiểu kỹ về công ty mới.", "Yes, [[if]] it's a good chance, like a better salary or new skills. [[But]] people shouldn't change jobs too often. [[For example]], I moved to my current job [[because]] it gave me more chances to learn, [[and]] it was the right decision. [[But]] before changing, people should learn carefully about the new company.", "", "good chance|too often", ""]]}, {"name": "Đề 24 · Concentration", "rows": [["Is it important for children to learn how to concentrate?", "Có, [[because]] khi tập trung, trẻ học tốt hơn và làm bài tập nhanh hơn. [[For example]], trẻ hay xem điện thoại trong khi làm bài, [[so]] làm rất lâu mà vẫn sai nhiều. [[If]] trẻ học cách tập trung từ nhỏ, sau này đi làm sẽ hiệu quả hơn nhiều.", "Yes, [[because]] when children concentrate, they learn better and finish their homework faster. [[For example]], kids often look at their phones while doing homework, [[so]] it takes a long time and they make many mistakes. [[If]] they learn to focus when they're young, they [[will]] work much better in the future.", "", "learn better", ""], ["What can employers do to help employees concentrate?", "Công ty có thể tạo khu làm việc yên tĩnh [[and]] bớt các cuộc họp không cần thiết. [[Also]], nên cho nhân viên nghỉ giải lao ngắn. [[For example]], công ty mình có phòng yên tĩnh cho ai cần làm việc tập trung. [[Also]], quản lý không nên nhắn tin công việc liên tục, [[because]] điều đó làm nhân viên mất tập trung.", "Employers can create quiet working areas [[and]] have fewer meetings. [[Also]], they should give employees short breaks. [[For example]], my company has a quiet room for people who need to focus. [[Also]], managers shouldn't send work messages all the time, [[because]] it distracts employees.", "", "quiet areas|fewer meetings|breaks", ""], ["What kinds of jobs require higher concentration at work?", "Những nghề như bác sĩ, phi công, tài xế và kế toán cần tập trung cao, [[because]] một lỗi nhỏ có thể gây hậu quả lớn. [[For example]], một bác sĩ phẫu thuật có thể phải tập trung hàng giờ liền. Công việc của mình là marketing [[also]] cần tập trung khi phân tích số liệu, [[because]] chỉ sai một con số là cả kế hoạch bị ảnh hưởng.", "Jobs like doctors, pilots, drivers and accountants need a lot of focus, [[because]] a small mistake can cause big problems. [[For example]], a surgeon may need to focus for hours. My job in marketing [[also]] needs focus when I analyse data, [[because]] one wrong number can affect the whole plan.", "", "doctors|pilots|accountants", ""], ["Have you ever felt it difficult to concentrate?", "Có, khá thường xuyên, [[when]] điện thoại cứ báo liên tục. [[Now]] mình dùng phương pháp Pomodoro, [[and]] nó giúp mình tập trung hơn nhiều. Mình làm 25 phút rồi nghỉ 5 phút, [[and]] để điện thoại ở phòng khác. Từ khi làm vậy, mình hoàn thành công việc nhanh hơn và ít mệt hơn.", "Yes, quite often, [[when]] my phone keeps buzzing. [[Now]] I use the Pomodoro method, [[and]] it really helps me concentrate. I work for 25 minutes and then take a 5-minute break, [[and]] I leave my phone in another room. Since then, I finish my work faster, [[and]] I feel less tired.", "", "phone|Pomodoro", ""]]}, {"name": "Đề 35 · Dream jobs", "rows": [["What jobs do children want to do when they grow up?", "Nhiều trẻ muốn làm bác sĩ, giáo viên hoặc cầu thủ. [[Nowadays]], nhiều trẻ muốn làm YouTuber hoặc game thủ. Trẻ thích những nghề trẻ thấy hằng ngày hoặc trên mạng. [[For example]], cháu mình muốn làm YouTuber [[because]] bé xem các kênh đồ chơi mỗi ngày.", "Many children want to be doctors, teachers or footballers. [[Nowadays]], many want to be YouTubers or gamers. Children like the jobs [[which]] they see every day or online. [[For example]], my nephew wants to be a YouTuber [[because]] he watches toy channels every day.", "", "YouTubers|footballers", ""], ["What should people consider when choosing jobs?", "Mọi người nên nghĩ về lương, sở thích [[and]] môi trường làm việc. [[For me]], môi trường làm việc rất quan trọng. [[For example]], [[when]] chọn công việc hiện tại, mình nghĩ nhiều về cơ hội học hỏi và đồng nghiệp. Mình [[also]] xem công ty có cho làm từ xa không, [[because]] mình còn đi học thạc sĩ.", "People should think about the salary, their interests [[and]] the working environment. [[For me]], the working environment is very important. [[For example]], [[when]] I chose my current job, I thought a lot about the chance to learn and the colleagues. I [[also]] checked if the company allowed remote work, [[because]] I'm also doing a master's degree.", "", "salary|interest|environment", ""], ["Is salary the main reason people choose a certain job?", "Với nhiều người thì đúng, [[because]] họ cần nuôi gia đình. [[But]] người trẻ bây giờ cũng quan tâm đến đam mê. [[For example]], nhiều bạn mình chấp nhận lương thấp hơn để làm công việc sáng tạo hoặc có ý nghĩa. [[But]] khi có gia đình, lương thường trở nên quan trọng hơn.", "For many people, yes, [[because]] they need to support their family. [[But]] young people also care about passion now. [[For example]], many of my friends accept a lower salary to do creative or meaningful work. [[But]] when people have a family, salary usually becomes more important.", "", "support family|passion", ""], ["What kind of job can be called a “dream job”?", "Công việc mơ ước là công việc mình yêu thích [[and]] có lương tốt. [[Also]], nó giúp mình cân bằng giữa công việc và cuộc sống. [[For me]], công việc mơ ước là làm trong lĩnh vực giáo dục, [[because]] mình có thể giúp người khác học tốt hơn. Mình nghĩ công việc mơ ước là công việc khiến mình muốn thức dậy mỗi sáng.", "A dream job is a job [[which]] you love [[and]] which pays well. [[Also]], it gives you a good work-life balance. [[For me]], a dream job is in education, [[because]] I can help people learn better. I think a dream job is one [[which]] makes you want to get up every morning.", "", "love|work-life balance", ""]]}, {"name": "Đề 57 · Pressure & rules", "rows": [["How do you balance life and work?", "Mình cố không làm việc vào cuối tuần. [[For example]], mình tập thể dục, gặp bạn bè [[and]] tắt thông báo công việc vào buổi tối. [[However]], vào mùa cao điểm, mình vẫn phải làm thêm giờ. [[So]] mình nghĩ cân bằng không phải mỗi ngày đều như nhau, mà là trong cả tháng mình có đủ thời gian nghỉ ngơi.", "I try not to work at weekends. [[For example]], I exercise, see my friends [[and]] turn off work notifications at night. [[However]], in busy seasons, I still have to work overtime. [[So]] I think balance doesn't mean every day is the same. It means I have enough rest during the whole month.", "", "at weekends|exercise|notifications", ""], ["Will you continue doing something when you are aware that it’s a waste of time?", "Thỉnh thoảng có, [[because]] bỏ thói quen rất khó. [[For example]], mình biết lướt TikTok tốn thời gian, [[but]] mình vẫn xem. Giờ mình đang cố giảm. Mình nghĩ ai cũng có những thói quen như vậy, [[because]] chúng giúp mình thư giãn trong thời gian ngắn. Điều quan trọng là biết giới hạn, ví dụ chỉ xem 20 phút trước khi ngủ.", "Sometimes, yes, [[because]] it's hard to stop a habit. [[For example]], I know TikTok wastes my time, [[but]] I still watch it. Now I'm trying to cut down. I think everyone has habits like this, [[because]] they help us relax for a short time. The important thing is to set a limit, like only 20 minutes before bed.", "", "habits|cut down", ""], ["What kinds of things make people feel pressured?", "Chủ yếu là hạn chót công việc và tiền bạc. [[Also]], nhiều người thấy áp lực khi so sánh bản thân với người khác trên mạng. [[For example]], học sinh Việt Nam chịu áp lực thi cử rất lớn, nhất là kỳ thi đại học. Người đi làm thì áp lực về nhà cửa và tiền tiết kiệm.", "Mainly work deadlines and money. [[Also]], many people feel pressured when they compare themselves with others on social media. [[For example]], Vietnamese students feel a lot of pressure from exams, especially the university entrance exam. Working adults feel pressure about buying a house and saving money.", "", "deadlines|money|compare", ""], ["Why do some people refuse to abide by rules?", "[[Because]] họ nghĩ luật không công bằng, [[or]] họ đang vội. [[For example]], một số người vượt đèn đỏ khi đi làm muộn. [[Also]], một số người nghĩ sẽ không bị phạt, [[because]] không ai kiểm tra. Mình nghĩ cần có camera và phạt nặng hơn, [[and]] giáo dục ý thức từ nhỏ.", "[[Because]] they think the rules are not fair, [[or]] they're in a hurry. [[For example]], some people run red lights when they're late for work. [[Also]], some people think they won't be punished, [[because]] nobody is checking. I think we need more cameras and bigger fines, [[and]] we need to teach good habits from a young age.", "", "not fair|in a hurry|run red lights", ""]]}, {"name": "Đề 64 · Skills", "rows": [["Where do children learn skills in your country?", "Trẻ học kỹ năng ở trường, ở nhà từ bố mẹ [[and]] ở các lớp học thêm như bơi lội hay tiếng Anh. [[However]], ở Việt Nam, trường học tập trung nhiều vào kiến thức hơn kỹ năng sống. [[So]] nhiều bố mẹ cho con học thêm kỹ năng vào cuối tuần.", "Children learn skills at school, at home from their parents, [[and]] at extra classes like swimming or English. [[However]], in Vietnam, schools focus more on knowledge than life skills. [[So]] many parents send their children to skills classes at weekends.", "", "at school|extra classes", ""], ["What are the differences between learning skills on your own and from others?", "Tự học thì linh hoạt và miễn phí, [[while]] học từ người khác thì nhanh hơn và ít sai hơn. Mình thích học với giáo viên hơn. [[For example]], mình tự học nấu ăn trên YouTube, [[but]] mất rất nhiều thời gian vì không ai sửa lỗi. Còn khi học tiếng Anh với giáo viên, mình tiến bộ nhanh hơn nhiều.", "Learning on your own is flexible and free, [[while]] learning from others is faster, with fewer mistakes. I prefer learning with a teacher. [[For example]], I learned to cook from YouTube by myself, [[but]] it took a long time because nobody corrected my mistakes. When I study English with a teacher, I improve much faster.", "", "flexible|fewer mistakes", ""], ["What important skills should a child learn?", "Mình nghĩ trẻ nên học bơi, [[because]] nó giúp trẻ an toàn. Giao tiếp và nấu ăn cơ bản [[also]] rất quan trọng. [[For example]], ở Việt Nam có nhiều sông và biển, [[so]] biết bơi rất quan trọng để an toàn. Kỹ năng giao tiếp [[also]] giúp trẻ tự tin và dễ kết bạn.", "I think children should learn to swim, [[because]] it keeps them safe. Communication and basic cooking are [[also]] important. [[For example]], Vietnam has many rivers and beaches, [[so]] swimming is important for safety. Communication skills [[also]] help children feel confident and make friends.", "", "swimming|communication|cooking", ""], ["What skills do you think teenagers should have?", "Tuổi teen nên học quản lý thời gian [[and]] dùng công nghệ an toàn. Nấu ăn và quản lý tiền [[also]] rất hữu ích. [[For example]], nhiều bạn trẻ mới đi làm không biết quản lý lương nên hết tiền giữa tháng. [[If]] học từ tuổi teen, các bạn sẽ tự lập hơn khi lên đại học.", "Teenagers should learn time management [[and]] how to use technology safely. Cooking and managing money are [[also]] useful. [[For example]], many young people with their first job don't know how to manage their salary, [[so]] they run out of money in the middle of the month. [[If]] they learn as teenagers, they [[will]] be more independent at university.", "", "time management|safely|managing money", ""], ["What are the differences between children's learning skills and adults' learning skills?", "Trẻ em học nhanh hơn, [[while]] người lớn học với mục tiêu rõ ràng. [[However]], người lớn có ít thời gian hơn. [[For example]], cháu mình học tiếng Anh qua bài hát rất nhanh, [[while]] mình phải học ngữ pháp có hệ thống. [[But]] người lớn biết rõ vì sao mình học, [[so]] họ thường kiên trì hơn.", "Children learn faster, [[while]] adults learn with clear goals. [[However]], adults have less time. [[For example]], my niece learns English through songs very quickly, [[while]] I have to study grammar step by step. [[But]] adults know why they're learning, [[so]] they're usually more determined.", "", "learn faster|clear goals|less time", ""]]}]}};
var P3ORDER = ["p3_2","p3_1","p3_3","p3_4","p3_5"];
var P3LEAD = 'Công thức: <em class="red">Trả lời → Lý do → Ví dụ</em>, 3–4 câu, chủ yếu thì hiện tại đơn. Mỗi câu có gợi ý tiếng Việt hoàn chỉnh (từ nối tiếng Anh tô đỏ) và câu trả lời mẫu tiếng Anh. Câu hỏi so sánh xưa và nay: <em class="red">In the past, people used to…, but now they…</em> Câu hỏi về tương lai: <em class="red">I think … will …</em> Bật “Ẩn gợi ý” để tự trả lời trước.';
P3ORDER.forEach(function(id){
  var g = P3G[id];
  PLAN[id] = g.topics.map(function(t){ return t.name; });
  g.topics.forEach(function(t){ var x = T(t.name, null, t.rows); TOPICS.push(x); ALL[t.name] = x; });
  DAYMETA[id] = {title:"Part 3 – "+g.name, lead:P3LEAD};
  DAYS.push({id:id, label:g.name});
  RENDER[id] = function(){ return dayPage(id).replace("Gợi ý, mẫu câu & ghi chú","Câu trả lời mẫu"); };
});
var _rowP1 = rowHTML;
rowHTML = function(){ var h=_rowP1.apply(this,arguments); if(!/^p3_/.test(current)) return h;
  return h.replace(/<label class="notewrap">[\s\S]*?<\/label>/,''); };
var _ideaP1 = ideaHTML, _hintP1 = hintHTML;
ideaHTML = function(q){
  if(!/^p3_/.test(current)) return _ideaP1(q);
  return '<div class="hint idea-left"><span class="tag">Gợi ý tiếng Việt</span><p class="p3vi">'+fmt(q.idea[0])+'</p></div>';
};
hintHTML = function(q){
  if(!/^p3_/.test(current)) return _hintP1(q);
  var h = '<div class="hint">';
  h += '<div class="block"><span class="tag">Câu mẫu</span><span class="p3en" lang="en">'+fmt(q.idea[1])+'</span></div>';
  h += '<div class="block"><span class="tag">Từ vựng</span><span class="chips">'+q.kw.map(function(k){ return '<span class="chip" lang="en">'+esc(k)+'</span>'; }).join("")+'</span></div>';
  if(q.note) h += '<div class="block"><span class="tag">Lưu ý</span><span class="note">'+fmt(q.note)+'</span></div>';
  return h + '</div><button class="peek" type="button">Xem gợi ý</button>';
};
var current = store.get("ielts-tab2") || "d9";
if(!RENDER[current]) current = "d9";

function renderNav(){
  document.getElementById("navlist").innerHTML = DAYS.map(function(d){
    var c = dayCount(d.id), prog = c ? '<span class="prog">'+c.n+'/'+c.total+'</span>' : '';
    return '<li><button type="button" data-go="'+d.id+'"'+(d.id===current?' aria-current="true"':'')+'>'+esc(d.label)+prog+'</button></li>';
  }).join("");
}
function sizeAll(){ document.querySelectorAll("textarea[data-note]").forEach(autosize); }
function autosize(el){ el.style.height="auto"; el.style.height=(el.scrollHeight+2)+"px"; }
function render(){
  document.getElementById("sheet").innerHTML = RENDER[current]() + '<footer>Đánh dấu “Đã luyện” và ghi chú được lưu trên trình duyệt này.</footer>';
  renderNav(); sizeAll();
}
function goTop(){ window.scrollTo(0,0); }
function go(id){
  if(!RENDER[id]) return;
  current = id; store.set("ielts-tab2", id); render(); goTop();
}
function setSub(i){
  subIdx[current] = i; store.set("ielts-sub", JSON.stringify(subIdx)); render();
  var h = document.querySelector("#sheet h2"); if(h) h.scrollIntoView({block:"start"});
  var sel = document.querySelector('.subtabs [aria-selected="true"]'); if(sel) sel.scrollIntoView({block:"nearest",inline:"center"});
}

document.addEventListener("click", function(e){
  var g = e.target.closest("[data-go]"); if(g){ go(g.getAttribute("data-go")); return; }
  var s = e.target.closest("[data-sub]"); if(s){ setSub(parseInt(s.getAttribute("data-sub"),10)); return; }
  var p = e.target.closest(".peek"); if(p){ p.closest(".q").classList.add("open"); return; }
});
document.addEventListener("input", function(e){
  var k = e.target.getAttribute && e.target.getAttribute("data-note");
  if(k !== null && k !== undefined){
    var v = e.target.value;
    if(v.trim()) notes[k] = v; else delete notes[k];
    saveNotes(); autosize(e.target);
  }
});
document.addEventListener("change", function(e){
  if(e.target.matches(".check input")){
    var row = e.target.closest(".q"), key = row.getAttribute("data-key");
    if(e.target.checked) done[key]=1; else delete done[key];
    row.classList.toggle("is-done", e.target.checked);
    saveDone(); renderNav();
    var sel = document.querySelector('.subtabs [aria-selected="true"]');
    if(sel && PLAN[current]){ var nm = PLAN[current][subIdx[current]||0], c = topicCount(nm);
      sel.querySelector(".cnt").textContent = c.n+"/"+c.total; sel.classList.toggle("full", c.n===c.total); }
  }
});
window.addEventListener("pagehide", function(){ store.set("ielts-notes", JSON.stringify(notes)); });
var hideBtn = document.getElementById("hideToggle");
function setHide(on){
  document.body.classList.toggle("hide-hints", on);
  hideBtn.setAttribute("aria-pressed", on ? "true" : "false");
  store.set("ielts-hide", on ? "1" : "0");
  document.querySelectorAll(".q.open").forEach(function(q){ q.classList.remove("open"); });
}
hideBtn.addEventListener("click", function(){ setHide(!document.body.classList.contains("hide-hints")); });
setHide(store.get("ielts-hide")==="1");

(function(){
  var now = new Date(); var exam = new Date(2026,9,20);
  var today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  var days = Math.round((exam - today)/86400000);
  var el = document.getElementById("countdown");
  el.innerHTML = days > 0 ? 'Còn <b>'+days+' ngày</b> đến ngày thi 20/10' : (days === 0 ? '<b>Hôm nay thi.</b> Chúc bạn may mắn!' : 'Đã qua ngày thi 20/10');
})();

render();

</script>
